# Runs every test suite on each pull request and on each push to dev and main.
# Windows, because the launcher tests run the real .bat, .vbs and .ps1 files.
name: Tests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Keep the browser test's screenshot when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failure
          path: ${{ runner.temp }}/vault-browser-fail.png
          if-no-files-found: ignore
