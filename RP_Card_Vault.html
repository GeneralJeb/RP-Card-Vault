  const pending = IMPORT_PENDING.get(root.id);
  if (!pending || !pending.length) {
    // No live files this session — keep the existing index intact rather than
    // treating every card as deleted.
    const kept = [];
    for (const [, r] of existing) if (r.rootId === root.id) kept.push(r);
    return { records: kept, bodies: [], thumbs: [], removed: [], error: null, needsAttach: true, count: kept.length };
  }

  const records = [], bodies = [], thumbs = [];
  const seenIds = new Set();

  for (let i = 0; i < pending.length; i++) {
    if (ctl && ctl.stop) break;
    const info = pending[i];
    const id = root.id + ":" + info.rel;
    seenIds.add(id);
    IMPORT_FILES.set(id, info.fileObj);
    if (i % 5 === 0 || i === pending.length - 1) {
      onProgress({ phase: "parsing", done: i + 1, total: pending.length, label: info.file });
    }
    const prev = existing.get(id);
    if (reusableRecord(prev, info.fileObj)) { records.push(prev); continue; }
    const out = await processCardFile(root, info, info.fileObj);
    records.push(out.rec);
    if (out.body) bodies.push(out.body);
    if (out.thumb) thumbs.push(out.thumb);
  }

  const removed = [];
  for (const [id, r] of existing) {
    if (r.rootId === root.id && !seenIds.has(id)) removed.push(id);
  }

  const dirSet = new Set();
  for (const info of pending) {
    const parts = info.dir ? info.dir.split("/") : [];
    for (let i = 1; i <= parts.length; i++) dirSet.add(parts.slice(0, i).join("/"));
  }
  IMPORT_PENDING.delete(root.id);
  return { records, bodies, thumbs, removed, error: null, count: pending.length, dirs: Array.from(dirSet).sort() };
}

function cardWarnings(d) {
  const w = [];
  if (!d.name) w.push("No name");
  if (!d.description) w.push("Empty description");
  if (!d.first_mes) w.push("No first message");
  if (!d.tags.length) w.push("No tags");
  if (d.tokensCore > 2000) w.push("Heavy permanent context (" + fmtTokens(d.tokensCore) + ")");
  if (d.description && /\{\{char\}\}/i.test(d.description) === false && d.description.length < 120) w.push("Very short description");
  if (d.lorebook && d.lorebook.entries.some((e) => !e.keys.length && !e.constant)) w.push("Lorebook entry with no keys");
  if (d.mes_example && d.mes_example.indexOf("<START>") < 0 && d.mes_example.length > 40) w.push("Example dialogue missing <START>");
  return w;
}

/* ════════════════════════════════════════════
   8. DUPLICATE DETECTION + INGEST PLANNING
   ════════════════════════════════════════════ */

/**
 * Group the whole collection into duplicate clusters.
 * Tier 1 exact  — identical byte signature
 * Tier 2 content— identical name+description+first_mes (catches re-encodes)
 * Tier 3 version— same name+creator, different content
 *
 * `ignore` holds group keys the user has marked as false positives, per kind.
 * Dismissed groups are hidden AND their members stop counting as duplicates,
 * so the grid's duplicate badge and filter stay honest.
 */
const EMPTY_IGNORE = { exact: [], content: [], versions: [] };

/* ── folders that shouldn't take part in duplicate detection ─────────
   A card you've thrown away, or a backup the vault itself wrote, is not a
   duplicate you need to hear about — and it must not block re-importing the
   same card later either.
   ──────────────────────────────────────────────────────────────────── */

const AUTO_NODUPE_NAMES = /^(_vault backups|_vault edits|_ingested|trash cards|trash|recycle|_recycle)$/i;

/** Build the context once, then reuse it per record. */
function makeDupeExcluder(settings, dupeMode) {
  const trash = (settings && settings.trashKey) ? parseDirKey(settings.trashKey) : null;
  const modes = dupeMode || {};
  return function isDupeExcluded(rec) {
    // an explicit per-folder setting beats everything, nearest folder first
    let d = rec.dir || "";
    for (;;) {
      const m = modes[dirKey(rec.rootId, d)];
      if (m === "include") return false;
      if (m === "exclude") return true;
      if (!d) break;
      const i = d.lastIndexOf("/");
      d = i < 0 ? "" : d.slice(0, i);
    }
    if (trash && recInDir(rec, trash.rootId, trash.dir)) return true;
    for (const seg of (rec.dir || "").split("/")) {
      if (seg && AUTO_NODUPE_NAMES.test(seg)) return true;
    }
    return false;
  };
}

/* ── the trash ────────────────────────────────────────────────────────
   Cards you've trashed (your trash folder, or any folder named like one)
   and the vault's own save backups are kept out of the main view, search,
   tag counts' cards and the agent. They show again when you open that
   folder in the sidebar, or turn on "Show trash".
   ──────────────────────────────────────────────────────────────────── */

const TRASH_NAMES = /^(_vault trash|trash cards|trash|recycle|_recycle|_vault backups)$/i;

/* ── folders kept private from the AI ─────────────────────────────────
   Cards in a private folder (or below it) never reach a model: the agent
   can't list, search, read or change them, and card actions refuse them.
   ──────────────────────────────────────────────────────────────────── */

/** (rootId, dir) → true when that folder is, or is inside, a private one. */
function makePrivateTest(settings) {
  const keys = ((settings && settings.privateFolders) || []).map(parseDirKey);
  return function isPrivate(rootId, dir) {
    const d = String(dir || "");
    return keys.some((k) => k.rootId === rootId && (!k.dir || d === k.dir || d.indexOf(k.dir + "/") === 0));
  };
}

const AI_PRIVATE_MESSAGE = "This card is in a folder you keep private from the AI, so nothing from it is sent to a model.";

/** (rootId, dir) → true when that folder is, or is inside, the trash. */
function makeTrashTest(settings) {
  const trash = (settings && settings.trashKey) ? parseDirKey(settings.trashKey) : null;
  return function inTrash(rootId, dir) {
    const d = String(dir || "");
    if (trash && trash.rootId === rootId && (d === trash.dir || d.indexOf(trash.dir + "/") === 0) && trash.dir) return true;
    for (const seg of d.split("/")) if (seg && TRASH_NAMES.test(seg)) return true;
    return false;
  };
}

function detectDupes(records, ignore, isExcluded) {
  const ig = {
    exact: new Set((ignore && ignore.exact) || []),
    content: new Set((ignore && ignore.content) || []),
    versions: new Set((ignore && ignore.versions) || []),
  };
  const bySig = new Map(), byFp = new Map(), byLfp = new Map();
  let excludedCount = 0;
  for (const r of records) {
    if (!r.sig) continue;
    if (isExcluded && isExcluded(r)) { excludedCount++; continue; }
    if (!bySig.has(r.sig)) bySig.set(r.sig, []);
    bySig.get(r.sig).push(r);
    if (r.ok) {
      if (!byFp.has(r.fp)) byFp.set(r.fp, []);
      byFp.get(r.fp).push(r);
      // Only cluster by name+creator when the card actually carries an embedded
      // name. Otherwise every untitled card collapses into one bogus group.
      if (r.hasName) {
        if (!byLfp.has(r.lfp)) byLfp.set(r.lfp, []);
        byLfp.get(r.lfp).push(r);
      }
    }
  }
  const exact = [], content = [], versions = [];
  const dismissed = [];

  for (const [sig, g] of bySig) {
    if (g.length < 2) continue;
    const grp = { key: sig, kind: "exact", items: g };
    if (ig.exact.has(sig)) dismissed.push(grp); else exact.push(grp);
  }
  for (const [fp, g] of byFp) {
    if (g.length < 2) continue;
    // only interesting if not already fully explained by identical bytes
    const sigs = new Set(g.map((r) => r.sig));
    if (sigs.size <= 1) continue;
    const grp = { key: fp, kind: "content", items: g };
    if (ig.content.has(fp)) dismissed.push(grp); else content.push(grp);
  }
  for (const [lfp, g] of byLfp) {
    if (g.length < 2) continue;
    const fps = new Set(g.map((r) => r.fp));
    if (fps.size <= 1) continue;
    const grp = { key: lfp, kind: "version", items: g };
    if (ig.versions.has(lfp)) dismissed.push(grp); else versions.push(grp);
  }

  const dupeIds = new Set();
  for (const grp of exact.concat(content)) for (const r of grp.items) dupeIds.add(r.id);
  const bySize = (a, b) => b.items.length - a.items.length;
  return {
    exact: exact.sort(bySize),
    content: content.sort(bySize),
    versions: versions.sort(bySize),
    dismissed: dismissed.sort(bySize),
    dupeIds, excludedCount,
    wastedBytes: exact.reduce((a, g) => a + g.items.slice(1).reduce((s, r) => s + r.size, 0), 0),
  };
}

/* ════════════════════════════════════════════
   8b. FOLDER TREE + MOVE
   ════════════════════════════════════════════ */

function dirKey(rootId, dir) { return rootId + "::" + (dir || ""); }

/*
 * Settings that name a folder ("rootId::dir": private folders, the trash, the
 * backup and filing folders, folder destinations, folder labels) point at a
 * registration's random id. When that id goes (a restore into a browser whose
 * folders were added again, or a folder replaced by the one around it), the
 * keys are carried over to the folder as it is registered now. `idMap` maps an
 * old id to { id, prefix }: the root it lives in now and the path in front.
 */
function importRootIdMap(exportRoots, currentRoots) {
  const map = Object.create(null);
  for (const r of currentRoots || []) map[r.id] = { id: r.id, prefix: "" };
  const byName = new Map();
  for (const r of currentRoots || []) {
    const k = String(r.name || "").toLowerCase();
    byName.set(k, byName.has(k) ? null : r);   // a name two folders share can't be matched
  }
  for (const r of exportRoots || []) {
    if (!r || !r.id || map[r.id]) continue;
    const hit = byName.get(String(r.name || "").toLowerCase());
    if (hit) map[r.id] = { id: hit.id, prefix: "" };
  }
  return map;
}

/** One key carried over, "" for none, or null when its folder isn't registered now. */
function remapDirKey(key, idMap) {
  if (!key) return "";
  const k = parseDirKey(key);
  const to = idMap[k.rootId];
  return to ? dirKey(to.id, [to.prefix, k.dir].filter(Boolean).join("/")) : null;
}

/**
 * `incoming`'s folder settings carried onto the folders registered now, as a
 * settings patch. Private folders are added to the current ones, never put in
 * their place; `lostPrivate` counts those that couldn't be placed.
 */
function remapRootSettings(incoming, current, idMap) {
  const inc = incoming || {}, cur = current || {};
  const patch = {};
  const mapped = (Array.isArray(inc.privateFolders) ? inc.privateFolders : []).map((k) => remapDirKey(k, idMap));
  patch.privateFolders = Array.from(new Set((cur.privateFolders || []).concat(mapped.filter(Boolean))));
  for (const f of ["trashKey", "afterSendKey"]) {
    if (inc[f] === undefined) continue;
    const m = remapDirKey(inc[f], idMap);
    patch[f] = m === null ? (cur[f] || "") : m;
  }
  if (inc.autoBackupKey !== undefined) {
    const v = inc.autoBackupKey;
    const m = v === "auto" || v === "off" ? v : remapDirKey(v, idMap);
    patch.autoBackupKey = m === null ? (cur.autoBackupKey == null ? "auto" : cur.autoBackupKey) : m;
  }
  if (Array.isArray(inc.destinations)) {
    patch.destinations = inc.destinations.map((d) => {
      if (!d || d.type !== "folder" || !d.folderKey) return d;
      const m = remapDirKey(d.folderKey, idMap);
      return Object.assign({}, d, { folderKey: m || "" });
    });
  }
  return { patch, lostPrivate: mapped.filter((x) => x === null).length };
}

/** An object keyed by "rootId::dir" (folder labels), carried over; keys with no folder now are dropped. */
function remapDirKeyed(obj, idMap) {
  const out = {};
  for (const k of Object.keys(obj || {})) {
    const m = remapDirKey(k, idMap);
    if (m) out[m] = obj[k];
  }
  return out;
}

function parseDirKey(k) {
  const i = String(k).indexOf("::");
  return i < 0 ? { rootId: k, dir: "" } : { rootId: k.slice(0, i), dir: k.slice(i + 2) };
}

/**
 * The role that applies to a folder: its own label if it has one, otherwise
 * the nearest labelled ancestor, otherwise the registered folder's role.
 * This is what makes "Cards" a Library while "Cards/new" is an Inbox, without
 * registering the subfolder separately.
 */
function effectiveFolderRole(rootId, dir, folderRoles, rootRole) {
  let d = dir || "";
  for (;;) {
    const explicit = folderRoles && folderRoles[dirKey(rootId, d)];
    if (explicit) return explicit;
    if (!d) break;
    const i = d.lastIndexOf("/");
    d = i < 0 ? "" : d.slice(0, i);
  }
  return rootRole || "reference";
}

/** Every folder key carrying (or inheriting) a given role. */
function foldersWithRole(records, roots, folderRoles, role) {
  const out = new Set();
  for (const [k, v] of Object.entries(folderRoles || {})) {
    if (v !== role) continue;
    const { rootId } = parseDirKey(k);
    if (roots.some((r) => r.id === rootId)) out.add(k);
  }
  return Array.from(out);
}

/**
 * Work out how a candidate folder relates to the folders already registered.
 * Registering a folder that sits inside another one indexes every card in it
 * twice, which then shows up as a collection full of "duplicates".
 * Returns null, or { kind: "same" | "inside" | "contains", root, path }.
 */
async function detectNesting(candidate, roots) {
  for (const r of roots) {
    if (!r.handle || isImportRoot(r)) continue;
    try {
      if (await r.handle.isSameEntry(candidate)) return { kind: "same", root: r, path: "" };
    } catch (e) { /* ignore */ }
    try {
      const rel = await r.handle.resolve(candidate);
      if (rel) return { kind: "inside", root: r, path: rel.join("/") };
    } catch (e) { /* ignore */ }
    try {
      const rel2 = await candidate.resolve(r.handle);
      if (rel2) return { kind: "contains", root: r, path: rel2.join("/") };
    } catch (e) { /* ignore */ }
  }
  return null;
}

/** Find registered folders that overlap each other (repairing an old mistake). */
async function findNestedRootPairs(roots) {
  const bad = [];
  for (let i = 0; i < roots.length; i++) {
    for (let j = 0; j < roots.length; j++) {
      if (i === j) continue;
      const outer = roots[i], inner = roots[j];
      if (!outer.handle || !inner.handle || isImportRoot(outer) || isImportRoot(inner)) continue;
      try {
        const rel = await outer.handle.resolve(inner.handle);
        if (rel && rel.length) bad.push({ outer, inner, path: rel.join("/") });
      } catch (e) { /* ignore */ }
    }
  }
  return bad;
}

/** True when a record sits in `dir` or any folder beneath it. */
function recInDir(rec, rootId, dir) {
  if (rec.rootId !== rootId) return false;
  if (!dir) return true;
  return rec.dir === dir || rec.dir.indexOf(dir + "/") === 0;
}

/**
 * Build a nested folder tree per root. Folder paths come from two places:
 * the cards themselves, and the directory listing captured during the scan
 * (which is how empty and freshly created folders make the list).
 */
function buildFolderTree(records, roots) {
  const byRoot = new Map();
  for (const root of roots) {
    byRoot.set(root.id, { paths: new Set([""]), counts: new Map(), own: new Map() });
  }
  for (const root of roots) {
    const slot = byRoot.get(root.id);
    for (const d of (root.dirs || [])) if (d) slot.paths.add(d);
  }
  for (const r of records) {
    const slot = byRoot.get(r.rootId);
    if (!slot) continue;
    slot.own.set(r.dir || "", (slot.own.get(r.dir || "") || 0) + 1);
    const parts = r.dir ? r.dir.split("/") : [];
    for (let i = 1; i <= parts.length; i++) slot.paths.add(parts.slice(0, i).join("/"));
    // every ancestor (including root) gets the descendant count
    slot.counts.set("", (slot.counts.get("") || 0) + 1);
    for (let i = 1; i <= parts.length; i++) {
      const p = parts.slice(0, i).join("/");
      slot.counts.set(p, (slot.counts.get(p) || 0) + 1);
    }
  }

  const trees = [];
  for (const root of roots) {
    const slot = byRoot.get(root.id);
    const nodes = new Map();
    const mk = (dir) => {
      if (nodes.has(dir)) return nodes.get(dir);
      const parts = dir ? dir.split("/") : [];
      const n = {
        key: dirKey(root.id, dir),
        rootId: root.id, dir,
        name: dir ? parts[parts.length - 1] : root.name,
        depth: parts.length,
        count: slot.counts.get(dir) || 0,
        own: slot.own.get(dir) || 0,
        children: [],
        isRoot: !dir,
      };
      nodes.set(dir, n);
      return n;
    };
    const sorted = Array.from(slot.paths).sort();
    for (const dir of sorted) {
      const n = mk(dir);
      if (!dir) continue;
      const parts = dir.split("/");
      const parentDir = parts.slice(0, -1).join("/");
      mk(parentDir).children.push(n);
    }
    for (const n of nodes.values()) {
      n.children.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    }
    trees.push({ root, node: nodes.get("") });
  }
  return trees;
}

/** Flat list of every folder in a root, for "move to…" pickers. */
function foldersOfRoot(records, root) {
  const set = new Set([""]);
  for (const d of (root.dirs || [])) if (d) set.add(d);
  for (const r of records) {
    if (r.rootId !== root.id) continue;
    const parts = r.dir ? r.dir.split("/") : [];
    for (let i = 1; i <= parts.length; i++) set.add(parts.slice(0, i).join("/"));
  }
  return Array.from(set).sort();
}

async function createFolderIn(root, parentDir, name) {
  if (isImportRoot(root)) throw new Error("Imported folders are read-only");
  const clean = String(name || "").replace(/[\\/:*?"<>|]/g, "").trim();
  if (!clean) throw new Error("Folder name can't be empty");
  if (!(await verifyPermission(root.handle, true))) throw new Error("Write permission denied for " + root.name);
  const dirs = (parentDir ? parentDir.split("/") : []).concat([clean]);
  await getDirByPath(root.handle, dirs, true);
  await logOp("mkdir", { root: root.name, path: dirs.join("/") });
  return dirs.join("/");
}

const TRASH_FOLDER_NAME = "_vault trash";

/**
 * Permanently remove a card file from disk.
 *
 * Callers are responsible for confirming intent. Everything lands in the
 * operation log, because this is the one action with no undo.
 */
async function deleteCardFile(rec, root) {
  if (!root) throw new Error("Folder for this card is no longer registered");
  if (isImportRoot(root)) throw new Error("Imported folders are read-only");
  if (!(await verifyPermission(root.handle, true))) throw new Error("Write permission denied for " + root.name);
  const dirs = rec.dir ? rec.dir.split("/") : [];
  const dir = await getDirByPath(root.handle, dirs, false);
  await dir.removeEntry(rec.file);
  await logOp("delete", { card: rec.name, path: root.name + "/" + rec.rel, size: rec.size });
  return true;
}

/**
 * Pick which copy in a duplicate group to keep.
 * Preference order: a card living in a Library root, then the newest file,
 * then the shortest path (which tends to be the "real" one rather than a
 * "card (2).png" style accident).
 */
function defaultKeeper(items, roots) {
  const roleOf = (r) => {
    const root = roots.find((x) => x.id === r.rootId);
    return root ? root.role : "reference";
  };
  const score = (r) => (roleOf(r) === "library" ? 2 : roleOf(r) === "inbox" ? 1 : 0);
  return items.slice().sort((a, b) => {
    const s = score(b) - score(a);
    if (s) return s;
    if (b.mtime !== a.mtime) return b.mtime - a.mtime;
    return a.rel.length - b.rel.length;
  })[0];
}

/**
 * Move one card to another folder (optionally in another root).
 *
 * The only operation in the vault that removes a file from where you put it,
 * so the order is deliberate: write the copy, read it back, compare byte
 * signatures, and ONLY then delete the source. If verification fails at any
 * point the source is left exactly where it was.
 */
async function moveCardTo(rec, srcRoot, destRoot, destDir) {
  if (isImportRoot(srcRoot)) throw new Error("Imported folders are read-only — nothing can be moved out of them");
  if (isImportRoot(destRoot)) throw new Error("Imported folders are read-only — nothing can be moved into them");
  if (srcRoot.id === destRoot.id && (rec.dir || "") === (destDir || "")) {
    return { skipped: true, reason: "already in that folder" };
  }
  if (!(await verifyPermission(destRoot.handle, true))) throw new Error("Write permission denied for " + destRoot.name);
  if (!(await verifyPermission(srcRoot.handle, true))) throw new Error("Write permission denied for " + srcRoot.name);

  const destDirs = destDir ? destDir.split("/") : [];

  // 1. read the original
  const srcDirs = rec.dir ? rec.dir.split("/") : [];
  const srcDirHandle = await getDirByPath(srcRoot.handle, srcDirs, false);
  const srcFh = await srcDirHandle.getFileHandle(rec.file, { create: false });
  const srcFile = await srcFh.getFile();
  const bytes = new Uint8Array(await srcFile.arrayBuffer());
  const srcSig = await byteSignature(srcFile);

  // 2. write the copy (collision-safe; may land under a numbered name)
  const written = await copyIntoRoot(destRoot, destDirs, rec.file, new Blob([bytes]), srcSig);

  // 3. verify the copy really exists and matches, byte signature for byte signature
  const destDirHandle = await getDirByPath(destRoot.handle, destDirs, false);
  const checkFh = await destDirHandle.getFileHandle(written.name, { create: false });
  // The "copy" may be the original itself: the same folder under another
  // spelling ("fantasy" and "Fantasy" on Windows), or a folder reached from two
  // registered ones. Removing the source would then delete the only copy.
  if (await srcFh.isSameEntry(checkFh)) return { skipped: true, reason: "already in that folder" };
  const checkFile = await checkFh.getFile();
  if (checkFile.size !== srcFile.size) throw new Error("Copy verification failed (size mismatch) — source left untouched");
  const checkSig = await byteSignature(checkFile);
  if (checkSig !== srcSig) throw new Error("Copy verification failed (content mismatch) — source left untouched");

  // 4. only now remove the original
  await srcDirHandle.removeEntry(rec.file);

  await logOp("move", {
    card: rec.name,
    from: srcRoot.name + "/" + rec.rel,
    to: destRoot.name + "/" + (destDirs.length ? destDirs.join("/") + "/" : "") + written.name,
    verified: true,
  });
  return { skipped: false, name: written.name, dir: destDir || "" };
}

function targetFolderFor(rec, mode, tagMeta) {
  if (mode === "creator") return [safeFileName(rec.creator || "unknown creator")];
  if (mode === "firstTag") {
    const t = resolveTags(rec.tags, tagMeta, true)[0];
    return [safeFileName(t || "untagged")];
  }
  if (mode === "date") {
    const d = new Date(rec.mtime || Date.now());
    return [d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")];
  }
  return [];
}

/**
 * Compare inbox records against the records already living in the
 * destination roots, and decide what to do with each.
 */
function planIngest(inboxRecs, destRecs, settings, tagMeta, isExcluded) {
  // A copy sitting in the trash or in _vault backups must not make an incoming
  // card look like it's already filed — otherwise you could never re-add
  // something you'd thrown away.
  if (isExcluded) destRecs = destRecs.filter((r) => !isExcluded(r));
  const bySig = new Map(), byFp = new Map(), byLfp = new Map();
  for (const r of destRecs) {
    if (r.sig) { if (!bySig.has(r.sig)) bySig.set(r.sig, []); bySig.get(r.sig).push(r); }
    if (r.ok) {
      if (!byFp.has(r.fp)) byFp.set(r.fp, []); byFp.get(r.fp).push(r);
      if (!byLfp.has(r.lfp)) byLfp.set(r.lfp, []); byLfp.get(r.lfp).push(r);
    }
  }
  const batchSig = new Map();
  const plan = [];
  for (const r of inboxRecs) {
    let status = "new", matches = [], note = "";
    if (!r.ok) {
      status = "broken";
      note = r.err;
    } else if (bySig.has(r.sig)) {
      status = "exact"; matches = bySig.get(r.sig);
      note = "Byte-identical copy already filed";
    } else if (byFp.has(r.fp)) {
      status = "content"; matches = byFp.get(r.fp);
      note = "Same character content, different file encoding";
    } else if (byLfp.has(r.lfp)) {
      status = "version"; matches = byLfp.get(r.lfp);
      const theirs = matches.map((m) => m.version).filter(Boolean).join(", ");
      note = "Same name/creator, different content" + (theirs ? " (filed: v" + theirs + ")" : "");
    } else if (batchSig.has(r.sig)) {
      status = "batchDupe"; matches = [batchSig.get(r.sig)];
      note = "Duplicated within this batch";
    }
    if (!batchSig.has(r.sig)) batchSig.set(r.sig, r);

    const skip = settings.ingestSkipDupes && (status === "exact" || status === "batchDupe");
    plan.push({
      rec: r,
      status, matches, note,
      action: status === "broken" ? "skip" : (skip ? "skip" : "copy"),
      subfolder: targetFolderFor(r, settings.ingestSubfolder, tagMeta),
    });
  }
  const order = { new: 0, version: 1, content: 2, exact: 3, batchDupe: 4, broken: 5 };
  plan.sort((a, b) => (order[a.status] - order[b.status]) || a.rec.name.localeCompare(b.rec.name));
  return plan;
}

const INGEST_STATUS_META = {
  new:       { label: "New",            color: "green",  icon: "✦" },
  version:   { label: "New version",    color: "warm",   icon: "↻" },
  content:   { label: "Same content",   color: "blue",   icon: "≈" },
  exact:     { label: "Exact duplicate",color: "muted",  icon: "=" },
  batchDupe: { label: "Dupe in batch",  color: "muted",  icon: "⇉" },
  broken:    { label: "Unreadable",     color: "red",    icon: "⚠" },
};

/**
 * Copy one file's bytes into a destination root. Never deletes, never
 * overwrites a differing file — collisions get a numeric suffix.
 */
async function copyIntoRoot(destRoot, subfolder, filename, blob, sig) {
  const dir = await getDirByPath(destRoot.handle, subfolder, true);
  let finalName = filename;
  // If a file with this name exists, check whether it's the same bytes.
  for (let attempt = 0; attempt < 50; attempt++) {
    let existing = null;
    try { existing = await dir.getFileHandle(finalName, { create: false }); }
    catch (e) { existing = null; }
    if (!existing) break;
    try {
      const ef = await existing.getFile();
      if (ef.size === blob.size) {
        const esig = await byteSignature(ef);
        if (esig === sig) return { skipped: true, name: finalName, reason: "identical file already there" };
      }
    } catch (e) { /* fall through to rename */ }
    const b = baseName(filename), x = extOf(filename);
    finalName = b + " (" + (attempt + 2) + ")" + (x ? "." + x : "");
  }
  const fh = await dir.getFileHandle(finalName, { create: true });
  const w = await fh.createWritable();
  await w.write(blob);
  await w.close();
  return { skipped: false, name: finalName, path: subfolder.concat([finalName]).join("/") };
}

/* ── menu placement ──────────────────────────────────────────────────
   Kept as pure functions so the edge cases can actually be tested rather
   than eyeballed: right-clicking near the right edge of a monitor used to
   push the menu (and worse, its flyouts) off-screen.
   ──────────────────────────────────────────────────────────────────── */

const MENU_MARGIN = 8;

/** Where to put the root menu so it stays fully on screen. */
function placeMenu(x, y, w, h, vw, vh) {
  // Flip to the other side of the cursor first, then clamp — flipping alone
  // still overflows when the cursor itself sits inside the margin, which is
  // exactly what happens when you right-click hard against the screen edge.
  let left = x;
  if (left + w > vw - MENU_MARGIN) left = x - w;
  left = Math.max(MENU_MARGIN, Math.min(left, vw - w - MENU_MARGIN));

  let top = y;
  if (top + h > vh - MENU_MARGIN) top = y - h;
  top = Math.max(MENU_MARGIN, Math.min(top, vh - h - MENU_MARGIN));
  // A maxHeight forces overflow:auto, which would clip submenus escaping the
  // menu box — so only ask for one when the menu really is taller than the screen.
  const needScroll = h > vh - 2 * MENU_MARGIN;
  return { left, top, maxHeight: needScroll ? vh - 2 * MENU_MARGIN : 0 };
}

/**
 * Where to put a submenu relative to its parent row.
 * Opens to the right normally; flips left when the right side is short on
 * room, and slides up when it would run off the bottom.
 */
function placeFlyout(parent, subW, subH, vw, vh) {
  const roomRight = vw - parent.right - MENU_MARGIN;
  const roomLeft = parent.left - MENU_MARGIN;
  const side = (roomRight >= subW || roomRight >= roomLeft) ? "right" : "left";
  let top = -4;
  const absTop = parent.top + top;
  if (absTop + subH > vh - MENU_MARGIN) top = (vh - MENU_MARGIN - subH) - parent.top;
  if (parent.top + top < MENU_MARGIN) top = MENU_MARGIN - parent.top;
  return { side, top, maxHeight: Math.max(120, vh - 2 * MENU_MARGIN) };
}

/* ════════════════════════════════════════════
   13. EDIT OVERLAY + EXPORT HELPERS
   ════════════════════════════════════════════

   Originals are never rewritten. Every change lives in the `edits` store,
   keyed by content fingerprint so it survives renames and re-filing.
   Materialising an edit always produces a NEW file.
   ════════════════════════════════════════════ */

function emptyEdit(fp) {
  return {
    fingerprint: fp, fields: {}, tags: null, vaultTags: [], flags: [],
    notes: "", rating: 0, favorite: false, updatedAt: 0,
  };
}

/** Tags that live only in the vault and are never written to a card file. */
function vaultTagsOf(edit) {
  return (edit && Array.isArray(edit.vaultTags)) ? edit.vaultTags : [];
}

function flagsOf(edit) {
  return (edit && Array.isArray(edit.flags)) ? edit.flags : [];
}

function hasFlag(edit, key) {
  return flagsOf(edit).some((f) => f.key === key);
}

/*
 * A card can hold several flags of one kind (two "Needs a rewrite", say),
 * each with its own note. Adding one skips a note that kind already has (an
 * empty one included, once the kind is there), and fills in a note-less flag
 * of that kind rather than adding another.
 */
function addFlagEntries(flags, adds, now) {
  const out = (flags || []).map((f) => Object.assign({}, f));
  for (const a of adds || []) {
    const key = String((a && a.key) || "");
    if (!key) continue;
    const note = String((a && a.note) || "").trim();
    const same = out.filter((f) => f.key === key);
    if (same.some((f) => String(f.note || "").trim() === note)) continue;
    if (!note && same.length) continue;
    const blank = same.filter((f) => !String(f.note || "").trim())[0];
    if (blank) blank.note = note;
    else out.push({ key, note, at: now });
  }
  return out;
}

/** A tooltip for one kind of flag on a card: its name, then each note on a line. */
function flagGroupTitle(g) {
  const notes = g.items.map((it) => String(it.flag.note || "").trim()).filter(Boolean);
  return flagDef(g.key).label + (g.items.length > 1 ? " ×" + g.items.length : "") + (notes.length ? ":\n" + notes.map((n) => "• " + n).join("\n") : "");
}

/** Flags grouped by kind, in the order each kind first appears: [{ key, items: [{ flag, index }] }]. */
function flagGroups(flags) {
  const groups = [];
  (flags || []).forEach((f, index) => {
    let g = groups.filter((x) => x.key === f.key)[0];
    if (!g) { g = { key: f.key, items: [] }; groups.push(g); }
    g.items.push({ flag: f, index });
  });
  return groups;
}

function effectiveField(body, edit, key) {
  if (edit && edit.fields && Object.prototype.hasOwnProperty.call(edit.fields, key)) return edit.fields[key];
  return body ? (body[key] || "") : "";
}

function effectiveTags(rec, edit) {
  if (edit && Array.isArray(edit.tags)) return edit.tags;
  return rec.tags || [];
}

function addedTagsOf(rec, edit) {
  if (!edit || !Array.isArray(edit.tags)) return [];
  const base = new Set((rec.tags || []).map(normTagName));
  return edit.tags.filter((t) => !base.has(normTagName(t)));
}

/** True when the vault holds card changes that aren't in the file yet. */
function isEdited(edit) {
  if (!edit) return false;
  if (edit.fields && Object.keys(edit.fields).length) return true;
  if (Array.isArray(edit.tags)) return true;
  if (edit.greetings) return true;
  if (edit.lorebook) return true;
  return false;
}

/** Count of unsaved card changes, for the "save to card" affordance. */
function pendingEditCount(edit) {
  if (!edit) return 0;
  let n = edit.fields ? Object.keys(edit.fields).length : 0;
  if (Array.isArray(edit.tags)) n++;
  if (edit.greetings) n++;
  if (edit.lorebook) n++;
  return n;
}

/* ── lorebook edits ──────────────────────────────────────────────────────
   edit.lorebook, when present, is the whole edited lorebook in the vault's
   normalized shape. Each entry keeps `idx`, its position in the file's
   original book (null for an entry added here), so a save can merge it
   back onto the original without losing what the vault doesn't model. */

/** The lorebook as the vault shows it now: the edited one, else the file's. */
function effectiveLorebook(body, edit) {
  if (edit && edit.lorebook && typeof edit.lorebook === "object") return edit.lorebook;
  const b = (body && body.lorebook) || null;
  // The file's entries are its originals: make sure each knows its place, so a save merges onto it.
  if (b && Array.isArray(b.entries) && b.entries.some((e) => !e || typeof e.idx !== "number")) {
    return Object.assign({}, b, { entries: b.entries.map((e, i) => (e && typeof e.idx === "number" ? e : Object.assign({}, e, { idx: i }))) });
  }
  return b;
}

/** A lorebook entry with every field the vault models, filled in. */
function cleanLoreEntry(e) {
  const x = e || {};
  const list = (v) => (Array.isArray(v) ? v : String(v || "").split(",")).map((k) => String(k).trim()).filter(Boolean);
  const content = String(x.content == null ? "" : x.content);
  return {
    idx: typeof x.idx === "number" ? x.idx : null,
    keys: list(x.keys), secondaryKeys: list(x.secondaryKeys),
    content, comment: String(x.comment || ""),
    enabled: x.enabled !== false, constant: !!x.constant, selective: !!x.selective,
    insertionOrder: Number.isFinite(Number(x.insertionOrder)) ? Number(x.insertionOrder) : 0,
    position: String(x.position || ""),
    tokens: estimateTokens(content),
  };
}

/** A lorebook with its entries tidied and its token total worked out again. */
function cleanLorebook(lb) {
  const b = lb || {};
  const entries = (Array.isArray(b.entries) ? b.entries : []).map(cleanLoreEntry);
  return {
    name: String(b.name || ""), description: String(b.description || ""),
    scanDepth: b.scanDepth == null ? null : b.scanDepth, tokenBudget: b.tokenBudget == null ? null : b.tokenBudget,
    recursiveScanning: !!b.recursiveScanning,
    entries, totalTokens: entries.reduce((a, e) => a + e.tokens, 0),
  };
}

/** Whether two lorebooks would write the same thing. */
function sameLorebook(a, b) {
  const w = (lb) => (lb ? JSON.stringify(denormalizeLorebook(cleanLorebook(lb))) + "|" + cleanLorebook(lb).entries.map((e) => e.idx).join(",") : "");
  return w(a) === w(b);
}

/**
 * The patch that puts `lb` into the vault's edits: the edited lorebook, or
 * { lorebook: null } (no edit) when it matches the file's again.
 */
function lorebookPatch(body, lb) {
  const next = lb ? cleanLorebook(lb) : null;
  const orig = (body && body.lorebook) || null;
  if (!next && !orig) return { lorebook: null };
  return { lorebook: next && orig && sameLorebook(next, orig) ? null : next };
}

/**
 * The card to write, as chara_card_v3. `rawBook` is the original file's
 * character_book (rawCharacterBook): pass it whenever the file was read, so
 * the lorebook keeps everything the vault doesn't model.
 */
function buildV3Payload(body, edit, rawBook) {
  const d = {};
  for (const f of CARD_FIELDS) d[f.key] = effectiveField(body, edit, f.key);
  const greet = (edit && edit.greetings) || null;
  return {
    spec: "chara_card_v3",
    spec_version: "3.0",
    data: Object.assign({
      name: effectiveField(body, edit, "name") || (body && body.name) || "",
      nickname: body ? body.nickname : "",
      creator: body ? body.creator : "",
      character_version: body ? body.character_version : "",
      tags: (edit && Array.isArray(edit.tags)) ? edit.tags : (body ? body.tags : []),
      alternate_greetings: greet ? greet : (body ? body.alternate_greetings : []),
      group_only_greetings: body ? body.group_only_greetings : [],
      source: body ? body.source : [],
      creation_date: body ? body.creation_date : null,
      modification_date: Math.floor(Date.now() / 1000),
      extensions: body ? body.extensions : {},
      character_book: effectiveLorebook(body, edit) ? mergeLorebookForSave(rawBook, effectiveLorebook(body, edit)) : undefined,
    }, d),
  };
}

function buildV2Payload(v3) {
  const d = Object.assign({}, v3.data);
  delete d.nickname;
  delete d.group_only_greetings;
  delete d.source;
  return { spec: "chara_card_v2", spec_version: "2.0", data: d };
}

function denormalizeLorebook(lb) {
  if (!lb) return undefined;
  return {
    name: lb.name, description: lb.description,
    scan_depth: lb.scanDepth === null ? undefined : lb.scanDepth,
    token_budget: lb.tokenBudget === null ? undefined : lb.tokenBudget,
    recursive_scanning: lb.recursiveScanning,
    entries: lb.entries.map((e) => ({
      keys: e.keys, secondary_keys: e.secondaryKeys, content: e.content,
      comment: e.comment, enabled: e.enabled, constant: e.constant,
      selective: e.selective, insertion_order: e.insertionOrder,
      position: e.position || undefined,
    })),
  };
}

/** A lorebook's entries as one comparable string: count, then each entry's keys and content. */
function lorebookDigest(lb) {
  const es = (lb && Array.isArray(lb.entries)) ? lb.entries : [];
  return es.length + "\u0000" + es.map((e) => (e.keys || []).join(",") + "\u0001" + (e.content || "")).join("\u0000");
}

/** The original character_book in a parsed card file, wherever the spec put it. */
function rawCharacterBook(raw) {
  if (!raw || typeof raw !== "object") return null;
  const src = (raw.data && typeof raw.data === "object") ? raw.data : raw;
  return src.character_book || src.characterBook || src.character_bookv3 || raw.character_book || null;
}

/**
 * The lorebook to write into a card, starting from the file's own
 * character_book so nothing the vault doesn't model is lost: entry ids,
 * extensions (SillyTavern's depth, probability, role…), case_sensitive,
 * use_regex, priority and anything else. The fields the vault does model are
 * written over each original entry, matched by its original position (idx);
 * entries without one are new, and original entries no longer listed are
 * removed. Without the original it falls back to the vault's own copy.
 */
function mergeLorebookForSave(rawBook, lb) {
  if (!lb) return undefined;
  const base = denormalizeLorebook(lb);
  if (!rawBook || typeof rawBook !== "object") return base;
  const rawEntries = Array.isArray(rawBook.entries) ? rawBook.entries
    : (rawBook.entries && typeof rawBook.entries === "object" ? Object.values(rawBook.entries) : []);
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const book = Object.assign({}, rawBook);
  for (const k of Object.keys(base)) if (k !== "entries" && base[k] !== undefined) book[k] = base[k];
  let nextId = rawEntries.reduce((n, e) => (e && typeof e.id === "number" && e.id >= n ? e.id + 1 : n), 0);
  book.entries = lb.entries.map((e, i) => {
    const mine = base.entries[i];
    const orig = (typeof e.idx === "number" && rawEntries[e.idx] && typeof rawEntries[e.idx] === "object") ? rawEntries[e.idx] : null;
    if (!orig) {
      const fresh = Object.assign({}, mine);
      if (nextId > 0 || rawEntries.some((x) => x && has(x, "id"))) fresh.id = nextId++;
      return fresh;
    }
    const out = Object.assign({}, orig);
    for (const k of Object.keys(mine)) if (mine[k] !== undefined) out[k] = mine[k];
    // Keep alternative spellings some front ends use in step with the edited values.
    if (has(orig, "key")) out.key = mine.keys;
    if (has(orig, "keysecondary")) out.keysecondary = mine.secondary_keys;
    if (has(orig, "order")) out.order = mine.insertion_order;
    if (has(orig, "disable")) out.disable = !mine.enabled;
    if (has(orig, "name") && !has(orig, "comment")) out.name = mine.comment;
    return out;
  });
  return book;
}

async function getFileHandleFor(rec, roots) {
  const root = roots.find((r) => r.id === rec.rootId);
  if (!root) throw new Error("Folder for this card is no longer registered");
  if (isImportRoot(root)) throw new Error("Imported folders are read-only");
  if (!(await verifyPermission(root.handle, false))) throw new Error("Permission denied for " + root.name);
  const dirs = rec.dir ? rec.dir.split("/") : [];
  const dir = await getDirByPath(root.handle, dirs, false);
  return dir.getFileHandle(rec.file, { create: false });
}

async function readOriginalBytes(rec, roots) {
  const root = roots.find((r) => r.id === rec.rootId);
  if (root && isImportRoot(root)) {
    const f = fileFor(rec.id);
    if (!f) throw new Error("Re-attach the folder \"" + root.name + "\" to read this card's file");
    return { bytes: new Uint8Array(await f.arrayBuffer()), file: f };
  }
  const fh = await getFileHandleFor(rec, roots);
  const file = await fh.getFile();
  return { bytes: new Uint8Array(await file.arrayBuffer()), file };
}

/** The original character_book in a card file's bytes, or null if it can't be read. */
async function rawBookFromBytes(bytes, filename) {
  try {
    const p = await parseCardBytes(bytes, filename);
    return p && p.ok ? rawCharacterBook(p.raw) : null;
  } catch (e) { return null; }
}

/** Produce the edited card as a Blob, never touching the source file. */
async function materializeEdit(rec, body, edit, roots) {
  const { bytes } = await readOriginalBytes(rec, roots);
  const v3 = buildV3Payload(body, edit, await rawBookFromBytes(bytes, rec.file));
  const v2 = buildV2Payload(v3);
  const name = safeFileName(v3.data.name || rec.name) + " (vault)";
  if (rec.ext === "json") {
    return { blob: new Blob([JSON.stringify(v3, null, 2)], { type: "application/json" }), filename: name + ".json" };
  }
  if (!isPng(bytes)) {
    return { blob: new Blob([JSON.stringify(v3, null, 2)], { type: "application/json" }), filename: name + ".json" };
  }
  const out = writeCardIntoPng(bytes, v3, v2);
  return { blob: new Blob([out], { type: "image/png" }), filename: name + ".png" };
}

const BACKUP_FOLDER_NAME = "_vault backups";

const BACKUP_KEEP_CHOICES = [0, 3, 5, 10, 20];   // 0 = keep every backup
const reEscape = (x) => String(x).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

/**
 * The backups of one card file to remove so that the newest `keep` remain.
 * Only names in the vault's own backup pattern ("<name> <date-time>.<ext>",
 * maybe with " (2)") count, so nothing else in the folder is ever touched.
 */
function backupsToPrune(names, file, keep) {
  if (!(keep > 0)) return [];
  const ext = extOf(file);
  const re = new RegExp("^" + reEscape(baseName(file)) + " (\\d{8}-\\d{6})(?: \\((\\d+)\\))?" + (ext ? "\\." + reEscape(ext) : "") + "$", "i");
  const mine = [];
  for (const n of names) {
    const m = re.exec(n);
    if (m) mine.push({ n, k: m[1] + "." + String(m[2] || 1).padStart(4, "0") });
  }
  mine.sort((a, b) => (a.k < b.k ? 1 : a.k > b.k ? -1 : 0));
  return mine.slice(keep).map((x) => x.n);
}

/* ── automatic backups of vault data ──────────────────────────────────────
   Tags, notes, edits and chats live only in the browser, which a "clear
   browsing data" wipes. So a copy of Export vault data is written, every day
   or so, into a folder of yours (`_vault data/`), where Import vault data can
   bring it back. Written only when the folder's access is already granted
   (after a scan, say), never by asking. */
const VAULT_DATA_FOLDER = "_vault data";
const VAULT_DATA_PREFIX = "rp-card-vault-data ";
const AUTO_BACKUP_KEY = "autoBackupAt";
const AUTO_BACKUP_DAYS = [1, 3, 7];
const AUTO_BACKUP_KEEP = [3, 7, 14, 30];

function vaultDataFileName(stamp) { return VAULT_DATA_PREFIX + stamp + ".json"; }

/** Which vault-data backups to remove so that the newest `keep` remain. */
function vaultDataFilesToPrune(names, keep) {
  if (!(keep > 0)) return [];
  const re = new RegExp("^" + reEscape(VAULT_DATA_PREFIX) + "(\\d{8}-\\d{6})\\.json$");
  return names.filter((n) => re.test(n)).sort().reverse().slice(keep);
}

/** Whether a backup is due: never made, or older than `days`. */
function autoBackupDue(lastAt, days, now) {
  const d = Number(days) > 0 ? Number(days) : 1;
  return !(Number(lastAt) > 0) || now - Number(lastAt) >= d * 86400000 - 60000;
}

/**
 * Where vault data is backed up: { root, dirs, label }, or null when it's off
 * or there's no folder to write to. A chosen folder that's gone (after an
 * import on another computer, say) falls back to the first folder, so backups
 * don't quietly stop.
 */
function autoBackupTarget(settings, roots) {
  const key = settings && settings.autoBackupKey != null ? settings.autoBackupKey : "auto";
  if (key === "off") return null;
  const usable = (roots || []).filter((r) => r && r.handle && !isImportRoot(r));
  if (!usable.length) return null;
  let root = usable[0], dirs = [];
  if (key && key !== "auto") {
    const k = parseDirKey(key);
    const chosen = usable.find((r) => r.id === k.rootId);
    if (chosen) { root = chosen; dirs = k.dir ? k.dir.split("/") : []; }
  }
  return { root, dirs, label: [root.name].concat(dirs, [VAULT_DATA_FOLDER]).join("/") };
}

function stampNow() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

/**
 * Write the edited card back into its own file.
 *
 * This is the only operation that overwrites an original, so it is built to
 * be survivable:
 *   1. the original bytes are held in memory for the whole operation
 *   2. a timestamped backup is written alongside (unless explicitly disabled)
 *   3. the new bytes are written in place
 *   4. the file is read back and re-parsed
 *   5. if that fails — or the name doesn't match what we wrote — the original
 *      bytes are written straight back and the error is raised
 *
 * Vault-only tags, notes, ratings and flags are deliberately NOT written.
 */
async function saveCardToFile(rec, body, edit, roots, opts) {
  opts = opts || {};
  const root = roots.find((r) => r.id === rec.rootId);
  if (!root) throw new Error("Folder for this card is no longer registered");
  if (isImportRoot(root)) throw new Error("Imported folders are read-only — use Download copy instead");
  if (!(await verifyPermission(root.handle, true))) throw new Error("Write permission denied for " + root.name);

  const dirs = rec.dir ? rec.dir.split("/") : [];
  const dir = await getDirByPath(root.handle, dirs, false);
  const fh = await dir.getFileHandle(rec.file, { create: false });
  const originalBytes = new Uint8Array(await (await fh.getFile()).arrayBuffer());

  // Start the lorebook from the file's own, so nothing the vault doesn't model is lost.
  const v3 = buildV3Payload(body, edit, await rawBookFromBytes(originalBytes, rec.file));
  const v2 = buildV2Payload(v3);

  let outBytes;
  if (rec.ext === "json") {
    outBytes = new TextEncoder().encode(JSON.stringify(v3, null, 2));
  } else if (isPng(originalBytes)) {
    outBytes = writeCardIntoPng(originalBytes, v3, v2);
  } else {
    throw new Error("Don't know how to write this file type in place — use Download copy");
  }

  let backupPath = "";
  if (opts.backup !== false) {
    const bName = baseName(rec.file) + " " + stampNow() + (rec.ext ? "." + rec.ext : "");
    // In a copy of the card's own folder path, so two cards with the same file
    // name in different folders never share (or prune) each other's backups.
    const res = await copyIntoRoot(root, [BACKUP_FOLDER_NAME].concat(dirs), bName, new Blob([originalBytes]), rec.sig);
    backupPath = [root.name, BACKUP_FOLDER_NAME].concat(dirs, [res.name]).join("/");
  }

  const restore = async () => {
    try {
      const w = await fh.createWritable();
      await w.write(new Blob([originalBytes]));
      await w.close();
      return true;
    } catch (e) { return false; }
  };

  try {
    const w = await fh.createWritable();
    await w.write(new Blob([outBytes]));
    await w.close();
  } catch (e) {
    await restore();
    throw new Error("Write failed, original restored: " + e.message);
  }

  // read it back off disk and make sure it's still a card
  let verified = null;
  try {
    const back = new Uint8Array(await (await fh.getFile()).arrayBuffer());
    verified = await parseCardBytes(back, rec.file);
  } catch (e) {
    verified = { ok: false, err: e.message };
  }

  if (!verified || !verified.ok) {
    const ok = await restore();
    throw new Error(
      "The saved file didn't read back as a valid card" +
      (verified && verified.err ? " (" + verified.err + ")" : "") + ". " +
      (ok ? "The original has been put back." : "Restore failed — recover from " + (backupPath || "your backup") + ".")
    );
  }

  // Parsing successfully isn't enough — a partly damaged file can still yield
  // *a* card. Compare what came back against what we meant to write.
  const intended = normalizeCard(v3);
  const want = intended ? intended.data : null;
  const got = verified.data;
  const mismatch = !want ? "could not re-read the intended card"
    : got.name !== want.name ? "name"
    : got.description !== want.description ? "description"
    : got.first_mes !== want.first_mes ? "first message"
    : got.personality !== want.personality ? "personality"
    : got.scenario !== want.scenario ? "scenario"
    : got.tags.join("\u0000") !== want.tags.join("\u0000") ? "tags"
    : got.alternate_greetings.length !== want.alternate_greetings.length ? "alternate greetings"
    : lorebookDigest(got.lorebook) !== lorebookDigest(want.lorebook) ? "lorebook"
    : "";
  if (mismatch) {
    const ok = await restore();
    throw new Error(
      "The file read back doesn't match what was written (" + mismatch + "). " +
      (ok ? "The original has been put back." : "Restore failed — recover from " + (backupPath || "your backup") + ".")
    );
  }

  await logOp("saveToCard", {
    card: v3.data.name, path: root.name + "/" + rec.rel,
    backup: backupPath || "(none)", bytes: outBytes.length,
  });

  // Only now that the new file is verified: drop this card's oldest backups
  // beyond the number to keep. A failure here never fails the save.
  let pruned = 0;
  if (backupPath && opts.keep > 0) {
    try {
      const bdir = await getDirByPath(root.handle, [BACKUP_FOLDER_NAME].concat(dirs), false);
      const names = [];
      for await (const [n, e] of bdir.entries()) if (e.kind === "file") names.push(n);
      for (const n of backupsToPrune(names, rec.file, opts.keep)) {
        try { await bdir.removeEntry(n); pruned++; } catch (e) { /* in use, say: next save tries again */ }
      }
    } catch (e) { /* no backup folder after all */ }
  }

  return { data: verified.data, spec: verified.spec, backupPath, bytes: outBytes.length, pruned };
}

/* ════════════════════════════════════════════
   8c. TEXT DIFF (for comparing duplicates)
   ════════════════════════════════════════════ */

const DIFF_WORD_CAP = 2500;   // beyond this, fall back to a paragraph diff

function tokenizeWords(s) {
  return String(s || "").split(/(\s+)/).filter((t) => t.length);
}

function tokenizeParas(s) {
  return String(s || "").split(/(\n{2,})/).filter((t) => t.length);
}

/**
 * Longest-common-subsequence diff over tokens.
 * Returns [{ t: "same"|"add"|"del", text }] where "del" is only in A and
 * "add" only in B. Quadratic, hence the token cap in diffText.
 */
function diffTokens(a, b) {
  const n = a.length, m = b.length;
  if (!n && !m) return [];
  if (!n) return [{ t: "add", text: b.join("") }];
  if (!m) return [{ t: "del", text: a.join("") }];

  // trim the common head and tail first — card edits are usually localised,
  // which keeps the expensive part small
  let head = 0;
  while (head < n && head < m && a[head] === b[head]) head++;
  let tail = 0;
  while (tail < n - head && tail < m - head && a[n - 1 - tail] === b[m - 1 - tail]) tail++;

  const A = a.slice(head, n - tail), B = b.slice(head, m - tail);
  const out = [];
  if (head) out.push({ t: "same", text: a.slice(0, head).join("") });

  if (A.length && B.length) {
    const rows = A.length + 1, cols = B.length + 1;
    const dp = new Uint32Array(rows * cols);
    for (let i = A.length - 1; i >= 0; i--) {
      for (let j = B.length - 1; j >= 0; j--) {
        dp[i * cols + j] = A[i] === B[j]
          ? dp[(i + 1) * cols + (j + 1)] + 1
          : Math.max(dp[(i + 1) * cols + j], dp[i * cols + (j + 1)]);
      }
    }
    let i = 0, j = 0;
    const push = (t, text) => {
      const last = out[out.length - 1];
      if (last && last.t === t) last.text += text; else out.push({ t, text });
    };
    while (i < A.length && j < B.length) {
      if (A[i] === B[j]) { push("same", A[i]); i++; j++; }
      else if (dp[(i + 1) * cols + j] >= dp[i * cols + (j + 1)]) { push("del", A[i]); i++; }
      else { push("add", B[j]); j++; }
    }
    while (i < A.length) { push("del", A[i]); i++; }
    while (j < B.length) { push("add", B[j]); j++; }
  } else if (A.length) {
    out.push({ t: "del", text: A.join("") });
  } else if (B.length) {
    out.push({ t: "add", text: B.join("") });
  }

  if (tail) out.push({ t: "same", text: a.slice(n - tail).join("") });
  return out.filter((s) => s.text.length);
}

/** Word-level where practical, paragraph-level for very long fields. */
function diffText(a, b) {
  a = String(a || ""); b = String(b || "");
  if (a === b) return { same: true, parts: [{ t: "same", text: a }], mode: "identical" };
  const wa = tokenizeWords(a), wb = tokenizeWords(b);
  if (wa.length <= DIFF_WORD_CAP && wb.length <= DIFF_WORD_CAP) {
    return { same: false, parts: diffTokens(wa, wb), mode: "word" };
  }
  return { same: false, parts: diffTokens(tokenizeParas(a), tokenizeParas(b)), mode: "paragraph" };
}

/** Quick similarity score 0..1, used to summarise how close two cards are. */
function similarity(a, b) {
  a = String(a || ""); b = String(b || "");
  if (a === b) return 1;
  if (!a.length && !b.length) return 1;
  const d = diffText(a, b);
  let same = 0;
  for (const p of d.parts) if (p.t === "same") same += p.text.length;
  // Dice coefficient: shared material against the combined length of both
  // sides. Symmetric, and doesn't punish one side simply for being longer.
  const denom = a.length + b.length;
  return denom ? (2 * same) / denom : 0;
}

/** Which fields differ between two normalized card bodies. */
function cardFieldDeltas(a, b) {
  const keys = [{ key: "name", label: "Name" }].concat(CARD_FIELDS.map((f) => ({ key: f.key, label: f.label })));
  return keys.map((k) => {
    const av = String((a && a[k.key]) || ""), bv = String((b && b[k.key]) || "");
    return { key: k.key, label: k.label, a: av, b: bv, same: av === bv };
  });
}

/* ════════════════════════════════════════════
   8d. AI HARNESS (pure)
   ════════════════════════════════════════════

   The page never calls a model endpoint itself. It posts to the local server
   (serve.js, /__vault/ai/*), which forwards the request and streams the reply
   back as NDJSON lines. Everything in this section is pure: building the
   request, reading the stream, and turning the reply into something the
   inspector can show or propose.

   Rules this section keeps:
   - The API key never passes through here. It lives in serve.js's memory;
     `aiSettings` has no field for it and sanitizeAiSettings strips any that an
     old version stored.
   - The card goes to the model inside <card>…</card> with a system rule that
     its contents are data, not instructions. Cards routinely contain text
     aimed at an AI ("ignore previous instructions…"), and that text must be
     assessed, not obeyed.
   - Nothing here writes to a card, and nothing proposes changes to the card's
     own tags. The most an answer can do is fill `edit.aiProposal`, which the
     user accepts item by item into the vault's edit overlay.
   - A reply that is cut off, empty, or only the model's thinking is a
     failure, reported as one. It is never cached, and never proposed.
   ════════════════════════════════════════════ */

const AISETTINGS_KEY = "aiSettings";

/**
 * The serve.js build this page needs. Build 6 streams replies as NDJSON and
 * requires the X-Vault header; build 7 adds tool calls and the agent's
 * workspace routes; build 8 lets chat messages carry photos. An older relay
 * can't serve this page's AI requests, so a stale relay blocks the AI rather
 * than half-working. The launcher restarts the server, which is the fix.
 */
const EXPECTED_RELAY_BUILD = 10;

/* Mirrors serve.js's AI_LIMITS for the three values it enforces. */
const AI_LIMITS = {
  temperature:  { min: 0,    max: 2,      def: 0.7 },
  maxTokens:    { min: 16,   max: 32768,  def: 1024 },
  timeoutMs:    { min: 5000, max: 600000, def: 90000 },
  contextChars: { min: 2000, max: 200000, def: 24000 },
  batchCap:     { min: 1,    max: 200,    def: 20 },
  contextTokens: { min: 0,   max: 2000000, def: 0 },   // the model's context; 0 = large or unknown
};

/* What may happen to an answer. Under every mode the AI cannot write to a
   card file; the strongest one applies vault-only tags, which never leave
   the vault. */
const AI_WRITE_MODES = [
  { key: "off", label: "Read-only",
    hint: "Answers are shown in the inspector and nothing else happens. Nothing is proposed or applied." },
  { key: "propose", label: "Propose for approval",
    hint: "Suggestions go into the card's Proposed changes. You accept or reject each one; accepted items go into your vault edits, which is still not the card file." },
  { key: "auto-tags-only", label: "Propose, and apply vault-only tags",
    hint: "As above, but suggested vault-only tags are applied without asking. Vault-only tags are never written into a card file." },

/* The persona: the voice only, shared by every prompt and the agent chat. */
const AI_PERSONA_DEFAULT =
  "You help catalogue roleplay character cards. Answer plainly and specifically. " +

/* Rules every prompt follows (the built-in actions and your own), sent after
   the persona. The chat doesn't get them: it has agent.md. These defaults
   suit anyone's cards; people replace or extend them with their own. */
const AI_PROMPT_RULES_DEFAULT =
  "When you write or rewrite anything in a card:\n" +
  "- Never write {{user}}'s dialogue, decisions, movements or thoughts in card prose; set up the premise only.\n" +
  "- Keep the card's own voice, tense, point of view and formatting. Don't rework text that is already fine, " +
  "and don't touch text you weren't asked to change.\n" +
  "- Fixes are invisible: a corrected passage reads as if the problem never existed. Say what changed in your " +
  "reply, never inside the card.\n" +
  "- Keep every {{char}}, {{user}} and <START> exactly as written, and start each example conversation with " +
  "<START> on its own line.\n" +
  "- creator_notes is written for people browsing the card, not for the character: don't treat it as a source " +
  "for what the card contains, and don't move story content into it.";

/* Appended to the persona on every request. Not editable: it is what keeps a
   card's own instructions from being followed. */
const AI_FENCE_RULES =
  "The user's message contains a roleplay character card between <card> and </card>. " +

/**
 * The actions. `template` is the user-editable instruction; the card is
 * always attached above it by the harness, and for structured actions a fixed
 * output format (AI_OUTPUT_FORMATS) is appended below it, so editing a prompt
 * can't break the parser.
 */
const AI_ACTIONS = [
  {
    key: "summarise", label: "Summarise", icon: "≡", color: "cyan", output: "text",
    hint: "A few lines on who this character is.",
    template:

  },
  {
    key: "impression", label: "Impression", icon: "◆", color: "purple", output: "text",
    hint: "What it would be like to roleplay with this card.",
    template:

  },
  {

    hint: "Concrete problems, proposed as flags.",
    template:
      "Review this card as an editor. Report concrete problems only: contradictions, leftover " +

  },
  {

    hint: "Tags drawn from the vocabulary you already use: vault-only tags, or the card's own tags (the switch below).",
    template:
      "Suggest up to 8 catalogue tags for this card. Prefer tags from this list where they fit, " +

    template:

  },
];

/* Fixed output instructions, owned by the parser that reads them. */
const AI_OUTPUT_FORMATS = {
  flags:
    "Answer with JSON only, in this shape:\n" +
    "{\"findings\":[{\"flag\":\"needsEdit|jailbreak|broken|rewrite|review\",\"note\":\"one sentence\"}]," +
    "\"verdict\":\"one sentence\"}\n" +
    "Use an empty findings array if there is nothing to fix.",
  vaultTags:
    "Answer with JSON only, in this shape: {\"tags\":[\"lowercase tag\"]}",
  fields:
    "Write the complete rewritten field between <rewrite> and </rewrite>, then one sentence on " +
