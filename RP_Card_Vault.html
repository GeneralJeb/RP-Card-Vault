          </div>
          <input value={f.hint} onChange={(e) => set(i, { hint: e.target.value })} aria-label="Note question" placeholder="The question its note asks, e.g. What's missing?"
            style={Object.assign({}, small, { marginBottom: 6, fontFamily: "'Outfit', sans-serif" })} />
          <textarea value={f.agent} onChange={(e) => set(i, { agent: e.target.value })} aria-label="For the agent" rows={2}
            placeholder="For the agent: when should it suggest this flag? e.g. The card has no picture, or only a placeholder."
            style={Object.assign({}, small, { fontFamily: "'Outfit', sans-serif", resize: "vertical", lineHeight: 1.5 })} />
        </div>
      ))}
      <SmallBtn color="warm" disabled={list.length >= CUSTOM_FLAG_MAX}
        onClick={() => onChange(list.concat([{ key: customFlagKey("flag " + (list.length + 1), list), label: "", color: "warm", icon: "⚑", hint: "", agent: "" }]))}>
        + Add a flag
      </SmallBtn>
    </div>
  );
}

/** Settings → Problem log: this session's problems, scrubbed, ready to copy into a bug report. */
function ProblemLog({ info, onToast }) {
  const [tick, setTick] = useState(0);
  const [showNames, setShowNames] = useState(false);
  useEffect(() => {
    const fn = () => setTick((n) => n + 1);
    problemLogListeners.add(fn);
    return () => { problemLogListeners.delete(fn); };
  }, []);
  const build = () => {
    const i = info ? info(showNames) : { header: [], names: [] };
    return formatProblemLog(PROBLEM_LOG, i.header, i.names);
  };
  const text = useMemo(build, [tick, showNames, info]);
  const copy = async () => {
    try { await navigator.clipboard.writeText(build()); onToast("Problem log copied", "green"); }
    catch (e) { onToast("Couldn't copy: select the log below and press Ctrl+C", "warm"); }
  };
  return (
    <div className="problem-log" style={{ marginBottom: 16 }}>
      <div style={{ fontSize: 11, color: "var(--text-muted)", lineHeight: 1.7, marginBottom: 8 }}>
        Errors and warnings from this session, to paste into a bug report. Kept only while this page is open:
        nothing is saved or sent anywhere. What you see is exactly what gets copied, with API keys, tokens and
        passwords, email addresses, your Windows user name, addresses on your network, destination user names
        and private cards' names taken out.
      </div>
      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 8 }}>
        <SmallBtn color="cyan" onClick={copy}>Copy log</SmallBtn>
        <SmallBtn color="muted" onClick={clearProblemLog} disabled={!PROBLEM_LOG.length}>Clear</SmallBtn>
        <label style={{ fontSize: 11, color: "var(--text-secondary)", display: "flex", gap: 5, alignItems: "center", cursor: "pointer" }}>
          <input type="checkbox" checked={showNames} onChange={(e) => setShowNames(e.target.checked)} />
          Show card and folder names
        </label>
        <span style={{ fontSize: 10.5, color: "var(--text-muted)" }}>{PROBLEM_LOG.length ? PROBLEM_LOG.length + " logged" : "nothing logged yet"}</span>
      </div>
      <pre className="vault-scroll problem-log-text" tabIndex={0} style={{ maxHeight: 240, overflow: "auto", margin: 0, padding: 9,
        whiteSpace: "pre-wrap", wordBreak: "break-word", fontSize: 10.5, lineHeight: 1.55, userSelect: "text",
        fontFamily: "'JetBrains Mono', monospace", color: "var(--text-secondary)",
        background: "var(--bg-input)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-sm)" }}>{text}</pre>
    </div>
  );
}

async function searchBodies(query) {
  const needle = String(query || "").toLowerCase().trim();
  if (!needle) return null;
  const terms = needle.split(/\s+/).filter(Boolean);
  try {
    const db = await dbOpen();
    const tx = db.transaction(STORE_BODIES, "readonly");
    const req = tx.objectStore(STORE_BODIES).openCursor();
    const ids = [];
    req.onsuccess = () => {
      const c = req.result;
      if (!c) return;
      const v = c.value || {};
      let hay = [
        v.description, v.personality, v.scenario, v.first_mes, v.mes_example,
        v.system_prompt, v.post_history_instructions, v.creator_notes,
        (v.alternate_greetings || []).join(" "),
      ].join(" ");
      if (v.lorebook && v.lorebook.entries) {
        for (const e of v.lorebook.entries) hay += " " + e.keys.join(" ") + " " + e.content;
      }
      hay = hay.toLowerCase();
      let all = true;
      for (const t of terms) if (hay.indexOf(t) < 0) { all = false; break; }
      if (all) ids.push(c.key);
      c.continue();
    };
    await txDone(tx);
    return new Set(ids);
  } catch (e) { return null; }
}

/** Call fn(id, body) for every cached card body. For the agent's grep_cards. */
async function scanAllBodies(fn) {
  const db = await dbOpen();
  const tx = db.transaction(STORE_BODIES, "readonly");
  const req = tx.objectStore(STORE_BODIES).openCursor();
  req.onsuccess = () => {
    const c = req.result;
    if (!c) return;
    fn(c.key, c.value || {});
    c.continue();
  };
  await txDone(tx);
}

function App() {
  const [ready, setReady] = useState(false);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [aiSettings, setAiSettings] = useState(DEFAULT_AI_SETTINGS);
  const [agentSettings, setAgentSettings] = useState(DEFAULT_AGENT_SETTINGS);
  const [sideMode, setSideMode] = useState("filters");   // filters | agent
  const [agentOpened, setAgentOpened] = useState(false); // mounted once opened, so a run survives switching back
  const [tagMeta, setTagMeta] = useState(DEFAULT_TAGMETA);
  const [dupeIgnore, setDupeIgnore] = useState(EMPTY_IGNORE);
  const [folderRoles, setFolderRoles] = useState({});
  const [dupeMode, setDupeMode] = useState({});
  const [nestedWarn, setNestedWarn] = useState([]);
  const [roots, setRoots] = useState([]);
  const [cards, setCards] = useState([]);
  const [editsMap, setEditsMap] = useState(new Map());
  // Edits saved in another window of the vault come in here (see announceEdits).
  useEffect(() => {
    const ch = vaultEditsChannel();
    if (!ch) return undefined;
    const onEdits = (e) => {
      const d = e.data || {};
      setEditsMap((prev) => {
        const next = new Map(prev);
        for (const it of d.put || []) if (it && it.fingerprint) next.set(it.fingerprint, it);
        for (const fp of d.deleted || []) next.delete(fp);
        return next;
      });
    };
    ch.addEventListener("message", onEdits);
    return () => ch.removeEventListener("message", onEdits);
  }, []);
  const [filters, setFilters] = useState(makeDefaultFilters("name"));
  const [selection, setSelection] = useState(new Set());
  const [focusId, setFocusId] = useState(null);
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState(null);
  const [scan, setScan] = useState({ running: false, done: 0, total: 0, label: "", rootName: "" });
  const [deepIds, setDeepIds] = useState(null);
  const [deepBusy, setDeepBusy] = useState(false);
  const gridRef = useRef(null);
  const stopRef = useRef({ stop: false });
  const lastClickIdx = useRef(-1);
  const sidNextRef = useRef(1);    // the next short card id's number
  const sidHintsRef = useRef({});  // new record id → short id, left by the vault's own moves

  const [storage, setStorage] = useState({ ok: true, msg: "" });

  /* ---- boot ---- */
  useEffect(() => {
    // Tell the fail-loud guard in <head> that React got this far.
    const el = document.getElementById("root");
    if (el) el.setAttribute("data-mounted", "1");
    (async () => {
      setStorage(await probeStorage());
      let [s, tm, rts, cds0, eds, di, fr, dm, ais, ags, sidNext] = await Promise.all([
        loadSettings(), loadTagMeta(), dbAll(STORE_ROOTS), dbAll(STORE_CARDS), dbAll(STORE_EDITS),
        loadDupeIgnore(), loadFolderRoles(), loadDupeMode(), loadAiSettings(), loadAgentSettings(),
        dbGet(STORE_KV, SID_KEY),
      ]);
      setSettings(s); setTagMeta(tm); setDupeIgnore(di); setFolderRoles(fr); setDupeMode(dm);
      setFilters((f) => Object.assign({}, f, { sort: startupSort(s) }));
      setAiSettings(ais); setAgentSettings(ags);
      setRoots(rts.sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0)));
      // Records left behind by a folder that was removed mid-scan: drop them
      // (index entries only; tags and notes live with the card's content).
      const orphans = orphanCardIds(cds0, rts);
      if (orphans.length) {
        await dbDelCardRecords(orphans);
        const gone = new Set(orphans);
        setTimeout(() => showToastRef.current && showToastRef.current("Cleaned up " + fmtNum(orphans.length) +
          " leftover index entr" + (orphans.length === 1 ? "y" : "ies") + " from a folder that's no longer in the vault. No files were touched; tags and notes are kept.", "cyan"), 800);
        cds0 = cds0.filter((c) => !gone.has(c.id));
      }
      // Short ids: cards indexed before they existed are numbered once, in path order.
      let cds = cds0;
      sidNextRef.current = Number(sidNext) || 1;
      if (cds0.some((c) => !c.sid)) {
        const sorted = cds0.slice().sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
        const a = assignShortIds(sorted, null, [], null, sidNextRef.current);
        cds = a.records;
        sidNextRef.current = a.next;
        await dbPutMany(STORE_CARDS, cds.filter((c, i) => c !== sorted[i]));
        await dbPut(STORE_KV, a.next, SID_KEY);
      }
      setCards(cds);
      const m = new Map();
      for (const e of eds) m.set(e.fingerprint, e);
      setEditsMap(m);
      setReady(true);
      // Overlapping registered folders index every card twice and make the
      // whole collection look like duplicates. Surface it rather than let it rot.
      findNestedRootPairs(rts).then((pairs) => { if (pairs.length) setNestedWarn(pairs); });
    })();
  }, []);

  const showToastRef = useRef(null);
  const showToast = useCallback((msg, color) => {
    const c = color || "green";
    const isProblem = c === "red" || c === "warm";
    if (isProblem) logProblem("Notice", msg, "", c === "red" ? "error" : "warn");
    setToast((prev) => {
      // Stop a routine message that fires moments later (a follow-up rescan,
      // say) from burying a failure. Kept deliberately short: anything the
      // user does afterwards must be free to report its own result, otherwise
      // a stale error hides the outcome of their next action.
      if (prev && prev.color === "red" && !isProblem && Date.now() - prev.at < 3000) return prev;
      return { msg, color: c, id: uid(), at: Date.now(), sticky: isProblem };
    });
    const ttl = isProblem ? 15000 : 4200;
    setTimeout(() => setToast((t) => (t && t.msg === msg ? null : t)), ttl);
  }, []);

  // Flags of your own: set during render, so everything drawn below sees them.
  useMemo(() => setCustomFlags(settings.customFlags), [settings.customFlags]);

  // The theme: applied when it changes, and when Windows switches light/dark
  // while "Match Windows" is chosen. Not before your settings have loaded: the
  // defaults would replace the theme the page opened in, and then flash back.
  useEffect(() => {
    if (!ready) return undefined;
    const mq = typeof window !== "undefined" && window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
    const apply = () => applyTheme(themeVars(settings, !!(mq && mq.matches)));
    apply();
    if (!mq || settings.theme !== "auto") return undefined;
    mq.addEventListener("change", apply);
    return () => mq.removeEventListener("change", apply);
  }, [ready, settings.theme, settings.accentColor]);

  useEffect(() => { showToastRef.current = showToast; }, [showToast]);

  const patchSettings = useCallback((p) => {
    setSettings((prev) => { const next = Object.assign({}, prev, p); saveSettings(next); return next; });
  }, []);

  const saveMeta = useCallback((m) => { setTagMeta(m); saveTagMeta(m); }, []);

  // With "the last one you used" chosen, remember each sort as it changes.
  useEffect(() => {
    if (ready && settings.startSort === "last" && filters.sort !== settings.lastSort) patchSettings({ lastSort: filters.sort });
  }, [ready, filters.sort, settings.startSort, settings.lastSort, patchSettings]);

  const setFolderRole = useCallback((key, role) => {
    setFolderRoles((prev) => {
      const next = Object.assign({}, prev);
      if (!role) delete next[key]; else next[key] = role;
      saveFolderRoles(next);
      return next;
    });
  }, []);

  /* ---- merged records ---- */
  const records = useMemo(() => {
    const inTrash = makeTrashTest(settings);
    const isPrivate = makePrivateTest(settings);
    return cards.map((c) => {
      const e = editsMap.get(c.fp);
      const tags = effectiveTags(c, e);
      const nameOv = (e && e.fields && e.fields.name) || "";
      const r = Object.assign({}, c, {
        tags,
        fileTags: c.tags || [],   // the tags in the card file itself, before vault edits
        addedTags: addedTagsOf(c, e),
        vaultTags: vaultTagsOf(e),
        flags: flagsOf(e),
        pending: pendingEditCount(e),
        name: nameOv || c.name,
        favorite: !!(e && e.favorite),
        rating: (e && e.rating) || 0,
        notes: (e && e.notes) || "",
        edited: isEdited(e),
        aiPending: proposalCount(e && e.aiProposal) > 0,
        inTrash: inTrash(c.rootId, c.dir),
        aiPrivate: isPrivate(c.rootId, c.dir),
      });
      r.search = searchBlobFor(r);
      return r;
    });
  }, [cards, editsMap, settings.trashKey, settings.privateFolders]);

  const recById = useMemo(() => {
    const m = new Map();
    for (const r of records) m.set(r.id, r);
    return m;
  }, [records]);

  const tagIndex = useMemo(
    () => buildTagIndex(records, tagMeta, settings.normalizeTags),
    [records, tagMeta, settings.normalizeTags]
  );

  const flagCounts = useMemo(() => {
    const m = new Map();
    for (const r of records) for (const g of flagGroups(r.flags)) m.set(g.key, (m.get(g.key) || 0) + 1);
    const known = allFlags().filter((f) => m.has(f.key)).map((f) => ({ key: f.key, count: m.get(f.key) }));
    // Flags whose definition was removed from Settings still count, so they can be found.
    const listed = new Set(known.map((f) => f.key));
    return known.concat(Array.from(m.keys()).filter((k) => !listed.has(k)).map((k) => ({ key: k, count: m.get(k) })));
  }, [records, settings.customFlags]);

  const dupeExcluder = useMemo(
    () => makeDupeExcluder(settings, dupeMode),
    [settings.trashKey, dupeMode]
  );

  const setFolderDupeMode = useCallback((key, mode) => {
    setDupeMode((prev) => {
      const next = Object.assign({}, prev);
      if (!mode) delete next[key]; else next[key] = mode;
      saveDupeMode(next);
      return next;
    });
  }, []);

  const dupes = useMemo(
    () => detectDupes(records, dupeIgnore, dupeExcluder),
    [records, dupeIgnore, dupeExcluder]
  );

  const [dupeKeepers, setDupeKeepers] = useState({});
  const setDupeKeeper = useCallback((groupKey, id) => {
    setDupeKeepers((prev) => Object.assign({}, prev, { [groupKey]: id }));
  }, []);

  const setDupeVerdict = useCallback((kind, key, ignored) => {
    setDupeIgnore((prev) => {
      const next = {
        exact: prev.exact.slice(), content: prev.content.slice(), versions: prev.versions.slice(),
      };
      const list = next[kind] || (next[kind] = []);
      const at = list.indexOf(key);
      if (ignored && at < 0) list.push(key);
      if (!ignored && at >= 0) list.splice(at, 1);
      saveDupeIgnore(next);
      return next;
    });
  }, []);

  const rootCounts = useMemo(() => {
    const c = {};
    for (const r of records) c[r.rootId] = (c[r.rootId] || 0) + 1;
    return c;
  }, [records]);

  /* ---- deep search ---- */
  useEffect(() => {
    if (!filters.deep || !filters.q.trim()) { setDeepIds(null); return; }
    let dead = false;
    setDeepBusy(true);
    const t = setTimeout(() => {
      searchBodies(filters.q).then((ids) => { if (!dead) { setDeepIds(ids); setDeepBusy(false); } });
    }, 320);
    return () => { dead = true; clearTimeout(t); setDeepBusy(false); };
  }, [filters.deep, filters.q]);

  /* ---- filtering ---- */
  const filtered = useMemo(() => {
    const norm = settings.normalizeTags;
    const inc = filters.tagsInc, exc = filters.tagsExc;
    const terms = filters.q.toLowerCase().split(/\s+/).filter(Boolean);
    const specSet = filters.specs.length ? new Set(filters.specs) : null;
    const fl = filters.flags;
    const flagSel = (filters.flagKeys && filters.flagKeys.length) ? new Set(filters.flagKeys) : null;
    const dirSel = filters.dirs.length
      ? filters.dirs.map((k) => { const i = k.indexOf("::"); return { rootId: k.slice(0, i), dir: k.slice(i + 2) }; })
      : null;

    // Trashed cards stay out of view unless you asked for them.
    const trashTest = makeTrashTest(settings);
    const showTrash = !!fl.trash || !!(dirSel && dirSel.some((d) => trashTest(d.rootId, d.dir)));

    let out = records.filter((r) => {
      if (r.inTrash && !showTrash) return false;
      if (dirSel) {
        let inAny = false;
        for (const d of dirSel) if (recInDir(r, d.rootId, d.dir)) { inAny = true; break; }
        if (!inAny) return false;
      }
      if (specSet && !specSet.has(r.spec)) return false;
      if (filters.tokenMin && r.tokensCore < filters.tokenMin) return false;
      if (filters.tokenMax && r.tokensCore > filters.tokenMax) return false;

      if (fl.favorite && !r.favorite) return false;
      if (fl.edited && !r.edited) return false;
      if (fl.hasLore && !r.loreCount) return false;
      if (fl.hasAlts && !r.altCount) return false;
      if (fl.untagged && r.tags.length) return false;
      if (fl.broken && r.ok) return false;
      if (fl.dupe && !dupes.dupeIds.has(r.id)) return false;
      if (fl.hasNotes && !r.notes) return false;
      if (fl.flagged && !r.flags.length) return false;
      if (fl.unsaved && !r.pending) return false;
      if (fl.aiPending && !r.aiPending) return false;

      if (flagSel && !r.flags.some((f) => flagSel.has(f.key))) return false;

      if (inc.length || exc.length) {
        const keys = new Set(resolveTags((r.tags || []).concat(r.vaultTags || []), tagMeta, norm));
        if (exc.length) for (const k of exc) if (keys.has(k)) return false;
        if (inc.length) {
          if (filters.tagMode === "and") {
            for (const k of inc) if (!keys.has(k)) return false;
          } else {
            let any = false;
            for (const k of inc) if (keys.has(k)) { any = true; break; }
            if (!any) return false;
          }
        }
      }

      if (terms.length) {
        if (deepIds) {
          if (deepIds.has(r.id)) return true;
          // still allow shallow field hits so filenames keep working in deep mode
        }
        for (const t of terms) if (r.search.indexOf(t) < 0) return false;
      }
      return true;
    });

    // The agent chat's pin list uses the same sortCards, so the two agree.
    return sortCards(out, filters.sort);
  }, [records, filters, tagMeta, settings.normalizeTags, settings.trashKey, dupes, deepIds]);

  /* ---- edits ---- */
  /* `patch` is an object, or a function of the current edit record returning
     one (or null for "nothing to do"). Use the function form whenever the
     patch is computed from the record — an AI reply can land seconds after
     the request started, and a patch built from the record as it was then
     would undo whatever the user changed meanwhile. */
  const patchEdit = useCallback((fp, patch) => {
    setEditsMap((prev) => {
      const cur = prev.get(fp) || emptyEdit(fp);
      const p = typeof patch === "function" ? patch(cur) : patch;
      if (!p) return prev;
      const next = new Map(prev);
      const merged = Object.assign({}, cur, p, { fingerprint: fp, updatedAt: Date.now() });
      if (merged.greetings === null) delete merged.greetings;
      if (merged.lorebook === null) delete merged.lorebook;
      next.set(fp, merged);
      dbPut(STORE_EDITS, merged);
      return next;
    });
  }, []);

  /* ---- creating, copying and moving card files ----
     Each writes through copyIntoRoot (never overwrites), rescans what it
     touched, and returns the new card's { id, sid, name }. Nothing here
     deletes a card: a move only removes the original after its copy is
     verified (moveCardTo). */

  const writableRootFor = (rootId) => {
    const root = roots.find((r) => r.id === rootId);
    if (!root) throw new Error("That folder is no longer linked to the vault.");
    if (isImportRoot(root) || root.role === "reference") throw new Error("\"" + root.name + "\" is read-only: cards can't be written there.");
    return root;
  };
  const needWrite = async (root) => {
    if (!(await verifyPermission(root.handle, true))) {
      throw new Error("The vault doesn't have write access to \"" + root.name + "\" right now. Click that folder in the sidebar " +
        "(or Rescan it) to give it access, then try again.");
    }
  };
  const recordAt = (recs, id) => (recs || []).filter((r) => r.id === id)[0] || null;

  /** A brand-new card with placeholder art, in a folder. */
  const createCardFile = useCallback(async (rootId, dir, fields) => {
    const root = writableRootFor(rootId);
    await needWrite(root);
    const v3 = newCardPayload(fields);
    const png = await makePlaceholderPng(v3.data.name);
    const blob = new Blob([writeCardIntoPng(png, v3, buildV2Payload(v3))], { type: "image/png" });
    const res = await copyIntoRoot(root, dir ? dir.split("/") : [], safeFileName(v3.data.name) + ".png", blob, await byteSignature(blob));
    const id = root.id + ":" + (dir ? dir + "/" : "") + res.name;
    await logOp("createCard", { card: v3.data.name, to: root.name + "/" + (dir ? dir + "/" : "") + res.name });
    const recs = await runScanRef.current(root.id, false, { quiet: true });
    const rec = recordAt(recs, id);
    return { id, sid: rec ? rec.sid : "", name: v3.data.name, file: res.name };
  }, [roots]);

  /**
   * A copy of a card as the vault shows it (unsaved edits included), under a
   * new name so it's a card of its own (same name and text would share one set
   * of vault edits). Vault-only tags, flags and notes start empty on the copy.
   */
  const copyCardFile = useCallback(async (rec, rootId, dir, newName) => {
    const root = writableRootFor(rootId);
    await needWrite(root);
    const orig = await readOriginalBytes(rec, roots);
    const body = await dbGet(STORE_BODIES, rec.id);
    const edit = editsMap.get(rec.fp);
    const name = String(newName || "").trim() || (String(effectiveField(body, edit, "name") || rec.name) + " (copy)");
    const named = Object.assign({}, edit, { fields: Object.assign({}, edit && edit.fields, { name }) });
    const v3 = buildV3Payload(body, named, await rawBookFromBytes(orig.bytes, rec.file));
    const asPng = isPng(orig.bytes);
    const blob = asPng
      ? new Blob([writeCardIntoPng(orig.bytes, v3, buildV2Payload(v3))], { type: "image/png" })
      : new Blob([JSON.stringify(v3, null, 2)], { type: "application/json" });
    const res = await copyIntoRoot(root, dir ? dir.split("/") : [], safeFileName(name) + (asPng ? ".png" : ".json"), blob, await byteSignature(blob));
    const id = root.id + ":" + (dir ? dir + "/" : "") + res.name;
    await logOp("copyCard", { card: rec.name, as: name, to: root.name + "/" + (dir ? dir + "/" : "") + res.name });
    const recs = await runScanRef.current(root.id, false, { quiet: true });
    const made = recordAt(recs, id);
    return { id, sid: made ? made.sid : "", name, file: res.name };
  }, [roots, editsMap]);

  /** Move one card, verified (the original goes only once its copy checks out); it keeps its short id. */
  const moveCardFile = useCallback(async (rec, rootId, dir) => {
    const src = roots.find((r) => r.id === rec.rootId);
    if (!src) throw new Error("That card's folder is no longer linked to the vault.");
    const dest = writableRootFor(rootId);
    if (isImportRoot(src)) throw new Error("\"" + src.name + "\" is read-only: its cards can't be moved.");
    await needWrite(dest);
    await needWrite(src);
    const res = await moveCardTo(rec, src, dest, dir || "");
    if (res.skipped) return { skipped: true, reason: res.reason || "nothing to move", id: rec.id, sid: rec.sid };
    const id = dest.id + ":" + (res.dir ? res.dir + "/" : "") + res.name;
    if (rec.sid) sidHintsRef.current[id] = rec.sid;
    await runScanRef.current(Array.from(new Set([dest.id, src.id])), false, { quiet: true });
    return { id, sid: rec.sid || "", name: rec.name, file: res.name };
  }, [roots]);

  /** Folder menu → New card here: a blank card, opened in the inspector to fill in. */
  const newCardIn = useCallback(async (rootId, dir) => {
    try {
      const res = await createCardFile(rootId, dir || "", { name: "New card" });
      setFocusId(res.id);
      showToast("Created " + res.file + ". Fill it in from the Fields tab, then Save to card", "green");
    } catch (e) { showToast("Couldn't create a card: " + e.message, "red"); }
  }, [createCardFile, showToast]);

  /** Card menu / inspector → Duplicate: a copy named "<Name> (copy)" in the same folder. */
  const duplicateCard = useCallback(async (rec) => {
    try {
      const res = await copyCardFile(rec, rec.rootId, rec.dir || "", "");
      setFocusId(res.id);
      showToast("Duplicated as \"" + res.name + "\"", "green");
    } catch (e) { showToast("Couldn't duplicate: " + e.message, "red"); }
  }, [copyCardFile, showToast]);

  /** Patch many cards' edit records in one go: [{ fp, patch }] (a patch may be a function of the record). */
  const patchManyEdits = useCallback((list) => {
    setEditsMap((prev) => {
      const next = new Map(prev);
      const writes = [];
      for (const item of list || []) {
        const cur = next.get(item.fp) || emptyEdit(item.fp);
        const p = typeof item.patch === "function" ? item.patch(cur) : item.patch;
        if (!p) continue;
        const merged = Object.assign({}, cur, p, { fingerprint: item.fp, updatedAt: Date.now() });
        if (merged.greetings === null) delete merged.greetings;
        if (merged.lorebook === null) delete merged.lorebook;
        next.set(item.fp, merged);
        writes.push(merged);
      }
      if (!writes.length) return prev;
      dbPutMany(STORE_EDITS, writes);
      return next;
    });
  }, []);

  const bulkTag = useCallback((ids, add, remove) => {
    const addKeys = add.map(normTagName);
    const remKeys = new Set(remove.map(normTagName));
    setEditsMap((prev) => {
      const next = new Map(prev);
      const writes = [];
      for (const id of ids) {
        const rec = recById.get(id);
        if (!rec) continue;
        const cur = next.get(rec.fp) || emptyEdit(rec.fp);
        const fileTags = rec.fileTags || [];
        const base = Array.isArray(cur.tags) ? cur.tags : fileTags;
        let tags = base.filter((t) => !remKeys.has(normTagName(t)));
        for (let i = 0; i < add.length; i++) {
          if (!tags.some((t) => normTagName(t) === addKeys[i])) tags = tags.concat([add[i]]);
        }
        const sameList = (x, y) => x.length === y.length && x.every((t, k) => t === y[k]);
        // A card this doesn't change stays as it was, not marked edited.
        if (sameList(tags, base)) continue;
        const merged = Object.assign({}, cur, { fingerprint: rec.fp, tags: sameList(tags, fileTags) ? null : tags, updatedAt: Date.now() });
        next.set(rec.fp, merged);
        writes.push(merged);
      }
      dbPutMany(STORE_EDITS, writes);
      return next;
    });
    showToast("Tagged " + fmtNum(ids.length) + " cards", "purple");
  }, [recById, showToast]);

  /** Add or replace a flag on a set of cards. Passing note=null removes it. */
  /*
   * Flags. With `index` (one card), that flag is replaced, or removed when
   * note is null. Without it, note null removes every flag of that kind, and
   * otherwise a flag is added: a card can hold several of one kind.
   */
  const setFlag = useCallback((ids, key, note, index) => {
    setEditsMap((prev) => {
      const next = new Map(prev);
      const writes = [];
      for (const id of ids) {
        const rec = recById.get(id);
        if (!rec) continue;
        const cur = next.get(rec.fp) || emptyEdit(rec.fp);
        const had = flagsOf(cur);
        let flags;
        if (index != null && ids.length === 1 && had[index]) {
          flags = had.slice();
          if (note === null || note === undefined) flags.splice(index, 1);
          else flags[index] = { key, note: String(note || ""), at: Date.now() };
        } else if (note === null || note === undefined) {
          flags = had.filter((f) => f.key !== key);
        } else {
          flags = addFlagEntries(had, [{ key, note }], Date.now());
        }
        if (JSON.stringify(flags) === JSON.stringify(had)) continue;
        const merged = Object.assign({}, cur, { fingerprint: rec.fp, flags, updatedAt: Date.now() });
        next.set(rec.fp, merged);
        writes.push(merged);
      }
      dbPutMany(STORE_EDITS, writes);
      return next;
    });
  }, [recById]);

  const clearFlags = useCallback((ids) => {
    setEditsMap((prev) => {
      const next = new Map(prev);
      const writes = [];
      for (const id of ids) {
        const rec = recById.get(id);
        if (!rec) continue;
        const cur = next.get(rec.fp);
        if (!cur || !flagsOf(cur).length) continue;
        const merged = Object.assign({}, cur, { flags: [], updatedAt: Date.now() });
        next.set(rec.fp, merged);
        writes.push(merged);
      }
      dbPutMany(STORE_EDITS, writes);
      return next;
    });
  }, [recById]);

  const bulkFavorite = useCallback((ids, val) => {
    setEditsMap((prev) => {
      const next = new Map(prev);
      const writes = [];
      for (const id of ids) {
        const rec = recById.get(id);
        if (!rec) continue;
        const cur = next.get(rec.fp) || emptyEdit(rec.fp);
        const merged = Object.assign({}, cur, { fingerprint: rec.fp, favorite: val, updatedAt: Date.now() });
        next.set(rec.fp, merged); writes.push(merged);
      }
      dbPutMany(STORE_EDITS, writes);
      return next;
    });
  }, [recById]);

  /**
   * Bake the vault's pending edits into the card file itself.
   * The fingerprint is derived from the card's content, so saving changes it —
   * the edit record has to be carried across to the new one or the notes,
   * flags, rating and vault-only tags attached to this card would be orphaned.
   */
  /**
   * Write one card's vault edits into its file (backup, verified write), then
   * move its edit record to the card's new fingerprint. Throws on failure;
   * no confirmation, toast or rescan: the callers do those.
   */
  const writeCardEdits = useCallback(async (rec, edit, backup, keep) => {
    const body = await dbGet(STORE_BODIES, rec.id);
    const res = await saveCardToFile(rec, body, edit, roots, { backup, keep });
    const newFp = await contentFingerprint(res.data);
    const carried = {
      fingerprint: newFp,
      fields: {}, tags: null, vaultTags: vaultTagsOf(edit), flags: flagsOf(edit),
      notes: edit.notes || "", rating: edit.rating || 0, favorite: !!edit.favorite,
      updatedAt: Date.now(),
    };
    // Anything else on the edit record has to be listed here or it is dropped
    // on the floor the first time a card is saved. Pending AI suggestions are
    // kept. A field rewrite remembers the text it was made from, so one whose
    // field this save changed simply can't be accepted any more (the
    // proposals panel says so) rather than overwriting the saved text.
    const pending = proposalOf(edit);
    if (proposalCount(pending) > 0) carried.aiProposal = pending;
    setEditsMap((prev) => {
      const next = new Map(prev);
      if (newFp !== rec.fp) next.delete(rec.fp);
      next.set(newFp, carried);
      return next;
    });
    if (newFp !== rec.fp) await dbDel(STORE_EDITS, rec.fp);
    await dbPut(STORE_EDITS, carried);
    // Anything else keyed by fingerprint has to move with it. Cached AI
    // answers are re-keyed and marked stale rather than left to orphan.
    await migrateAiNotes(rec.fp, newFp);
    return res;
  }, [roots]);

  const saveToCard = useCallback(async (rec) => {
    const edit = editsMap.get(rec.fp);
    if (!isEdited(edit)) { showToast("No unsaved card changes on this one", "warm"); return false; }
    const root = roots.find((r) => r.id === rec.rootId);
    if (!root || isImportRoot(root)) {
      showToast("That card is in a read-only imported folder — use Download copy", "red");
      return false;
    }
    const backup = settings.backupBeforeSave !== false;
    if (!window.confirm(
      "Write " + pendingEditCount(edit) + " change(s) into the card file?\n\n" +
      root.name + "/" + rec.rel + "\n\n" +
      (backup
        ? "A timestamped copy of the current file is saved to " + BACKUP_FOLDER_NAME + "/ first, and the write is verified — if it doesn't read back as a valid card the original is put straight back."
        : "BACKUPS ARE OFF. The write is still verified and rolled back on failure, but you'll have no earlier copy.") +
      "\n\nYour notes, rating, flags and vault-only tags stay in the vault and are not written to the file."
    )) return false;

    setScan({ running: true, done: 0, total: 1, label: rec.file, rootName: root.name });
    try {
      const res = await writeCardEdits(rec, edit, backup, Number(settings.backupKeep));
      setScan({ running: false, done: 0, total: 0, label: "", rootName: "" });
      showToast(
        "Saved into " + rec.file + (res.backupPath ? " · backup in " + BACKUP_FOLDER_NAME + "/" : ""),
        "green"
      );
      runScanRef.current(rec.rootId, false, { quiet: true });
      return true;
    } catch (e) {
      setScan({ running: false, done: 0, total: 0, label: "", rootName: "" });
      showToast("Save failed: " + e.message, "red");
      return false;
    }
  }, [editsMap, roots, settings.backupBeforeSave, settings.backupKeep, showToast, writeCardEdits]);

  /**
   * Save to card for a selection: one confirmation, then each card in turn,
   * each with its own backup and verified write. Cards with nothing to save
   * or in read-only imported folders are skipped and counted.
   */
  const saveManyToCard = useCallback(async (ids) => {
    const recs = ids.map((id) => recById.get(id)).filter(Boolean);
    const withEdits = recs.filter((r) => isEdited(editsMap.get(r.fp)));
    const writable = withEdits.filter((r) => { const rt = roots.find((x) => x.id === r.rootId); return rt && !isImportRoot(rt); });
    if (!writable.length) {
      showToast(withEdits.length ? "Those cards are in read-only imported folders — use Download copy" : "None of the selected cards has unsaved card changes", "warm");
      return;
    }
    const backup = settings.backupBeforeSave !== false;
    const skipped = recs.length - writable.length;
    if (!window.confirm(
      "Write the vault's changes into " + writable.length + " card file" + (writable.length === 1 ? "" : "s") + "?\n\n" +
      (backup
        ? "Each file is first copied to " + BACKUP_FOLDER_NAME + "/, and each write is verified: one that doesn't read back as a valid card is put straight back."
        : "BACKUPS ARE OFF. Each write is still verified and rolled back on failure, but there'll be no earlier copies.") +
      (skipped ? "\n\n" + skipped + " selected card" + (skipped === 1 ? " has" : "s have") + " nothing to save or can't be written, and will be skipped." : "") +
      "\n\nNotes, ratings, flags and vault-only tags stay in the vault."
    )) return;
    let saved = 0, failed = 0;
    const errs = [];
    const touched = new Set();
    for (let i = 0; i < writable.length; i++) {
      const rec = writable[i];
      setScan({ running: true, done: i, total: writable.length, label: rec.file, rootName: "Saving to card" });
      try {
        await writeCardEdits(rec, editsMap.get(rec.fp), backup, Number(settings.backupKeep));
        saved++;
        touched.add(rec.rootId);
      } catch (e) {
        failed++;
        if (errs.length < 3) errs.push(rec.file + ": " + e.message);
      }
    }
    setScan({ running: false, done: 0, total: 0, label: "", rootName: "" });
    await logOp("bulkSaveToCard", { saved, failed, skipped });
    showToast("Saved " + saved + " card file" + (saved === 1 ? "" : "s") +
      (skipped ? ", " + skipped + " skipped" : "") + (failed ? ", " + failed + " failed — " + errs.join(" | ") : ""),
      failed ? "red" : "green");
    if (touched.size) runScanRef.current(Array.from(touched), false, { quiet: true });
  }, [recById, editsMap, roots, settings.backupBeforeSave, settings.backupKeep, showToast, writeCardEdits]);

  /* ---- scanning ---- */
  const runScan = useCallback(async (rootIdOrIds, force, opts) => {
    const quiet = !!(opts && opts.quiet);
    // Accepts ids OR root objects. Passing the object matters when a folder has
    // only just been added: the scan is kicked off before React has necessarily
    // re-rendered with it in state, and looking it up by id would find nothing.
    const asList = (t) => {
      if (!t) return roots;
      if (Array.isArray(t)) {
        return t.length && typeof t[0] === "object" ? t : roots.filter((r) => t.indexOf(r.id) >= 0);
      }
      return typeof t === "object" ? [t] : roots.filter((r) => r.id === t);
    };
    const list = asList(rootIdOrIds);
    if (!list.length) return;
    stopRef.current = { stop: false };
    setScan({ running: true, done: 0, total: 0, label: "Starting…", rootName: "" });

    let working = cards.slice();
    for (const root of list) {
      if (stopRef.current.stop) break;
      const existing = new Map();
      if (!force) for (const c of working) if (c.rootId === root.id) existing.set(c.id, c);
      // A readable card whose text never made it into the cache is read again,
      // rather than showing "no card data" until a full rescan.
      if (existing.size) {
        const cached = new Set(await dbKeys(STORE_BODIES));
        for (const [id, c] of existing) if (c.ok && !cached.has(id)) existing.delete(id);
      }
      setScan((s) => Object.assign({}, s, { rootName: root.name }));
      const res = await scanRoot(root, existing, stopRef.current, (p) => {
        setScan({ running: true, done: p.done, total: p.total, label: p.label, rootName: root.name });
      });
      if (res.error) { showToast(res.error, "red"); continue; }
      // The folder may have been removed (or replaced by the folder above it)
      // while this scan ran. Then nothing of it is written back: no records,
      // and no folder record either.
      if (!(await dbHas(STORE_ROOTS, root.id))) continue;
      // Short ids: kept by path, carried over by the vault's own moves and by renames.
      {
        const prevById = new Map(working.map((c) => [c.id, c]));
        const removedRecs = res.removed.map((id) => prevById.get(id)).filter(Boolean);
        const a = assignShortIds(res.records, prevById, removedRecs, sidHintsRef.current, sidNextRef.current);
        res.records = a.records;
        for (const r of res.records) delete sidHintsRef.current[r.id];
        if (a.next !== sidNextRef.current) { sidNextRef.current = a.next; await dbPut(STORE_KV, a.next, SID_KEY); }
      }
      await dbPutMany(STORE_CARDS, res.records);
      await dbPutMany(STORE_BODIES, res.bodies);
      await dbPutMany(STORE_THUMBS, res.thumbs);
      for (const id of res.removed) {
        await dbDel(STORE_CARDS, id); await dbDel(STORE_BODIES, id); await dbDel(STORE_THUMBS, id);
      }
      working = working.filter((c) => c.rootId !== root.id).concat(res.records);
      // Merge into what's on screen now, not into this scan's starting copy:
      // another scan or a removed folder may have changed it meanwhile.
      const fresh = res.records;
      setCards((prev) => prev.filter((c) => c.rootId !== root.id).concat(fresh));
      const updated = Object.assign({}, root, {
        lastScan: Date.now(),
        dirs: res.dirs && res.dirs.length ? res.dirs : (root.dirs || []),
      });
      if (await dbHas(STORE_ROOTS, root.id)) {
        await dbPut(STORE_ROOTS, updated);
        setRoots((prev) => prev.map((r) => (r.id === root.id ? updated : r)));
      } else {
        // Removed during the last few writes: take its records back out.
        await dbDelCardsOfRoot(root.id);
        setCards((prev) => prev.filter((c) => c.rootId !== root.id));
      }
    }
    setScan({ running: false, done: 0, total: 0, label: "", rootName: "" });
    if (!quiet) showToast("Scan complete — " + fmtNum(working.length) + " cards indexed", "green");
    // A scan means folder access is granted: a good moment for a due backup.
    setTimeout(() => { if (backupRef.current) backupRef.current(false); }, 1500);
    return working;
  }, [roots, cards, showToast]);

  const addRoot = useCallback(async () => {
    if (!fsSupported()) { showToast("This browser has no File System Access API", "red"); return; }
    let handle;
    try {
      handle = await window.showDirectoryPicker({ mode: "readwrite", id: "rpCardVaultRoot" });
    } catch (e) { return; }
    const nm = (handle.name || "folder").toLowerCase();
    let role = "library";
    if (/download|inbox|new|unsorted/.test(nm)) role = "inbox";
    else if (/archive|backup|bak|redund/.test(nm)) role = "archive";
    else if (/character|sillytavern|tavern|lumiverse|cards/.test(nm)) role = "library";

    // Registering a folder that already sits inside a registered one would
    // index every card in it twice and flood the duplicate finder. Label the
    // subfolder instead — that's what the user actually wanted.
    const nest = await detectNesting(handle, roots);
    if (nest && nest.kind === "same") {
      showToast("\"" + handle.name + "\" is already registered as " + nest.root.name, "warm");
      return;
    }
    if (nest && nest.kind === "inside") {
      setFolderRole(dirKey(nest.root.id, nest.path), role);
      setFilters((f) => Object.assign({}, f, { dirs: [dirKey(nest.root.id, nest.path)] }));
      showToast(
        "\"" + handle.name + "\" is already inside " + nest.root.name +
        " — labelled it " + ROOT_ROLES[role].label + " instead of indexing it twice",
        "cyan"
      );
      return;
    }
    if (nest && nest.kind === "contains") {
      if (!window.confirm(
        "\"" + handle.name + "\" contains the registered folder \"" + nest.root.name + "\" (at " + nest.path + ").\n\n" +
        "Registering both would index those cards twice and report them all as duplicates.\n\n" +
        "Add the outer folder and drop the inner registration?"
      )) return;
    }
    const root = { id: uid(), name: handle.name, role, handle, addedAt: Date.now(), lastScan: 0 };
    if (nest && nest.kind === "contains") {
      // Its private folders, labels, trash and the like now live under the
      // outer folder: carry them over before its registration goes.
      const idMap = importRootIdMap([], roots);
      idMap[nest.root.id] = { id: root.id, prefix: nest.path };
      patchSettings(remapRootSettings(settings, settings, idMap).patch);
      const roles = Object.assign({}, folderRoles, remapDirKeyed(folderRoles, idMap));
      setFolderRoles(roles); saveFolderRoles(roles);
      await dbDel(STORE_ROOTS, nest.root.id);
      await dbDelCardsOfRoot(nest.root.id);
      setRoots((prev) => prev.filter((r) => r.id !== nest.root.id));
      setCards((prev) => prev.filter((c) => c.rootId !== nest.root.id));
    }

    await dbPut(STORE_ROOTS, root);
    setRoots((prev) => prev.concat([root]));
    showToast("Added " + root.name + " as " + ROOT_ROLES[role].label, "cyan");
    setTimeout(() => runScanRef.current(root, false), 50);
  }, [showToast, roots, cards, setFolderRole, settings, folderRoles, patchSettings]);

  const runScanRef = useRef(runScan);
  useEffect(() => { runScanRef.current = runScan; }, [runScan]);

  /* ---- read-only folder import (works without the File System Access API) ---- */
  const dirInputRef = useRef(null);

  const handlePickedFolder = useCallback(async (fileList) => {
    const groups = groupPickedFiles(fileList);
    if (!groups.length) {
      showToast("No card files (.png / .json / .charx) found in that folder", "warm");
      return;
    }
    const newRoots = [];
    for (const g of groups) {
      IMPORT_PENDING.set(g.id, g.files);
      const existingRoot = roots.find((r) => r.id === g.id);
      if (existingRoot) { newRoots.push(existingRoot); continue; }
      const nm = g.name.toLowerCase();
      let role = "reference";
      if (/download|inbox|new|unsorted/.test(nm)) role = "inbox";
      else if (/archive|backup|bak|redund/.test(nm)) role = "archive";
      else if (/character|sillytavern|tavern|cards/.test(nm)) role = "library";
      const root = { id: g.id, name: g.name, role, mode: "import", addedAt: Date.now(), lastScan: 0 };
      await dbPut(STORE_ROOTS, root);
      newRoots.push(root);
    }
    setRoots((prev) => {
      const known = new Set(prev.map((r) => r.id));
      return prev.concat(newRoots.filter((r) => !known.has(r.id)));
    });
    const total = groups.reduce((a, g) => a + g.files.length, 0);
    showToast("Reading " + fmtNum(total) + " card file" + (total === 1 ? "" : "s") + " from " + groups.map((g) => g.name).join(", "), "cyan");
    setTimeout(() => runScanRef.current(newRoots, false), 60);
  }, [roots, showToast]);

  const importsNeedingAttach = useMemo(
    () => roots.filter((r) => isImportRoot(r) && (rootCounts[r.id] || 0) > 0 && !IMPORT_FILES.has((cards.find((c) => c.rootId === r.id) || {}).id)),
    [roots, rootCounts, cards]
  );

  const repairNesting = useCallback(async (pair) => {
    const role = pair.inner.role || "inbox";
    setFolderRole(dirKey(pair.outer.id, pair.path), role);
    await dbDel(STORE_ROOTS, pair.inner.id);
    await dbDelCardsOfRoot(pair.inner.id);
    setRoots((prev) => prev.filter((r) => r.id !== pair.inner.id));
    setCards((prev) => prev.filter((c) => c.rootId !== pair.inner.id));
    setNestedWarn((prev) => prev.filter((p) => p.inner.id !== pair.inner.id));
    showToast(
      "Dropped the duplicate registration — " + pair.outer.name + "/" + pair.path +
      " is now labelled " + (ROOT_ROLES[role] || ROOT_ROLES.reference).label,
      "green"
    );
  }, [cards, setFolderRole, showToast]);

  const forgetRoot = useCallback(async (id) => {
    const root = roots.find((r) => r.id === id);
    if (!root) return;
    if (!window.confirm("Remove " + root.name + " from the vault index?\n\nNothing on disk is deleted.")) return;
    await dbDel(STORE_ROOTS, id);
    await dbDelCardsOfRoot(id);
    setRoots((prev) => prev.filter((r) => r.id !== id));
    setCards((prev) => prev.filter((c) => c.rootId !== id));
    showToast("Removed " + root.name + " from the index", "cyan");
  }, [roots, cards, showToast]);

  const setRootRole = useCallback(async (id, role) => {
    const root = roots.find((r) => r.id === id);
    if (!root) return;
    const updated = Object.assign({}, root, { role });
    await dbPut(STORE_ROOTS, updated);
    setRoots((prev) => prev.map((r) => (r.id === id ? updated : r)));
  }, [roots]);

  /* ---- vault data export / import ---- */
  /*
   * Everything that's yours and lives only in this browser: edits (tags,
   * notes, flags, ratings, changes), tag aliases, settings, folder labels,
   * agent chats and saved AI answers. Folder access can't travel: browsers
   * only grant it to a click, so folders are added again after an import.
   */
  const buildVaultExport = useCallback(async () => {
    const [eds, chats, answers] = await Promise.all([dbAll(STORE_EDITS), dbAll(STORE_AGENT), dbAll(STORE_AINOTES)]);
    return {
      app: APP_NAME, version: APP_VERSION, format: 2, exportedAt: Date.now(),
      settings, tagMeta, edits: eds, folderRoles, dupeMode,
      agentChats: chats, aiAnswers: answers,
      roots: roots.map((r) => ({ id: r.id, name: r.name, role: r.role })),
      cardCount: cards.length,
    };
  }, [settings, tagMeta, folderRoles, dupeMode, roots, cards]);

  const exportVault = useCallback(async () => {
    downloadFile(JSON.stringify(await buildVaultExport(), null, 2), "rp-card-vault-data.json", "application/json");
    showToast("Vault data exported", "green");
  }, [buildVaultExport, showToast]);

  const [lastAutoBackup, setLastAutoBackup] = useState(0);
  useEffect(() => { dbGet(STORE_KV, AUTO_BACKUP_KEY).then((v) => setLastAutoBackup(Number(v) || 0)); }, []);

  // Write a copy of the vault data into the backup folder: when one is due
  // and the folder's access is already granted, or right away when asked.
  const backupVaultData = useCallback(async (asked) => {
    const target = autoBackupTarget(settings, roots);
    if (!target) {
      if (asked) showToast(settings.autoBackupKey === "off" ? "Automatic backups are off: pick a folder first" : "Add a folder first: backups are written into one", "warm");
      return false;
    }
    if (!asked && !autoBackupDue(Number(await dbGet(STORE_KV, AUTO_BACKUP_KEY)) || 0, settings.autoBackupDays, Date.now())) return false;
    let granted = false;
    try {
      granted = asked ? await verifyPermission(target.root.handle, true)
        : (await target.root.handle.queryPermission({ mode: "readwrite" })) === "granted";
    } catch (e) { granted = false; }
    if (!granted) { if (asked) showToast("No write access to " + target.root.name, "red"); return false; }
    try {
      const dir = await getDirByPath(target.root.handle, target.dirs.concat([VAULT_DATA_FOLDER]), true);
      const fh = await dir.getFileHandle(vaultDataFileName(stampNow()), { create: true });
      const w = await fh.createWritable();
      await w.write(new Blob([JSON.stringify(await buildVaultExport(), null, 2)], { type: "application/json" }));
      await w.close();
      const names = [];
      for await (const [n, e] of dir.entries()) if (e.kind === "file") names.push(n);
      for (const n of vaultDataFilesToPrune(names, Number(settings.autoBackupKeep) || 7)) {
        try { await dir.removeEntry(n); } catch (e) { /* tried again next time */ }
      }
      const at = Date.now();
      await dbPut(STORE_KV, at, AUTO_BACKUP_KEY);
      setLastAutoBackup(at);
      showToast("Vault data backed up to " + target.label, asked ? "green" : "cyan");
      return true;
    } catch (e) {
      showToast("Vault data backup failed: " + e.message, "red");
      return false;
    }
  }, [settings, roots, buildVaultExport, showToast]);
  const backupRef = useRef(backupVaultData);
  useEffect(() => { backupRef.current = backupVaultData; }, [backupVaultData]);

  const importVault = useCallback((file) => {
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const p = JSON.parse(ev.target.result);
        if (!p || !Array.isArray(p.edits)) throw new Error("Not a vault export");
        if (p.tagMeta) saveMeta(Object.assign({}, DEFAULT_TAGMETA, p.tagMeta));
        // Folder settings point at folder registrations, which have new ids
        // once folders are added again: carry them over by folder name, and
        // never let an import take a folder out of Keep private.
        const idMap = importRootIdMap(p.roots, roots);
        let lostPrivate = 0;
        if (p.settings) {
          const moved = remapRootSettings(p.settings, settings, idMap);
          lostPrivate = moved.lostPrivate;
          patchSettings(Object.assign({}, p.settings, moved.patch));
        }
        await dbPutMany(STORE_EDITS, p.edits);
        const m = new Map(editsMap);
        for (const e of p.edits) if (e && e.fingerprint) m.set(e.fingerprint, e);
        setEditsMap(m);
        // Exports from before format 2 have none of these; that's fine.
        if (p.folderRoles && typeof p.folderRoles === "object") {
          const roles = Object.assign({}, folderRoles, remapDirKeyed(p.folderRoles, idMap));
          setFolderRoles(roles); saveFolderRoles(roles);
        }
        if (p.dupeMode && typeof p.dupeMode === "object") {
          const dm = Object.assign({}, dupeMode, p.dupeMode);
          setDupeMode(dm); saveDupeMode(dm);
        }
        const chats = Array.isArray(p.agentChats) ? p.agentChats.filter((c) => c && c.id) : [];
        const answers = Array.isArray(p.aiAnswers) ? p.aiAnswers.filter((n) => n && n.id) : [];
        if (chats.length) await dbPutMany(STORE_AGENT, chats);
        if (answers.length) await dbPutMany(STORE_AINOTES, answers);
        showToast("Imported " + fmtNum(p.edits.length) + " card records" +
          (chats.length ? ", " + fmtNum(chats.length) + " agent chats" : "") +
          (answers.length ? ", " + fmtNum(answers.length) + " saved AI answers" : "") +
          (chats.length || answers.length ? ". Reloading to show them…" : ""), "green");
        if (lostPrivate) {
          showToast(lostPrivate + " folder" + (lostPrivate === 1 ? "" : "s") + " kept private from the AI in that export " +
            (lostPrivate === 1 ? "isn't" : "aren't") + " linked here. Add " + (lostPrivate === 1 ? "it" : "them") +
            ", then right-click → Keep private from the AI again.", "warm");
        }
        if (chats.length || answers.length) setTimeout(() => window.location.reload(), lostPrivate ? 6000 : 1500);
      } catch (e) { showToast("Import failed: " + e.message, "red"); }
    };
    reader.readAsText(file);
  }, [editsMap, folderRoles, dupeMode, saveMeta, patchSettings, showToast, roots, settings]);

  /*
   * Everything the vault keeps in this browser goes: the index and card
   * text, tags, notes, edits, chats, folder access, the offline copy, and
   * the API key the local server holds. What's left on this computer is
   * nothing of yours, which is the point before leaving a shared one.
   */
  const hardReset = useCallback(async () => {
    if (!window.confirm("Reset the vault and forget this computer?\n\nFolder registrations, the card index and card text, your tags, notes, ratings, edits and agent chats are erased from this browser, the API key is dropped from the local server, and the offline copy is removed. Export your vault data first if you want to keep it.\n\nCard files on disk, and the agent's workspace folder, are untouched.")) return;
    clearThumbCache();
    clearDragFileCache();
    for (const s of [STORE_KV, STORE_ROOTS, STORE_CARDS, STORE_THUMBS, STORE_EDITS, STORE_OPLOG, STORE_BODIES, STORE_AINOTES, STORE_AGENT]) await dbClearStore(s);
    try { await vaultFetch("/__vault/ai/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ apiKey: "" }) }); } catch (e) { /* no server running */ }
    try {
      if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
      if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    } catch (e) { /* nothing cached */ }
    try { localStorage.removeItem("rpCardVault-theme"); } catch (e) { /* storage blocked */ }
    window.location.reload();
  }, []);

  /* ---- selection ---- */
  const onTileClick = useCallback((rec, idx, e) => {
    if (e.metaKey || e.ctrlKey) {
      setSelection((prev) => { const n = new Set(prev); if (n.has(rec.id)) n.delete(rec.id); else n.add(rec.id); return n; });
      lastClickIdx.current = idx;
      return;
    }
    if (e.shiftKey && lastClickIdx.current >= 0) {
      const a = Math.min(lastClickIdx.current, idx), b = Math.max(lastClickIdx.current, idx);
      setSelection((prev) => {
        const n = new Set(prev);
        for (let i = a; i <= b; i++) if (filtered[i]) n.add(filtered[i].id);
        return n;
      });
      return;
    }
    lastClickIdx.current = idx;
    setSelection(new Set([rec.id]));
    setFocusId(rec.id);
  }, [filtered]);

  const bulkCopyTo = useCallback(async (destId) => {
    const dest = roots.find((r) => r.id === destId);
    if (!dest) return;
    const ids = Array.from(selection);
    if (!(await verifyPermission(dest.handle, true))) { showToast("Write permission denied", "red"); return; }
    setScan({ running: true, done: 0, total: ids.length, label: "Copying…", rootName: dest.name });
    let ok = 0, skip = 0, fail = 0;
    for (let i = 0; i < ids.length; i++) {
      const rec = recById.get(ids[i]);
      if (!rec) continue;
      setScan({ running: true, done: i, total: ids.length, label: rec.file, rootName: dest.name });
      try {
        const { bytes } = await readOriginalBytes(rec, roots);
        const out = await copyIntoRoot(dest, [], rec.file, new Blob([bytes]), rec.sig);
        if (out.skipped) skip++; else ok++;
      } catch (e) { fail++; }
    }
    await logOp("bulkCopy", { count: ids.length, to: dest.name, copied: ok, skipped: skip, failed: fail });
    setScan({ running: false, done: 0, total: 0, label: "", rootName: "" });
    showToast(ok + " copied to " + dest.name + (skip ? ", " + skip + " already there" : "") + (fail ? ", " + fail + " failed" : ""), fail ? "warm" : "green");
    runScanRef.current(dest.id, false, { quiet: true });
  }, [roots, selection, recById, showToast]);

  /* ---- folders: create + move ---- */
  const writableRoots = useMemo(
    () => roots.filter((r) => r.role !== "reference" && !isImportRoot(r)),
    [roots]
  );
  const folderTrees = useMemo(() => buildFolderTree(records, roots), [records, roots]);

  const newFolder = useCallback(async (presetRoot, presetParent) => {
    const targets = roots.filter((r) => !isImportRoot(r));
    if (!targets.length) { showToast("No writable folder registered — imported folders are read-only", "red"); return; }
    let root = presetRoot || null;
    if (!root) {
      if (targets.length === 1) root = targets[0];
      else {
        const names = targets.map((r, i) => (i + 1) + ") " + r.name).join("\n");
        const pick = window.prompt("Create a folder inside which registered folder?\n\n" + names + "\n\nEnter a number:", "1");
        if (pick === null) return;
        root = targets[Number(pick) - 1];
        if (!root) { showToast("No such folder", "red"); return; }
      }
    }
    const parent = presetParent === undefined || presetParent === null ? "" : presetParent;
    const name = window.prompt(
      "New folder inside " + root.name + (parent ? "/" + parent : "") + "\n\nName:",
      "Card Storage"
    );
    if (!name) return;
    try {
      const created = await createFolderIn(root, parent, name);
      const updated = Object.assign({}, root, { dirs: (root.dirs || []).concat([created]).sort() });
      await dbPut(STORE_ROOTS, updated);
      setRoots((prev) => prev.map((r) => (r.id === root.id ? updated : r)));
      showToast("Created " + root.name + "/" + created, "green");
    } catch (e) { showToast("Couldn't create folder: " + e.message, "red"); }
  }, [roots, showToast]);

  const moveCards = useCallback(async (ids, destRoot, destDir, opts) => {
    opts = opts || {};
    const recs = ids.map((id) => recById.get(id)).filter(Boolean);
    if (!recs.length) return;
    if (isImportRoot(destRoot)) { showToast("\"" + destRoot.name + "\" is imported read-only — it can't accept moves", "red"); return; }
    const fromImport = recs.filter((r) => { const sr = roots.find((x) => x.id === r.rootId); return sr && isImportRoot(sr); });
    if (fromImport.length) {
      showToast(fmtNum(fromImport.length) + " card(s) live in a read-only imported folder and can't be moved", "red");
      if (fromImport.length === recs.length) return;
    }
    const movable = recs.filter((r) => { const sr = roots.find((x) => x.id === r.rootId); return sr && !isImportRoot(sr); });
    const label = destRoot.name + (destDir ? "/" + destDir : "");
    if (!opts.noConfirm && movable.length > 1) {
      if (!window.confirm("Move " + movable.length + " cards into " + label + "?\n\nEach file is copied and verified before the original is removed.")) return;
    }

    setScan({ running: true, done: 0, total: movable.length, label: "Moving…", rootName: label });
    let moved = 0, skipped = 0, failed = 0;
    const errs = [];
    const touched = new Set([destRoot.id]);
    for (let i = 0; i < movable.length; i++) {
      const rec = movable[i];
      const srcRoot = roots.find((x) => x.id === rec.rootId);
      setScan({ running: true, done: i, total: movable.length, label: rec.file, rootName: label });
      try {
        const res = await moveCardTo(rec, srcRoot, destRoot, destDir);
        if (res.skipped) skipped++; else moved++;
        // The card keeps its short id at its new path.
        if (!res.skipped && rec.sid) sidHintsRef.current[destRoot.id + ":" + (res.dir ? res.dir + "/" : "") + res.name] = rec.sid;
        touched.add(srcRoot.id);
      } catch (e) { failed++; if (errs.length < 3) errs.push(rec.file + ": " + e.message); }
    }
    setScan({ running: false, done: 0, total: 0, label: "", rootName: "" });
    if (!opts.silent) {
      const verb = (opts.verb === "trashed") ? " sent to " : " moved to ";
      showToast(
        moved + verb + label +
        (skipped ? ", " + skipped + " already there" : "") +
        (failed ? ", " + failed + " failed — " + errs.join(" | ") : ""),
        failed ? "red" : "green"
      );
      setSelection(new Set());
    }
    runScanRef.current(Array.from(touched), false, { quiet: true });
    return { moved, skipped, failed, label, errs };
  }, [recById, roots, showToast]);

  /* ---- trash + delete ---- */

  // Drop cards out of the in-memory index and the caches immediately, so the
  // grid reflects a deletion without waiting for a rescan.
  const purgeFromIndex = useCallback(async (ids) => {
    const set = new Set(ids);
    for (const id of ids) {
      await dbDel(STORE_CARDS, id);
      await dbDel(STORE_BODIES, id);
      await dbDel(STORE_THUMBS, id);
      const u = THUMB_CACHE.get(id);
      if (u) { try { URL.revokeObjectURL(u); } catch (e) {} THUMB_CACHE.delete(id); }
      IMPORT_FILES.delete(id);
    }
    setCards((prev) => prev.filter((c) => !set.has(c.id)));
    setSelection((prev) => {
      const n = new Set(prev);
      for (const id of ids) n.delete(id);
      return n;
    });
    setFocusId((f) => (set.has(f) ? null : f));
  }, []);

  /** Resolve the configured trash destination, creating it if needed. */
  const resolveTrash = useCallback(async (fallbackRootId) => {
    if (settings.trashKey) {
      const i = settings.trashKey.indexOf("::");
      const root = roots.find((r) => r.id === settings.trashKey.slice(0, i));
      if (root && !isImportRoot(root)) return { root, dir: settings.trashKey.slice(i + 2) };
    }
    const root = roots.find((r) => r.id === fallbackRootId && !isImportRoot(r))
      || roots.find((r) => !isImportRoot(r));
    if (!root) throw new Error("No writable folder available for a trash folder");
    // reuse an existing trash-looking folder if the user already has one
    const existing = (root.dirs || []).find((d) => /(^|\/)(_vault trash|trash cards|trash)$/i.test(d));
    if (existing) return { root, dir: existing };
    await createFolderIn(root, "", TRASH_FOLDER_NAME);
    const updated = Object.assign({}, root, { dirs: (root.dirs || []).concat([TRASH_FOLDER_NAME]).sort() });
    await dbPut(STORE_ROOTS, updated);
    setRoots((prev) => prev.map((r) => (r.id === root.id ? updated : r)));
    return { root, dir: TRASH_FOLDER_NAME };
  }, [settings.trashKey, roots]);

  const trashCards = useCallback(async (ids, opts) => {
    opts = opts || {};
    const recs = ids.map((id) => recById.get(id)).filter(Boolean);
    if (!recs.length) return;
    try {
      const dest = await resolveTrash(recs[0].rootId);
      const label = dest.root.name + "/" + dest.dir;
      if (!opts.noConfirm) {
        if (!window.confirm(
          "Move " + recs.length + " card" + (recs.length === 1 ? "" : "s") + " to " + label + "?\n\n" +
          "Nothing is destroyed — the files are relocated, and you can drag them back out or empty that folder yourself later."
        )) return;
      }
      await moveCardsRef.current(ids, dest.root, dest.dir, { noConfirm: true, verb: "trashed" });
    } catch (e) {
      showToast("Couldn't trash: " + e.message, "red");
    }
  }, [recById, resolveTrash, showToast]);

  const deleteCards = useCallback(async (ids, opts) => {
    opts = opts || {};
    const recs = ids.map((id) => recById.get(id)).filter(Boolean);
    if (!recs.length) return;
    const readOnly = recs.filter((r) => { const rt = roots.find((x) => x.id === r.rootId); return rt && isImportRoot(rt); });
    if (readOnly.length === recs.length) {
      showToast("These cards live in a read-only imported folder — nothing can be deleted from it", "red");
      return;
    }
    const list = recs.slice(0, 6).map((r) => "  • " + r.rel).join("\n") + (recs.length > 6 ? "\n  • …and " + (recs.length - 6) + " more" : "");
    if (!opts.noConfirm) {
      if (!window.confirm(
        "Permanently delete " + recs.length + " file" + (recs.length === 1 ? "" : "s") + " from disk?\n\n" +
        list + "\n\nThis cannot be undone. To keep a recoverable copy, use Move to trash instead."
      )) return;
    }
    setScan({ running: true, done: 0, total: recs.length, label: "Deleting…", rootName: "" });
    const gone = [], failed = [];
    for (let i = 0; i < recs.length; i++) {
      const rec = recs[i];
      setScan({ running: true, done: i, total: recs.length, label: rec.file, rootName: "" });
      const root = roots.find((x) => x.id === rec.rootId);
      try {
        await deleteCardFile(rec, root);
        gone.push(rec.id);
      } catch (e) { failed.push(rec.file + ": " + e.message); }
    }
    setScan({ running: false, done: 0, total: 0, label: "", rootName: "" });
    if (gone.length) await purgeFromIndex(gone);
    showToast(
      gone.length + " file" + (gone.length === 1 ? "" : "s") + " deleted" +
      (failed.length ? " · " + failed.length + " failed — " + failed.slice(0, 2).join(" | ") : ""),
      failed.length ? "red" : "warm"
    );
  }, [recById, roots, purgeFromIndex, showToast]);

  const moveCardsRef = useRef(moveCards);
  useEffect(() => { moveCardsRef.current = moveCards; }, [moveCards]);
  const sendToFrontendRef = useRef(null);

  /** Clean up duplicate groups: keep one card per group, trash or delete the rest. */
  const resolveDupeGroups = useCallback(async (groups, mode, keepers) => {
    const victims = [];
    for (const g of groups) {
      const keepId = (keepers && keepers[g.kind + g.key]) || (defaultKeeper(g.items, roots) || {}).id;
      for (const it of g.items) {
        if (it.id === keepId) continue;
        const rt = roots.find((x) => x.id === it.rootId);
        if (rt && isImportRoot(rt)) continue;   // can't touch read-only imports
        victims.push(it.id);
      }
      // Never let a group be emptied: if every copy but the keeper was skipped
      // there is nothing to do, and the keeper is excluded by construction.
    }
    if (!victims.length) { showToast("Nothing to clean up — every copy is either the keeper or read-only", "warm"); return; }
    const bytes = victims.reduce((a, id) => a + ((recById.get(id) || {}).size || 0), 0);
    if (mode === "delete") {
      if (!window.confirm(
        "Permanently delete " + victims.length + " redundant file" + (victims.length === 1 ? "" : "s") +
        " (" + fmtBytes(bytes) + ")?\n\nOne copy of every card is kept. This cannot be undone."
      )) return;
      await deleteCards(victims, { noConfirm: true });
    } else {
      await trashCards(victims, { noConfirm: false });
    }
  }, [roots, recById, deleteCards, trashCards, showToast]);

  /* ---- drag and drop ---- */
  const [dragActive, setDragActive] = useState(false);

  /**
   * Stage a card's real bytes as a blob URL so a drag can hand the OS an
   * actual file. Kicked off on hover, because dragstart is synchronous and
   * reading from disk is not.
   */
  const prefetchDragFile = useCallback(async (rec) => {
    if (!rec || !rec.ok || DRAG_FILE_CACHE.has(rec.id)) return;
    try {
      const { bytes } = await readOriginalBytes(rec, roots);
      const mime = mimeForExt(rec.ext);
      const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
      cacheDragFile(rec.id, { url, name: rec.file, mime });
    } catch (e) { /* drag-out simply won't be available for this card */ }
  }, [roots]);

  const onCardDragStart = useCallback((rec, e) => {
    const ids = selection.has(rec.id) && selection.size > 1 ? Array.from(selection) : [rec.id];
    try {
      e.dataTransfer.setData("text/vault-cards", JSON.stringify(ids));
      e.dataTransfer.setData("text/plain", ids.length > 1 ? ids.length + " cards" : rec.name);
      // Dragging to Explorer or the desktop produces a real file; dragging to a
      // folder in the sidebar moves it. Both effects have to be allowed.
      e.dataTransfer.effectAllowed = "copyMove";
      attachDownloadUrl(e.dataTransfer, rec);
    } catch (err) { /* older browsers */ }
    setDragActive(true);
  }, [selection]);

  const onDropCards = useCallback((root, dir, payload) => {
    setDragActive(false);
    let ids = [];
    try { ids = JSON.parse(payload || "[]"); } catch (e) { ids = []; }
    if (!ids.length) return;
    moveCards(ids, root, dir, { noConfirm: ids.length <= 5 });
  }, [moveCards]);

  /* ---- destinations with an import API: their sign-ins live in serve.js ---- */
  const [destStatus, setDestStatus] = useState({ available: null, byId: {} });

  const refreshDests = useCallback(async () => {
    try {
      const r = await vaultFetch("/__vault/dest/list");
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      const byId = {};
      for (const x of d.destinations || []) byId[x.id] = x;
      setDestStatus({ available: true, byId });
      return true;
    } catch (e) {
      setDestStatus({ available: false, byId: {} });
      return false;
    }
  }, []);

  useEffect(() => { refreshDests(); }, [refreshDests]);

  /** Sign in to (or set up) an upload destination. Passwords and tokens go to serve.js only. */
  const connectDest = useCallback(async (dest, secret) => {
    try {
      const r = await vaultFetch("/__vault/dest/connect", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({ id: dest.id, type: dest.type, baseUrl: dest.baseUrl, username: dest.username,
          field: dest.field, header: dest.header }, secret || {})),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ("The local server answered HTTP " + r.status));
      setDestStatus((st) => ({ available: true, byId: Object.assign({}, st.byId, { [dest.id]: d }) }));
      showToast("Connected to " + dest.name + (d.user ? " as " + d.user : ""), "green");
      return true;
    } catch (e) {
      showToast(dest.name + ": " + e.message, "red");
      return false;
    }
  }, [showToast]);

  const disconnectDest = useCallback(async (dest) => {
    try {
      await vaultFetch("/__vault/dest/disconnect", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: dest.id }) });
    } catch (e) { /* the server is gone anyway */ }
    setDestStatus((st) => { const byId = Object.assign({}, st.byId); delete byId[dest.id]; return { available: st.available, byId }; });
  }, []);

  /* ---- AI relay (also served by serve.js) ────────────────────────────────
     The page never calls a model endpoint itself: serve.js forwards requests
     and holds the API key in memory. `aiRelay` is the server's side of the
     settings (address, model, whether it holds a key) plus its build.
     ─────────────────────────────────────────────────────────────────────── */
  const [aiRelay, setAiRelay] = useState({
    available: null, needsUpgrade: false, configured: false, hasKey: false,
    baseUrl: "", model: "", build: 0, version: "", checkedAt: 0,
  });

  const patchAiSettings = useCallback((p) => {
    setAiSettings((prev) => {
      const next = sanitizeAiSettings(Object.assign({}, prev, p));
      saveAiSettings(next);
      return next;
    });
  }, []);

  const patchAgentSettings = useCallback((p) => {
    setAgentSettings((prev) => {
      const next = sanitizeAgentSettings(Object.assign({}, prev, p));
      saveAgentSettings(next);
      return next;
    });
  }, []);

  const applyAiRelay = useCallback((d) => {
    setAiRelay({
      available: true, needsUpgrade: false,
      configured: !!d.configured, hasKey: !!d.hasKey,
      baseUrl: d.baseUrl || "", model: d.model || "",
      build: Number(d.build || 0), version: d.version || "",
      checkedAt: Date.now(),
    });
  }, []);

  const refreshAiRelay = useCallback(async () => {
    const down = { configured: false, hasKey: false, baseUrl: "", model: "", build: 0, version: "", checkedAt: Date.now() };
    try {
      const r = await vaultFetch("/__vault/ai/config");
      if (r.status === 404) {
        // A serve.js from before the AI relay existed.
        setAiRelay(Object.assign({ available: true, needsUpgrade: true }, down));
        return false;
      }
      if (!r.ok) throw new Error("HTTP " + r.status);
      applyAiRelay(await r.json());
      return true;
    } catch (e) {
      setAiRelay(Object.assign({ available: false, needsUpgrade: false }, down));
      return false;
    }
  }, [applyAiRelay]);

  useEffect(() => { refreshAiRelay(); }, [refreshAiRelay]);
  useEffect(() => { rememberLogNames(records, roots, settings.destinations); }, [records, roots, settings.destinations]);

  /* What the problem log (Settings) puts at the top, and the names it hides:
     private cards and destination user names always, the rest unless shown. */
  const problemLogInfo = useCallback((showNames) => {
    const ua = typeof navigator !== "undefined" ? navigator.userAgent : "";
    const major = chromiumMajor(ua);
    const os = /Windows/.test(ua) ? "Windows" : /Mac OS/.test(ua) ? "macOS" : /Linux/.test(ua) ? "Linux" : "unknown OS";
    let aiHost = "";
    try { aiHost = aiRelay.baseUrl ? new URL(aiRelay.baseUrl).host : ""; } catch (e) { aiHost = "?"; }
    const header = [
      "RP Card Vault problem log, copied " + new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().replace("T", " ").slice(0, 16) + " (local time)",
      "Vault " + APP_VERSION + " · server " + (aiRelay.version || (aiRelay.available ? "?" : "not reached")) + " · " +
        BROWSER_LABEL + (major ? " " + major : "") + " · " + os,
      "Folders: " + roots.length + " · cards: " + cards.length,
      "AI: " + (aiRelay.configured ? aiHost + " · model " + (aiRelay.model || "?") + (aiRelay.hasKey ? " · key set" : " · no key") : "not set up"),
    ];
    return { header, names: logNameEntries(showNames) };
  }, [aiRelay, roots.length, cards.length]);

  /** Give the relay an address, model and (optionally) key. Throws the relay's reason. */
  const aiPushConfig = useCallback(async (fields) => {
    const r = await vaultFetch("/__vault/ai/config", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fields || {}),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ("The local server refused that (HTTP " + r.status + ")"));
    applyAiRelay(d);
    return d;
  }, [applyAiRelay]);

  // After the launcher restarts the server it has no address or model. Hand
  // it the saved ones (never a key: that was never stored, so it's re-entered).
  useEffect(() => {
    if (!ready || !aiRelay.available || aiRelay.needsUpgrade || relayIsStale(aiRelay)) return;
    if (aiRelay.baseUrl || !aiSettings.baseUrl) return;
    aiPushConfig({ localOnly: !!aiSettings.localOnly, noTrain: aiSettings.noTrain !== false, baseUrl: aiSettings.baseUrl, model: aiSettings.model })
      .catch(() => { /* the AI panel shows what's wrong */ });
  }, [ready, aiRelay, aiSettings.baseUrl, aiSettings.model, aiSettings.localOnly, aiSettings.noTrain, aiPushConfig]);

  /** Local models only / the OpenRouter flag: the local server enforces them, so it's told first. */
  const aiSavePrivacy = useCallback(async (fields) => {
    try { await aiPushConfig(fields); }
    catch (e) { showToast(e.message, "red"); return false; }
    patchAiSettings(fields);
    return true;
  }, [aiPushConfig, patchAiSettings, showToast]);

  /**
   * Save the endpoint: to vault settings (address, model) and to the relay
   * (address, model, and the key if one was typed — `apiKey: ""` forgets it).
   */
  const aiSaveEndpoint = useCallback(async (fields) => {
    const baseUrl = normalizeAiBase(fields.baseUrl);
    const model = String(fields.model || "").trim();
    const push = { baseUrl, model };
    if (typeof fields.apiKey === "string") push.apiKey = fields.apiKey;
    // Server first: if the vault's settings changed before the server had
    // them, the restart hand-over below would race this and send them twice.
    const d = await aiPushConfig(push);
    patchAiSettings({ baseUrl, model });
    return d;
  }, [patchAiSettings, aiPushConfig]);

  /** Test what the relay has saved. Returns `{ ok, models, via }` or `{ ok: false, error }`. */
  const aiTestConnection = useCallback(async () => {
    try {
      const r = await vaultFetch("/__vault/ai/test", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      const d = await r.json().catch(() => ({}));
      if (d.config) applyAiRelay(d.config);
      if (!r.ok) return { ok: false, error: d.error || ("HTTP " + r.status) };
      return d;
    } catch (e) {
      return { ok: false, error: "Couldn't reach the local server: " + e.message };
    }
  }, [applyAiRelay]);

  const aiForgetKey = useCallback(async () => {
    try {
      await aiPushConfig({ apiKey: "" });
      showToast("API key cleared from the local server's memory", "warm");
    } catch (e) {
      showToast(e.message, "red");
    }
  }, [aiPushConfig, showToast]);

  /**
   * Run one AI action on one card.
   *
   * Streams the reply, calling `opts.onProgress(state)` as text and thinking
   * arrive. A good answer is cached and, if it carries suggestions, merged
   * into the card's proposals against the edit record as it is *when the
   * reply lands*. A bad one (cut off, empty, only thinking) is returned as a
   * failure and neither cached nor proposed.
   *
   * Returns `{ ok: true, note, outcome }` or `{ ok: false, error, raw, think }`.
   * Cancelling via `opts.signal` rejects with an AbortError.
   */
  const runAi = useCallback(async (rec, body, edit, kind, opts) => {
    opts = opts || {};
    const settingsNow = aiSettings;
    if (!aiReady(settingsNow, aiRelay)) {
      return { ok: false, error: aiSettingsProblems(settingsNow, aiRelay)[0] || "The AI isn't switched on — open the ✦ AI panel." };
    }
    const req = aiBuildRequest(kind, settingsNow, rec, body, edit, opts.knownTags || [], { field: opts.field });
    if (req.error) return { ok: false, error: req.error };

    const r = await vaultFetch("/__vault/ai/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: [{ role: "system", content: req.system }, { role: "user", content: req.user }],
        temperature: settingsNow.temperature,
        maxTokens: settingsNow.maxTokens,
        timeoutMs: settingsNow.timeoutMs,
      }),
      signal: opts.signal,
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      return { ok: false, error: d.error || ("The local server answered HTTP " + r.status) };
    }

    let acc = aiEmptyStream();
    const split = ndjsonSplitter();
