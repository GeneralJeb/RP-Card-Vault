   15. MODALS
   ════════════════════════════════════════════ */

function RootsModal({ roots, rootCounts, onClose, onAdd, onImport, onSetRole, onForget, onRescan, scanning }) {
  return (
    <Modal title="Card folders" icon={"\u{1F4C1}"} width={720} onClose={onClose}
      subtitle="Register as many folders as you like. Roles drive the ingest pipeline."
      footer={
        <Fragment>
          <SmallBtn color="warm" onClick={onAdd} disabled={!fsSupported()}
            title={fsSupported() ? "" : "This browser doesn't grant folder write access"}>+ Add folder</SmallBtn>
          <SmallBtn color="cyan" onClick={onImport}>+ Import read-only</SmallBtn>
          <SmallBtn color="cyan" onClick={() => onRescan(null, false)} disabled={scanning || !roots.length}>Rescan changed</SmallBtn>
          <SmallBtn color="muted" onClick={() => onRescan(null, true)} disabled={scanning || !roots.length}>Full re-parse</SmallBtn>
          <span style={{ marginLeft: "auto", fontSize: 10, color: "var(--text-muted)" }}>
            Permission is re-requested by the browser after a restart.
          </span>
        </Fragment>
      }>
      {!roots.length ? (
        <div style={{ fontSize: 12, color: "var(--text-muted)", lineHeight: 1.7 }}>
          No folders registered yet. Add your downloads folder as <strong>Inbox</strong>, your front-end
          character folder as <strong>Library</strong>, and your backup folder as <strong>Archive</strong>.
        </div>
      ) : null}
      {roots.map((r) => {
        const meta = ROOT_ROLES[r.role] || ROOT_ROLES.reference;
        return (
          <div key={r.id} style={{
            display: "flex", alignItems: "center", gap: 10, padding: 10, marginBottom: 8,
            background: "var(--bg-tertiary)", borderRadius: "var(--radius-sm)",
            border: "1px solid " + acRgba(meta.color, 0.25),
          }}>
            <span style={{ fontSize: 18 }}>{meta.icon}</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ fontSize: 13, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.name}</span>
                {isImportRoot(r) ? <Pill color="cyan" title="Imported via the folder picker — readable, not writable">read-only</Pill> : null}
              </div>
              <div style={Object.assign({}, monoTiny, { color: "var(--text-muted)", marginTop: 2 })}>
                {fmtNum(rootCounts[r.id] || 0)} cards · added {fmtDateShort(r.addedAt)}
                {r.lastScan ? " · scanned " + fmtDate(r.lastScan) : " · never scanned"}
              </div>
              <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 3 }}>
                {isImportRoot(r)
                  ? "Imported read-only. Can be an ingest source but never a destination; re-pick after a reload to read card files."
                  : meta.desc}
              </div>
            </div>
            <select value={r.role} onChange={(e) => onSetRole(r.id, e.target.value)}
              style={Object.assign({}, selectStyle, { width: 132, padding: "5px 26px 5px 9px", fontSize: 11 })}>
              {Object.keys(ROOT_ROLES).map((k) => <option key={k} value={k}>{ROOT_ROLES[k].label}</option>)}
            </select>
            {isImportRoot(r)
              ? <SmallBtn color="cyan" onClick={onImport} disabled={scanning} title="Re-pick this folder">re-attach</SmallBtn>
              : <SmallBtn color="cyan" onClick={() => onRescan(r.id, false)} disabled={scanning}>scan</SmallBtn>}
            <SmallBtn color="red" onClick={() => onForget(r.id)} disabled={scanning}>forget</SmallBtn>
          </div>
        );
      })}
      <div style={{
        marginTop: 12, padding: 10, background: acRgba("cyan", 0.06),
        border: "1px solid " + acRgba("cyan", 0.2), borderRadius: "var(--radius-sm)",
        fontSize: 11, color: "var(--text-secondary)", lineHeight: 1.7,
      }}>
        <strong>Forget</strong> only removes the folder from the vault's index — nothing on disk is touched.
        Reference folders are opened read-only; every other role gets read/write so the ingest pipeline can copy into them.
      </div>
    </Modal>
  );
}

function TagManagerModal({ tagIndex, tagMeta, onSaveMeta, onClose, allTagsUnfiltered }) {
  const [q, setQ] = useState("");
  const [mergeTarget, setMergeTarget] = useState(null);
  const suggestions = useMemo(() => suggestTagMerges(tagIndex.list), [tagIndex]);
  const hidden = new Set(tagMeta.hidden || []);
  const pinned = new Set(tagMeta.pinned || []);

  const setAlias = (from, to) => {
    const aliases = Object.assign({}, tagMeta.aliases);
    if (!to || from === to) delete aliases[from]; else aliases[from] = to;
    onSaveMeta(Object.assign({}, tagMeta, { aliases }));
  };
  const toggleHidden = (key) => {
    const h = new Set(hidden);
    if (h.has(key)) h.delete(key); else h.add(key);
    onSaveMeta(Object.assign({}, tagMeta, { hidden: Array.from(h) }));
  };
  const togglePinned = (key) => {
    const p = new Set(pinned);
    if (p.has(key)) p.delete(key); else p.add(key);
    onSaveMeta(Object.assign({}, tagMeta, { pinned: Array.from(p) }));
  };

  const filtered = useMemo(() => {
    const n = normTagName(q);
    return n ? tagIndex.list.filter((t) => t.key.indexOf(n) >= 0) : tagIndex.list;
  }, [q, tagIndex]);

  const aliasEntries = Object.keys(tagMeta.aliases || {});

  return (
    <Modal title="Tag manager" icon={"\u{1F3F7}"} width={840} onClose={onClose}
      subtitle={fmtNum(tagIndex.list.length) + " canonical tags · " + fmtNum(aliasEntries.length) + " aliases · " + fmtNum(hidden.size) + " hidden"}>

      {suggestions.length ? (
        <div style={{ marginBottom: 18 }}>
          <label style={tinyLabel}>Suggested merges ({suggestions.length})</label>
          <div style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 8 }}>
            Tags that look like the same thing. Merging only changes how the vault groups them.
          </div>
          {suggestions.slice(0, 12).map((s) => (
            <div key={s.canonical.key} style={{
              display: "flex", alignItems: "center", gap: 8, padding: "6px 9px", marginBottom: 5,
              background: "var(--bg-tertiary)", borderRadius: "var(--radius-sm)", flexWrap: "wrap",
            }}>
              <Pill color="warm">{s.canonical.label} · {s.canonical.count}</Pill>
              <span style={{ color: "var(--text-muted)", fontSize: 11 }}>←</span>
              {s.others.map((o) => <Pill key={o.key} color="muted">{o.label} · {o.count}</Pill>)}
              <SmallBtn color="green" style={{ marginLeft: "auto" }} onClick={() => {
                const aliases = Object.assign({}, tagMeta.aliases);
                for (const o of s.others) aliases[o.key] = s.canonical.key;
                onSaveMeta(Object.assign({}, tagMeta, { aliases }));
              }}>merge</SmallBtn>
            </div>
          ))}
        </div>
      ) : null}

      {aliasEntries.length ? (
        <div style={{ marginBottom: 18 }}>
          <label style={tinyLabel}>Active aliases</label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
            {aliasEntries.map((from) => (
              <span key={from} style={{
                display: "inline-flex", alignItems: "center", gap: 5, fontSize: 10.5,
                fontFamily: "'JetBrains Mono', monospace", padding: "3px 7px", borderRadius: 3,
                background: acRgba("purple", 0.1), border: "1px solid " + acRgba("purple", 0.25),
                color: "var(--accent-purple)",
              }}>
                {from} → {tagMeta.aliases[from]}
                <span onClick={() => setAlias(from, null)} style={{ cursor: "pointer", opacity: 0.7 }}>×</span>
              </span>
            ))}
          </div>
        </div>
      ) : null}

      <label style={tinyLabel}>All tags</label>
      <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="filter…"
        style={Object.assign({}, inputBase, { marginBottom: 8 })} />

      {mergeTarget ? (
        <div style={{
          marginBottom: 10, padding: 9, borderRadius: "var(--radius-sm)",
          background: acRgba("warm", 0.09), border: "1px solid " + acRgba("warm", 0.28),
          fontSize: 11.5, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap",
        }}>
          <span>Merging <strong>{mergeTarget.label}</strong> into… pick a destination tag below.</span>
          <SmallBtn color="muted" style={{ marginLeft: "auto" }} onClick={() => setMergeTarget(null)}>cancel</SmallBtn>
        </div>
      ) : null}

      <div style={{ maxHeight: 340, overflowY: "auto", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-sm)" }}>
        {filtered.slice(0, 400).map((t) => (
          <div key={t.key} className="tagRow" style={{
            display: "flex", alignItems: "center", gap: 8, padding: "5px 9px",
            borderBottom: "1px solid rgba(42,47,61,0.5)",
            background: mergeTarget && mergeTarget.key === t.key ? acRgba("warm", 0.12) : "transparent",
          }}>
            {pinned.has(t.key) ? <span style={{ color: "var(--accent-warm)", fontSize: 10 }}>📌</span> : null}
            <span style={{ flex: 1, fontSize: 12, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.label}</span>
            <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)" })}>{t.key}</span>
            <Pill color="muted">{t.count}</Pill>
            {t.custom ? <Pill color="purple">{t.custom} yours</Pill> : null}
            {mergeTarget && mergeTarget.key !== t.key ? (
              <SmallBtn color="green" onClick={() => { setAlias(mergeTarget.key, t.key); setMergeTarget(null); }}>← merge here</SmallBtn>
            ) : (
              <SmallBtn color="warm" onClick={() => setMergeTarget(t)}>merge…</SmallBtn>
            )}
            <SmallBtn color="cyan" active={pinned.has(t.key)} onClick={() => togglePinned(t.key)} title="Pin to top of sidebar">pin</SmallBtn>
            <SmallBtn color="red" onClick={() => toggleHidden(t.key)} title="Hide from the sidebar">hide</SmallBtn>
          </div>
        ))}
        {filtered.length > 400 ? (
          <div style={{ padding: 8, fontSize: 11, color: "var(--text-muted)" }}>
            …{fmtNum(filtered.length - 400)} more. Narrow the filter to see them.
          </div>
        ) : null}
      </div>

      {hidden.size ? (
        <div style={{ marginTop: 14 }}>
          <label style={tinyLabel}>Hidden tags ({hidden.size})</label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
            {Array.from(hidden).map((k) => (
              <span key={k} onClick={() => toggleHidden(k)} style={{
                cursor: "pointer", fontSize: 10.5, fontFamily: "'JetBrains Mono', monospace",
                padding: "3px 7px", borderRadius: 3, background: acRgba("red", 0.08),
                border: "1px solid " + acRgba("red", 0.22), color: "var(--accent-red)",
              }}>{k} ×</span>
            ))}
          </div>
        </div>
      ) : null}

      <div style={{
        marginTop: 16, padding: 10, background: acRgba("purple", 0.06),
        border: "1px solid " + acRgba("purple", 0.2), borderRadius: "var(--radius-sm)",
        fontSize: 11, color: "var(--text-secondary)", lineHeight: 1.7,
      }}>
        Normalization and aliases are a <strong>view</strong> over your collection. Card files keep their
        original tags exactly as the creator wrote them.
      </div>
    </Modal>
  );
}

function IngestModal({ roots, records, settings, tagMeta, folderRoles, dupeExcluder, onClose, onSaveSettings, onDone, onToast }) {
  const inboxRoots = roots.filter((r) => r.role === "inbox");
  const writable = roots.filter((r) => (r.role === "library" || r.role === "archive") && !isImportRoot(r));

  // Sources and destinations are FOLDERS, not whole roots. That's what lets a
  // single "Cards" folder work: its top level is the inbox, and its dated
  // storage subfolders are destinations.
  const folderOptions = useMemo(
    () => roots.map((root) => ({ root, folders: foldersOfRoot(records, root) })),
    [roots, records]
  );
  const writableFolderOptions = useMemo(
    () => folderOptions.filter((g) => !isImportRoot(g.root)),
    [folderOptions]
  );

  // Subfolders labelled Inbox/Library/Archive take priority over the role of
  // the registered folder they live in.
  const labelledInbox = foldersWithRole(records, roots, folderRoles, "inbox");
  const labelledDests = foldersWithRole(records, roots, folderRoles, "library")
    .concat(foldersWithRole(records, roots, folderRoles, "archive"))
    .filter((k) => { const r = roots.find((x) => x.id === parseDirKey(k).rootId); return r && !isImportRoot(r); });

  const [sourceKeys, setSourceKeys] = useState(
    (settings.ingestSourceKeys && settings.ingestSourceKeys.length)
      ? settings.ingestSourceKeys
      : (labelledInbox.length ? labelledInbox
        : (inboxRoots.length
            ? inboxRoots.map((r) => dirKey(r.id, ""))
            // Nothing labelled: assume loose cards sit at the top level of each
            // registered folder, which is the common single-folder setup.
            : roots.filter((r) => !isImportRoot(r)).map((r) => dirKey(r.id, ""))))
  );
  const [destKeys, setDestKeys] = useState(
    (settings.ingestDestKeys && settings.ingestDestKeys.length)
      ? settings.ingestDestKeys
      : (labelledDests.length ? labelledDests : writable.map((r) => dirKey(r.id, "")))
  );
  const [srcRecursive, setSrcRecursive] = useState(!!settings.ingestSourceRecursive);
  const [subfolder, setSubfolder] = useState(settings.ingestSubfolder);
  const [skipDupes, setSkipDupes] = useState(settings.ingestSkipDupes);
  const [moveSource, setMoveSource] = useState(false);
  const [plan, setPlan] = useState(null);
  const [running, setRunning] = useState(false);
  const [prog, setProg] = useState({ done: 0, total: 0, label: "" });
  const [result, setResult] = useState(null);

  const parseKey = (k) => { const i = k.indexOf("::"); return { rootId: k.slice(0, i), dir: k.slice(i + 2) }; };
  const destTargets = destKeys.map(parseKey);

  const sourceRecs = useMemo(() => {
    const sel = sourceKeys.map(parseKey);
    return records.filter((r) => sel.some((s) => (
      srcRecursive ? recInDir(r, s.rootId, s.dir) : (r.rootId === s.rootId && (r.dir || "") === s.dir)
    )));
  }, [records, sourceKeys, srcRecursive]);

  // Duplicate comparison looks at the WHOLE destination root, not just the
  // target folder — you want to know a card is already filed even if it landed
  // somewhere else in that root.
  const destRecs = useMemo(() => {
    const rootIds = new Set(destTargets.map((d) => d.rootId));
    // Exclude the source cards themselves. When the source folder and the
    // destination live in the same root — which is exactly the single-"Cards"
    // layout — every incoming card would otherwise match its own bytes and be
    // written off as an exact duplicate of itself.
    const srcIds = new Set(sourceRecs.map((r) => r.id));
    return records.filter((r) => rootIds.has(r.rootId) && !srcIds.has(r.id));
  }, [records, destKeys, sourceRecs]);

  const build = () => {
    setResult(null);
    setPlan(planIngest(sourceRecs, destRecs, { ingestSkipDupes: skipDupes, ingestSubfolder: subfolder }, tagMeta, dupeExcluder));
  };

  const setAction = (i, action) => {
    const p = plan.slice();
    p[i] = Object.assign({}, p[i], { action });
    setPlan(p);
  };

  const execute = async () => {
    const toDo = plan.filter((p) => p.action === "copy");
    const dests = destTargets
      .map((d) => ({ root: roots.find((r) => r.id === d.rootId), baseDir: d.dir }))
      .filter((d) => d.root && !isImportRoot(d.root));
    if (!toDo.length || !dests.length) return;
    setRunning(true);
    const res = { copied: 0, skipped: 0, failed: 0, moved: 0, details: [] };
    for (let i = 0; i < toDo.length; i++) {
      const p = toDo[i];
      setProg({ done: i, total: toDo.length, label: p.rec.file });
      try {
        const { bytes } = await readOriginalBytes(p.rec, roots);
        const blob = new Blob([bytes]);
        const wrote = [];
        for (const d of dests) {
          const dest = d.root;
          if (!(await verifyPermission(dest.handle, true))) throw new Error("write permission denied for " + dest.name);
          // destination folder + whatever the filing mode adds on top
          const fullDirs = (d.baseDir ? d.baseDir.split("/") : []).concat(p.subfolder);
          const out = await copyIntoRoot(dest, fullDirs, p.rec.file, blob, p.rec.sig);
          if (out.skipped) res.skipped++; else res.copied++;
          wrote.push(dest.name + "/" + (fullDirs.length ? fullDirs.join("/") + "/" : "") + out.name + (out.skipped ? " (already there)" : ""));
        }
        if (moveSource) {
          // Never over an earlier ingest's copy (numbered instead), and the
          // source goes only once its copy reads back the same.
          const srcRoot = roots.find((r) => r.id === p.rec.rootId);
          const dirs = p.rec.dir ? p.rec.dir.split("/") : [];
          const sig = await byteSignature(blob);
          const kept = await copyIntoRoot(srcRoot, ["_ingested"].concat(dirs), p.rec.file, blob, sig);
          const doneDir = await getDirByPath(srcRoot.handle, ["_ingested"].concat(dirs), false);
          const back = await (await doneDir.getFileHandle(kept.name, { create: false })).getFile();
          if (back.size !== blob.size || (await byteSignature(back)) !== sig) throw new Error("its copy in _ingested didn't check out, so the source was left where it was");
          const srcDir = await getDirByPath(srcRoot.handle, dirs, false);
          await srcDir.removeEntry(p.rec.file);
          res.moved++;
        }
        res.details.push({ name: p.rec.name, file: p.rec.file, ok: true, wrote });
      } catch (e) {
        res.failed++;
        res.details.push({ name: p.rec.name, file: p.rec.file, ok: false, err: e.message });
      }
    }
    setProg({ done: toDo.length, total: toDo.length, label: "done" });
    await logOp("ingest", {
      copied: res.copied, skipped: res.skipped, failed: res.failed, moved: res.moved,
      dests: dests.map((d) => d.root.name + (d.baseDir ? "/" + d.baseDir : "")),
    });
    setResult(res);
    setRunning(false);
    onSaveSettings({
      ingestSubfolder: subfolder, ingestSkipDupes: skipDupes,
      ingestSourceKeys: sourceKeys, ingestDestKeys: destKeys, ingestSourceRecursive: srcRecursive,
    });
    onToast("Ingest finished — " + res.copied + " copied, " + res.skipped + " already present" + (res.failed ? ", " + res.failed + " failed" : ""), res.failed ? "warm" : "green");
    const touchedRoots = dests.map((d) => d.root.id)
      .concat(moveSource ? sourceKeys.map((k) => k.slice(0, k.indexOf("::"))) : []);
    onDone(touchedRoots);
  };

  const counts = plan ? plan.reduce((a, p) => { a[p.status] = (a[p.status] || 0) + 1; return a; }, {}) : {};
  const willCopy = plan ? plan.filter((p) => p.action === "copy").length : 0;

  const toggleIn = (arr, setArr, id) => {
    const s = new Set(arr);
    if (s.has(id)) s.delete(id); else s.add(id);
    setArr(Array.from(s));
  };

  const FolderPicker = ({ groups, selected, setSelected, color }) => (
    <div style={{
      maxHeight: 180, overflowY: "auto", border: "1px solid var(--border-subtle)",
      borderRadius: "var(--radius-sm)", padding: 4, background: "var(--bg-input)",
    }}>
      {!groups.length ? (
        <div style={{ fontSize: 11, color: "var(--text-muted)", padding: 6 }}>No eligible folders.</div>
      ) : null}
      {groups.map((g) => (
        <div key={g.root.id}>
          <div style={Object.assign({}, tinyLabel, { padding: "4px 4px 2px", marginBottom: 0 })}>
            {(ROOT_ROLES[g.root.role] || {}).icon} {g.root.name}{isImportRoot(g.root) ? " (read-only)" : ""}
          </div>
          {g.folders.map((d) => {
            const k = dirKey(g.root.id, d);
            const on = selected.indexOf(k) >= 0;
            return (
              <div key={k} className="tagRow no-sel" onClick={() => toggleIn(selected, setSelected, k)}
                title={d === "" ? g.root.name + " (top level)" : g.root.name + "/" + d}
                style={{
                  display: "flex", gap: 6, alignItems: "center", padding: "2px 5px",
                  cursor: "pointer", borderRadius: 3, fontSize: 11.5,
                  background: on ? acRgba(color, 0.16) : "transparent",
                  color: on ? ac(color) : "var(--text-secondary)",
                }}>
                <span style={{ width: 10, fontSize: 10, flexShrink: 0 }}>{on ? "✓" : "·"}</span>
                <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {d === "" ? "(top level)" : d}
                </span>
                {folderRoles && folderRoles[k] ? (
                  <Pill color={(ROOT_ROLES[folderRoles[k]] || {}).color}>
                    {(ROOT_ROLES[folderRoles[k]] || {}).label}
                  </Pill>
                ) : null}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );

  return (
    <Modal title="Ingest new cards" icon={"\u{1F4E5}"} width={900} onClose={onClose}
      subtitle="Copy from Inbox into Library and Archive in one pass. Nothing is overwritten or deleted."
      footer={
        <Fragment>
          <SmallBtn color="cyan" onClick={build} disabled={running || !sourceKeys.length}>
            {plan ? "Rebuild plan" : "Build plan"}
          </SmallBtn>
          <SmallBtn color="warm" onClick={execute} disabled={running || !plan || !willCopy || !destKeys.length}>
            {running ? "Working…" : "Copy " + willCopy + " card" + (willCopy === 1 ? "" : "s")}
          </SmallBtn>
          {running ? <div style={{ flex: 1 }}><ProgressBar step={prog.done} total={prog.total} label={prog.label} /></div> : null}
        </Fragment>
      }>

      {!writableFolderOptions.length ? (
        <div style={{
          padding: 10, marginBottom: 14, borderRadius: "var(--radius-sm)",
          background: acRgba("red", 0.08), border: "1px solid " + acRgba("red", 0.25),
          fontSize: 11.5, color: "var(--text-secondary)", lineHeight: 1.7,
        }}>
          <strong style={{ color: "var(--accent-red)" }}>No writable destination folder.</strong> The ingest
          pipeline copies files, which needs write access. Read-only imported folders can be a source but
          never a destination. Add a folder with <strong>+ Add folder</strong> in the Folders panel — in
          Brave that needs the File System Access flag enabled, or run the vault in Chrome or Edge.
        </div>
      ) : null}

      <div style={{
        padding: 10, marginBottom: 14, borderRadius: "var(--radius-sm)",
        background: acRgba("cyan", 0.06), border: "1px solid " + acRgba("cyan", 0.2),
        fontSize: 11.5, color: "var(--text-secondary)", lineHeight: 1.7,
      }}>
        Sources and destinations are <strong>folders</strong>, so one registered folder is enough: pick its
        top level as the source, your current storage subfolder as a destination, and leave
        <strong> Include subfolders </strong> off so cards you've already filed aren't offered again.
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14, marginBottom: 16 }}>
        <div>
          <label style={tinyLabel}>Take new cards from</label>
          <FolderPicker groups={folderOptions} selected={sourceKeys} setSelected={setSourceKeys} color="cyan" />
          <div style={{ marginTop: 7 }}>
            <Toggle small color="cyan" checked={srcRecursive} onChange={setSrcRecursive} label="Include subfolders" />
          </div>
          <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 5, lineHeight: 1.5 }}>
            {srcRecursive
              ? "Everything beneath the picked folders counts as new — including cards you've already filed."
              : "Only cards sitting directly in the picked folders. Leave this off if your storage subfolders live inside the same folder."}
          </div>
          <div style={Object.assign({}, monoTiny, { color: "var(--text-secondary)", marginTop: 6 })}>
            {fmtNum(sourceRecs.length)} card{sourceRecs.length === 1 ? "" : "s"} in scope
          </div>
        </div>
        <div>
          <label style={tinyLabel}>File them into</label>
          <FolderPicker groups={writableFolderOptions} selected={destKeys} setSelected={setDestKeys} color="green" />
          <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 5, lineHeight: 1.5 }}>
            Each card is copied to every folder picked here — that's how one action keeps your working
            copy and your backup copy in step.
          </div>
        </div>
        <div>
          <label style={tinyLabel}>Filing</label>
          <select value={subfolder} onChange={(e) => setSubfolder(e.target.value)}
            style={Object.assign({}, selectStyle, { marginBottom: 8, padding: "6px 26px 6px 9px", fontSize: 11 })}>
            <option value="flat">Flat — straight into the folder</option>
            <option value="creator">Subfolder per creator</option>
            <option value="firstTag">Subfolder per first tag</option>
            <option value="date">Subfolder per month</option>
          </select>
          <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
            <Toggle small color="cyan" checked={skipDupes} onChange={setSkipDupes} label="Skip exact duplicates" />
            <Toggle small color="red" checked={moveSource} onChange={setMoveSource} label="Move source to _ingested/" />
          </div>
          {moveSource ? (
            <div style={{ fontSize: 10, color: "var(--accent-red)", marginTop: 6, lineHeight: 1.5 }}>
              This relocates the original out of the Inbox after a verified copy. The only operation in
              the app that removes a file from where you put it.
            </div>
          ) : null}
        </div>
      </div>

      {result ? (
        <div style={{
          marginBottom: 14, padding: 11, borderRadius: "var(--radius-sm)",
          background: acRgba(result.failed ? "red" : "green", 0.08),
          border: "1px solid " + acRgba(result.failed ? "red" : "green", 0.25),
        }}>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>
            {result.copied} copied · {result.skipped} already present · {result.moved} moved · {result.failed} failed
          </div>
          <div style={{ maxHeight: 140, overflowY: "auto" }}>
            {result.details.map((d, i) => (
              <div key={i} style={Object.assign({}, monoTiny, { color: d.ok ? "var(--text-muted)" : "var(--accent-red)", lineHeight: 1.7 })}>
                {d.ok ? "✓ " + d.file + " → " + d.wrote.join(", ") : "✗ " + d.file + " — " + d.err}
              </div>
            ))}
          </div>
        </div>
      ) : null}

      {plan ? (
        <Fragment>
          <div style={{ display: "flex", gap: 5, marginBottom: 8, flexWrap: "wrap", alignItems: "center" }}>
            {Object.keys(INGEST_STATUS_META).map((k) => counts[k] ? (
              <Pill key={k} color={INGEST_STATUS_META[k].color}>{INGEST_STATUS_META[k].label}: {counts[k]}</Pill>
            ) : null)}
            <span style={{ marginLeft: "auto", display: "flex", gap: 5 }}>
              <SmallBtn color="green" onClick={() => setPlan(plan.map((p) => Object.assign({}, p, { action: p.status === "broken" ? "skip" : "copy" })))}>select all</SmallBtn>
              <SmallBtn color="muted" onClick={() => setPlan(plan.map((p) => Object.assign({}, p, { action: "skip" })))}>select none</SmallBtn>
              <SmallBtn color="cyan" onClick={() => setPlan(plan.map((p) => Object.assign({}, p, { action: p.status === "new" || p.status === "version" ? "copy" : "skip" })))}>only new + versions</SmallBtn>
            </span>
          </div>
          <div style={{ border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-sm)", maxHeight: 320, overflowY: "auto" }}>
            {plan.map((p, i) => {
              const m = INGEST_STATUS_META[p.status];
              const on = p.action === "copy";
              return (
                <div key={p.rec.id} className="tagRow" onClick={() => setAction(i, on ? "skip" : "copy")}
                  style={{
                    display: "flex", alignItems: "center", gap: 8, padding: "5px 9px", cursor: "pointer",
                    borderBottom: "1px solid rgba(42,47,61,0.5)", opacity: on ? 1 : 0.5,
                  }}>
                  <span style={{ width: 12, color: on ? "var(--accent-green)" : "var(--text-muted)", fontSize: 11 }}>{on ? "✓" : "·"}</span>
                  <div style={{ width: 22, height: 30, flexShrink: 0 }}>
                    <Thumb id={p.rec.id} hasThumb={p.rec.hasThumb} radius={2} />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 11.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.rec.name}</div>
                    <div style={Object.assign({}, monoTiny, { color: "var(--text-muted)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" })}>
                      {p.rec.file}{p.subfolder.length ? "  →  " + p.subfolder.join("/") + "/" : ""}
                    </div>
                  </div>
                  <div style={{ width: 250, flexShrink: 0, fontSize: 10, color: "var(--text-muted)", lineHeight: 1.4 }}>{p.note}</div>
                  <Pill color={m.color}>{m.icon} {m.label}</Pill>
                </div>
              );
            })}
            {!plan.length ? <div style={{ padding: 10, fontSize: 11.5, color: "var(--text-muted)" }}>No cards found in the selected source folders.</div> : null}
          </div>
        </Fragment>
      ) : (
        <div style={{ fontSize: 11.5, color: "var(--text-muted)", lineHeight: 1.7 }}>
          Build the plan to see exactly what would be copied where — nothing is written until you confirm.
        </div>
      )}
    </Modal>
  );
}

function DupesModal({ dupes, roots, onClose, onSelectIds, onJumpTo, onDismiss, onRestore, onToast, onResolve, onCompare, externalKeepers }) {
  const [tab, setTab] = useState("exact");
  const [keepers, setKeepers] = useState(externalKeepers || {});
  useEffect(() => { if (externalKeepers) setKeepers((k) => Object.assign({}, k, externalKeepers)); }, [externalKeepers]);
  const rootName = (id) => (roots.find((r) => r.id === id) || {}).name || "?";
  const groups = tab === "exact" ? dupes.exact
    : tab === "content" ? dupes.content
    : tab === "versions" ? dupes.versions
    : dupes.dismissed;
  const isDismissedTab = tab === "dismissed";
  const kindOf = (g) => (g.kind === "version" ? "versions" : g.kind);

  const keeperOf = (g) => keepers[g.kind + g.key] || (defaultKeeper(g.items, roots) || {}).id;
  const setKeeper = (g, id) => setKeepers(Object.assign({}, keepers, { [g.kind + g.key]: id }));

  // What "trash/delete redundant" would actually touch on the current tab.
  const redundant = useMemo(() => {
    const out = [];
    for (const g of groups) {
      const keep = keeperOf(g);
      for (const it of g.items) {
        const rt = roots.find((x) => x.id === it.rootId);
        if (it.id !== keep && !(rt && isImportRoot(rt))) out.push(it);
      }
    }
    return out;
  }, [groups, keepers, roots]);
  const redundantCount = redundant.length;
  const redundantBytes = redundant.reduce((a, r) => a + r.size, 0);

  const exportCsv = () => {
    const rows = [["group_kind", "group_key", "name", "creator", "version", "folder", "path", "size", "spec", "modified"]];
    for (const kind of ["exact", "content", "versions", "dismissed"]) {
      for (const g of dupes[kind]) {
        for (const r of g.items) {
          rows.push([kind, g.key.slice(0, 16), r.name, r.creator, r.version, rootName(r.rootId), r.rel, r.size, r.spec, fmtDate(r.mtime)]);
        }
      }
    }
    const csv = rows.map((r) => r.map((c) => '"' + String(c === undefined ? "" : c).replace(/"/g, '""') + '"').join(",")).join("\n");
    downloadFile(csv, "vault-duplicates.csv", "text/csv");
  };

  const TAB_INFO = {
    exact:   { label: "Exact copies", n: dupes.exact.length, hint: "Byte-identical files. Safe to thin out — these are literally the same file in more than one place, which is exactly what an Archive folder is for." },
    content: { label: "Same content", n: dupes.content.length, hint: "Same name, description and greeting, but the files differ — usually a re-encoded PNG or a JSON/PNG pair of the same card." },
    versions:{ label: "Version drift", n: dupes.versions.length, hint: "Same character and creator, different content. One of these is probably a newer edit of the other — but this is also where false positives live, since two unrelated cards can share a name. Mark those as not duplicates and they'll stay out of the way." },
    dismissed:{ label: "Not duplicates", n: dupes.dismissed.length, hint: "Groups you've marked as false positives. They no longer count as duplicates anywhere in the vault. Restore one if you change your mind." },
  };

  return (
    <Modal title="Duplicates & versions" icon={"⧉"} width={900} onClose={onClose}
      subtitle={fmtNum(dupes.exact.length) + " exact · " + fmtNum(dupes.content.length) + " same-content · " +
        fmtNum(dupes.versions.length) + " version groups · " + fmtBytes(dupes.wastedBytes) + " in redundant exact copies" +
        (dupes.excludedCount ? " · " + fmtNum(dupes.excludedCount) + " cards ignored (trash & backups)" : "")}
      footer={
        <Fragment>
          <SmallBtn color="cyan" onClick={exportCsv}>Export CSV</SmallBtn>
          <SmallBtn color="muted" onClick={() => {
            const ids = [];
            for (const g of groups) for (const r of g.items) ids.push(r.id);
            onSelectIds(ids); onClose();
          }} disabled={!groups.length}>Select in grid</SmallBtn>
          {!isDismissedTab ? (
            <Fragment>
              <SmallBtn color="warm" disabled={!groups.length}
                title={"Keep one copy of each card, relocate the rest to your trash folder"}
                onClick={() => { onResolve(groups, "trash", keepers); onClose(); }}>
                {"\u{1F5D1} Trash redundant (" + redundantCount + ")"}
              </SmallBtn>
              <SmallBtn color="red" disabled={!groups.length}
                title={"Keep one copy of each card, permanently delete the rest"}
                onClick={() => { onResolve(groups, "delete", keepers); onClose(); }}>
                {"✕ Delete redundant (" + fmtBytes(redundantBytes) + ")"}
              </SmallBtn>
            </Fragment>
          ) : null}
          <span style={{ marginLeft: "auto", fontSize: 10, color: "var(--text-muted)", maxWidth: 220, lineHeight: 1.4 }}>
            {isDismissedTab
              ? "Restore a group to have it counted again."
              : "One copy of every card always survives — the one marked KEEP."}
          </span>
        </Fragment>
      }>
      <div style={{ display: "flex", gap: 5, marginBottom: 12, flexWrap: "wrap" }}>
        {["exact", "content", "versions", "dismissed"].map((k) => (
          <SmallBtn key={k} color={k === "versions" ? "warm" : k === "content" ? "blue" : k === "dismissed" ? "green" : "red"}
            active={tab === k} onClick={() => setTab(k)}>
            {TAB_INFO[k].label} ({TAB_INFO[k].n})
          </SmallBtn>
        ))}
      </div>
      <div style={{ fontSize: 11, color: "var(--text-muted)", lineHeight: 1.65, marginBottom: 12 }}>{TAB_INFO[tab].hint}</div>

      {!groups.length ? (
        <div style={{ fontSize: 12, color: "var(--text-muted)" }}>
          {isDismissedTab ? "You haven't marked anything as a false positive yet." : "Nothing in this category."}
        </div>
      ) : null}

      {groups.slice(0, 200).map((g) => (
        <div key={g.kind + g.key} style={{
          marginBottom: 8, padding: 9, background: "var(--bg-tertiary)",
          borderRadius: "var(--radius-sm)",
          border: "1px solid " + (isDismissedTab ? acRgba("green", 0.28) : "var(--border-subtle)"),
          opacity: isDismissedTab ? 0.85 : 1,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
            <div style={{ width: 24, height: 32, flexShrink: 0 }}>
              <Thumb id={g.items[0].id} hasThumb={g.items[0].hasThumb} radius={2} />
            </div>
            <span style={{ fontSize: 12.5, fontWeight: 500 }}>{g.items[0].name}</span>
            <Pill color="muted">{g.items.length} files</Pill>
            {g.items[0].creator ? <Pill color="blue">@{g.items[0].creator}</Pill> : null}
            {isDismissedTab ? <Pill color="green">{TAB_INFO[kindOf(g)] ? TAB_INFO[kindOf(g)].label : g.kind}</Pill> : null}
            <span style={{ marginLeft: "auto", display: "flex", gap: 5 }}>
              {g.items.length > 1 ? (
                <SmallBtn color="cyan" onClick={() => onCompare(g)} title="See exactly how these copies differ">
                  ⧉ compare
                </SmallBtn>
              ) : null}
              {isDismissedTab ? (
                <SmallBtn color="warm" onClick={() => { onRestore(kindOf(g), g.key); onToast && onToast("Restored — counted as a duplicate again", "warm"); }}>
                  treat as duplicate again
                </SmallBtn>
              ) : (
                <SmallBtn color="green" title="These are different cards — stop flagging them"
                  onClick={() => { onDismiss(kindOf(g), g.key); onToast && onToast("Marked as not duplicates — " + g.items[0].name, "green"); }}>
                  ✓ not duplicates
                </SmallBtn>
              )}
            </span>
          </div>
          {g.items.slice().sort((a, b) => b.mtime - a.mtime).map((r, i) => {
            const keep = keeperOf(g) === r.id;
            const rt = roots.find((x) => x.id === r.rootId);
            const ro = rt && isImportRoot(rt);
            return (
              <div key={r.id} className="tagRow"
                style={{
                  display: "flex", alignItems: "center", gap: 8, padding: "3px 6px",
                  borderRadius: 3, fontSize: 11,
                  background: keep ? acRgba("green", 0.1) : "transparent",
                }}>
                {!isDismissedTab ? (
                  <span onClick={() => setKeeper(g, r.id)} title="Keep this copy; the others are what gets trashed or deleted"
                    style={{
                      cursor: "pointer", width: 40, flexShrink: 0, textAlign: "center",
                      fontSize: 9, fontFamily: "'JetBrains Mono', monospace", letterSpacing: "0.04em",
                      padding: "1px 0", borderRadius: 3,
                      border: "1px solid " + (keep ? acRgba("green", 0.5) : "var(--border-subtle)"),
                      background: keep ? acRgba("green", 0.22) : "transparent",
                      color: keep ? "var(--accent-green)" : "var(--text-muted)",
                    }}>{keep ? "KEEP" : "keep"}</span>
                ) : null}
                {ro ? <Pill color="cyan" title="Read-only import — never touched">RO</Pill> : null}
                <Pill color={i === 0 ? "green" : "muted"}>{i === 0 ? "newest" : "#" + (i + 1)}</Pill>
                <span onClick={() => { onJumpTo(r.id); onClose(); }}
                  style={Object.assign({}, monoTiny, {
                    flex: 1, color: "var(--text-secondary)", overflow: "hidden", cursor: "pointer",
                    textOverflow: "ellipsis", whiteSpace: "nowrap",
                  })}>{rootName(r.rootId)} / {r.rel}</span>
                {r.version ? <Pill color="warm">v{r.version}</Pill> : null}
                <Pill color="muted">{fmtBytes(r.size)}</Pill>
                <Pill color="muted">{fmtDateShort(r.mtime)}</Pill>
              </div>
            );
          })}
          {!isDismissedTab && g.items.length > 1 ? (
            <div style={{ display: "flex", gap: 5, marginTop: 6, justifyContent: "flex-end" }}>
              <SmallBtn color="warm" onClick={() => onResolve([g], "trash", keepers)}>
                trash the other {g.items.length - 1}
              </SmallBtn>
              <SmallBtn color="red" onClick={() => onResolve([g], "delete", keepers)}>
                delete the other {g.items.length - 1}
              </SmallBtn>
            </div>
          ) : null}
        </div>
      ))}
      {groups.length > 200 ? (
        <div style={{ fontSize: 11, color: "var(--text-muted)" }}>…{fmtNum(groups.length - 200)} more groups. Export the CSV for the full list.</div>
      ) : null}
    </Modal>
  );
}

/** Renders one side of a diff: deletions on the left, additions on the right. */
function DiffText({ parts, side }) {
  if (!parts || !parts.length) return <span style={{ color: "var(--text-muted)" }}>(empty)</span>;
  return (
    <Fragment>
      {parts.map((p, i) => {
        if (p.t === "same") return <span key={i}>{p.text}</span>;
        if (side === "a" && p.t === "add") return null;
        if (side === "b" && p.t === "del") return null;
        const isDel = p.t === "del";
        return (
          <span key={i} style={{
            background: acRgba(isDel ? "red" : "green", 0.22),
            color: ac(isDel ? "red" : "green"),
            borderRadius: 2, padding: "0 1px",
            textDecoration: isDel ? "line-through" : "none",
          }}>{p.text}</span>
        );
      })}
    </Fragment>
  );
}

/** Side-by-side comparison of two cards from a duplicate group. */
function CompareModal({ group, roots, onClose, onJumpTo, onSetKeeper, onTrash, onToast }) {
  const items = group.items;
  const [aId, setAId] = useState(items[0].id);
  const [bId, setBId] = useState((items[1] || items[0]).id);
  const [bodies, setBodies] = useState({});
  const [loading, setLoading] = useState(true);
  const [onlyDiffs, setOnlyDiffs] = useState(true);

  useEffect(() => {
    let dead = false;
    setLoading(true);
    Promise.all(items.map((r) => dbGet(STORE_BODIES, r.id).then((b) => [r.id, b])))
      .then((pairs) => {
        if (dead) return;
        const m = {};
        for (const [id, b] of pairs) m[id] = b || null;
        setBodies(m); setLoading(false);
      });
    return () => { dead = true; };
  }, [group.key]);

  const recA = items.find((r) => r.id === aId) || items[0];
  const recB = items.find((r) => r.id === bId) || items[0];
  const bodyA = bodies[aId], bodyB = bodies[bId];
  const rootName = (id) => (roots.find((r) => r.id === id) || {}).name || "?";

  const deltas = useMemo(() => cardFieldDeltas(bodyA, bodyB), [bodyA, bodyB]);
  const diffCount = deltas.filter((d) => !d.same).length;

  const tagsA = (bodyA && bodyA.tags) || [], tagsB = (bodyB && bodyB.tags) || [];
  const setA = new Set(tagsA.map(normTagName)), setB = new Set(tagsB.map(normTagName));
  const onlyA = tagsA.filter((t) => !setB.has(normTagName(t)));
  const onlyB = tagsB.filter((t) => !setA.has(normTagName(t)));

  const overall = useMemo(() => {
    if (!bodyA || !bodyB) return 0;
    const fields = ["description", "personality", "scenario", "first_mes"];
    let tot = 0;
    for (const f of fields) tot += similarity(bodyA[f], bodyB[f]);
    return tot / fields.length;
  }, [bodyA, bodyB]);

  const Picker = ({ value, onChange, label, color }) => (
    <div style={{ flex: 1, minWidth: 0 }}>
      <label style={tinyLabel}>{label}</label>
      <select value={value} onChange={(e) => onChange(e.target.value)}
        style={Object.assign({}, selectStyle, { borderColor: acRgba(color, 0.4) })}>
        {items.map((r) => (
          <option key={r.id} value={r.id}>{rootName(r.rootId)} / {r.rel}</option>
        ))}
      </select>
    </div>
  );

  const Meta = ({ rec, body, color }) => (
    <div style={{ fontSize: 10.5, color: "var(--text-muted)", lineHeight: 1.7, marginTop: 6 }}>
      <div><Pill color={color}>{rec.spec}</Pill>{" "}
        {fmtBytes(rec.size)} · {fmtDateShort(rec.mtime)}{rec.version ? " · v" + rec.version : ""}</div>
      <div>{fmtTokens(rec.tokensCore)} permanent · {rec.loreCount} lore · {rec.altCount} alt greetings
        {body && body.creator ? " · @" + body.creator : ""}</div>
    </div>
  );

  return (
    <Modal title="Compare copies" icon={"⧉"} width={1080} onClose={onClose}
      subtitle={items[0].name + " — " + items.length + " copies, " + (loading ? "loading…" : diffCount + " field(s) differ")}
      footer={
        <Fragment>
          <SmallBtn color="green" onClick={() => { onSetKeeper(group, aId); onToast && onToast("Keeping the left copy", "green"); }}>
            ← Keep left
          </SmallBtn>
          <SmallBtn color="green" onClick={() => { onSetKeeper(group, bId); onToast && onToast("Keeping the right copy", "green"); }}>
            Keep right →
          </SmallBtn>
          <span style={{ width: 1, height: 18, background: "var(--border-subtle)", margin: "0 4px" }} />
          <SmallBtn color="warm" onClick={() => { onTrash([aId]); onClose(); }}>Trash left</SmallBtn>
          <SmallBtn color="warm" onClick={() => { onTrash([bId]); onClose(); }}>Trash right</SmallBtn>
          <span style={{ marginLeft: "auto", display: "flex", gap: 6, alignItems: "center" }}>
            <Toggle small color="cyan" checked={onlyDiffs} onChange={setOnlyDiffs} label="Only differences" />
            <SmallBtn color="muted" onClick={() => { onJumpTo(aId); onClose(); }}>Open left</SmallBtn>
            <SmallBtn color="muted" onClick={() => { onJumpTo(bId); onClose(); }}>Open right</SmallBtn>
          </span>
        </Fragment>
      }>

      <div style={{ display: "flex", gap: 12, marginBottom: 12 }}>
        <Picker value={aId} onChange={setAId} label="Left copy" color="red" />
        <Picker value={bId} onChange={setBId} label="Right copy" color="green" />
      </div>

      <div style={{ display: "flex", gap: 12, marginBottom: 14 }}>
        <div style={{ flex: 1, display: "flex", gap: 8 }}>
          <div style={{ width: 46, height: 62, flexShrink: 0, borderRadius: 3, overflow: "hidden" }}>
            <Thumb id={recA.id} hasThumb={recA.hasThumb} />
          </div>
          <div style={{ minWidth: 0 }}><Meta rec={recA} body={bodyA} color="red" /></div>
        </div>
        <div style={{ flex: 1, display: "flex", gap: 8 }}>
          <div style={{ width: 46, height: 62, flexShrink: 0, borderRadius: 3, overflow: "hidden" }}>
            <Thumb id={recB.id} hasThumb={recB.hasThumb} />
          </div>
          <div style={{ minWidth: 0 }}><Meta rec={recB} body={bodyB} color="green" /></div>
        </div>
      </div>

      {aId === bId ? (
        <div style={{ fontSize: 12, color: "var(--accent-warm)", marginBottom: 12 }}>
          Both sides are the same file — pick a different copy on one side.
        </div>
      ) : null}

      <div style={{
        display: "flex", gap: 10, alignItems: "center", marginBottom: 14, padding: 10,
        background: "var(--bg-tertiary)", borderRadius: "var(--radius-sm)", border: "1px solid var(--border-subtle)",
      }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 10, color: "var(--text-muted)", marginBottom: 4 }}>
            Prose similarity across description, personality, scenario and first message
          </div>
          <div style={{ height: 5, background: "var(--border-subtle)", borderRadius: 3, overflow: "hidden" }}>
            <div style={{
              height: "100%", width: Math.round(overall * 100) + "%",
              background: overall > 0.95 ? "var(--accent-green)" : overall > 0.6 ? "var(--accent-warm)" : "var(--accent-red)",
            }} />
          </div>
        </div>
        <span style={Object.assign({}, monoTiny, { color: "var(--text-secondary)" })}>{Math.round(overall * 100)}%</span>
        <Pill color={recA.size === recB.size ? "muted" : "warm"}>
          {recA.size === recB.size ? "same size" : (recB.size > recA.size ? "+" : "") + fmtBytes(Math.abs(recB.size - recA.size)) + " right"}
        </Pill>
        <Pill color={recA.mtime === recB.mtime ? "muted" : "blue"}>
          {recA.mtime === recB.mtime ? "same date" : (recB.mtime > recA.mtime ? "right is newer" : "left is newer")}
        </Pill>
      </div>

      {onlyA.length || onlyB.length ? (
        <div style={{ marginBottom: 14 }}>
          <label style={tinyLabel}>Tag differences</label>
          <div style={{ display: "flex", gap: 14 }}>
            <div style={{ flex: 1 }}>
              {onlyA.length ? onlyA.map((t, i) => <Pill key={i} color="red" style={{ marginRight: 4 }}>− {t}</Pill>)
                : <span style={{ fontSize: 11, color: "var(--text-muted)" }}>nothing unique</span>}
            </div>
            <div style={{ flex: 1 }}>
              {onlyB.length ? onlyB.map((t, i) => <Pill key={i} color="green" style={{ marginRight: 4 }}>+ {t}</Pill>)
                : <span style={{ fontSize: 11, color: "var(--text-muted)" }}>nothing unique</span>}
            </div>
          </div>
        </div>
      ) : null}

      {loading ? <div style={{ fontSize: 12, color: "var(--text-muted)" }}>Loading both cards…</div> : null}
      {!loading && (!bodyA || !bodyB) ? (
        <div style={{ fontSize: 12, color: "var(--accent-red)" }}>
          One of these has no cached card data — rescan the folder and try again.
        </div>
      ) : null}

      {!loading && bodyA && bodyB ? deltas.map((d) => {
        if (onlyDiffs && d.same) return null;
        const diff = d.same ? null : diffText(d.a, d.b);
        return (
          <div key={d.key} style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
              <label style={Object.assign({}, tinyLabel, { marginBottom: 0 })}>{d.label}</label>
              {d.same
                ? <Pill color="muted">identical</Pill>
                : <Pill color="warm">differs</Pill>}
              {!d.same ? (
                <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)" })}>
                  {fmtNum(d.a.length)} vs {fmtNum(d.b.length)} chars
                </span>
              ) : null}
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              {["a", "b"].map((side) => (
                <div key={side} style={{
                  flex: 1, minWidth: 0, fontSize: 11.5, lineHeight: 1.6,
                  whiteSpace: "pre-wrap", wordBreak: "break-word",
                  background: "var(--bg-input)", padding: 9, borderRadius: "var(--radius-sm)",
                  border: "1px solid " + (d.same ? "var(--border-subtle)" : acRgba(side === "a" ? "red" : "green", 0.28)),
                  maxHeight: 260, overflowY: "auto", color: "var(--text-secondary)",
                }}>
                  {d.same
                    ? (d.a || <span style={{ color: "var(--text-muted)" }}>(empty)</span>)
                    : <DiffText parts={diff.parts} side={side} />}
                </div>
              ))}
            </div>
          </div>
        );
      }) : null}

      {!loading && bodyA && bodyB && onlyDiffs && diffCount === 0 ? (
        <div style={{ fontSize: 12, color: "var(--accent-green)", lineHeight: 1.7 }}>
          Every compared field is identical — these really are the same card. The files may still differ
          in image data or encoding, which is what puts them in the “same content” group rather than
          “exact copies”.
        </div>
      ) : null}
    </Modal>
  );
}

function BulkTagModal({ count, tagIndex, onClose, onApply }) {
  const [add, setAdd] = useState([]);
  const [remove, setRemove] = useState([]);
  return (
    <Modal title={"Tag " + fmtNum(count) + " selected card" + (count === 1 ? "" : "s")} icon={"\u{1F3F7}"} width={560} onClose={onClose} footerClose={false}
      subtitle="Applied to the vault's copy of each card's tag list. Files on disk are untouched."
      footer={
        <Fragment>
          <SmallBtn color="warm" disabled={!add.length && !remove.length} onClick={() => { onApply(add, remove); onClose(); }}>
            Apply to {fmtNum(count)}
          </SmallBtn>
          <SmallBtn color="muted" onClick={onClose}>Cancel</SmallBtn>
        </Fragment>
      }>
      <Field label="Add these tags">
        <TagEditor tags={add} baseTags={[]} tagIndex={tagIndex} onChange={setAdd} />
      </Field>
      <Field label="Remove these tags">
        <TagEditor tags={remove} baseTags={remove} tagIndex={tagIndex} onChange={setRemove} />
      </Field>
    </Modal>
  );
}

/** Small chip showing a flag and its reason. */
function FlagChip({ flag, onClick, onRemove, small, more, open, wrap, title }) {
  const d = flagDef(flag.key);
  return (
    <span onClick={onClick} title={title || flag.note || d.label}
      style={{
        display: "inline-flex", alignItems: wrap ? "flex-start" : "center", gap: 5, maxWidth: "100%",
        fontSize: small ? 10 : 11, padding: small ? "1px 5px" : "3px 7px", borderRadius: 3,
        background: acRgba(d.color, 0.14), border: "1px solid " + acRgba(d.color, 0.35),
        color: ac(d.color), cursor: onClick ? "pointer" : "default",
      }}>
      <span style={{ flexShrink: 0 }}>{d.icon}</span>
      <span style={wrap ? { whiteSpace: "pre-wrap", wordBreak: "break-word", lineHeight: 1.45 } : { overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
        {wrap ? (flag.note || d.label) : d.label + (flag.note ? ": " + flag.note : "")}
      </span>
      {more ? (
        <span className="flag-more" style={{
          flexShrink: 0, fontFamily: "'JetBrains Mono', monospace", fontSize: 10, padding: "0 4px", borderRadius: 3,
          background: acRgba(d.color, 0.28),
        }}>{(open ? "▾ " : "") + "+" + more}</span>
      ) : null}
      {onRemove ? (
        <span onClick={(e) => { e.stopPropagation(); onRemove(); }}
          style={{ cursor: "pointer", opacity: 0.7, fontSize: 12, flexShrink: 0 }}>×</span>
      ) : null}
    </span>
  );
}

/**
 * A card's flags, one chip per kind. A kind with several flags shows the
 * first with "+N"; clicking it lists them all, each with its whole note,
 * to edit or remove one by one.
 */
function FlagGroups({ flags, onEdit, onRemove }) {
  const [open, setOpen] = useState({});
  const groups = flagGroups(flags);
  if (!groups.length) return <span style={{ fontSize: 11, color: "var(--text-muted)" }}>None.</span>;
  const shown = groups.filter((g) => g.items.length > 1 && open[g.key]);
  return (
    <div className="flag-groups" style={{ display: "flex", flexDirection: "column", gap: 6, width: "100%" }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
        {groups.map((g) => {
          const first = g.items[0];
          if (g.items.length === 1) {
            return <FlagChip key={g.key} flag={first.flag} onClick={() => onEdit(first.index)} onRemove={() => onRemove(first.index)} />;
          }
          const isOpen = !!open[g.key];
          return (
            <FlagChip key={g.key} flag={first.flag} more={g.items.length - 1} open={isOpen}
              title={(isOpen ? "Hide" : "Show") + " all " + g.items.length + " " + flagDef(g.key).label + " flags"}
              onClick={() => setOpen((o) => Object.assign({}, o, { [g.key]: !o[g.key] }))} />
          );
        })}
      </div>
      {shown.map((g) => (
        <div key={g.key} className="flag-group-open" style={{
          display: "flex", flexDirection: "column", gap: 4, padding: "6px 8px", borderRadius: "var(--radius-sm)",
          border: "1px solid " + acRgba(flagDef(g.key).color, 0.3), background: acRgba(flagDef(g.key).color, 0.05),
        }}>
          <div style={{ fontSize: 10.5, color: ac(flagDef(g.key).color), letterSpacing: 0.3 }}>
            {flagDef(g.key).icon} {flagDef(g.key).label} · {g.items.length}
          </div>
          {g.items.map((it) => (
            <FlagChip key={it.index} flag={it.flag} wrap title="Edit this flag"
              onClick={() => onEdit(it.index)} onRemove={() => onRemove(it.index)} />
          ))}
        </div>
      ))}
    </div>
  );
}

/** Pick a flag and give a reason. */

/* ── AI harness settings ──────────────────────────────────────────────────
   Separate from the main Settings modal: this one has to explain a trust
   boundary, not just flip switches.

   - The API key is typed here and posted straight to the local server, which
     keeps it in memory. It never enters `aiSettings`, so it never reaches
     IndexedDB; restarting the launcher forgets it by design.
   - The endpoint is saved first and then tested, so "Test" always tests what
     requests will actually use.
   ─────────────────────────────────────────────────────────────────────── */

/**
 * A bounded number field. Holds what's typed until blur or Enter, then clamps
 * it — clamping on every keystroke turns "1" into the minimum before you can
 * type "1024". Declared at module scope so React keeps the same input.
 */
function AiNumBox({ label, value, spec, step, onChange, hint, suffix }) {
  const [draft, setDraft] = useState(String(value));
  useEffect(() => { setDraft(String(value)); }, [value]);
  const commit = () => {
    const v = clampAi(draft, spec, value);
    setDraft(String(v));
    if (v !== value) onChange(v);
  };
  return (
    <div>
      <label style={tinyLabel}>{label}</label>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <input type="number" value={draft} min={spec.min} max={spec.max} step={step || 1}
          onChange={(e) => setDraft(e.target.value)} onBlur={commit}
          onKeyDown={(e) => { if (e.key === "Enter") commit(); }}
          style={Object.assign({}, inputBase, { padding: "7px 9px", flex: 1, minWidth: 0, width: "auto" })} />
        {suffix ? (
          <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)", flexShrink: 0, whiteSpace: "nowrap" })}>{suffix}</span>
        ) : null}
      </div>
      {hint ? <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 4, lineHeight: 1.5 }}>{hint}</div> : null}
    </div>
  );
}

/** Everything sent to an AI this session, each request openable to read exactly what went. */
function AiSentLog() {
  const [, setTick] = useState(0);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const fn = () => setTick((n) => n + 1);
    aiSentListeners.add(fn);
    return () => { aiSentListeners.delete(fn); };
  }, []);
  return (
    <div className="ai-sent-log" style={{ marginTop: 12 }}>
      <SmallBtn color="cyan" onClick={() => setOpen(!open)}>
        {(open ? "▾ " : "▸ ") + "What was sent this session (" + AI_SENT_LOG.length + ")"}
      </SmallBtn>
      {open ? (
        <div style={{ marginTop: 8, maxHeight: 360, overflow: "auto", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-sm)", padding: 8 }}>
          {AI_SENT_LOG.length ? null : <div style={{ fontSize: 11, color: "var(--text-muted)" }}>Nothing yet. Each request to the AI shows up here, word for word.</div>}
          {AI_SENT_LOG.map((e, i) => (
            <details key={e.at + ":" + i} className="ai-sent-entry" style={{ marginBottom: 6 }}>
              <summary style={{ cursor: "pointer", fontSize: 11, color: "var(--text-secondary)" }}>
                {new Date(e.at).toLocaleTimeString()} · {e.source} · ~{fmtNum(Math.ceil(e.chars / 4))}t{e.tools ? " · " + e.tools + " tools described" : ""}
              </summary>
              {e.messages.map((m, j) => (
                <div key={j} style={{ margin: "6px 0 0 12px" }}>
                  <div style={{ fontSize: 10, color: "var(--accent-cyan)", fontFamily: "'JetBrains Mono', monospace" }}>{m.role}</div>
                  <pre style={{ whiteSpace: "pre-wrap", wordBreak: "break-word", fontSize: 10.5, margin: "2px 0 0", color: "var(--text-secondary)", fontFamily: "'JetBrains Mono', monospace" }}>{m.text}</pre>
                </div>
              ))}

          ))}
        </div>
      ) : null}
      <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 4 }}>Kept only while this page is open.</div>
    </div>
  );
}

function AiSettingsModal({ ai, onSave, relay, onSaveEndpoint, onSavePrivacy, onTest, onForgetKey, onRefreshRelay, onClose, onToast, knownTagCount }) {
  const [baseUrl, setBaseUrl] = useState(ai.baseUrl || "");
  const [model, setModel] = useState(ai.model || "");
  const [apiKey, setApiKey] = useState("");
  const [keyTouched, setKeyTouched] = useState(false);
  const [testing, setTesting] = useState(false);
  const [result, setResult] = useState(null);       // { ok, error?, models?, via? }
  const [promptKey, setPromptKey] = useState(AI_ACTIONS[0].key);

  const cleanBase = normalizeAiBase(baseUrl);
  const relayUsable = relay.available && !relay.needsUpgrade && !relayIsStale(relay);
  const problems = aiSettingsProblems(ai, relay);
  const action = aiActionDef(promptKey, ai) || AI_ACTIONS[0];
  const customs = ai.customPrompts || [];
  const cur = action.custom ? customs.filter((c) => c.id === action.id)[0] : null;   // the custom prompt being edited
  const tpl = cur ? cur.template : (ai.prompts[action.key] || "");
  const saveCustom = (patch) => onSave({ customPrompts: customs.map((c) => (c.id === cur.id ? Object.assign({}, c, patch) : c)) });
  const addCustom = () => {
    const id = "p" + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
    onSave({ customPrompts: customs.concat([{ id, label: "New prompt", icon: "✎", color: "cyan", template: "",
      bulk: false, allFields: true, fields: [], agentVisible: false }]) });
    setPromptKey("c:" + id);
  };
  const removeCustom = () => {
    if (!window.confirm("Delete the prompt \"" + action.label + "\"? Its saved answers stay on the cards until you clear them.")) return;
    onSave({ customPrompts: customs.filter((c) => c.id !== cur.id) });
    setPromptKey(AI_ACTIONS[0].key);
  };
  const rendered = renderPromptTemplate(tpl, {});
  const originChanges = !!ai.baseUrl && !!cleanBase && originOfUrl(cleanBase) !== originOfUrl(ai.baseUrl);

  // The address, model and key save themselves when you leave the field or
  // press Enter, and a preset saves when picked. Saves run one at a time and
  // each reads the fields as they are when it starts, so leaving the key field
  // by clicking Test can't send stale values or send the key twice.
  const live = useRef(null);
  live.current = { baseUrl, model, apiKey, keyTouched };
  const saved = useRef({ baseUrl: ai.baseUrl, model: ai.model });
  useEffect(() => { saved.current = { baseUrl: ai.baseUrl, model: ai.model }; }, [ai.baseUrl, ai.model]);
  const saveQueue = useRef(Promise.resolve());

  const commitEndpoint = (over) => {
    const run = async () => {
      const cur = Object.assign({}, live.current, over || {});
      const base = normalizeAiBase(cur.baseUrl);
      const m = String(cur.model || "").trim();
      // An emptied key field means "keep the key": forgetting it is its own button.
      const sendKey = cur.keyTouched && !!cur.apiKey;
      const doneWithKey = () => {
        // Typed on while the save ran: that's a new key, left for the next save.
        if (!cur.keyTouched || live.current.apiKey !== cur.apiKey) return;
        live.current = Object.assign({}, live.current, { apiKey: "", keyTouched: false });
        setApiKey(""); setKeyTouched(false);
      };
      if (!base) return;
      if (base === saved.current.baseUrl && m === saved.current.model && !sendKey) { doneWithKey(); return; }
      const fields = { baseUrl: base, model: m };
      if (sendKey) fields.apiKey = cur.apiKey;
      await onSaveEndpoint(fields);
      saved.current = { baseUrl: base, model: m };
      setBaseUrl((v) => (v === cur.baseUrl ? base : v));
      doneWithKey();
    };
    const p = saveQueue.current.then(run);
    saveQueue.current = p.catch(() => {});
    return p;
  };

  const autosave = (over) => { commitEndpoint(over).catch((e) => setResult({ ok: false, error: e.message })); };
  const saveOnEnter = (e) => { if (e.key === "Enter") autosave(); };

  const testConnection = async () => {
    setTesting(true);
    setResult(null);
    try {
      await commitEndpoint();
    } catch (e) {
      setResult({ ok: false, error: e.message });
      setTesting(false);
      return;
    }
    const r = await onTest();
    setResult(r);
    if (r.ok) {
      if (!live.current.model.trim() && r.models && r.models.length === 1) {
        setModel(r.models[0]);
        try { await commitEndpoint({ model: r.models[0] }); } catch (e) { /* shown below */ }
      }
      onToast("Endpoint reachable" + (r.models && r.models.length ? " · " + r.models.length + " model(s)" : ""), "green");
    }
    setTesting(false);
  };

  const pickModel = (m) => {
    setModel(m);
    autosave({ model: m });
  };

  const relayNote =
    relay.available === null ? { color: "muted", text: "Checking for the local server…" }
    : relay.available === false ? { color: "red", text: "The local server isn't answering. The vault has to be opened through \"Start RP Card Vault.bat\", not straight from the file. Nothing can be sent until then." }
    : relay.needsUpgrade ? { color: "warm", text: "The server hosting this page is an older serve.js with no AI relay. Copy the new serve.js next to the page and run \"Start RP Card Vault.bat\"." }
    : relayIsStale(relay) ? { color: "warm", text: "The server answering is serve.js build " + (relay.build || 0) + "; this page needs build " + EXPECTED_RELAY_BUILD + ". An older copy is still running in the background. Run \"Start RP Card Vault.bat\" — it stops the old one and starts the current one." }
    : { color: relay.hasKey ? "green" : "cyan",
        text: "Local server build " + relay.build + " ready" + (relay.baseUrl ? " · " + relay.baseUrl : " · no endpoint saved yet") +
          (relay.hasKey ? " · an API key is held in its memory." : " · no API key held (local endpoints usually don't need one).") };

  const divider = <div style={{ height: 1, background: "var(--border-subtle)", margin: "16px 0" }} />;

  return (
    <Modal title="AI harness" icon={"✦"} width={720} onClose={onClose}
      subtitle="Any OpenAI-compatible endpoint, relayed by the local server">
      <div style={{
        padding: 10, marginBottom: 14, borderRadius: "var(--radius-sm)",
        background: acRgba(relayNote.color, 0.08), border: "1px solid " + acRgba(relayNote.color, 0.3),
        display: "flex", alignItems: "flex-start", gap: 9,
      }}>
        <div style={{ flex: 1, fontSize: 11.5, lineHeight: 1.65, color: "var(--text-secondary)" }}>{relayNote.text}</div>
        <SmallBtn color="muted" onClick={onRefreshRelay}>Recheck</SmallBtn>
      </div>

      <Toggle color="green" checked={!!ai.enabled} onChange={(v) => onSave({ enabled: v })} label="Enable the AI harness" />
      <div style={{ fontSize: 11, color: "var(--text-muted)", lineHeight: 1.7, margin: "7px 0 0 42px" }}>
        Off hides every AI action. Card text only leaves this machine if the endpoint below is a remote one.
      </div>

      <div className="ai-privacy-opts" style={{ marginTop: 12 }}>
        <Toggle small color="green" checked={!!ai.localOnly} onChange={(v) => onSavePrivacy && onSavePrivacy({ localOnly: v })}
          label="Local models only" />
        <div style={{ fontSize: 10.5, color: "var(--text-muted)", lineHeight: 1.6, margin: "4px 0 10px 36px" }}>
          Refuse any AI address that isn't on this computer, so card text can't leave it. The local server checks this too.
        </div>
        <Toggle small color="green" checked={ai.noTrain !== false} onChange={(v) => onSavePrivacy && onSavePrivacy({ noTrain: v })}
          label="Ask OpenRouter not to log or train on what's sent" />
        <div style={{ fontSize: 10.5, color: "var(--text-muted)", lineHeight: 1.6, margin: "4px 0 0 36px" }}>
          With OpenRouter, requests go only to providers that say they don't keep or train on prompts (fewer models may be
          available). Other services have their own policies: check them, or use a local model for anything sensitive.
        </div>
        <AiSentLog />
      </div>

      {divider}

      <label style={tinyLabel}>Endpoint</label>
      <div style={{ fontSize: 11, color: "var(--text-muted)", lineHeight: 1.7, marginBottom: 10 }}>
        Anything that speaks <code style={{ fontFamily: "'JetBrains Mono', monospace" }}>/chat/completions</code>:
        OpenAI, OpenRouter, Ollama, KoboldCpp, LM Studio, llama.cpp. The local server makes the request, which is
        what lets this page reach a local model server at all.{" "}
        <strong style={{ color: "var(--accent-green)" }}>The API key is never stored</strong> — it's held in the
        server's memory and forgotten when the launcher window closes.
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "200px 1fr", gap: 8, marginBottom: 8 }}>
        <div>
          <label style={tinyLabel}>Preset</label>
          <select value={AI_ENDPOINT_PRESETS.some((p) => p.url === cleanBase) ? cleanBase : ""}
            onChange={(e) => { const v = e.target.value; if (v) { setBaseUrl(v); setResult(null); autosave({ baseUrl: v }); } }} style={selectStyle}>
            <option value="">{cleanBase ? "Custom" : "Pick one…"}</option>

          <input value={baseUrl} onChange={(e) => { setBaseUrl(e.target.value); setResult(null); }}

            placeholder="http://127.0.0.1:11434/v1" style={inputBase} spellCheck={false} />
          <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 4, lineHeight: 1.55 }}>

/** One destination's settings: name, kind-specific fields, sign-in, default. */
function DestinationRow({ dest, isDefault, status, folderOptions, onChange, onRemove, onMakeDefault, onConnect, onDisconnect }) {
  const kind = DEST_KINDS[dest.type];
  const [secret, setSecret] = useState("");
  const [busy, setBusy] = useState(false);
  const connected = !!(status && status.byId && status.byId[dest.id]);
  const set = (patch) => onChange(Object.assign({}, dest, patch));
  const field = (label, value, key, placeholder, extra) => (
    <div style={Object.assign({ minWidth: 0 }, extra || {})}>
      <label style={tinyLabel}>{label}</label>
      <input value={value || ""} placeholder={placeholder || ""} onChange={(e) => set({ [key]: e.target.value })}
        disabled={connected} style={Object.assign({}, inputBase, { padding: "5px 8px", fontSize: 11.5 })} />
    </div>
  );
  const connect = async () => {
    setBusy(true);
    const ok = await onConnect(dest, dest.type === "http" ? { token: secret } : { password: secret });
    if (ok) setSecret("");
    setBusy(false);
  };
  return (
    <div className="dest-row" style={{ padding: 10, marginBottom: 8, borderRadius: "var(--radius-sm)",
      background: "var(--bg-tertiary)", border: "1px solid " + (isDefault ? acRgba("green", 0.4) : "var(--border-subtle)") }}>
      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
        <input value={dest.name} onChange={(e) => set({ name: e.target.value })} aria-label="Destination name"
          style={Object.assign({}, inputBase, { padding: "5px 8px", fontSize: 12, fontWeight: 500, flex: 1 })} />
        <Pill color={dest.type === "folder" ? "warm" : "cyan"}>{kind.label}</Pill>
        {isDefault ? <Pill color="green" title="S and the Send button use this one">default</Pill>
          : <SmallBtn color="muted" onClick={onMakeDefault}>Make default</SmallBtn>}
        <SmallBtn color="red" onClick={onRemove} title="Remove this destination (nothing is deleted anywhere)">×</SmallBtn>
      </div>
      <div style={{ fontSize: 10.5, color: "var(--text-muted)", lineHeight: 1.6, marginBottom: 8 }}>{kind.hint}</div>
      {dest.type === "folder" ? (
        <select value={dest.folderKey || ""} onChange={(e) => set({ folderKey: e.target.value })} style={selectStyle}>
          <option value="">Pick a folder…</option>
          {folderOptions.map((g) => (
            <optgroup key={"ds" + g.root.id} label={g.root.name}>
              {g.folders.map((d) => <option key={"ds" + dirKey(g.root.id, d)} value={dirKey(g.root.id, d)}>{d === "" ? "(top level)" : d}</option>)}
            </optgroup>
          ))}
        </select>
      ) : (
        <Fragment>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
            {field(dest.type === "http" ? "Import address (full URL)" : "Address", dest.baseUrl, "baseUrl",
              dest.type === "http" ? "http://127.0.0.1:5000/api/import" : kind.url, { gridColumn: "1 / -1" })}
            {dest.type === "http" ? field("File field name", dest.field, "field", "file") : field("Username" + (dest.type === "sillytavern" ? " (if it has accounts)" : ""), dest.username, "username", "")}
            {dest.type === "http" ? field("Header for a token (optional)", dest.header, "header", "Authorization") : null}
            {!connected ? (
              <div style={{ minWidth: 0 }}>
                <label style={tinyLabel}>{dest.type === "http" ? "Token (kept in memory only)" : "Password (never stored)"}</label>
                <input type="password" value={secret} onChange={(e) => setSecret(e.target.value)} autoComplete="off"
                  onKeyDown={(e) => { if (e.key === "Enter") connect(); }}
                  style={Object.assign({}, inputBase, { padding: "5px 8px", fontSize: 11.5 })} />
              </div>
            ) : null}
          </div>
          {status && status.available === false ? (
            <div style={{ fontSize: 10.5, color: "var(--accent-red)", marginBottom: 6 }}>
              The local server isn't answering, so uploads can't work. Start the vault with Start RP Card Vault.bat.
            </div>
          ) : null}
          {connected ? (
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 11, color: "var(--accent-green)" }}>✓ Connected{status.byId[dest.id].user ? " as " + status.byId[dest.id].user : ""}</span>
              <SmallBtn color="muted" onClick={() => onDisconnect(dest)}>Disconnect</SmallBtn>
              <span className="dest-locked-hint" style={{ fontSize: 10, color: "var(--text-muted)" }}>Disconnect to change the address or username.</span>
            </div>
          ) : (
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <SmallBtn color="green" disabled={busy || !dest.baseUrl} onClick={connect}>{busy ? "Connecting…" : "Connect"}</SmallBtn>
              <span style={{ fontSize: 10, color: "var(--text-muted)" }}>Once per launcher session: the sign-in is held by the local server, never saved.</span>
            </div>
          )}
        </Fragment>
      )}
    </div>
  );
}

/** Every destination, plus adding one. */
function DestinationsEditor({ settings, onSave, folderOptions, status, onConnect, onDisconnect }) {
  const list = settings.destinations || [];
  const save = (next, def) => onSave({ destinations: next, defaultDestination: def !== undefined ? def : settings.defaultDestination });
  return (
    <div className="destinations" style={{ marginBottom: 14 }}>
      {list.length ? null : (
        <div style={{ fontSize: 11, color: "var(--text-muted)", lineHeight: 1.7, marginBottom: 8 }}>
          None yet. Add a folder your front end reads, or a front end to upload into. You can keep several:
          right-click a card to pick one, or press S to send to your default.
        </div>
      )}
      {list.map((d) => (
        <DestinationRow key={d.id} dest={d} isDefault={d.id === settings.defaultDestination || (!settings.defaultDestination && d === list[0])}
          status={status} folderOptions={folderOptions}
          onChange={(nd) => save(list.map((x) => (x.id === d.id ? sanitizeDestination(nd) : x)))}
          onRemove={() => { const next = list.filter((x) => x.id !== d.id); save(next, d.id === settings.defaultDestination ? (next[0] ? next[0].id : "") : undefined); onDisconnect(d); }}
          onMakeDefault={() => save(list, d.id)}
          onConnect={onConnect} onDisconnect={onDisconnect} />
      ))}
      <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
        <span style={{ fontSize: 11, color: "var(--text-muted)" }}>Add:</span>
        {Object.keys(DEST_KINDS).map((k) => (
          <SmallBtn key={k} color={k === "folder" ? "warm" : "cyan"} onClick={() => {
            const d = newDestination(k);
            save(list.concat([d]), settings.defaultDestination || d.id);
          }}>+ {DEST_KINDS[k].label}</SmallBtn>
        ))}
      </div>
    </div>
  );
}

/** Flags of your own: name, icon, colour, the note's question, and a line for the agent. */
function CustomFlagsEditor({ flags, usage, onChange }) {
  const list = sanitizeCustomFlags(flags);
  const set = (i, patch) => onChange(list.map((f, j) => (j === i ? Object.assign({}, f, patch) : f)));
  const remove = (i) => {
    const n = usage[list[i].key] || 0;
    if (n && !window.confirm(n + " card" + (n === 1 ? " has" : "s have") + " the flag “" + (list[i].label || "Untitled flag") + "”.\n\n" +
      "Removing it from this list leaves it on " + (n === 1 ? "that card" : "those cards") + ", shown in grey by its name, until you remove it there.")) return;
    onChange(list.filter((_, j) => j !== i));
  };
  const small = Object.assign({}, inputBase, { padding: "5px 8px", fontSize: 11.5 });
  return (
    <div className="custom-flags" style={{ marginBottom: 14 }}>
      {list.map((f, i) => (
        <div key={f.key} className="custom-flag-row" style={{ padding: 10, marginBottom: 8, borderRadius: "var(--radius-sm)",
          background: "var(--bg-tertiary)", border: "1px solid " + acRgba(f.color, 0.35) }}>
          <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 6 }}>

              style={Object.assign({}, small, { width: 44, textAlign: "center", fontFamily: "inherit" })} />
            <input value={f.label} onChange={(e) => set(i, { label: e.target.value })} aria-label="Flag name" placeholder="Name, e.g. Needs art"
              style={Object.assign({}, small, { flex: 1, fontFamily: "'Outfit', sans-serif" })} />
            <select value={f.color} onChange={(e) => set(i, { color: e.target.value })} aria-label="Colour"
              style={Object.assign({}, selectStyle, { width: "auto", padding: "4px 8px", color: ac(f.color) })}>
              {CUSTOM_FLAG_COLORS.map((c) => <option key={c} value={c}>{c === "warm" ? "amber" : c}</option>)}
            </select>
