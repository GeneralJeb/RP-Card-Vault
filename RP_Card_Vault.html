            <SmallBtn color={picked.note ? "muted" : action.color} disabled={!ready || !req || !!req.error} onClick={run}>
              {picked.note ? (picked.current ? "↻ Regenerate" : "↻ Run again") : action.label}
            </SmallBtn>
            {req && !req.error ? (
              <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)" })}
                title="Estimated before sending; the endpoint's own count replaces it afterwards">
                ~{fmtNum(req.estimate.in)}t in · up to {fmtNum(req.estimate.out)}t out
              </span>
            ) : null}
            {req && !req.error && req.tooBig ? (
              <div className="ai-too-big" style={{ flexBasis: "100%", fontSize: 10.5, color: "var(--accent-red)", lineHeight: 1.5 }}>⚠ {req.tooBig}</div>
            ) : null}
          </Fragment>
        )}
      </div>

      {req && req.error ? <AiNotice color="warm">{req.error}</AiNotice> : null}

      {req && req.trimmed && req.trimmed.length && !busy ? (
        <div style={{ fontSize: 10, color: "var(--accent-warm)", marginBottom: 9, lineHeight: 1.6 }}>
          Trimmed to fit the context budget ({fmtNum(ai.contextChars)} characters):{" "}
          {req.trimmed.map((t) => t.label + " " + fmtNum(t.sent) + " of " + fmtNum(t.total)).join("; ")}.
          The model is told where each cut is. Raise the budget in the ✦ AI panel if it matters.
        </div>
      ) : null}

      {live && liveText.text ? (
        <div className="vault-scroll" style={{
          padding: 10, marginBottom: 10, borderRadius: "var(--radius-sm)", maxHeight: 260, overflowY: "auto",
          background: "var(--bg-tertiary)", border: "1px solid var(--border-subtle)",
          fontSize: 12, lineHeight: 1.65, color: "var(--text-secondary)", whiteSpace: "pre-wrap", wordBreak: "break-word",
        }}>{liveText.text.length > 6000 ? "…" + liveText.text.slice(-6000) : liveText.text}</div>
      ) : null}

      {fail ? (
        <AiNotice color="red">
          {fail.error}
          {fail.raw || fail.think ? (
            <div style={{ marginTop: 7 }}>
              <SmallBtn color="muted" onClick={() => setShowRaw(!showRaw)}>{showRaw ? "Hide the reply" : "Show the reply"}</SmallBtn>
              {showRaw ? (
                <div className="vault-scroll" style={{
                  marginTop: 7, maxHeight: 220, overflowY: "auto", whiteSpace: "pre-wrap",
                  fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "var(--text-muted)",
                }}>
                  {fail.raw || ""}{fail.think ? (fail.raw ? "\n\n" : "") + "[thinking]\n" + fail.think : ""}
                </div>
              ) : null}
            </div>
          ) : null}
        </AiNotice>
      ) : null}

      {!busy && picked.note ? (
        <AiResult note={picked.note} current={picked.current} kind={kind} writeMode={ai.writeMode} ai={ai}
          pending={pendingHere} onRepropose={repropose} />
      ) : null}

      {!busy && !picked.note && !fail ? (
        <div style={{ fontSize: 11.5, color: "var(--text-muted)", lineHeight: 1.7 }}>
          Nothing cached for this {action.perField ? "field" : "card"} and model yet. Answers are kept, so
          coming back to this tab costs nothing.
        </div>
      ) : null}

      {rows.length ? (
        <div style={{ marginTop: 12, display: "flex", gap: 6, alignItems: "center" }}>
          <SmallBtn color="muted" disabled={busy} onClick={async () => {
            const n = await onClearNotes(rec.fp);
            setRows([]);
            onToast(n ? "Cleared " + n + " cached answer(s)" : "Nothing cached", "muted");
          }}>Clear cached answers</SmallBtn>
          <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)" })}>{rows.length} cached</span>
        </div>
      ) : null}

      <div style={{ fontSize: 10, color: "var(--text-muted)", lineHeight: 1.6, marginTop: 14 }}>
        {action.perField
          ? "Sent: the name and this one field, in full."
          : "Sent: name, card tags, description, personality, scenario, first message" +
            (ai.includeExamples ? ", example dialogue" : "") + ", within " + fmtNum(ai.contextChars) + " characters."}
        {" "}Lorebooks and alternate greetings are counted, never sent. Nothing here can change the card file.
      </div>
    </Fragment>
  );
}

/** A comma-separated list (lorebook keys), committed when you leave the box or press Enter. */
function ListInput({ value, onChange, placeholder, className }) {
  const joined = (value || []).join(", ");
  const [draft, setDraft] = useState(joined);
  const [focus, setFocus] = useState(false);
  useEffect(() => { if (!focus) setDraft(joined); }, [joined, focus]);
  return (
    <input className={className} value={focus ? draft : joined} placeholder={placeholder}
      onFocus={() => { setFocus(true); setDraft(joined); }}
      onChange={(e) => setDraft(e.target.value)}
      onBlur={() => { setFocus(false); onChange(draft.split(",").map((x) => x.trim()).filter(Boolean)); }}
      onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); e.currentTarget.blur(); } }}
      style={Object.assign({}, inputBase, { padding: "5px 8px", fontSize: 11 })} />
  );
}

/* One lorebook entry in the editor below. */
const LORE_ROW_KEYS = ["comment", "enabled", "constant", "selective", "content", "insertionOrder", "position", "tokens"];

/** True when a lorebook row would draw the same: same place, same visible fields. */
function sameLoreRow(a, b) {
  if (a.i !== b.i || a.rowApi !== b.rowApi) return false;
  const x = a.e || {}, y = b.e || {};
  for (const k of LORE_ROW_KEYS) if (x[k] !== y[k]) return false;
  return (x.keys || []).join("\u0000") === (y.keys || []).join("\u0000") &&
    (x.secondaryKeys || []).join("\u0000") === (y.secondaryKeys || []).join("\u0000");
}

const LoreEntryRow = React.memo(function LoreEntryRow({ e, i, rowApi }) {
  const small = { fontSize: 10.5, color: "var(--text-muted)", display: "inline-flex", alignItems: "center", gap: 3, cursor: "pointer" };
  const setEntry = rowApi.set, removeEntry = rowApi.remove;
  return (
    <div className="lore-entry" style={{
      marginBottom: 8, padding: 9, borderRadius: "var(--radius-sm)",
      background: "var(--bg-input)", border: "1px solid " + (e.enabled !== false ? "var(--border-subtle)" : acRgba("red", 0.25)),
    }}>
      <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 6, flexWrap: "wrap" }}>
        <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)" })}>#{i + 1}</span>
        <input value={e.comment || ""} placeholder="Name" onChange={(ev) => setEntry(i, { comment: ev.target.value })}
          style={Object.assign({}, inputBase, { padding: "4px 7px", fontSize: 11, flex: 1, minWidth: 100, width: "auto" })} />
        <label style={small}><input type="checkbox" checked={e.enabled !== false} onChange={(ev) => setEntry(i, { enabled: ev.target.checked })} />on</label>
        <label style={small}><input type="checkbox" checked={!!e.constant} onChange={(ev) => setEntry(i, { constant: ev.target.checked })} />constant</label>
        <label style={small}><input type="checkbox" checked={!!e.selective} onChange={(ev) => setEntry(i, { selective: ev.target.checked })} />selective</label>
        <SmallBtn color="red" onClick={() => removeEntry(i)} title="Remove this entry">remove</SmallBtn>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginBottom: 6 }}>
        <ListInput className="lore-keys" value={e.keys} placeholder="Keys, comma-separated" onChange={(v) => setEntry(i, { keys: v })} />
        <ListInput className="lore-secondary" value={e.secondaryKeys} placeholder="Secondary keys" onChange={(v) => setEntry(i, { secondaryKeys: v })} />
      </div>
      <textarea value={e.content || ""} rows={4} onChange={(ev) => setEntry(i, { content: ev.target.value })}
        style={Object.assign({}, inputBase, { resize: "vertical", lineHeight: 1.55, fontSize: 11.5 })} />
      <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 5, flexWrap: "wrap" }}>
        <label style={small}>order
          <input type="number" value={e.insertionOrder || 0} onChange={(ev) => setEntry(i, { insertionOrder: Number(ev.target.value) || 0 })}
            style={Object.assign({}, inputBase, { padding: "2px 5px", fontSize: 10.5, width: 64 })} /></label>
        <label style={small}>position
          <input value={e.position || ""} onChange={(ev) => setEntry(i, { position: ev.target.value })} placeholder="e.g. before_char"
            style={Object.assign({}, inputBase, { padding: "2px 5px", fontSize: 10.5, width: 110 })} /></label>
        <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)", marginLeft: "auto" })}>{fmtTokens(e.tokens || 0)}</span>
      </div>
    </div>
  );
}, sameLoreRow);

/**
 * The Lorebook tab: the card's lorebook, editable. Changes go into the
 * vault's edits like any field (the file changes on Save to card, which
 * keeps every lorebook field the vault doesn't show).
 */
function LorebookEditor({ body, edit, onPatchEdit }) {
  const lb = effectiveLorebook(body, edit);
  const edited = !!(edit && edit.lorebook);
  const write = (next) => onPatchEdit(lorebookPatch(body, next));
  const book = () => cleanLorebook(lb || { entries: [] });
  const setEntry = (i, patch) => { const b = book(); b.entries[i] = cleanLoreEntry(Object.assign({}, b.entries[i], patch)); write(b); };
  const removeEntry = (i) => { const b = book(); b.entries.splice(i, 1); write(b); };
  const addEntry = () => { const b = book(); b.entries.push(cleanLoreEntry({ comment: "New entry" })); write(b); };
  // Rows only redraw when their own entry changes (a 2,000-entry book would
  // otherwise redraw every entry on every keystroke), so they reach the
  // current setEntry and removeEntry through a ref rather than new functions.
  const live = useRef({});
  live.current = { setEntry, removeEntry };
  const rowApi = useMemo(() => ({
    set: (i, patch) => live.current.setEntry(i, patch),
    remove: (i) => live.current.removeEntry(i),
  }), []);

  if (!lb) {
    return (
      <div style={{ fontSize: 12, color: "var(--text-muted)" }}>
        No embedded lorebook.
        <div style={{ marginTop: 8 }}><SmallBtn color="purple" onClick={addEntry}>+ Start a lorebook</SmallBtn></div>
      </div>
    );
  }
  return (
    <div className="lore-editor">
      <div style={{ marginBottom: 10 }}>
        <label style={tinyLabel}>Book name</label>
        <input value={lb.name || ""} onChange={(e) => write(Object.assign(book(), { name: e.target.value }))}
          style={Object.assign({}, inputBase, { padding: "5px 8px", fontSize: 11.5, marginBottom: 8 })} />
        <StatRow k="Entries" v={fmtNum(lb.entries.length)} />
        <StatRow k="Total tokens" v={fmtTokens(lb.totalTokens || 0)} />
        <StatRow k="Scan depth" v={lb.scanDepth === null || lb.scanDepth === undefined ? "—" : lb.scanDepth} />
        <StatRow k="Token budget" v={lb.tokenBudget === null || lb.tokenBudget === undefined ? "—" : fmtNum(lb.tokenBudget)} />
      </div>
      <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", marginBottom: 10 }}>
        {edited ? <Pill color="warm">edited</Pill> : null}
        <span style={{ fontSize: 10, color: "var(--text-muted)", flex: 1, minWidth: 160 }}>
          Changes go into the vault's edits. Save to card writes them, keeping every lorebook field, including ones not shown here.
        </span>
        {edited ? <SmallBtn color="muted" onClick={() => onPatchEdit({ lorebook: null })}>Revert lorebook</SmallBtn> : null}
      </div>
      {lb.entries.map((e, i) => (
        <LoreEntryRow key={(e.idx === null || e.idx === undefined ? "n" : e.idx) + ":" + i} e={e} i={i} rowApi={rowApi} />
      ))}
      <SmallBtn color="purple" onClick={addEntry}>+ add entry</SmallBtn>
    </div>
  );
}

function Inspector({ rec, roots, edit, tagIndex, onPatchEdit, onClose, onToast, dupeGroup, onJumpTo, onSaveToCard, onOpenFlag, ai, aiRelay, onRunAi, onClearAiNotes, onOpenAiSettings, onSaveAi, onDuplicate }) {
  const [tab, setTab] = useState("overview");
  const [body, setBody] = useState(null);
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState("");

  useEffect(() => {
    let dead = false;
    setLoading(true); setBody(null);
    dbGet(STORE_BODIES, rec.id).then((b) => { if (!dead) { setBody(b || null); setLoading(false); } });
    return () => { dead = true; };
  }, [rec.id]);

  useEffect(() => { setTab("overview"); }, [rec.id]);

  // The Raw tab shows what a save would write, so it needs the file's own lorebook too.
  const [rawBook, setRawBook] = useState(null);
  useEffect(() => {
    let dead = false;
    setRawBook(null);
    if (tab !== "raw" || !rec.loreCount) return () => { dead = true; };
    readOriginalBytes(rec, roots).then((o) => rawBookFromBytes(o.bytes, rec.file))
      .then((b) => { if (!dead) setRawBook(b); }).catch(() => {});
    return () => { dead = true; };
  }, [tab, rec.id]);

  const root = roots.find((r) => r.id === rec.rootId);
  const rootMeta = root ? (ROOT_ROLES[root.role] || ROOT_ROLES.reference) : ROOT_ROLES.reference;
  const tags = effectiveTags(rec, edit);
  const greetings = (edit && edit.greetings) || (body ? body.alternate_greetings : []) || [];

  const setField = (key, val) => {
    const fields = Object.assign({}, (edit && edit.fields) || {});
    if (body && val === (body[key] || "")) delete fields[key];
    else fields[key] = val;
    onPatchEdit({ fields });
  };

  const exportCopy = async (destRootId) => {
    setBusy("Building copy…");
    try {
      const out = await materializeEdit(rec, body, edit, roots);
      if (!destRootId) {
        downloadBlob(out.blob, out.filename);
        onToast("Downloaded " + out.filename, "green");
      } else {
        const dest = roots.find((r) => r.id === destRootId);
        if (!(await verifyPermission(dest.handle, true))) throw new Error("Write permission denied");
        const sig = await byteSignature(out.blob.slice(0));
        const res = await copyIntoRoot(dest, ["_vault edits"], out.filename, out.blob, sig);
        await logOp("exportEdit", { card: rec.name, to: dest.name + "/_vault edits/" + res.name });
        onToast("Saved to " + dest.name + "/_vault edits/" + res.name, "green");
      }
    } catch (e) {
      onToast("Export failed: " + e.message, "red");
    }
    setBusy("");
  };

  const copyOriginal = async (destRootId) => {
    setBusy("Copying…");
    try {
      const dest = roots.find((r) => r.id === destRootId);
      if (!(await verifyPermission(dest.handle, true))) throw new Error("Write permission denied");
      const { bytes } = await readOriginalBytes(rec, roots);
      const blob = new Blob([bytes], { type: "image/png" });
      const res = await copyIntoRoot(dest, [], rec.file, blob, rec.sig);
      await logOp("copy", { card: rec.name, from: rec.rel, to: dest.name + "/" + res.name, skipped: res.skipped });
      onToast(res.skipped ? "Already there — " + res.reason : "Copied to " + dest.name + "/" + res.name, res.skipped ? "blue" : "green");
    } catch (e) { onToast("Copy failed: " + e.message, "red"); }
    setBusy("");
  };

  const writableRoots = roots.filter((r) => r.role !== "reference" && !isImportRoot(r));
  const readOnlyRoot = !!(root && isImportRoot(root));
  const dirtyCount = pendingEditCount(edit);
  const vaultTags = vaultTagsOf(edit);
  const flags = flagsOf(edit);

  return (
    <div style={{
      width: 440, flexShrink: 0, borderLeft: "1px solid var(--border-subtle)",
      background: "var(--bg-secondary)", display: "flex", flexDirection: "column", height: "100%",
    }}>
      {/* header */}
      <div style={{ padding: "12px 14px", borderBottom: "1px solid var(--border-subtle)", background: "var(--bg-tertiary)" }}>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ width: 62, height: 84, flexShrink: 0, borderRadius: "var(--radius-sm)", overflow: "hidden", border: "1px solid var(--border-subtle)" }}>
            <Thumb id={rec.id} hasThumb={rec.hasThumb} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "flex-start", gap: 6 }}>
              <div style={{
                flex: 1, fontFamily: "'Crimson Pro', serif", fontSize: 19, fontWeight: 600,
                lineHeight: 1.15, wordBreak: "break-word",
              }}>{effectiveField(body, edit, "name") || rec.name}</div>
              <SmallBtn color="muted" onClick={onClose} title="Close (Esc)">×</SmallBtn>
            </div>
            <div style={{ display: "flex", gap: 4, marginTop: 5, flexWrap: "wrap" }}>
              <Pill color={SPEC_COLOR[rec.spec] || "red"}>{rec.spec === "none" ? "no card data" : "spec " + rec.spec}</Pill>
              {rec.version ? <Pill color="muted">v{rec.version}</Pill> : null}
              {rec.sid ? <Pill color="muted" title="This card's short id: the agent chat knows it by this">{rec.sid}</Pill> : null}
              {rec.creator ? <Pill color="blue">@{rec.creator}</Pill> : null}
              {dirtyCount ? <Pill color="purple">{dirtyCount} local edit{dirtyCount === 1 ? "" : "s"}</Pill> : null}
            </div>
            <div style={Object.assign({}, monoTiny, {
              color: "var(--text-muted)", marginTop: 6, wordBreak: "break-all", lineHeight: 1.45,
            })}>
              {rootMeta.icon} {root ? root.name : "?"}{rec.dir ? " / " + rec.dir : ""} / {rec.file}
            </div>
          </div>
        </div>

        <div style={{ display: "flex", gap: 5, marginTop: 10, flexWrap: "wrap", alignItems: "center" }}>
          <SmallBtn color="warm" active={!!(edit && edit.favorite)} onClick={() => onPatchEdit({ favorite: !(edit && edit.favorite) })}>
            {edit && edit.favorite ? "★ Favourite" : "☆ Favourite"}
          </SmallBtn>
          <SmallBtn color="cyan" onClick={() => { navigator.clipboard && navigator.clipboard.writeText((root ? root.name : "") + "/" + rec.rel); onToast("Path copied", "cyan"); }}>Copy path</SmallBtn>
          <SmallBtn color="purple" disabled={!body} onClick={() => exportCopy(null)}>Download copy</SmallBtn>
          {onDuplicate ? <SmallBtn color="green" disabled={!body} onClick={onDuplicate} title="A copy named “(copy)” in the same folder, as a card of its own">Duplicate</SmallBtn> : null}
          <SmallBtn color={dirtyCount ? "red" : "muted"} disabled={!dirtyCount || !body || readOnlyRoot}
            title={readOnlyRoot ? "Imported folders are read-only" : "Write these changes into the card file itself"}
            onClick={onSaveToCard}>
            {dirtyCount ? "\u{1F4BE} Save to card (" + dirtyCount + ")" : "\u{1F4BE} Saved"}
          </SmallBtn>
          {writableRoots.length ? (
            <select value="" onChange={(e) => { if (e.target.value) { const [kind, id] = e.target.value.split("|"); if (kind === "edit") exportCopy(id); else copyOriginal(id); e.target.value = ""; } }}
              style={Object.assign({}, selectStyle, { width: "auto", padding: "4px 26px 4px 8px", fontSize: 11 })}>
              <option value="">Copy to…</option>
              <optgroup label="Copy original file">
                {writableRoots.map((r) => <option key={"o" + r.id} value={"orig|" + r.id}>{r.name}</option>)}
              </optgroup>
              <optgroup label="Save edited copy">
                {writableRoots.map((r) => <option key={"e" + r.id} value={"edit|" + r.id}>{r.name}/_vault edits</option>)}
              </optgroup>
            </select>
          ) : null}
        </div>
        {busy ? <div style={{ marginTop: 8 }}><ProgressBar step={1} total={0} label={busy} /></div> : null}
      </div>

      {/* tabs */}
      <div style={{ display: "flex", borderBottom: "1px solid var(--border-subtle)", overflowX: "auto", flexShrink: 0 }}>
        {TABS.map((t) => {
          const on = tab === t.key;
          const badge = t.key === "lore" ? rec.loreCount
            : t.key === "greet" ? (greetings.length + (body && body.first_mes ? 1 : 0))
            : t.key === "tags" ? tags.length + vaultTags.length + flags.length
            : t.key === "ai" ? proposalCount(edit && edit.aiProposal)
            : 0;
          return (
            <div key={t.key} onClick={() => setTab(t.key)} className="no-sel" style={{
              padding: "8px 11px", fontSize: 11.5, cursor: "pointer", whiteSpace: "nowrap",
              color: on ? "var(--accent-warm)" : "var(--text-muted)",
              borderBottom: "2px solid " + (on ? "var(--accent-warm)" : "transparent"),
              background: on ? "var(--accent-warm-glow)" : "transparent",
            }}>
              {t.label}{badge ? " " : ""}
              {badge ? <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)" })}>{badge}</span> : null}
            </div>
          );
        })}
      </div>

      <div className="vault-scroll" style={{ flex: 1, padding: 14 }}>
        {loading ? <div style={{ fontSize: 12, color: "var(--text-muted)" }}>Loading card…</div> : null}
        {!loading && !body ? (
          <div style={{ fontSize: 12, color: "var(--accent-red)", lineHeight: 1.6 }}>
            No card data cached for this file.<br />
            <span style={{ color: "var(--text-muted)" }}>{rec.err || "It may not contain an embedded character card."}</span>
          </div>
        ) : null}

        {!loading && body && tab === "overview" ? (
          <Fragment>
            {rec.warnings && rec.warnings.length ? (
              <div style={{
                marginBottom: 12, padding: "9px 11px", borderRadius: "var(--radius-sm)",
                background: acRgba("warm", 0.08), border: "1px solid " + acRgba("warm", 0.25),
              }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: "var(--accent-warm)", marginBottom: 4 }}>Notes on this card</div>
                {rec.warnings.map((w, i) => (
                  <div key={i} style={{ fontSize: 11, color: "var(--text-secondary)", lineHeight: 1.6 }}>• {w}</div>
                ))}
              </div>
            ) : null}

            <div style={{ marginBottom: 14 }}>
              <label style={tinyLabel}>Token budget</label>
              <StatRow k="Permanent context (desc+pers+scen+greeting)" v={fmtTokens(rec.tokensCore)} color={rec.tokensCore > 1500 ? "warm" : "green"} />
              <StatRow k="All prompt fields" v={fmtTokens(rec.tokensAll)} />
              <StatRow k="Alternate greetings" v={fmtTokens(rec.tokensGreetings)} />
              <StatRow k="Lorebook (if fully triggered)" v={fmtTokens(rec.tokensLore)} />
            </div>

            <div style={{ marginBottom: 14 }}>
              <label style={tinyLabel}>File</label>
              <StatRow k="Size" v={fmtBytes(rec.size)} />
              <StatRow k="Modified" v={fmtDate(rec.mtime)} />
              <StatRow k="Card created" v={body.creation_date ? fmtDate(body.creation_date * (String(body.creation_date).length <= 10 ? 1000 : 1)) : "—"} />
              <StatRow k="Format" v={rec.ext.toUpperCase() + (rec.specRaw ? " · " + rec.specRaw : "")} />
              <StatRow k="Lorebook entries" v={fmtNum(rec.loreCount)} />
              <StatRow k="Alternate greetings" v={fmtNum(rec.altCount)} />
              <StatRow k="Embedded assets" v={fmtNum(rec.assetCount)} />
              <StatRow k="Content fingerprint" v={rec.fp.slice(0, 16)} />
            </div>

            {body.source && body.source.length ? (
              <div style={{ marginBottom: 14 }}>
                <label style={tinyLabel}>Source</label>
                {body.source.map((s, i) => (
                  <div key={i} style={Object.assign({}, monoTiny, { color: "var(--accent-blue)", wordBreak: "break-all", lineHeight: 1.6 })}>{s}</div>
                ))}
              </div>
            ) : null}

            {dupeGroup && dupeGroup.length > 1 ? (
              <div style={{ marginBottom: 14 }}>
                <label style={tinyLabel}>Other copies of this card ({dupeGroup.length - 1})</label>
                {dupeGroup.filter((r) => r.id !== rec.id).map((r) => (
                  <div key={r.id} onClick={() => onJumpTo(r.id)} className="tagRow" style={{
                    padding: "4px 6px", cursor: "pointer", borderRadius: 3,
                    fontSize: 11, fontFamily: "'JetBrains Mono', monospace",
                    color: "var(--text-secondary)", wordBreak: "break-all",
                  }}>
                    {(roots.find((x) => x.id === r.rootId) || {}).name || "?"} / {r.rel}
                  </div>
                ))}
              </div>
            ) : null}

            <div>
              <label style={tinyLabel}>Description preview</label>
              <div style={{
                fontSize: 12, lineHeight: 1.65, color: "var(--text-secondary)",
                whiteSpace: "pre-wrap", maxHeight: 260, overflow: "auto",
                background: "var(--bg-input)", padding: 10, borderRadius: "var(--radius-sm)",
                border: "1px solid var(--border-subtle)",
              }}>{effectiveField(body, edit, "description") || "(empty)"}</div>
            </div>
          </Fragment>
        ) : null}

        {!loading && body && tab === "fields" ? (
          <Fragment>
            <div style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 12, lineHeight: 1.6 }}>
              Edits are stored in the vault only. The original file on disk is never modified — use
              <strong style={{ color: "var(--text-secondary)" }}> Download copy </strong>
              or <strong style={{ color: "var(--text-secondary)" }}>Copy to…</strong> to write a new card out.
            </div>
            <Field label="Name">
              <input value={effectiveField(body, edit, "name") || ""} onChange={(e) => setField("name", e.target.value)}
                style={Object.assign({}, inputBase, {
                  fontFamily: "'Outfit', sans-serif",
                  borderColor: (edit && edit.fields && edit.fields.name !== undefined) ? "var(--accent-purple)" : "var(--border-subtle)",
                })} />
            </Field>
            {CARD_FIELDS.map((f) => (
              <Field key={f.key} label={f.label}>
                <EditableText
                  value={effectiveField(body, edit, f.key)}
                  original={body[f.key] || ""}
                  rows={f.key === "description" ? 9 : 5}
                  onChange={(v) => setField(f.key, v)}
                  onRevert={() => setField(f.key, body[f.key] || "")} />
              </Field>
            ))}
          </Fragment>
        ) : null}

        {!loading && body && tab === "greet" ? (
          <Fragment>
            <Field label="First message">
              <EditableText value={effectiveField(body, edit, "first_mes")} original={body.first_mes || ""} rows={7}
                onChange={(v) => setField("first_mes", v)} onRevert={() => setField("first_mes", body.first_mes || "")} />
            </Field>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "14px 0 8px" }}>
              <label style={Object.assign({}, tinyLabel, { marginBottom: 0 })}>Alternate greetings ({greetings.length})</label>
              <SmallBtn color="cyan" onClick={() => onPatchEdit({ greetings: greetings.concat([""]) })}>+ add</SmallBtn>
            </div>
            {greetings.length === 0 ? <div style={{ fontSize: 11, color: "var(--text-muted)" }}>None.</div> : null}
            {greetings.map((g, i) => (
              <div key={i} style={{ marginBottom: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3 }}>
                  <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)" })}>#{i + 1} · {fmtTokens(estimateTokens(g))}</span>
                  <SmallBtn color="red" onClick={() => onPatchEdit({ greetings: greetings.filter((_, j) => j !== i) })}>remove</SmallBtn>
                </div>
                <textarea value={g} rows={4}
                  onChange={(e) => { const n = greetings.slice(); n[i] = e.target.value; onPatchEdit({ greetings: n }); }}
                  style={Object.assign({}, inputBase, { fontFamily: "'Outfit', sans-serif", lineHeight: 1.55 })} />
              </div>
            ))}
            {edit && edit.greetings ? (
              <SmallBtn color="muted" onClick={() => onPatchEdit({ greetings: null })}>revert all greetings</SmallBtn>
            ) : null}
          </Fragment>
        ) : null}

        {!loading && body && tab === "lore" ? (
          <LorebookEditor body={body} edit={edit} onPatchEdit={onPatchEdit} />
        ) : null}

        {!loading && body && tab === "ai" ? (
          <InspectorAiTab rec={rec} body={body} edit={edit} ai={ai} relay={aiRelay}
            tagIndex={tagIndex} onRun={onRunAi} onClearNotes={onClearAiNotes}
            onPatchEdit={onPatchEdit} onToast={onToast}
            onOpenSettings={onOpenAiSettings} onSaveAi={onSaveAi} />
        ) : null}

        {!loading && body && tab === "tags" ? (
          <Fragment>
            <div style={{
              marginBottom: 14, padding: 9, borderRadius: "var(--radius-sm)",
              background: "var(--bg-tertiary)", border: "1px solid var(--border-subtle)",
              fontSize: 10.5, color: "var(--text-muted)", lineHeight: 1.6,
            }}>
              <strong style={{ color: "var(--accent-warm)" }}>Card tags</strong> belong to the character
              and get written into the file when you save to card.{" "}
              <strong style={{ color: "var(--accent-purple)" }}>Vault tags</strong> are yours alone —
              they filter and search exactly the same way but never touch the file.
            </div>

            <Field label={"Card tags · " + tags.length}
              hint="Purple outlines mark tags you added. These travel with the card.">
              <TagEditor tags={tags} baseTags={rec.tags} tagIndex={tagIndex}
                onChange={(t) => onPatchEdit({ tags: t })} />
            </Field>
            {Array.isArray(edit && edit.tags) ? (
              <div style={{ marginBottom: 14 }}>
                <SmallBtn color="muted" onClick={() => onPatchEdit({ tags: null })}>revert to the card's own tags</SmallBtn>
              </div>
            ) : null}

            <Field label={"Vault-only tags · " + vaultTags.length}
              hint="Never written to the card. Use these for your own shelving — “to read”, “archive candidate”, whatever you like.">
              <TagEditor tags={vaultTags} baseTags={[]} tagIndex={tagIndex}
                onChange={(t) => onPatchEdit({ vaultTags: t })} />
            </Field>

            <Field label={"Flags · " + flags.length} hint="Vault-only markers with an optional reason.">
              <div style={{ marginBottom: 8 }}>
                <FlagGroups flags={flags}
                  onEdit={(i) => onOpenFlag(flags[i].key, flags[i].note, i)}
                  onRemove={(i) => onPatchEdit({ flags: flags.filter((x, j) => j !== i) })} />
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                {statusFlags().map((f) => (
                  <div key={f.key} onClick={() => onOpenFlag(f.key, "")}
                    style={{ cursor: "pointer" }}>
                    <Pill color={f.color} style={{ opacity: flags.some((x) => x.key === f.key) ? 1 : 0.6 }}>
                      + {f.icon} {f.label}
                    </Pill>
                  </div>
                ))}
                {FLAG_COLORS.map((f) => {
                  const on = flags.some((x) => x.key === f.key);
                  return (
                    <div key={f.key} title={f.label} onClick={() => onPatchEdit({
                      flags: on ? flags.filter((x) => x.key !== f.key) : flags.concat([{ key: f.key, note: "", at: Date.now() }]),
                    })} style={{
                      width: 18, height: 18, borderRadius: "50%", cursor: "pointer", alignSelf: "center",
                      background: acRgba(f.color, on ? 0.85 : 0.3),
                      border: "2px solid " + (on ? ac(f.color) : "transparent"),
                    }} />
                  );
                })}
              </div>
            </Field>
            <Field label="Rating">
              <div style={{ display: "flex", gap: 4 }}>
                {[1, 2, 3, 4, 5].map((n) => (
                  <span key={n} onClick={() => onPatchEdit({ rating: (edit && edit.rating) === n ? 0 : n })}
                    style={{
                      cursor: "pointer", fontSize: 18, lineHeight: 1,
                      color: (edit && edit.rating >= n) ? "var(--accent-warm)" : "var(--text-muted)",
                    }}>★</span>
                ))}
              </div>
            </Field>
            <Field label="Private notes" hint="Never written to the card. Searchable.">
              <textarea value={(edit && edit.notes) || ""} rows={7}
                onChange={(e) => onPatchEdit({ notes: e.target.value })}
                style={Object.assign({}, inputBase, { fontFamily: "'Outfit', sans-serif", lineHeight: 1.6 })} />
            </Field>
          </Fragment>
        ) : null}

        {!loading && body && tab === "raw" ? (
          <Fragment>
            <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
              <SmallBtn color="cyan" onClick={() => {
                navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(buildV3Payload(body, edit, rawBook), null, 2));
                onToast("V3 JSON copied", "cyan");
              }}>Copy V3 JSON</SmallBtn>
              <SmallBtn color="muted" onClick={() => downloadFile(JSON.stringify(buildV3Payload(body, edit, rawBook), null, 2), safeFileName(rec.name) + ".json", "application/json")}>
                Download JSON
              </SmallBtn>
            </div>
            <pre style={{
              fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, lineHeight: 1.55,
              background: "var(--bg-input)", border: "1px solid var(--border-subtle)",
              borderRadius: "var(--radius-sm)", padding: 10, overflow: "auto",
              whiteSpace: "pre-wrap", wordBreak: "break-word", color: "var(--text-secondary)",
            }}>{JSON.stringify(buildV3Payload(body, edit, rawBook), null, 2)}</pre>
          </Fragment>
        ) : null}
      </div>
    </div>
  );
}
