  async move_card(a, ctx) {
    agentCardFilesAllowed(ctx);
    const reason = agentReasonArg(a.reason);
    const r = agentFindCard(ctx.vault, a.id);
    const folder = agentResolveFolder(ctx.vault.roots(), a.folder);
    if (folder.rootId === r.rootId && folder.dir === (r.dir || "")) return { ok: true, content: r.name + " is already in " + folder.path + "." };
    const from = agentFolderList(ctx.vault.roots()).filter((f) => f.rootId === r.rootId && f.dir === (r.dir || ""))[0];
    if (!agentIsPinned(ctx.session, r)) await ctx.gate("edits", 1);
    const moved = await ctx.vault.moveCard(r, folder.rootId, folder.dir);
    if (moved.skipped) return { ok: true, content: "Nothing moved: " + moved.reason + "." };
    return { ok: true, content: "Moved " + r.name + " to " + folder.path + " (the copy was checked before the original was removed). It keeps its id, " + (r.sid || moved.sid) + ".",
      display: { cardMoved: { card: r.name, cardId: moved.id, sid: r.sid || moved.sid, to: folder.path,
        from: from ? from.path : "", fromRootId: r.rootId, fromDir: r.dir || "", reason } } };
  },

  async bulk_tags(a, ctx) {
    if (sanitizeAiSettings(ctx.vault.aiSettings()).writeMode === "off") {
      throw new Error("The ✦ AI panel is set to Read-only, so nothing can be changed. Tell the user instead.");
    }
    const kind = a.kind === "vault" ? "vault" : a.kind === "card" ? "card" : "";
    if (!kind) throw new Error("kind must be \"card\" (the card's own tags) or \"vault\" (vault-only tags).");
    const reason = agentReasonArg(a.reason);
    const clean = (list) => (Array.isArray(list) ? list : []).map((x) => String(x).trim()).filter(Boolean);
    const add = clean(a.add), remove = clean(a.remove);
    if (!add.length && !remove.length) throw new Error("Give tags to add or remove.");
    let cards;
    if (Array.isArray(a.ids) && a.ids.length) cards = a.ids.map((id) => agentFindCard(ctx.vault, id));
    else if (a.where && typeof a.where === "object" && Object.keys(a.where).some((k) => String(a.where[k] || "").trim())) cards = agentMatchCards(ctx.vault.records(), a.where);
    else throw new Error("Pick the cards: ids, or where (list_cards filters).");
    if (cards.length > AGENT_BULK_MAX) {
      throw new Error(fmtNum(cards.length) + " cards match. Change at most " + AGENT_BULK_MAX + " per call: narrow where, or work through them in parts.");
    }
    const changes = agentBulkTagChanges(cards, (fp) => ctx.vault.edit(fp), kind, add, remove);
    const names = [add.length ? "added " + add.join(", ") : "", remove.length ? "removed " + remove.join(", ") : ""].filter(Boolean).join(" and ");
    if (!changes.length) return { ok: true, content: "Nothing to change: none of the " + fmtNum(cards.length) + " card(s) needed that." };
    if (cards.some((r) => !agentIsPinned(ctx.session, r))) await ctx.gate("edits", 1);
    ctx.vault.applyTags(kind, changes.map((c) => ({ fp: c.fp, value: c.after })));
    return { ok: true,
      content: "Changed " + (kind === "card" ? "card tags" : "vault-only tags") + " on " + fmtNum(changes.length) + " card(s): " + names +
        ". It's in the vault's edits now" + (kind === "card" ? "; the card files change when the user saves them" : "") + ", and the user can undo it from the chat.",
      display: { bulkTags: { kind, add, remove, reason, count: changes.length,
        changes: changes.map((c) => ({ fp: c.fp, card: c.card, before: c.before, after: c.after })) } } };
  },

  async propose_card_tags(a, ctx) {
    const { r, edit, pinned } = agentChangeCard(a, ctx);
    const reason = agentReasonArg(a.reason);
    const clean = (list) => (Array.isArray(list) ? list : []).map((t) => String(t).trim()).filter(Boolean);
    const hit = (list, t) => list.some((x) => normTagName(x) === normTagName(t));
    const now = effectiveTags(r, edit);
    const add = clean(a.add).filter((t, i, all) => !hit(now, t) && all.findIndex((x) => normTagName(x) === normTagName(t)) === i);
    const remove = clean(a.remove).filter((t) => hit(now, t));
    if (!add.length && !remove.length) {
      throw new Error("Nothing to change: " + r.name + "'s tags are " + (now.join(", ") || "(none)") + ". Add tags it doesn't have, or remove ones it has.");
    }
    await agentChangeGate(ctx, pinned);
    ctx.vault.propose(r.fp, "cardTags", { add, remove }, agentChangeMeta(ctx, { reason }));
    const what = [add.length ? "adding " + add.join(", ") : "", remove.length ? "removing " + remove.join(", ") : ""].filter(Boolean).join(" and ");
    return { ok: true, content: "Suggested " + what + " in " + r.name + "'s card tags. It waits in the card's Proposed changes for the user.",
      display: { proposal: { card: r.name, cardId: r.id, what: what + " (card tags)", reason } } };

  async propose_flags(a, ctx) {

    return { ok: true, content: "Suggested flagging " + r.name + ": " + labels + ". It waits in the card's Proposed changes for the user.",
      display: { proposal: { card: r.name, cardId: r.id, what: "flagging it " + labels, reason: fresh.map((f) => f.note).join(" ") } } };

/* ── the loop ────────────────────────────────────────────────────────── */

function agentAbortError() {
  const e = new Error("Cancelled");
  e.name = "AbortError";
  return e;
}

/**
 * Run the agent until it answers, finishes, asks you something, reaches the
 * step cap, fails, or is cancelled.
 *
 *   step()        → Promise of interpretAgentStep's result. Throws AbortError on cancel.
 *   runTool(call) → Promise of runAgentTool's result.
 *   gate(kind, n) → Promise; waits out a rate limit.
 *   emit(event)   → adds to the chat: { role: "assistant" | "tool" | "note", … }
 *   stepCap       → model requests per message, 0 = unlimited
 *   signal        → an AbortSignal
 *
 * Returns { stopped: "answered" | "finished" | "asked" | "stepcap" | "error" | "cancelled", error? }.
 */
async function runAgentLoop(d) {
  const aborted = () => !!(d.signal && d.signal.aborted);
  let steps = 0;
  for (;;) {
    if (aborted()) return { stopped: "cancelled" };
    if (d.stepCap && steps >= d.stepCap) {
      d.emit({ role: "note", kind: "stepcap",
        text: "Stopped after " + steps + " model request" + (steps === 1 ? "" : "s") + " for this message (the step cap). Say \"continue\" to let it go on." });
      return { stopped: "stepcap" };
    }
    let step;
    try {
      await d.gate("requests", 1);
      if (aborted()) return { stopped: "cancelled" };
      steps++;
      step = await d.step();
    } catch (e) {
      if (e && e.name === "AbortError") return { stopped: "cancelled" };
      step = { ok: false, error: (e && e.message) || String(e) };
    }
    if (!step.ok) {
      d.emit({ role: "note", kind: "error", text: step.error });
      return { stopped: "error", error: step.error };
    }
    d.emit({ role: "assistant", text: step.text, think: step.think || "", calls: step.calls, usage: step.usage || null, model: step.model || "" });
    if (!step.calls.length) return { stopped: "answered" };

    // Every call gets a result, even after a cancel, or the next request
    // would be refused for a call left unanswered.
    let finished = false, asked = false, cancelled = false;
    for (const call of step.calls) {
      let res;
      if (cancelled || aborted()) {
        cancelled = true;
        res = { ok: false, content: "Not run: the user pressed Stop." };
      } else {
        try { res = await d.runTool(call); }
        catch (e) {
          if (e && e.name === "AbortError") { cancelled = true; res = { ok: false, content: "Not run: the user pressed Stop." }; }
          else res = { ok: false, content: "Error: " + ((e && e.message) || String(e)) };
        }
      }
      d.emit({ role: "tool", id: call.id, name: call.name, args: call.args, result: res.content, ok: !!res.ok, display: res.display || null });
      if (res.finish) finished = true;
      if (res.ask) asked = true;
    }
    if (cancelled) return { stopped: "cancelled" };
    if (finished) return { stopped: "finished" };
    if (asked) return { stopped: "asked" };
  }
}

      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}),
    });
  } catch (e) {
    throw new Error("Couldn't reach the local server. Is \"Start RP Card Vault.bat\" running?");
  }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = new Error(d.error || (r.status === 404 && !d.error
      ? "The local server has no workspace. It's an older serve.js; run \"Start RP Card Vault.bat\"."
      : "The workspace request failed (HTTP " + r.status + ")."));
    e.status = r.status;
    throw e;
  }
  return d;
}

/** A submenu that measures itself and picks a side that fits. */
function Flyout({ items, renderItems }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);

  useLayoutEffect(() => {
    const el = ref.current;
    if (!el || !el.parentElement) return;
    const parent = el.parentElement.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const vw = window.innerWidth || 1200, vh = window.innerHeight || 800;
    // jsdom and zero-size layouts report 0; fall back to sane defaults
    const w = r.width || 220, h = r.height || 240;
    setPos(placeFlyout(parent, w, h, vw, vh));
  }, [items]);

  const style = {
    position: "absolute", top: pos ? pos.top : -4,
    minWidth: 210, maxHeight: pos ? pos.maxHeight : 340, overflowY: "auto",
    background: "var(--bg-elevated)", border: "1px solid var(--border-accent)",
    borderRadius: "var(--radius-sm)", padding: 4, zIndex: 2,
    boxShadow: "0 12px 34px rgba(0,0,0,0.5)",
    visibility: pos ? "visible" : "hidden",
  };
  if (pos && pos.side === "left") { style.right = "100%"; style.marginRight = 2; }
  else { style.left = "100%"; style.marginLeft = 2; }

  return <div ref={ref} style={style}>{renderItems(items, true)}</div>;
}

/**
 * Lightweight right-click menu. Items: {label, icon, color, onClick, disabled,
 * hint, submenu:[...]}, or {sep:true}, or {header:"..."}.
 */
function ContextMenu({ x, y, items, onClose }) {
  const ref = useRef(null);
  const [pos, setPos] = useState({ left: x, top: y });
  const [openSub, setOpenSub] = useState(-1);

  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const vw = window.innerWidth || 1200, vh = window.innerHeight || 800;
    setPos(placeMenu(x, y, r.width || 220, r.height || 260, vw, vh));
  }, [x, y, items]);

  useEffect(() => {
    const close = () => onClose();
    const key = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("mousedown", close);
    window.addEventListener("keydown", key);
    window.addEventListener("blur", close);
    return () => {
      window.removeEventListener("mousedown", close);
      window.removeEventListener("keydown", key);
      window.removeEventListener("blur", close);
    };
  }, [onClose]);

  const menuStyle = {
    position: "fixed", zIndex: 300, minWidth: 200, maxWidth: 320,
    background: "var(--bg-elevated)", border: "1px solid var(--border-accent)",
    borderRadius: "var(--radius-sm)", padding: 4,
    boxShadow: "0 12px 34px rgba(0,0,0,0.5)",
    maxHeight: pos.maxHeight || undefined,
    overflowY: pos.maxHeight ? "auto" : "visible",
    overflowX: "visible",
  };

  const renderItems = (list, isSub) => list.map((it, i) => {
    if (it.sep) return <div key={"s" + i} style={{ height: 1, background: "var(--border-subtle)", margin: "4px 2px" }} />;
    if (it.header) return (
      <div key={"h" + i} style={Object.assign({}, tinyLabel, { padding: "5px 8px 3px", marginBottom: 0 })}>{it.header}</div>
    );
    const hasSub = it.submenu && it.submenu.length;
    return (
      <div key={i}
        onMouseEnter={() => !isSub && setOpenSub(hasSub ? i : -1)}
        onMouseDown={(e) => {
          e.stopPropagation();
          // The item acts on mousedown, and may open a dialog that focuses its
          // input; the browser would then move focus to the item clicked (gone
          // by then), leaving it nowhere. So the click doesn't move focus.
          e.preventDefault();
          if (it.disabled) return;
          if (hasSub) { setOpenSub(openSub === i ? -1 : i); return; }
          onClose();
          it.onClick && it.onClick();
        }}
        style={{
          display: "flex", alignItems: "center", gap: 8, padding: "5px 8px",
          borderRadius: 3, cursor: it.disabled ? "default" : "pointer",
          color: it.disabled ? "var(--text-muted)" : (it.color ? ac(it.color) : "var(--text-primary)"),
          fontSize: 12, position: "relative",
          background: openSub === i && hasSub ? "var(--bg-tertiary)" : "transparent",
        }}
        onMouseOver={(e) => { if (!it.disabled) e.currentTarget.style.background = "var(--bg-tertiary)"; }}
        onMouseOut={(e) => { if (openSub !== i) e.currentTarget.style.background = "transparent"; }}>
        <span style={{ width: 14, textAlign: "center", fontSize: 11, flexShrink: 0 }}>{it.icon || ""}</span>
        <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{it.label}</span>
        {it.hint ? <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)" })}>{it.hint}</span> : null}
        {hasSub ? <span style={{ color: "var(--text-muted)", fontSize: 9 }}>▶</span> : null}
        {hasSub && openSub === i ? (
          <Flyout items={it.submenu} renderItems={renderItems} />
        ) : null}
      </div>
    );
  });

  return (
    <div ref={ref} className="fadeIn"
      style={Object.assign({}, menuStyle, { left: pos.left, top: pos.top })}>
      {renderItems(items, false)}
    </div>
  );
}

   11. THUMBNAILS + VIRTUALIZED GRID
   ════════════════════════════════════════════ */

// Bounded object-URL cache. Without a cap, scrolling a 5000-card library
// leaks one blob URL per tile until the tab dies.
const THUMB_CACHE = new Map();
const THUMB_CAP = 500;

function cacheThumbUrl(id, url) {
  THUMB_CACHE.set(id, url);
  if (THUMB_CACHE.size > THUMB_CAP) {
    const firstKey = THUMB_CACHE.keys().next().value;
    const old = THUMB_CACHE.get(firstKey);
    THUMB_CACHE.delete(firstKey);
    if (old) { try { URL.revokeObjectURL(old); } catch (e) {} }
  }
}

function clearThumbCache() {
  for (const url of THUMB_CACHE.values()) { try { URL.revokeObjectURL(url); } catch (e) {} }
  THUMB_CACHE.clear();
}

/* ── drag-out-to-OS support ──────────────────────────────────────────
   Chromium exposes a non-standard "DownloadURL" drag type: set it on
   dragstart and the browser materialises a real file when you drop on the
   desktop or an Explorer window. The payload must be
   "<mime>:<filename>:<url>" and the URL has to exist at dragstart, which is
   synchronous — so card bytes are read ahead of time on hover.

   Worth knowing: this only works when the drop target is the OS. Dropping
   onto another *browser page* can never deliver a file, because a receiving
   page's dataTransfer.files is populated by the OS alone.
   ──────────────────────────────────────────────────────────────────── */

const DRAG_FILE_CACHE = new Map();   // recId -> { url, name, mime }
const DRAG_CACHE_CAP = 10;

function mimeForExt(ext) {
  if (ext === "png" || ext === "apng") return "image/png";
  if (ext === "json") return "application/json";
  return "application/octet-stream";
}

function cacheDragFile(id, entry) {
  DRAG_FILE_CACHE.set(id, entry);
  while (DRAG_FILE_CACHE.size > DRAG_CACHE_CAP) {
    const k = DRAG_FILE_CACHE.keys().next().value;
    const old = DRAG_FILE_CACHE.get(k);
    DRAG_FILE_CACHE.delete(k);
    if (old && old.url) { try { URL.revokeObjectURL(old.url); } catch (e) {} }
  }
}

function clearDragFileCache() {
  for (const e of DRAG_FILE_CACHE.values()) { try { URL.revokeObjectURL(e.url); } catch (err) {} }
  DRAG_FILE_CACHE.clear();
}

/** Attach the OS-drag payload if the bytes are already staged. */
function attachDownloadUrl(dataTransfer, rec) {
  const entry = DRAG_FILE_CACHE.get(rec.id);
  if (!entry || !entry.url) return false;
  try {
    dataTransfer.setData("DownloadURL", entry.mime + ":" + entry.name + ":" + entry.url);
    return true;
  } catch (e) { return false; }
}

function Thumb({ id, hasThumb, alt, radius, fit }) {
  const [url, setUrl] = useState(() => THUMB_CACHE.get(id) || null);
  useEffect(() => {
    let dead = false;
    const cached = THUMB_CACHE.get(id);
    if (cached) { setUrl(cached); return; }
    if (!hasThumb) { setUrl(null); return; }
    dbGet(STORE_THUMBS, id).then((blob) => {
      if (dead || !blob) return;
      const u = URL.createObjectURL(blob);
      cacheThumbUrl(id, u);
      setUrl(u);
    });
    return () => { dead = true; };
  }, [id, hasThumb]);

  if (!url) {
    return (
      <div style={{
        width: "100%", height: "100%", background: "var(--bg-tertiary)",
        borderRadius: radius || 0, display: "flex", alignItems: "center",
        justifyContent: "center", color: "var(--text-muted)", fontSize: 22,
      }}>{"\u{1F0A0}"}</div>
    );
  }
  return <img src={url} alt={alt || ""} draggable={false} style={{
    width: "100%", height: "100%", objectFit: fit || "cover",
    borderRadius: radius || 0, display: "block", background: "var(--bg-tertiary)",
  }} />;
}

/** Window-based virtualization for a fixed-size grid. */
function useGridVirtual(scrollRef, itemCount, tileW, tileH, gap) {
  const [dims, setDims] = useState({ w: 0, h: 0, top: 0 });
  // The grid isn't there on the first render of a new vault (the "add a
  // folder" screen is) or while cards load, so the element is looked for
  // after every render and measured as soon as it appears. With fixed deps,
  // it never was: the grid kept a width of 0, one column, a handful of cards.
  const bound = useRef({ el: null, off: null });
  useEffect(() => {
    const el = scrollRef.current;
    if (el === bound.current.el) return;
    if (bound.current.off) bound.current.off();
    bound.current = { el, off: null };
    if (!el) return;
    let raf = null;
    const measure = () => {
      setDims((prev) => {
        const w = el.clientWidth, h = el.clientHeight, top = el.scrollTop;
        if (prev.w === w && prev.h === h && prev.top === top) return prev;
        return { w, h, top };
      });
    };
    const onScroll = () => { if (raf) return; raf = requestAnimationFrame(() => { raf = null; measure(); }); };
    measure();
    el.addEventListener("scroll", onScroll, { passive: true });
    const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(measure) : null;
    if (ro) ro.observe(el);
    window.addEventListener("resize", measure);
    bound.current.off = () => {
      el.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", measure);
      if (ro) ro.disconnect();
      if (raf) cancelAnimationFrame(raf);
    };
  });
  useEffect(() => () => { if (bound.current.off) bound.current.off(); }, []);

  const cols = Math.max(1, Math.floor((dims.w + gap) / (tileW + gap)));
  const rows = Math.ceil(itemCount / cols);
  const rowH = tileH + gap;
  const firstRow = Math.max(0, Math.floor(dims.top / rowH) - GRID_BUFFER_ROWS);
  const visRows = Math.ceil(dims.h / rowH) + GRID_BUFFER_ROWS * 2;
  const lastRow = Math.min(rows, firstRow + visRows);
  return {
    cols, rows, rowH, totalHeight: rows * rowH,
    start: firstRow * cols,
    end: Math.min(itemCount, lastRow * cols),
    offsetY: firstRow * rowH,
    ready: dims.w > 0,
  };
}

      <div style={{ width: "100%", height: imgH, position: "relative" }}>
        <Thumb id={rec.id} hasThumb={rec.hasThumb} alt={rec.name} />
        <div style={{
          position: "absolute", top: 5, left: 5, display: "flex", gap: 3, flexWrap: "wrap", maxWidth: tileW - 10,
        }}>
          <Pill color={SPEC_COLOR[rec.spec] || "red"} style={onArt(SPEC_COLOR[rec.spec] || "red")}>{rec.spec === "none" ? "?" : rec.spec}</Pill>
          {rec.loreCount ? <Pill color="purple" style={onArt("purple")} title={rec.loreCount + " lorebook entries"}>{"\u{1F4D6}" + rec.loreCount}</Pill> : null}
          {rec.altCount ? <Pill color="cyan" style={onArt("cyan")} title={rec.altCount + " alternate greetings"}>{"↳" + rec.altCount}</Pill> : null}
        </div>
        <div style={{ position: "absolute", top: 5, right: 5, display: "flex", gap: 3 }}>
          {fav ? <Pill color="warm" style={onArt("warm")} title="Favourite">{"★"}</Pill> : null}
          {rec.pending ? <Pill color="purple" style={onArt("purple")} title={rec.pending + " unsaved card edit(s)"}>{"✎" + rec.pending}</Pill> : null}
          {isDupe ? <Pill color="red" style={onArt("red")} title="Duplicate of another card">{"⧉"}</Pill> : null}
        </div>
        {rec.flags && rec.flags.length ? (
          <div style={{
            position: "absolute", left: 0, right: 0, bottom: 0, display: "flex",
            gap: 2, padding: "3px 5px", background: "linear-gradient(transparent, rgba(0,0,0,0.65))",
          }}>
            {flagGroups(rec.flags).slice(0, 6).map((g, i) => {
              const d = flagDef(g.key);
              return (
                <span key={i} title={flagGroupTitle(g)}
                  style={{
                    width: 9, height: 9, borderRadius: "50%", flexShrink: 0,
                    background: ac(d.color), border: "1px solid rgba(0,0,0,0.4)",
                  }} />
              );
            })}
          </div>
        ) : null}
        {!rec.ok ? (
          <div style={{
            position: "absolute", inset: 0, background: "rgba(184,84,80,0.18)",
            display: "flex", alignItems: "flex-end", padding: 6,
          }}>
            <Pill color="red">unreadable</Pill>
          </div>
        ) : null}
      </div>
      <div style={{ padding: "7px 8px 8px" }}>
        <div title={rec.name} style={{
          fontSize: 12, fontWeight: 500, whiteSpace: "nowrap",
          overflow: "hidden", textOverflow: "ellipsis",
        }}>{rec.name || rec.file}</div>
        <div style={{
          display: "flex", justifyContent: "space-between", gap: 6, marginTop: 3,
          color: "var(--text-muted)", fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5,
        }}>
          <span title={rec.dir || "top level"} style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            {rec.dir ? "\u{1F4C2} " + rec.dir.split("/").pop() : (rec.creator ? "@" + rec.creator : "top level")}
          </span>
          <span style={{ flexShrink: 0 }}>{fmtTokens(rec.tokensCore)}</span>
        </div>
      </div>
    </div>
  );
}

function CardRow({ rec, selected, isDupe, onClick, onDouble, onContext, rootName, onDragStart, onDragEnd, draggable, onMouseEnter }) {

      draggable={draggable} onDragStart={onDragStart} onDragEnd={onDragEnd} onMouseEnter={onMouseEnter}
      style={{

        <Thumb id={rec.id} hasThumb={rec.hasThumb} radius={3} />
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ fontSize: 12.5, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            {rec.name || rec.file}
          </span>
          {rec.favorite ? <span style={{ color: "var(--accent-warm)", fontSize: 11 }}>{"★"}</span> : null}
          {rec.pending ? <span title={rec.pending + " unsaved edits"} style={{ color: "var(--accent-purple)", fontSize: 11 }}>{"✎"}</span> : null}
          {flagGroups(rec.flags).slice(0, 5).map((g, i) => {
            const d = flagDef(g.key);
            return <span key={i} title={flagGroupTitle(g)}
              style={{ width: 7, height: 7, borderRadius: "50%", background: ac(d.color), display: "inline-block" }} />;
          })}
        </div>
        <div style={Object.assign({}, monoTiny, { color: "var(--text-muted)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", marginTop: 1 })}>
          {rootName}{rec.dir ? " / " + rec.dir : ""} / {rec.file}
        </div>
      </div>
      <div style={{ display: "flex", gap: 4, alignItems: "center", flexShrink: 0 }}>
        {isDupe ? <Pill color="red">{"⧉"}</Pill> : null}
        {rec.loreCount ? <Pill color="purple">{"\u{1F4D6}" + rec.loreCount}</Pill> : null}
        <Pill color={SPEC_COLOR[rec.spec] || "red"}>{rec.spec}</Pill>
        <Pill color="muted">{fmtTokens(rec.tokensCore)}</Pill>
        <Pill color="muted">{fmtBytes(rec.size)}</Pill>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════
   12. FILTER SIDEBAR
   ════════════════════════════════════════════ */

const FLAGS = [
  { key: "favorite",   label: "Favourites",       color: "warm" },
  { key: "edited",     label: "Locally edited",   color: "purple" },
  { key: "hasLore",    label: "Has lorebook",     color: "purple" },
  { key: "hasAlts",    label: "Alt greetings",    color: "cyan" },
  { key: "untagged",   label: "No tags",          color: "muted" },
  { key: "broken",     label: "Unreadable",       color: "red" },
  { key: "dupe",       label: "Duplicates",       color: "red" },
  { key: "hasNotes",   label: "Has notes",        color: "blue" },
  { key: "flagged",    label: "Flagged",          color: "warm" },
  { key: "unsaved",    label: "Unsaved edits",    color: "purple" },
  { key: "aiPending",  label: "AI suggestions",   color: "blue" },
  // Not a narrowing filter: it brings trashed cards back into view.
  { key: "trash",      label: "Show trash",       color: "muted" },
];

function SectionHead({ children, right }) {
  return (
    <div style={{
      display: "flex", alignItems: "center", justifyContent: "space-between",
      padding: "10px 12px 6px", gap: 8,
    }}>
      <span style={Object.assign({}, tinyLabel, { marginBottom: 0 })}>{children}</span>
      {right}
    </div>
  );
}

/** One row of the folder tree: filter target and drop target. */
function FolderNode({ node, root, filters, patch, collapsed, setCollapsed, onDropCards, dragActive, folderRoles, onFolderMenu, dupeExcluder, privateTest }) {
  const isPrivate = privateTest ? privateTest(root.id, node.dir) : false;
  const [over, setOver] = useState(false);
  const noDupes = dupeExcluder ? dupeExcluder({ rootId: root.id, dir: node.dir }) : false;
  const explicitRole = folderRoles && folderRoles[node.key];
  const inheritedRole = effectiveFolderRole(root.id, node.dir, folderRoles, root.role);
  const meta = ROOT_ROLES[inheritedRole] || ROOT_ROLES.reference;
  const labelMeta = explicitRole ? (ROOT_ROLES[explicitRole] || ROOT_ROLES.reference) : null;
  const on = filters.dirs.indexOf(node.key) >= 0;
  const isCollapsed = !!collapsed[node.key];
  const hasKids = node.children.length > 0;
  const readOnly = isImportRoot(root);

  const toggleFilter = (e) => {
    const s = new Set(filters.dirs);
    if (e && (e.metaKey || e.ctrlKey)) {
      if (s.has(node.key)) s.delete(node.key); else s.add(node.key);
    } else {
      if (s.has(node.key) && s.size === 1) s.clear();
      else { s.clear(); s.add(node.key); }
    }
    patch({ dirs: Array.from(s) });
  };

  return (
    <Fragment>
      <div className="tagRow no-sel"
        onClick={toggleFilter}
        onContextMenu={(e) => onFolderMenu && onFolderMenu(root, node, e)}
        onDragOver={(e) => { if (!readOnly && dragActive) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; setOver(true); } }}
        onDragLeave={() => setOver(false)}
        onDrop={(e) => {
          setOver(false);
          if (readOnly) return;
          e.preventDefault();
          onDropCards(root, node.dir, e.dataTransfer.getData("text/vault-cards"));
        }}
        title={(node.dir || root.name) + (readOnly ? "  (read-only — can't accept moves)" : "\nDrop cards here to move them") +
          "\n" + node.own + " here, " + node.count + " including subfolders" +
          "\nRole: " + (ROOT_ROLES[inheritedRole] || {}).label + (explicitRole ? " (labelled)" : " (inherited)") +
          "\nClick to filter · Ctrl-click to add · Right-click to label"}
        style={{
          display: "flex", alignItems: "center", gap: 5, cursor: "pointer",
          padding: "3px 12px 3px " + (10 + node.depth * 11) + "px",
          background: over ? acRgba("green", 0.28) : on ? acRgba(meta.color, 0.15) : "transparent",
          borderLeft: over ? "2px solid var(--accent-green)" : "2px solid transparent",
        }}>
        {hasKids ? (
          <span onClick={(e) => { e.stopPropagation(); setCollapsed(Object.assign({}, collapsed, { [node.key]: !isCollapsed })); }}
            style={{ width: 9, fontSize: 8, color: "var(--text-muted)", flexShrink: 0 }}>
            {isCollapsed ? "▶" : "▼"}
          </span>
        ) : <span style={{ width: 9, flexShrink: 0 }} />}
        <span style={{ fontSize: 10, flexShrink: 0 }}>{node.isRoot ? meta.icon : (isCollapsed && hasKids ? "\u{1F4C1}" : "\u{1F4C2}")}</span>
        <span style={{
          flex: 1, fontSize: 11.5, minWidth: 0, overflow: "hidden",
          textOverflow: "ellipsis", whiteSpace: "nowrap",
          color: on ? ac(meta.color) : node.isRoot ? "var(--text-primary)" : "var(--text-secondary)",
          fontWeight: node.isRoot ? 500 : 400,
        }}>{node.name}</span>
        {node.isRoot && readOnly ? <span style={{ fontSize: 8, color: "var(--accent-cyan)" }}>RO</span> : null}
        {isPrivate ? <span className="folder-private" title="Private from the AI: nothing in here is sent to a model" style={{ fontSize: 10, flexShrink: 0 }}>{"🔒"}</span> : null}
        {noDupes ? (
          <span title="Ignored by the duplicate checker" style={{
            fontSize: 8, fontFamily: "'JetBrains Mono', monospace", flexShrink: 0,
            padding: "0 3px", borderRadius: 2, color: "var(--text-muted)",
            border: "1px solid var(--border-subtle)",
          }}>⧉off</span>
        ) : null}
        {labelMeta && !node.isRoot ? (
          <span title={"Labelled " + labelMeta.label} style={{
            fontSize: 8, fontFamily: "'JetBrains Mono', monospace", letterSpacing: "0.04em",
            padding: "0 4px", borderRadius: 2, flexShrink: 0,
            background: acRgba(labelMeta.color, 0.18),
            border: "1px solid " + acRgba(labelMeta.color, 0.4),
            color: ac(labelMeta.color),
          }}>{labelMeta.label.slice(0, 3).toUpperCase()}</span>
        ) : null}
        <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)", flexShrink: 0 })}>{fmtNum(node.count)}</span>
      </div>
      {!isCollapsed ? node.children.map((c) => (
        <FolderNode key={c.key} node={c} root={root} filters={filters} patch={patch}
          collapsed={collapsed} setCollapsed={setCollapsed} onDropCards={onDropCards} dragActive={dragActive}
          folderRoles={folderRoles} onFolderMenu={onFolderMenu} dupeExcluder={dupeExcluder} privateTest={privateTest} />
      )) : null}
    </Fragment>
  );
}

function FolderTree({ trees, filters, patch, collapsed, setCollapsed, onDropCards, dragActive, folderRoles, onFolderMenu, dupeExcluder, privateTest }) {
  if (!trees.length) return null;
  return (
    <div>
      {trees.map((t) => t.node ? (
        <FolderNode key={t.root.id} node={t.node} root={t.root} filters={filters} patch={patch}
          collapsed={collapsed} setCollapsed={setCollapsed} onDropCards={onDropCards} dragActive={dragActive}
          folderRoles={folderRoles} onFolderMenu={onFolderMenu} dupeExcluder={dupeExcluder} privateTest={privateTest} />
      ) : null)}
    </div>
  );
}

/**
 * The left sidebar. In Agent mode the part below Sort becomes the chat and
 * the sidebar widens so replies are readable; the search box stays. The chat
 * (`agent`) stays mounted while you look at the filters, so a running agent
 * keeps going.
 */
function FilterSidebar({
  filters, setFilters, tagIndex, roots, rootCounts, total, shown,
  settings, onOpenTagManager, folderTrees, onDropCards, dragActive, onNewFolder,
  folderRoles, onFolderMenu, flagCounts, dupeExcluder, mode, onMode, agent,
}) {
  const agentMode = mode === "agent";
  const [tagQuery, setTagQuery] = useState("");
  const [tagLimit, setTagLimit] = useState(60);
  const [collapsed, setCollapsed] = useState({});
  const searchRef = useRef(null);

  useEffect(() => {
    const h = (e) => {
      if (e.key === "/" && document.activeElement && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
        e.preventDefault();
        searchRef.current && searchRef.current.focus();
      }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  const patch = (p) => setFilters(Object.assign({}, filters, p));

  const toggleTag = (key, exclude) => {
    const inc = new Set(filters.tagsInc), exc = new Set(filters.tagsExc);
    if (exclude) {
      if (exc.has(key)) exc.delete(key); else { exc.add(key); inc.delete(key); }
    } else {
      if (inc.has(key)) inc.delete(key); else { inc.add(key); exc.delete(key); }
    }
    patch({ tagsInc: Array.from(inc), tagsExc: Array.from(exc) });
  };

  const visibleTags = useMemo(() => {
    const q = normTagName(tagQuery);
    let list = tagIndex.list;
    if (q) list = list.filter((t) => t.key.indexOf(q) >= 0);
    return list;
  }, [tagIndex, tagQuery]);

  const incSet = new Set(filters.tagsInc), excSet = new Set(filters.tagsExc);
  const activeCount = filters.tagsInc.length + filters.tagsExc.length +
    (filters.q ? 1 : 0) + Object.keys(filters.flags).filter((k) => filters.flags[k]).length +
    filters.specs.length + filters.dirs.length + (filters.flagKeys || []).length +
    (filters.tokenMin ? 1 : 0) + (filters.tokenMax ? 1 : 0);

  const sortBlock = (
    <div style={{ padding: "10px 12px", borderBottom: "1px solid var(--border-subtle)", flexShrink: 0 }}>
      <label style={tinyLabel}>Sort</label>
      <select value={filters.sort} onChange={(e) => patch({ sort: e.target.value })} style={selectStyle}>
        {SORTS.map((s) => <option key={s.key} value={s.key}>{s.label}</option>)}
      </select>
    </div>
  );

  return (
    <div style={{
      width: agentMode ? 420 : 272, flexShrink: 0, borderRight: "1px solid var(--border-subtle)",
      background: "var(--bg-secondary)", display: "flex", flexDirection: "column", height: "100%",
    }}>
      {/* search */}
      <div style={{ padding: 12, borderBottom: "1px solid var(--border-subtle)" }}>
        <div style={{ position: "relative" }}>
          <input ref={searchRef} value={filters.q} placeholder="Search  /"
            onChange={(e) => patch({ q: e.target.value })}
            onKeyDown={(e) => { if (e.key === "Escape") { e.target.blur(); patch({ q: "" }); } }}
            style={Object.assign({}, inputBase, { paddingRight: 56 })}
            onFocus={(e) => (e.target.style.borderColor = "var(--accent-warm-dim)")}
            onBlur={(e) => (e.target.style.borderColor = "var(--border-subtle)")} />
          {filters.q ? (
            <span onClick={() => patch({ q: "" })} style={{
              position: "absolute", right: 8, top: 8, cursor: "pointer",
              color: "var(--text-muted)", fontSize: 13,
            }}>×</span>
          ) : null}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 8 }}>
          <Toggle small color="cyan" checked={filters.deep} onChange={(v) => patch({ deep: v })} label="Deep text" />
          <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)", marginLeft: "auto" })}>
            {fmtNum(shown)}/{fmtNum(total)}
          </span>
        </div>
        {filters.deep ? (
          <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 5, lineHeight: 1.5 }}>
            Searches full descriptions, greetings and lorebook text. Slower — reads from the local cache.
          </div>
        ) : null}
        {onMode ? (
          <div style={{ display: "flex", gap: 5, marginTop: 9 }}>
            <SmallBtn color="warm" active={!agentMode} onClick={() => onMode("filters")} style={{ flex: 1 }}>Filters</SmallBtn>
            <SmallBtn color="blue" active={agentMode} onClick={() => onMode("agent")} style={{ flex: 1 }}>✦ Agent</SmallBtn>
          </div>
        ) : null}
      </div>

      {agentMode ? sortBlock : null}
      <div style={{ flex: 1, minHeight: 0, display: agentMode ? "flex" : "none", flexDirection: "column" }}>{agent}</div>

      <div className="vault-scroll" style={{ flex: 1, display: agentMode ? "none" : undefined }}>
        {sortBlock}

        {/* folder tree */}
        <div style={{ borderBottom: "1px solid var(--border-subtle)", paddingBottom: 8 }}>
          <SectionHead right={
            <div style={{ display: "flex", gap: 4 }}>
              {filters.dirs.length ? <SmallBtn color="muted" onClick={() => patch({ dirs: [] })}>all</SmallBtn> : null}
              <SmallBtn color="green" onClick={onNewFolder} title="Create a new subfolder">+ folder</SmallBtn>
            </div>
          }>
            Folders
          </SectionHead>
          <div style={{ fontSize: 9.5, color: "var(--text-muted)", padding: "0 12px 5px", lineHeight: 1.5 }}>
            Drag cards onto a folder to move them — or out of the window entirely
            to drop a real file into Explorer. <kbd>S</kbd> sends to your front end.
          </div>
          <FolderTree trees={folderTrees} filters={filters} patch={patch}
            collapsed={collapsed} setCollapsed={setCollapsed}
            onDropCards={onDropCards} dragActive={dragActive}
            folderRoles={folderRoles} onFolderMenu={onFolderMenu} dupeExcluder={dupeExcluder}
            privateTest={makePrivateTest(settings)} />
        </div>

        {/* spec + flags */}
        <div style={{ borderBottom: "1px solid var(--border-subtle)", paddingBottom: 10 }}>
          <SectionHead>Spec</SectionHead>
          <div style={{ display: "flex", gap: 5, padding: "0 12px", flexWrap: "wrap" }}>
            {["v3", "v2", "v1", "none"].map((s) => {
              const on = filters.specs.indexOf(s) >= 0;
              return (
                <div key={s} onClick={() => {
                  const set = new Set(filters.specs);
                  if (set.has(s)) set.delete(s); else set.add(s);
                  patch({ specs: Array.from(set) });
                }} style={{ cursor: "pointer" }}>
                  <Pill color={on ? (SPEC_COLOR[s] || "red") : "muted"}
                    style={on ? { background: acRgba(SPEC_COLOR[s] || "red", 0.22) } : {}}>
                    {s === "none" ? "no data" : s}
                  </Pill>
                </div>
              );
            })}
          </div>

          <SectionHead>Flags</SectionHead>
          <div style={{ display: "flex", gap: 5, padding: "0 12px", flexWrap: "wrap" }}>
            {FLAGS.map((f) => {
              const on = !!filters.flags[f.key];
              return (
                <div key={f.key} onClick={() => {
                  const flags = Object.assign({}, filters.flags);
                  if (on) delete flags[f.key]; else flags[f.key] = true;
                  patch({ flags });
                }} style={{ cursor: "pointer" }}>
                  <Pill color={on ? f.color : "muted"} style={on ? { background: acRgba(f.color, 0.22) } : {}}>
                    {f.label}
                  </Pill>
                </div>
              );
            })}
          </div>

          {flagCounts && flagCounts.length ? (
            <Fragment>
              <SectionHead right={(filters.flagKeys || []).length
                ? <SmallBtn color="muted" onClick={() => patch({ flagKeys: [] })}>all</SmallBtn> : null}>
                Flags
              </SectionHead>
              <div style={{ display: "flex", gap: 5, padding: "0 12px", flexWrap: "wrap" }}>
                {flagCounts.map((fc) => {
                  const on = (filters.flagKeys || []).indexOf(fc.key) >= 0;
                  const d = flagDef(fc.key);
                  return (
                    <div key={fc.key} onClick={() => {
                      const set = new Set(filters.flagKeys || []);
                      if (set.has(fc.key)) set.delete(fc.key); else set.add(fc.key);
                      patch({ flagKeys: Array.from(set) });
                    }} style={{ cursor: "pointer" }}>
                      <Pill color={d.color} style={on ? { background: acRgba(d.color, 0.3), border: "1px solid " + acRgba(d.color, 0.6) } : {}}>
                        {d.icon} {d.label} {fc.count}
                      </Pill>
                    </div>
                  );
                })}
              </div>
            </Fragment>
          ) : null}

          <SectionHead>Permanent tokens</SectionHead>
          <div style={{ display: "flex", gap: 6, padding: "0 12px", alignItems: "center" }}>
            <input type="number" placeholder="min" value={filters.tokenMin || ""}
              onChange={(e) => patch({ tokenMin: e.target.value ? Number(e.target.value) : 0 })}
              style={Object.assign({}, inputBase, { padding: "6px 8px", fontSize: 11 })} />
            <span style={{ color: "var(--text-muted)" }}>–</span>
            <input type="number" placeholder="max" value={filters.tokenMax || ""}
              onChange={(e) => patch({ tokenMax: e.target.value ? Number(e.target.value) : 0 })}
              style={Object.assign({}, inputBase, { padding: "6px 8px", fontSize: 11 })} />
          </div>
        </div>

        {/* tags */}
        <SectionHead right={
          <div style={{ display: "flex", gap: 4 }}>
            <SmallBtn color="warm" active={filters.tagMode === "and"} onClick={() => patch({ tagMode: "and" })} title="Card must have every selected tag">AND</SmallBtn>
            <SmallBtn color="cyan" active={filters.tagMode === "or"} onClick={() => patch({ tagMode: "or" })} title="Card must have any selected tag">OR</SmallBtn>
            <SmallBtn color="purple" onClick={onOpenTagManager} title="Merge, alias, hide and pin tags">⚙</SmallBtn>
          </div>
        }>
          Tags · {fmtNum(tagIndex.list.length)}
        </SectionHead>

        {(filters.tagsInc.length || filters.tagsExc.length) ? (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 4, padding: "0 12px 8px" }}>
            {filters.tagsInc.map((k) => (
              <div key={"i" + k} onClick={() => toggleTag(k, false)} style={{ cursor: "pointer" }}>
                <Pill color="warm" style={{ background: acRgba("warm", 0.22) }}>{tagIndex.byKey.get(k) ? tagIndex.byKey.get(k).label : k} ×</Pill>
              </div>
            ))}
            {filters.tagsExc.map((k) => (
              <div key={"e" + k} onClick={() => toggleTag(k, true)} style={{ cursor: "pointer" }}>
                <Pill color="red" style={{ background: acRgba("red", 0.2) }}>−{tagIndex.byKey.get(k) ? tagIndex.byKey.get(k).label : k} ×</Pill>
              </div>
            ))}
            <div onClick={() => patch({ tagsInc: [], tagsExc: [] })} style={{ cursor: "pointer" }}>
              <Pill color="muted">clear</Pill>
            </div>
          </div>
        ) : null}

        <div style={{ padding: "0 12px 8px" }}>
          <input value={tagQuery} onChange={(e) => setTagQuery(e.target.value)} placeholder="filter tags…"
            style={Object.assign({}, inputBase, { padding: "6px 9px", fontSize: 11 })} />
        </div>

        <div style={{ paddingBottom: 12 }}>
          {visibleTags.length === 0 ? (
            <div style={{ padding: "8px 12px", fontSize: 11, color: "var(--text-muted)" }}>No tags match.</div>
          ) : null}
          {visibleTags.slice(0, tagLimit).map((t) => {
            const inc = incSet.has(t.key), exc = excSet.has(t.key);
            return (
              <div key={t.key} className="tagRow no-sel"
                onClick={(e) => toggleTag(t.key, e.altKey)}
                onContextMenu={(e) => { e.preventDefault(); toggleTag(t.key, true); }}
                title={"Click to include · Alt-click or right-click to exclude\n" + t.embedded + " embedded, " + t.custom + " custom"}
                style={{
                  display: "flex", alignItems: "center", gap: 6, padding: "3px 12px", cursor: "pointer",
                  background: inc ? acRgba("warm", 0.15) : exc ? acRgba("red", 0.13) : "transparent",
                }}>
                <span style={{
                  width: 9, textAlign: "center", fontSize: 10, flexShrink: 0,
                  color: inc ? "var(--accent-warm)" : exc ? "var(--accent-red)" : "var(--text-muted)",
                }}>{inc ? "✓" : exc ? "−" : "·"}</span>
                <span style={{
                  flex: 1, fontSize: 11.5, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                  color: inc ? "var(--accent-warm)" : exc ? "var(--accent-red)" : "var(--text-secondary)",
                }}>{t.label}</span>
                {t.custom ? <span style={{ color: "var(--accent-purple)", fontSize: 9 }}>✎</span> : null}
                <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)", flexShrink: 0 })}>{fmtNum(t.count)}</span>
              </div>
            );
          })}
          {visibleTags.length > tagLimit ? (
            <div style={{ padding: "6px 12px" }}>
              <SmallBtn color="muted" onClick={() => setTagLimit(tagLimit + 200)}>
                show {fmtNum(Math.min(200, visibleTags.length - tagLimit))} more
              </SmallBtn>
            </div>
          ) : null}
        </div>
      </div>

      {activeCount > 0 && !agentMode ? (
        <div style={{ padding: 10, borderTop: "1px solid var(--border-subtle)" }}>
          <SmallBtn color="red" style={{ width: "100%", padding: "6px 10px" }}
            onClick={() => setFilters(makeDefaultFilters(filters.sort))}>
            Clear {activeCount} filter{activeCount === 1 ? "" : "s"}
          </SmallBtn>
        </div>
      ) : null}
    </div>
  );
}

/* ════════════════════════════════════════════
   AGENT CHAT (UI)
   The loop and the tools are pure (section 8e); this is the chat around
   them: sessions, the pinned card, approvals, the workspace dialog.
   ════════════════════════════════════════════ */

/** Read the relay's NDJSON reply to the end, calling onProgress (throttled) as it arrives. */
async function readAgentStream(r, onProgress) {
  let acc = aiEmptyStream();
  const split = ndjsonSplitter();
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let last = 0;
  for (;;) {
    const chunk = await reader.read();
    if (chunk.done) break;
    for (const ev of split.feed(dec.decode(chunk.value, { stream: true }))) acc = aiStreamStep(acc, ev);
    const now = Date.now();
    if (onProgress && now - last > 120) { last = now; onProgress(acc); }
  }
  for (const ev of split.end()) acc = aiStreamStep(acc, ev);
  return acc;
}

/** Wait, but give up at once if the signal aborts. */
function sleepFor(ms, signal) {
  return new Promise((resolve, reject) => {
    if (signal && signal.aborted) { reject(agentAbortError()); return; }
    const on = () => { clearTimeout(timer); reject(agentAbortError()); };
    const timer = setTimeout(() => { if (signal) signal.removeEventListener("abort", on); resolve(); }, ms);
    if (signal) signal.addEventListener("abort", on, { once: true });
  });
}

function agentSessionMeta(s) {
  return { id: s.id, title: s.title, createdAt: s.createdAt, updatedAt: s.updatedAt,
    count: (s.messages || []).filter((m) => m.role === "user").length,
    pinnedId: s.pinnedId || "", pinnedSid: s.pinnedSid || "", pinnedName: s.pinnedName || "" };
}

/** "fs_read agent.md", "read_card c12" — a tool call in a few words. */
function agentCallLabel(name, args, records) {
  let a = {};
  try { a = JSON.parse(args || "{}") || {}; } catch (e) { a = {}; }
  const card = (id) => { const r = (records || []).filter((x) => x.id === id || (x.sid && x.sid === String(id).toLowerCase()))[0]; return r ? r.name : id; };
  if (a.path !== undefined && /^fs_/.test(name)) return name + " " + (a.path || "(workspace)");
  if (name === "fs_move") return name + " " + a.from + " → " + a.to;
  if (a.id !== undefined) return name + " " + card(a.id) + (a.field ? " · " + agentFieldLabel(a.field) + (a.greeting ? " " + a.greeting : "") : "");
  if (name === "grep_cards") return name + " " + JSON.stringify(a.pattern || "");
  if (name === "list_cards") {
    const bits = ["query", "tag", "creator", "folder", "flag"].filter((k) => a[k]).map((k) => k + ": " + a[k]);
    return name + (bits.length ? " (" + bits.join(", ") + ")" : "");
  }
  return name;
}

const AGENT_CHANGE_VERB = { fs_write: "change", fs_edit: "edit", fs_delete: "delete", fs_move: "move" };

/** A card change the agent suggested (or, for vault-only tags, made), as the chat shows it. */
function AgentSuggestion({ d, onOpenCard, onUndo }) {
  const [diff, setDiff] = useState(false);
  const p = d.proposal;          // waits in Proposed changes
  const t = d.tagsApplied;       // vault-only tags put straight on
  const l = d.lorebookEdit;      // a lorebook change put straight into the vault's edits
  const bt = d.bulkTags;         // tags changed on many cards at once
  const cf = d.cardFile;         // a card file created or copied
  const mv = d.cardMoved;        // a card file moved to another folder
  const item = p || t || l || bt || cf || mv;
  const withDiff = (p && typeof p.before === "string") ? p : l;
  return (
    <div className="agent-suggestion" style={{ margin: "5px 0 5px 14px", padding: "7px 9px", borderRadius: "var(--radius-sm)",
      border: "1px solid " + acRgba("blue", 0.25), background: acRgba("blue", 0.04), fontSize: 11.5, lineHeight: 1.6, color: "var(--text-secondary)" }}>
      {p ? (
        <div>Suggested <strong>{p.what || "removing " + p.flag}</strong> for {p.card}. It's waiting in that card's Proposed changes.</div>
      ) : l ? (
        <div>Changed <strong>{l.what}</strong> of {l.card}. It's in the vault's edits; the card file changes when you save it.</div>
      ) : cf ? (
        <div className="agent-card-file">{cf.op === "copied" ? <span>Copied {cf.from} as <strong>{cf.card}</strong></span> : <span>Created <strong>{cf.card}</strong></span>}{" "}
          in {cf.folder}{cf.sid ? " (" + cf.sid + ")" : ""}. It's a new card file; delete it yourself if you don't want it.</div>
      ) : mv ? (
        <div className="agent-card-moved">Moved <strong>{mv.card}</strong>{mv.from ? " from " + mv.from : ""} to {mv.to}. The copy was checked before the original was removed.</div>
      ) : bt ? (
        <div className="agent-bulk-tags">
          {bt.kind === "card" ? "Card tags" : "Vault-only tags"} on <strong>{fmtNum(bt.count)} card{bt.count === 1 ? "" : "s"}</strong>:{" "}
          {bt.add.length ? "added " + bt.add.join(", ") : ""}{bt.add.length && bt.remove.length ? "; " : ""}{bt.remove.length ? "removed " + bt.remove.join(", ") : ""}.
          {bt.kind === "card" ? " In the vault's edits; the files change when you save them (select them, then Save to card)." : ""}
          <div style={{ fontSize: 10.5, color: "var(--text-muted)" }}>
            {bt.changes.slice(0, 6).map((c) => c.card).join(", ")}{bt.changes.length > 6 ? " and " + fmtNum(bt.changes.length - 6) + " more" : ""}
          </div>
        </div>
      ) : (
        <div>Added the vault-only tags <strong>{t.tags.join(", ")}</strong> to {t.card} (the ✦ AI panel applies them straight away).</div>
      )}
      {item.reason ? <div style={{ fontStyle: "italic", color: "var(--text-muted)" }}>{item.reason}</div> : null}
      <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 5, flexWrap: "wrap" }}>
        {withDiff ? <SmallBtn color="muted" onClick={() => setDiff(!diff)}>{diff ? "Hide diff" : "Show diff"}</SmallBtn> : null}
        {item.cardId && onOpenCard ? <SmallBtn color="blue" onClick={() => onOpenCard(item.cardId)}>Open card</SmallBtn> : null}
        {t || l || bt || mv ? (d.undone ? <Pill color="muted">undone</Pill> : <SmallBtn color="warm" onClick={onUndo}>Undo</SmallBtn>) : null}
      </div>
      {diff && withDiff ? <div style={{ marginTop: 6 }}><DiffView before={withDiff.before} after={withDiff.after || ""} /></div> : null}
    </div>
  );
}

function AgentChangeView({ d }) {
  const verb = d.tool === "fs_move" ? "Move " + d.path + " → " + d.to
    : d.tool === "fs_delete" ? "Delete " + d.path + (d.dir ? "/" : "")
    : (d.before == null ? "Create " : "Change ") + d.path;
  return (
    <div>
      <div style={{ fontSize: 11, color: "var(--text-secondary)", marginBottom: 5 }}>{verb}</div>
      {d.tool === "fs_write" || d.tool === "fs_edit" || (d.tool === "fs_delete" && !d.dir) ? (
        <DiffView before={d.before || ""} after={d.after || ""} />
      ) : null}
    </div>
  );
}

/** Markdown as React elements (parseMarkdown's tree). Never raw HTML. */
function MdInline({ nodes }) {
  return (nodes || []).map((n, k) => {
    if (n.t === "text") return <Fragment key={k}>{n.v}</Fragment>;
    if (n.t === "br") return <br key={k} />;
    if (n.t === "b") return <strong key={k}><MdInline nodes={n.c} /></strong>;
    if (n.t === "i") return <em key={k}><MdInline nodes={n.c} /></em>;
    if (n.t === "s") return <s key={k}><MdInline nodes={n.c} /></s>;
    if (n.t === "code") {
      return <code key={k} style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: "0.92em", padding: "1px 4px",
        borderRadius: 3, background: "var(--bg-input)", border: "1px solid var(--border-subtle)" }}>{n.v}</code>;
    }
    if (n.t === "a") {
      return <a key={k} href={n.href} title={n.href} target="_blank" rel="noopener noreferrer" style={{ color: "var(--accent-cyan)" }}><MdInline nodes={n.c} /></a>;
    }
    return null;
  });
}

function MdBlocks({ blocks, tight }) {
  const gap = tight ? 2 : 7;
  return blocks.map((b, k) => {
    if (b.t === "p") return <p key={k} style={{ margin: (k ? gap : 0) + "px 0 0" }}><MdInline nodes={b.inl} /></p>;
    if (b.t === "h") {
      const size = [0, 15, 14, 13, 12.5, 12, 12][b.level];
      return <div key={k} style={{ fontSize: size, fontWeight: 700, margin: (k ? 10 : 0) + "px 0 3px", color: "var(--text-primary)" }}><MdInline nodes={b.inl} /></div>;
    }
    if (b.t === "hr") return <div key={k} style={{ height: 1, background: "var(--border-subtle)", margin: "9px 0" }} />;
    if (b.t === "code") {
      return (
        <pre key={k} className="vault-scroll" style={{ margin: (k ? gap : 0) + "px 0 0", padding: 8, borderRadius: "var(--radius-sm)",
          background: "var(--bg-input)", border: "1px solid var(--border-subtle)", fontFamily: "'JetBrains Mono', monospace",
          fontSize: 11, whiteSpace: "pre-wrap", wordBreak: "break-word", maxHeight: 320 }}>{b.text}</pre>
      );
    }
    if (b.t === "quote") {
      return <div key={k} style={{ margin: (k ? gap : 0) + "px 0 0", paddingLeft: 9, borderLeft: "3px solid var(--border-accent)", color: "var(--text-secondary)" }}><MdBlocks blocks={b.blocks} /></div>;
    }
    if (b.t === "list") {
      const Tag = b.ordered ? "ol" : "ul";
      return (
        <Tag key={k} start={b.ordered ? b.start : undefined} style={{ margin: (k ? gap : 0) + "px 0 0", paddingLeft: 20 }}>
          {b.items.map((it, j) => <li key={j} style={{ margin: "2px 0" }}><MdBlocks blocks={it.blocks} tight /></li>)}
        </Tag>
      );
    }
    if (b.t === "table") {
      const cell = { padding: "3px 7px", border: "1px solid var(--border-subtle)", verticalAlign: "top" };
      return (
        <div key={k} className="vault-scroll" style={{ margin: (k ? gap : 0) + "px 0 0", overflowX: "auto" }}>
          <table style={{ borderCollapse: "collapse", fontSize: 11.5 }}>
            <thead><tr>{b.head.map((h, j) => <th key={j} style={Object.assign({}, cell, { textAlign: b.align[j] || "left", background: "var(--bg-tertiary)" })}><MdInline nodes={h} /></th>)}</tr></thead>
            <tbody>{b.rows.map((r, j) => <tr key={j}>{r.map((c, x) => <td key={x} style={Object.assign({}, cell, { textAlign: b.align[x] || "left" })}><MdInline nodes={c} /></td>)}</tr>)}</tbody>
          </table>
        </div>
      );
    }
    return null;
  });
}

function Markdown({ text }) {
  const blocks = useMemo(() => parseMarkdown(text), [text]);
  return <div className="md" style={{ fontSize: 12, lineHeight: 1.6, wordBreak: "break-word" }}><MdBlocks blocks={blocks} /></div>;
}

/** A looping loader, one of several, with a phrase that changes every few seconds. */
function AgentLoader({ thinking }) {
  const [kind] = useState(() => pickOne(AGENT_LOADERS));
  const [phrase, setPhrase] = useState(() => pickOne(thinking ? AGENT_THINKING_PHRASES : AGENT_WAITING_PHRASES));
  useEffect(() => {
    setPhrase((p) => pickOne(thinking ? AGENT_THINKING_PHRASES : AGENT_WAITING_PHRASES, p));
    const t = setInterval(() => setPhrase((p) => pickOne(thinking ? AGENT_THINKING_PHRASES : AGENT_WAITING_PHRASES, p)), 2600);
    return () => clearInterval(t);
  }, [thinking]);
  const n = { dots: 3, orbit: 3, bars: 4, ring: 2, cards: 2, shimmer: 1 }[kind] || 3;
  return (
    <div className="agent-loader" style={{ display: "flex", alignItems: "center", gap: 9, fontSize: 11.5, color: "var(--text-secondary)", fontStyle: "italic" }}>
      <span className={"ag-loader ag-" + kind} aria-hidden="true">{Array.from({ length: n }, (_, k) => <i key={k}></i>)}</span>
      <span>{phrase}</span>
    </div>
  );
}

/** A reply's reasoning, folded away until you ask for it. */
function AgentThinking({ text, open, onToggle }) {
  if (!text) return null;
  return (
    <div style={{ margin: "4px 0" }}>
      <div onClick={onToggle} style={{ cursor: "pointer", fontSize: 10.5, color: "var(--text-muted)", userSelect: "none" }}>
        {open ? "▾" : "▸"} Thinking ({fmtNum(text.length)} characters)
      </div>
      {open ? (
        <div className="vault-scroll" style={{ marginTop: 4, padding: "6px 9px", maxHeight: 260, fontSize: 11, lineHeight: 1.55,
          whiteSpace: "pre-wrap", wordBreak: "break-word", color: "var(--text-muted)", fontStyle: "italic",
          borderLeft: "2px solid var(--border-accent)", background: "var(--bg-input)", borderRadius: "0 var(--radius-sm) var(--radius-sm) 0" }}>{text}</div>
      ) : null}
    </div>
  );
}

function AgentMessage({ m, i, open, onToggle, onUndo, onAnswer, onOpenCard, onCopy, onFork, running, records, persona }) {
  const bubble = {
    padding: "7px 10px", borderRadius: "var(--radius-sm)", fontSize: 12, lineHeight: 1.6,
    whiteSpace: "pre-wrap", wordBreak: "break-word",
  };
  // Copy, and fork a new chat from here.
  const acts = (forkTitle) => (
    <div className="agent-msg-acts">
      {onCopy && m.text ? <button type="button" title="Copy the text" onClick={() => onCopy(m.text)}>⧉ Copy</button> : null}
      {onFork && !running ? <button type="button" title={forkTitle} onClick={() => onFork(i)}>⑂ Fork</button> : null}
    </div>
  );
  if (m.role === "user") {
    return (
      <div className="agent-msg" style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", margin: "8px 0" }}>
        <div className="agent-user-msg" style={Object.assign({}, bubble, { maxWidth: "88%", background: acRgba("blue", 0.14), border: "1px solid " + acRgba("blue", 0.3) })}>
          {(m.images || []).length ? (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: m.text || (m.files || []).length ? 6 : 0 }}>
              {m.images.map((x, k) => (
                <a key={k} href={x.url} target="_blank" rel="noopener noreferrer" title={x.name}>
                  <img src={x.url} alt={x.name} style={{ maxWidth: 150, maxHeight: 110, borderRadius: 4, display: "block" }} />
                </a>
              ))}
            </div>
          ) : null}
          {(m.files || []).length ? (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: m.text ? 6 : 0 }}>
              {m.files.map((f, k) => <Pill key={k} color="cyan" title={fmtNum(String(f.text || "").length) + " characters"}>{"\u{1F4C4}"} {f.name}</Pill>)}
            </div>
          ) : null}
          {m.text}
        </div>
        {acts("Fork from here: a new chat with the messages before this one, and this message back in the box to edit")}
      </div>
    );
  }
  if (m.role === "assistant") {
    if (!m.text && !m.think) return null;
    // A step that only called tools: just its thinking, if it had any.
    if (!m.text) return <div style={{ marginLeft: 2 }}><AgentThinking text={m.think} open={open} onToggle={onToggle} /></div>;
    return (
      <div className="agent-reply agent-msg" style={{
        margin: "10px 0", padding: "8px 11px 9px", borderRadius: "var(--radius-sm)",
        background: acRgba("purple", 0.07), border: "1px solid " + acRgba("purple", 0.22),
        borderLeft: "3px solid var(--accent-purple)", color: "var(--text-primary)",
      }}>
        <div className="agent-reply-head" style={{ display: "flex", alignItems: "baseline", gap: 6, marginBottom: 4, fontSize: 10.5 }}>
          <span style={{ color: "var(--accent-purple)", fontWeight: 600 }}>✦ {persona}</span>
          {m.model ? <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)" })}>· {m.model}</span> : null}
          <span style={{ marginLeft: "auto" }}>{acts("Fork from here: a new chat with everything up to this reply")}</span>
        </div>
        <AgentThinking text={m.think} open={open} onToggle={onToggle} />
        <Markdown text={m.text} />
      </div>
    );
  }
  if (m.role === "note") {
    const c = m.kind === "error" ? "red" : m.kind === "stepcap" || m.kind === "ratelimit" ? "warm" : "muted";
    return <div style={{ fontSize: 10.5, color: ac(c), margin: "6px 2px", lineHeight: 1.5, fontStyle: m.kind === "error" ? "normal" : "italic" }}>{m.text}</div>;
  }
  // A tool call and its result.
  const d = m.display || {};
  const change = AGENT_CHANGE_VERB[m.name] && (d.applied || d.rejected);
  return (
    <div style={{ margin: "4px 0" }}>
      <div onClick={onToggle} style={{
        display: "flex", alignItems: "center", gap: 6, cursor: "pointer", fontSize: 10.5,
        color: m.ok ? "var(--text-muted)" : "var(--accent-red)", fontFamily: "'JetBrains Mono', monospace",
      }}>
        <span>{open ? "▾" : "▸"}</span>
        <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>{agentCallLabel(m.name, m.args, records)}</span>
        <span>{m.ok ? "✓" : "✕"}</span>
      </div>
      {change ? (
        <div style={{ margin: "5px 0 5px 14px", padding: 8, borderRadius: "var(--radius-sm)", border: "1px solid var(--border-subtle)" }}>
          <AgentChangeView d={d} />
          <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 6 }}>
            {d.rejected ? <Pill color="muted">rejected</Pill> : d.undone ? <Pill color="muted">undone</Pill> : <Pill color="green">applied</Pill>}
            {d.applied && !d.undone ? <SmallBtn color="warm" onClick={() => onUndo(i)}>Undo</SmallBtn> : null}
          </div>
        </div>
      ) : null}
      {d.proposal || d.tagsApplied || d.lorebookEdit || d.bulkTags || d.cardFile || d.cardMoved ? <AgentSuggestion d={d} onOpenCard={onOpenCard} onUndo={() => onUndo(i)} /> : null}
      {d.todo ? (
        <div style={{ margin: "5px 0 5px 14px", fontSize: 11.5, lineHeight: 1.7 }}>
          {d.todo.map((x, j) => <div key={j} style={{ color: x.done ? "var(--text-muted)" : "var(--text-secondary)" }}>{x.done ? "☑" : "☐"} {x.text}</div>)}
        </div>
      ) : null}
      {d.question ? (
        <div style={{ margin: "6px 0", padding: 9, borderRadius: "var(--radius-sm)", background: acRgba("purple", 0.08), border: "1px solid " + acRgba("purple", 0.3) }}>
          <Markdown text={d.question} />
          {d.options && d.options.length ? (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginTop: 7 }}>
              {d.options.map((o) => <SmallBtn key={o} color="purple" disabled={running} onClick={() => onAnswer(o)}>{o}</SmallBtn>)}
            </div>
          ) : null}
        </div>
      ) : null}
      {d.summary ? (
        <div className="agent-reply" style={{
          margin: "10px 0", padding: "8px 11px 9px", borderRadius: "var(--radius-sm)",
          background: acRgba("purple", 0.07), border: "1px solid " + acRgba("purple", 0.22),
          borderLeft: "3px solid var(--accent-purple)", color: "var(--text-primary)",
        }}>
          <div style={{ fontSize: 10.5, color: "var(--accent-purple)", fontWeight: 600, marginBottom: 4 }}>✦ {persona} · done</div>
          <Markdown text={d.summary} />
        </div>
      ) : null}
      {open ? (
        <div style={{ margin: "4px 0 6px 14px" }}>
          <div style={Object.assign({}, tinyLabel, { marginBottom: 2 })}>Arguments</div>
          <pre className="vault-scroll" style={{ margin: 0, maxHeight: 120, fontSize: 10.5, whiteSpace: "pre-wrap", wordBreak: "break-word", color: "var(--text-secondary)" }}>{m.args}</pre>

/** What a chat had pinned, for the Chats list. */
function agentPinLabel(meta, records) {
  if (!meta.pinnedId) return "All characters";
  const r = agentPinnedRecord(meta, records);
  if (r) return r.name;
  return (meta.pinnedName || meta.pinnedId) + " (no longer in the vault)";
}

/** Browse and edit agent-workspace/, the same files the agent uses. */
function WorkspaceModal({ onClose, onToast, initialPath }) {
  const [entries, setEntries] = useState(null);
  const [err, setErr] = useState("");
  const [file, setFile] = useState(null);     // { path, text, ver } as last read or saved
  const [draft, setDraft] = useState("");
  const [newName, setNewName] = useState("");
  const [full, setFull] = useState(false);
  const [openDirs, setOpenDirs] = useState({});    // folders start closed

  const load = async () => {
    try { const d = await agentWs.list(""); setEntries(d.entries); setErr(""); }
    catch (e) { setErr(e.message); }
  };
  useEffect(() => { load(); if (initialPath) open(initialPath); }, []);

  const open = async (p) => {
    try {
      const f = await agentWs.read(p);
      setFile(f); setDraft(f.text); setErr("");
      // Show where it lives: open the folders above it.
      setOpenDirs((o) => { const n = Object.assign({}, o); for (const a of wsAncestors(f.path)) n[a] = true; return n; });
    } catch (e) { setErr(e.message); }
  };
  const dirty = !!file && draft !== file.text;
  const stale = (e) => (e && e.status === 409
    ? file.path + " changed on disk since you opened it (the agent or another editor wrote it). Reload it; your text stays here until you do."
    : e.message);
  const save = async () => {
    if (!file) return;
    try {
      const w = await agentWs.write(file.path, draft, file.ver);
      setFile({ path: w.path, text: draft, ver: w.ver });
      setErr("");
      onToast("Saved " + w.path, "green");
      load();
    } catch (e) { setErr(stale(e)); }
  };
  const create = async () => {
    const p = newName.trim();
    if (!p) return;
    try { const w = await agentWs.write(p, "", null); setNewName(""); await load(); open(w.path); }
    catch (e) { setErr(e.message); }
  };
  const remove = async () => {
    if (!file || !window.confirm("Delete " + file.path + " from the agent's workspace?")) return;
    try { await agentWs.del(file.path, file.ver); setFile(null); setDraft(""); setErr(""); load(); }
    catch (e) { setErr(stale(e)); }
  };

  return (
    <Modal title="Agent workspace" icon={"\u{1F4C2}"} width={900} onClose={onClose} full={full}
      subtitle="agent-workspace/ next to serve.js. You can edit these files in any editor too."
      headerExtra={
        <SmallBtn color="muted" onClick={() => setFull(!full)} title={full ? "Back to normal size" : "Almost full screen"}>
          {full ? "⤡ Restore" : "⤢ Full screen"}
        </SmallBtn>
      }
      footer={
        <Fragment>
          <SmallBtn color="green" disabled={!dirty} onClick={save}>Save</SmallBtn>
          <SmallBtn color="muted" disabled={!file} onClick={() => file && open(file.path)}>Reload</SmallBtn>
          <SmallBtn color="red" disabled={!file} onClick={remove}>Delete</SmallBtn>
          <span style={{ width: 1, height: 18, background: "var(--border-subtle)", margin: "0 4px" }} />
          <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="notes/new-file.md"
            onKeyDown={(e) => { if (e.key === "Enter") create(); }}
            style={Object.assign({}, inputBase, { width: 180, padding: "4px 8px", fontSize: 11 })} />
          <SmallBtn color="blue" disabled={!newName.trim()} onClick={create}>New file</SmallBtn>
        </Fragment>
      }>
      {err ? <AiNotice color="red">{err}</AiNotice> : null}
      <div style={{ display: "grid", gridTemplateColumns: "220px 1fr", gap: 12, minHeight: 360, flex: full ? 1 : undefined }}>
        <div className="vault-scroll" style={{ maxHeight: full ? "none" : 460, borderRight: "1px solid var(--border-subtle)", paddingRight: 8 }}>
          {entries === null ? <div style={{ fontSize: 11, color: "var(--text-muted)" }}>Loading…</div> : null}
          {wsTreeRows(entries, openDirs).map((r) => r.empty ? (
            <div key={r.path} style={{ fontSize: 10.5, padding: "2px 4px", paddingLeft: 18 + 12 * r.depth, color: "var(--text-muted)", fontStyle: "italic" }}>(empty)</div>
          ) : (
            <div key={r.path} className={r.dir ? "ws-dir" : "ws-file"}
              onClick={() => { if (r.dir) setOpenDirs((o) => Object.assign({}, o, { [r.path]: !o[r.path] })); else open(r.path); }}
              style={{
                fontSize: 11.5, padding: "3px 4px", cursor: "pointer", borderRadius: 3, userSelect: "none",
                paddingLeft: 4 + 12 * r.depth + (r.dir ? 0 : 14),
                color: r.dir ? "var(--text-primary)" : file && file.path === r.path ? "var(--accent-blue)" : "var(--text-secondary)",
                background: file && file.path === r.path ? acRgba("blue", 0.1) : "transparent",
              }}>{r.dir ? (r.isOpen ? "▾ " : "▸ ") + r.name + "/" : r.name}</div>
          ))}
        </div>
        <div style={{ display: "flex", flexDirection: "column", minHeight: 0 }}>
          {file ? (
            <Fragment>
              <div style={Object.assign({}, monoTiny, { color: "var(--text-muted)", marginBottom: 5 })}>
                {file.path}{dirty ? " · not saved" : ""}
              </div>
              <textarea value={draft} onChange={(e) => setDraft(e.target.value)} rows={22} spellCheck={false}
                style={Object.assign({}, inputBase, { resize: full ? "none" : "vertical", flex: full ? 1 : undefined,
                  fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, lineHeight: 1.55 })} />
            </Fragment>
          ) : <div style={{ fontSize: 12, color: "var(--text-muted)", paddingTop: 8 }}>Pick a file on the left.</div>}
        </div>
      </div>
    </Modal>
  );
}

/**
 * The chat. Everything it does to the outside world goes through the pure
 * loop and tools, handed the workspace, the vault (read-only), the model via
 * the relay, and your approval.
 */
function AgentPanel({ ai, relay, agent, onSaveAgent, records, editsMap, tagIndex, sortKey, onOpenAiSettings, onToast, onPatchEdit, onPatchMany, onOpenCard, roots, onCardFiles, dupes }) {
  const [sessions, setSessions] = useState([]);
  const [sess, setSess] = useState(() => newAgentSession(uid(), Date.now()));
  const [input, setInput] = useState("");
  const [running, setRunning] = useState(false);
  const [live, setLive] = useState(null);
  const [status, setStatus] = useState("");
  const [pending, setPending] = useState(null);   // { change, done(bool) }
  const [modal, setModal] = useState(null);       // sessions | options | files
  const [pinQuery, setPinQuery] = useState("");
  const [pinOpen, setPinOpen] = useState(false);
  const [openTools, setOpenTools] = useState({});
  const [attach, setAttach] = useState({ images: [], files: [] });   // for the next message
  const [condensing, setCondensing] = useState(false);
  const [filesAt, setFilesAt] = useState("");      // the file the Files dialog opens on
  const [pinnedText, setPinnedText] = useState("");  // the pinned card as the model sees it, for the meter
  const [dragOver, setDragOver] = useState(false);
  const fileInput = useRef(null);
  const sessRef = useRef(sess);
  const runRef = useRef(null);
  const rateLog = useRef([]);
  const listRef = useRef(null);
  const latest = useRef(null);
  latest.current = { ai, relay, agent, records, editsMap, tagIndex, onPatchEdit, onPatchMany, roots, onCardFiles, dupes };

  const ready = aiReady(ai, relay);

  /** Which card the user is looking at: a pointer only; the agent reads the card itself when it needs to. */
  const pinnedBlock = async (s) => {
    const pr = agentPinnedRecord(s, latest.current.records);
    return agentPinnedNote(pr);
  };
  useEffect(() => {
    let dead = false;
    pinnedBlock(sess).then((t) => { if (!dead) setPinnedText(t); });
    return () => { dead = true; };
  }, [sess.pinnedId, sess.pinnedSid, editsMap]);

  // Photos stay out of requests once this model has refused one.
  const noImagesFor = (s) => !!(s.noImagesModel && s.noImagesModel === (latest.current.relay.model || ""));
  const usageExtra = { persona: ai.persona, pinned: pinnedText, noImages: noImagesFor(sess) };
  usageExtra.budgetChars = agentBudgetChars(agent, ai, agentFixedChars(sess, agent, usageExtra));
  const usage = agentContextUsage(sess, agent, usageExtra);

  const show = (s) => {
    sessRef.current = s;
    setSess(Object.assign({}, s));
    setOpenTools({});
  };

  // Keep the workspace's tools/ reference in step with the built-in tools. Quiet: edited files are left alone.
  useEffect(() => { ensureAgentToolDocs(agentWs); }, []);

  // Load the saved chats and carry on with the most recent one.
  useEffect(() => {
    let dead = false;
    dbAll(STORE_AGENT).then((all) => {
      if (dead) return;
      const list = (all || []).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      setSessions(list.map(agentSessionMeta));
      if (list.length && !sessRef.current.messages.length) show(list[0]);
    });
    return () => { dead = true; if (runRef.current) runRef.current.abort(); };
  }, []);

  // Follow new messages only while you're at the bottom; scrolled up to read,
  // you stay put, with a button back down.
  const stickRef = useRef(true);
  const [atBottom, setAtBottom] = useState(true);
  const [full, setFull] = useState(false);   // the chat near full screen, over the vault
  const onListScroll = () => {
    const el = listRef.current;
    if (!el) return;
    const near = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    stickRef.current = near;
    setAtBottom(near);
  };
  const toBottom = () => {
    stickRef.current = true;
    setAtBottom(true);
    const el = listRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  };
  useEffect(() => {
    const el = listRef.current;
    if (el && stickRef.current) el.scrollTop = el.scrollHeight;
  }, [sess.messages.length, live, pending]);
  // Opening a chat starts at its end.
  useEffect(() => { toBottom(); }, [sess.id]);

  const deletedChats = useRef(new Set());
  const persist = (s) => {
    s.updatedAt = Date.now();
    sessRef.current = s;
    setSess(Object.assign({}, s));
    const meta = agentSessionMeta(s);
    setSessions((prev) => [meta].concat(prev.filter((x) => x.id !== s.id)));
    return dbPut(STORE_AGENT, s);
  };

  const emit = (m) => {
    const s = sessRef.current;
    s.messages = s.messages.concat([Object.assign({ at: Date.now() }, m)]);
    persist(s);
    if (m.role === "note" && m.kind === "error") {
      const L = latest.current;
      logProblem("Agent chat", m.text, "model: " + ((L.relay && L.relay.model) || "?") +
        " · tool calls: " + (s.textMode || L.agent.toolMode === "text" ? "as text" : "native"));
    } else if (m.role === "tool" && m.ok === false) {
      logProblem("Agent tool", m.name + " failed: " + String(m.result || "").slice(0, 500), "", "warn");
    }
  };

  const vault = useMemo(() => ({
    records: () => latest.current.records,
    // The duplicate finder's groups, exactly as the Dupes view shows them.
    dupes: () => latest.current.dupes,
    body: (id) => dbGet(STORE_BODIES, id),
    edit: (fp) => latest.current.editsMap.get(fp),
    notes: (fp) => dbAllByIndex(STORE_AINOTES, "fingerprint", fp),
    aiSettings: () => latest.current.ai,
    relayModel: () => latest.current.relay.model || "",
    knownTags: () => aiTagVocabulary(latest.current.tagIndex),
    scanBodies: scanAllBodies,
    // The agent's only way to change a card: a suggestion in its Proposed changes.
    propose: (fp, bucket, value, meta) => latest.current.onPatchEdit(fp, (cur) => {
      const next = mergeProposal(cur.aiProposal, bucket, value, meta);
      // For ↻: this card's suggestions before the turn's first change, and after its last.
      const lt = sessRef.current && sessRef.current.lastTurn;
      if (lt) {
        lt.proposals = lt.proposals || {};
        if (!lt.proposals[fp]) lt.proposals[fp] = { before: cur.aiProposal || null };
        lt.proposals[fp].after = next;
      }
      return { aiProposal: next };
    }),
    // Only when the ✦ AI panel applies vault-only tags straight away; never the card's own tags.
    // bulk_tags: many cards at once, straight into the vault's edits. `value` is the edit's own
    // value: card tags (null = the file's own) or vault-only tags.
    // Card files: create, copy, move (never delete), through the vault's own verified writes.
    roots: () => latest.current.roots || [],
    createCard: (rootId, dir, fields) => latest.current.onCardFiles.create(rootId, dir, fields),
    copyCard: (rec, rootId, dir, name) => latest.current.onCardFiles.copy(rec, rootId, dir, name),
    moveCard: (rec, rootId, dir) => latest.current.onCardFiles.move(rec, rootId, dir),
    applyTags: (kind, list) => latest.current.onPatchMany(list.map((c) => ({ fp: c.fp,
      patch: kind === "card" ? { tags: c.value || null } : { vaultTags: c.value || [] } }))),
    // edit_lorebook: straight into the vault's edits (null = back to the file's own lorebook).
    applyLorebook: (fp, lorebook) => latest.current.onPatchEdit(fp, () => ({ lorebook: lorebook || null })),
    applyVaultTags: (fp, tags) => latest.current.onPatchEdit(fp, (cur) => ({
      vaultTags: vaultTagsOf(cur).concat(tags.filter((t) => !vaultTagsOf(cur).some((x) => normTagName(x) === normTagName(t)))),
    })),
  }), []);

  /** Wait out a rate limit, with a note in the chat the first time. */
  const makeGate = (signal) => async (kind, n) => {
    const st = latest.current.agent;
    const checks = kind === "requests" ? [["requests", st.requestsPerMin, 1], ["tokens", st.tokensPerMin, 1]]
      : kind === "reads" ? [["reads", st.cardReadsPerMin, n || 1]]
      : kind === "edits" ? [["edits", st.unpinnedEditsPerMin, n || 1]] : [];
    let noted = false;
    for (;;) {
      let wait = 0, which = "";
      for (const c of checks) {
        const w = rateWait(rateLog.current, Date.now(), c[0], c[1], c[2]);
        if (w > wait) { wait = w; which = c[0]; }
      }
      if (!wait) break;
      if (!noted) {
        noted = true;
        const label = which === "tokens" ? "tokens per minute" : which === "reads" ? "card reads per minute"
          : which === "edits" ? "card changes on unpinned cards per minute" : "model requests per minute";
        emit({ role: "note", kind: "ratelimit", text: "Waiting (rate limit): " + label + ". It carries on by itself." });
      }
      setStatus("Waiting (rate limit) · " + Math.ceil(wait / 1000) + "s");
      await sleepFor(Math.min(wait, 1000), signal);
    }
    if (kind === "requests") rateLog.current = rateRecord(rateLog.current, Date.now(), "requests", 1);
