    "as written. If the field is already tight, return it unchanged.",
};

/* Which proposal bucket each structured output fills. */
const AI_PROPOSAL_KINDS = { polish: "fields", tags: "vaultTags", critique: "flags" };

/* Fields Tighten may be pointed at. System prompt and post-history
   instructions are left out: rewording them changes behaviour, not prose. */
const AI_TIGHTEN_FIELDS = ["description", "personality", "scenario", "first_mes", "mes_example", "creator_notes"];

/* ── your own prompts ─────────────────────────────────────────────────────
   Custom actions beside the built-in ones. Each answers in plain text, is
   cached like any other answer, and appears in every card's ✦ AI tab. Keys
   are "c:" + id. Options:
     bulk          can run on a selection of many cards at once
     allFields     reads every card field; otherwise only `fields`
     agentVisible  the agent chat can read its answers (it never runs them) */

const AI_CUSTOM_MAX = 30;
const AI_CUSTOM_COLORS = ["cyan", "purple", "warm", "green", "pink", "blue"];

function sanitizeCustomPrompts(list) {
  const out = [];
  const seen = {};
  for (const x of Array.isArray(list) ? list : []) {
    if (!x || typeof x !== "object") continue;
    const id = String(x.id || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 24);
    if (!id || seen[id]) continue;
    seen[id] = true;
    const icon = Array.from(String(x.icon || "").trim())[0] || "✎";
    out.push({
      id,
      label: String(x.label == null ? "" : x.label).replace(/[\r\n\t]+/g, " ").slice(0, 40),
      icon,
      color: AI_CUSTOM_COLORS.indexOf(x.color) >= 0 ? x.color : "cyan",
      template: String(x.template == null ? "" : x.template),
      bulk: !!x.bulk,
      allFields: x.allFields !== false,
      fields: (Array.isArray(x.fields) ? x.fields : []).filter((k, i, a) => CARD_FIELDS.some((f) => f.key === k) && a.indexOf(k) === i),
      agentVisible: !!x.agentVisible,
    });
    if (out.length >= AI_CUSTOM_MAX) break;
  }
  return out;
}

/** Custom prompts as action definitions, like AI_ACTIONS. */
function aiCustomActions(cfg) {
  const list = cfg && Array.isArray(cfg.customPrompts) ? cfg.customPrompts : [];
  return list.map((c) => {
    const fieldNames = (c.fields || []).map((k) => (CARD_FIELDS.filter((f) => f.key === k)[0] || { label: k }).label);
    return {
      key: "c:" + c.id, id: c.id, custom: true, output: "text",
      label: String(c.label || "").trim() || "Untitled prompt", icon: c.icon || "✎", color: c.color || "cyan",
      hint: "Your own prompt" + (c.allFields === false ? ", reading " + (fieldNames.join(", ") || "no fields yet") : "") +
        (c.bulk ? ". It can run on a selection of cards." : "."),
      template: String(c.template || ""), bulk: !!c.bulk, allFields: c.allFields !== false,
      fields: c.fields || [], agentVisible: !!c.agentVisible,
    };
  });
}

/** Every action: the built-in ones, then your own. */
function aiAllActions(cfg) {
  return AI_ACTIONS.concat(aiCustomActions(cfg));
}

/** An action by key. Custom ones ("c:…") need the settings they live in. */
function aiActionDef(key, cfg) {
  for (const a of AI_ACTIONS) if (a.key === key) return a;
  if (cfg && String(key || "").indexOf("c:") === 0) {
    for (const a of aiCustomActions(cfg)) if (a.key === key) return a;
  }
  return null;
}

function defaultAiPrompts() {
  const out = {};
  for (const a of AI_ACTIONS) out[a.key] = a.template;
  return out;
}

const DEFAULT_AI_SETTINGS = {
  enabled: false,
  baseUrl: "",
  model: "",
  temperature: AI_LIMITS.temperature.def,
  maxTokens: AI_LIMITS.maxTokens.def,
  timeoutMs: AI_LIMITS.timeoutMs.def,
  contextTokens: AI_LIMITS.contextTokens.def,
  writeMode: "propose",
  localOnly: false,        // only addresses on this computer (checked by the local server too)
  noTrain: true,           // ask OpenRouter for providers that don't log or train on prompts
  tagTarget: "vault",      // where Suggest tags puts its suggestions: vault-only tags, or the card's own tags
  persona: AI_PERSONA_DEFAULT,
  personaTitle: "",        // the persona's name, shown on agent chat replies; never sent to the model
  promptRules: AI_PROMPT_RULES_DEFAULT,   // Rules for every prompt; "" means none (a missing key gets the default)
  customPrompts: [],       // your own prompts: see sanitizeCustomPrompts
  prompts: defaultAiPrompts(),
  contextChars: AI_LIMITS.contextChars.def,
  includeExamples: false,
  batchCap: AI_LIMITS.batchCap.def,
};

function clampAi(v, spec, fallback) {
  const n = Number(v);
  if (v === "" || v == null || !isFinite(n)) return fallback === undefined ? spec.def : fallback;
  return Math.min(spec.max, Math.max(spec.min, n));
}

/** "https://host:port" of an address, lower-cased; "" if it has none. */
function originOfUrl(u) {
  const m = String(u == null ? "" : u).match(/^(https?:\/\/[^/?#]+)/i);
  return m ? m[1].toLowerCase() : "";
}

/** Same rule as serve.js: trim slashes, cut a pasted /chat/completions. */
function normalizeAiBase(u) {
  let s = String(u == null ? "" : u).trim().replace(/\s+/g, "");
  if (!s) return "";
  s = s.replace(/\/+$/, "");
  const i = s.toLowerCase().indexOf("/chat/completions");
  if (i > 0) s = s.slice(0, i);
  return s.replace(/\/+$/, "");
}

/** True for an address on this computer itself: localhost, 127.x, ::1. */
function isLoopbackAddress(u) {
  const m = String(u == null ? "" : u).trim().match(/^https?:\/\/(\[[^\]]+\]|[^/:?#]+)/i);
  if (!m) return false;
  const h = m[1].toLowerCase().replace(/^\[|\]$/g, "");
  return h === "localhost" || /\.localhost$/.test(h) || /^127\./.test(h) || h === "::1";
}

/**
 * A warning when an AI address would carry your key and card text over the
 * network unencrypted: http, and not this computer. Empty when it's fine.
 */
function aiAddressWarning(u) {
  const b = normalizeAiBase(u);
  if (!/^http:\/\//i.test(b) || isLoopbackAddress(b)) return "";
  return "This address isn't encrypted (http, not https) and isn't this computer, so your API key and card text " +
    "cross the network where anyone on it can read them. That's fine on your own home network; on public or " +
    "shared Wi-Fi, use an https address or a local model.";
}

/**
 * A short, stable hash (cyrb53). Used to tell whether a cached answer was
 * produced from exactly the request that would be sent now, and to recognise
 * retired factory prompts without keeping their full text around.
 */
function aiHash(str) {
  const s = String(str == null ? "" : str);
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) {
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

/* Hashes of factory text shipped by earlier versions. A stored value that
   matches one was never edited by the user, so it is upgraded to the current
   default; anything else is the user's own and is kept. */
const AI_RETIRED_DEFAULTS = {
  // v1 "British English"; v3 with the style rules built in (they moved to Rules for every prompt).
  persona: ["2s6zogy8px", "18ln3d1679t"],
  summarise: ["sv1gcracvr"],
  impression: ["2ftgv2p5fhi"],
  critique: ["kp1hfj38p2"],
  tags: ["23aq1i37vu9"],
  polish: ["e0bj84ksjv"],
};

function isRetiredDefault(slot, text) {
  const list = AI_RETIRED_DEFAULTS[slot] || [];
  return list.indexOf(aiHash(text)) >= 0;
}

/**
 * Force a stored settings blob into shape. Runs on every load and save, so an
 * old or hand-edited record can't put the UI into an impossible state. Strips
 * any key an earlier version stored, upgrades untouched factory prompts, and
 * removes {{card}} from custom ones (the card is now always attached).
 */
function sanitizeAiSettings(raw) {
  const s = Object.assign({}, DEFAULT_AI_SETTINGS, raw && typeof raw === "object" ? raw : {});
  delete s.apiKey; delete s.key; delete s.token;
  delete s.personaName;
  s.enabled = !!s.enabled;
  s.baseUrl = normalizeAiBase(s.baseUrl);
  s.model = String(s.model || "").trim();
  s.temperature = clampAi(s.temperature, AI_LIMITS.temperature);
  s.maxTokens = Math.round(clampAi(s.maxTokens, AI_LIMITS.maxTokens));
  s.timeoutMs = Math.round(clampAi(s.timeoutMs, AI_LIMITS.timeoutMs));
  s.contextChars = Math.round(clampAi(s.contextChars, AI_LIMITS.contextChars));
  s.batchCap = Math.round(clampAi(s.batchCap, AI_LIMITS.batchCap));
  s.contextTokens = Math.round(clampAi(s.contextTokens, AI_LIMITS.contextTokens));
  if (s.contextTokens > 0 && s.contextTokens < 1024) s.contextTokens = 1024;
  if (!AI_WRITE_MODES.some((m) => m.key === s.writeMode)) s.writeMode = DEFAULT_AI_SETTINGS.writeMode;
  if (s.tagTarget !== "card") s.tagTarget = "vault";
  s.localOnly = s.localOnly === true;
  s.noTrain = s.noTrain !== false;
  s.persona = String(s.persona == null ? "" : s.persona);
  if (isRetiredDefault("persona", s.persona)) s.persona = AI_PERSONA_DEFAULT;
  // Saved as typed (the field saves on every keystroke, so trimming here would
  // eat the space between words); it's trimmed where it's shown.
  s.personaTitle = String(s.personaTitle == null ? "" : s.personaTitle).replace(/[\r\n\t]+/g, " ").slice(0, 40);
  s.promptRules = String(s.promptRules == null ? "" : s.promptRules);
  s.customPrompts = sanitizeCustomPrompts(s.customPrompts);
  s.includeExamples = !!s.includeExamples;
  const prompts = {};
  for (const a of AI_ACTIONS) {
    let v = s.prompts && typeof s.prompts[a.key] === "string" ? s.prompts[a.key] : "";
    if (isRetiredDefault(a.key, v)) v = "";
    v = v.replace(/\n?[ \t]*\{\{\s*card\s*\}\}[ \t]*/g, "").replace(/\s+$/, "");
    prompts[a.key] = v.trim() ? v : a.template;
  }
  s.prompts = prompts;
  return s;
}

async function loadAiSettings() {
  return sanitizeAiSettings(await dbGet(STORE_KV, AISETTINGS_KEY));
}
async function saveAiSettings(s) {
  return dbPut(STORE_KV, sanitizeAiSettings(s), AISETTINGS_KEY);
}

function isDefaultPrompt(key, text) {
  const def = aiActionDef(key);
  return !!def && String(text || "") === def.template;
}

/** True when the relay answering is older than this page needs. */
function relayIsStale(relay) {
  return !!(relay && relay.available && !relay.needsUpgrade &&
    Number(relay.build || 0) < EXPECTED_RELAY_BUILD);
}

/**
 * Why the AI can't run yet, most important first. Empty means ready.
 * `relay` is the page's view of /__vault/ai/config.
 */
function aiSettingsProblems(s, relay) {
  const out = [];
  const cfg = sanitizeAiSettings(s);
  const r = relay || {};
  if (r.available === false) {
    out.push("The local server isn't answering. Start the vault with \"Start RP Card Vault.bat\" rather than opening the file directly.");
    return out;
  }
  if (r.needsUpgrade) {
    out.push("The server hosting this page is an older serve.js with no AI relay. Copy the new serve.js next to the page and run \"Start RP Card Vault.bat\".");
    return out;
  }
  if (relayIsStale(r)) {
    out.push(
      "The server answering is serve.js build " + (r.build || 0) + "; this page needs build " +
      EXPECTED_RELAY_BUILD + ". An older copy is probably still running in the background. " +
      "Run \"Start RP Card Vault.bat\" to restart it."
    );
    return out;
  }
  if (!cfg.baseUrl) out.push("No endpoint address.");
  else if (!/^https?:\/\/[^/]/i.test(cfg.baseUrl)) out.push("The endpoint address must start with http:// or https://.");
  if (!cfg.model) out.push("No model — test the connection and pick one.");
  if (r.available && cfg.baseUrl && (r.baseUrl !== cfg.baseUrl || r.model !== cfg.model)) {
    out.push("The local server doesn't have these settings yet. Press Save and test in the ✦ AI panel.");
  }
  return out;
}

/** Enough in place to send a request. */
function aiReady(s, relay) {
  const cfg = sanitizeAiSettings(s);
  return cfg.enabled && aiSettingsProblems(cfg, relay).length === 0;
}

const AI_TEMPLATE_VARS = [
  { key: "name", hint: "character name" },
  { key: "tags", hint: "tags already on the card, including vault-only ones" },
  { key: "knownTags", hint: "tags your vault already uses, on cards and vault-only, most used first" },
  { key: "loreCount", hint: "number of lorebook entries" },
  { key: "greetingCount", hint: "number of alternate greetings" },
  { key: "field", hint: "Tighten only: the name of the field being rewritten" },
];

/**
 * Fill {{tokens}}. Unknown ones are left in place and reported, so a typo
 * shows up in the settings panel. {{char}} and {{user}} aren't ours — they
 * belong to the card format — so they pass through silently.
 */
function renderPromptTemplate(tpl, vars) {
  const known = { char: true, user: true };
  for (const v of AI_TEMPLATE_VARS) known[v.key] = true;
  const missing = [];
  const text = String(tpl == null ? "" : tpl).replace(/\{\{\s*([A-Za-z][A-Za-z0-9_]*)\s*\}\}/g, (m, name) => {
    if (vars && Object.prototype.hasOwnProperty.call(vars, name)) {
      const v = vars[name];
      return v == null ? "" : String(v);
    }
    if (!known[name] && missing.indexOf(name) < 0) missing.push(name);
    return m;
  });
  return { text, missing };
}

function aiEstimateRequest(systemText, userText, maxTokens) {
  const inTokens = estimateTokens(systemText) + estimateTokens(userText);
  const out = Math.round(maxTokens || 0);
  return { in: inTokens, out, total: inTokens + out };
}

/* ── fitting a model's context ─────────────────────────────────────────
   Small local models often take only 2,048–8,192 tokens at once (Ollama's
   default is 2,048–4,096 unless raised), and a server cuts the START of
   anything longer, so the model silently loses its instructions. With the
   model's context set in the ✦ AI panel, budgets shrink to fit and anything
   that still won't fit says so. 0 means large or unknown: nothing changes. */

/* Characters per token, on the safe side (estimateTokens counts 4). */
const AI_CHARS_PER_TOKEN = 3.5;

/** Characters of prompt that fit beside the reply and `reserveTokens`; Infinity when no context is set. */
function aiRoomChars(settings, reserveTokens) {
  const ctx = Number(settings && settings.contextTokens) || 0;
  if (!ctx) return Infinity;
  const room = ctx - (Number(settings.maxTokens) || 0) - (Number(reserveTokens) || 0);
  return Math.max(1500, Math.floor(room * AI_CHARS_PER_TOKEN));
}

/** "" when a request of `promptChars` (plus the reply) fits the model's context, else why it doesn't. */
function aiFitWarning(promptChars, settings) {
  const ctx = Number(settings && settings.contextTokens) || 0;
  if (!ctx) return "";
  const need = Math.ceil(promptChars / AI_CHARS_PER_TOKEN) + (Number(settings.maxTokens) || 0);
  if (need <= ctx) return "";
  return "This needs about " + fmtNum(need) + " tokens with room for the reply, but the model takes " + fmtNum(ctx) +
    " (Model context in the ✦ AI panel), so it would lose the start of what it's sent.";
}

/* ── the card, as the model sees it ──────────────────────────────────── */

const AI_PROMPT_VERSION = 2;

/* Reading order and each field's share of the budget. A field shorter than
   its share gives the rest back to the fields that need it. */
const AI_CONTEXT_FIELDS = [
  { key: "description", label: "Description",      share: 0.34 },
  { key: "personality", label: "Personality",      share: 0.14 },
  { key: "scenario",    label: "Scenario",         share: 0.12 },
  { key: "first_mes",   label: "First message",    share: 0.30 },
  { key: "mes_example", label: "Example dialogue", share: 0.24, optional: true },
];

/** Stop card text from closing (or reopening) the fence around it. */
function aiFenceText(s) {
  return String(s == null ? "" : s).replace(/<(\/?)(card)\b/gi, "&lt;$1$2");
}

/**
 * Share `budget` characters between fields of the given lengths. Each gets
 * up to its share; what short fields don't use is handed on, in order, to
 * the ones that were cut.
 */
function aiAllocate(lengths, shares, budget) {
  const n = lengths.length;
  const totalShare = shares.reduce((a, b) => a + b, 0) || 1;
  const give = lengths.map((len, i) => Math.min(len, Math.floor(budget * shares[i] / totalShare)));
  let left = budget - give.reduce((a, b) => a + b, 0);
  for (let i = 0; i < n && left > 0; i++) {
    const want = lengths[i] - give[i];
    if (want <= 0) continue;
    const add = Math.min(want, left);
    give[i] += add;
    left -= add;
  }
  return give;
}

/** Cut to about `cap` characters at a natural break, and say so in the text. */
function aiTrimField(text, cap) {
  const s = String(text);
  if (s.length <= cap) return { text: s, cut: 0 };
  let head = cap >= 200 ? (chunkText(s, cap, 0)[0] || s.slice(0, cap)) : s.slice(0, cap);
  if (head.length > cap) head = head.slice(0, cap);
  const cut = s.length - head.length;
  return {
    text: head.replace(/\s+$/, "") + "\n[… " + fmtNum(cut) + " more characters of this field not sent …]",
    cut,
  };
}

/**
 * Flatten a card into the fenced block the model reads, through the edit
 * overlay so it sees what the user sees. Lorebooks and alternate greetings
 * are counted, not sent; example dialogue is opt-in.
 */
function buildCardContext(rec, body, edit, cfg, fieldKeys) {
  const s = sanitizeAiSettings(cfg);
  const name = String(effectiveField(body, edit, "name") || (rec && rec.name) || "(unnamed)");
  const cardTags = effectiveTags(rec || {}, edit);
  // `fieldKeys` (a custom prompt's choice) replaces the usual set, in card order.
  const defs = fieldKeys
    ? CARD_FIELDS.filter((f) => fieldKeys.indexOf(f.key) >= 0)
      .map((f) => AI_CONTEXT_FIELDS.filter((c) => c.key === f.key)[0] || { key: f.key, label: f.label, share: 0.1 })
    : AI_CONTEXT_FIELDS.filter((f) => !f.optional || s.includeExamples);
  const fields = defs
    .map((f) => ({ def: f, raw: String(effectiveField(body, edit, f.key) || "").trim() }))
    .filter((f) => f.raw);
  const give = aiAllocate(fields.map((f) => f.raw.length), fields.map((f) => f.def.share), s.contextChars);

  const lines = ["<card>", "Name: " + aiFenceText(name)];
  if (cardTags.length) lines.push("Tags: " + aiFenceText(cardTags.join(", ")));
  const trimmed = [];
  fields.forEach((f, i) => {
    const t = aiTrimField(f.raw, Math.max(1, give[i]));
    if (t.cut) trimmed.push({ key: f.def.key, label: f.def.label, sent: f.raw.length - t.cut, total: f.raw.length });
    lines.push("", "## " + f.def.label, aiFenceText(t.text));
  });
  const loreBook = effectiveLorebook(body, edit);
  const loreCount = loreBook && Array.isArray(loreBook.entries) ? loreBook.entries.length : 0;
  const greetList = (edit && Array.isArray(edit.greetings)) ? edit.greetings : ((body && body.alternate_greetings) || []);
  const greetCount = greetList.length;
  const counts = [];
  if (loreCount) counts.push(loreCount + " lorebook entr" + (loreCount === 1 ? "y" : "ies"));
  if (greetCount) counts.push(greetCount + " alternate greeting" + (greetCount === 1 ? "" : "s"));
  if (counts.length) lines.push("", "## Also on this card (not included)", counts.join("; "));
  lines.push("</card>");
  return { text: lines.join("\n"), trimmed, loreCount, greetCount, name, cardTags };
}

/** The one field Tighten rewrites, whole, with just the name for context. */
function buildFieldContext(rec, body, edit, fieldKey) {
  const def = CARD_FIELDS.filter((f) => f.key === fieldKey)[0] || { key: fieldKey, label: fieldKey };
  const name = String(effectiveField(body, edit, "name") || (rec && rec.name) || "(unnamed)");
  const text = String(effectiveField(body, edit, fieldKey) || "");
  return {
    text: ["<card>", "Name: " + aiFenceText(name), "", "## " + def.label, aiFenceText(text), "</card>"].join("\n"),
    label: def.label, original: text, name,
  };
}

/* An internal rule, always first in Rules for every prompt and never shown in
   the panel: a prompt is one-way, so nothing in the answer should wait on a reply. */
const AI_PROMPT_RULE_FIXED =
  "The user can't reply to this. They only read your answer, so don't ask them questions or offer to do more: give your complete answer now.";

/** Every prompt's system message: persona, then Rules for every prompt (the built-in one first), then the fixed card rules. */
function aiSystemPrompt(s) {
  const rules = String(s.promptRules || "").trim();
  return (String(s.persona || "").trim() || AI_PERSONA_DEFAULT) +
    "\n\nRules for every prompt:\n- " + AI_PROMPT_RULE_FIXED + (rules ? "\n" + rules : "") +
    "\n\n" + AI_FENCE_RULES;
}

/**
 * The tags your vault already uses, from the tag index: the ones on cards,
 * and the vault-only ones, each with how many cards use it, most used first.
 * Hidden tags are already left out of the index.
 */
function aiTagVocabulary(tagIndex) {
  const list = (tagIndex && Array.isArray(tagIndex.list)) ? tagIndex.list : [];
  const pick = (n) => list.map((e) => ({ label: String(e.label || e.key || ""), n: n(e) }))
    .filter((x) => x.label && x.n > 0)
    .sort((a, b) => b.n - a.n || a.label.localeCompare(b.label));
  return {
    card: pick((e) => (e.embedded || 0) + (e.custom || 0)),
    vault: pick((e) => e.vault || 0),
  };
}

/**
 * {{knownTags}} as the model reads it. `known` is aiTagVocabulary's result
 * (a plain list of names is accepted too). The list for where the
 * suggestions will go comes first.
 */
function aiKnownTagsText(known, target) {
  if (Array.isArray(known)) return known.slice(0, 200).join(", ") || "(the vault has no tags yet)";
  const k = known || { card: [], vault: [] };
  const line = (xs) => xs.slice(0, 150).map((x) => x.label + " (" + x.n + ")").join(", ");
  const card = k.card.length ? "Tags on cards in your vault, most used first (with how many cards): " + line(k.card) : "";
  const vault = k.vault.length ? "Vault-only tags you use, most used first: " + line(k.vault) : "";
  const parts = target === "card" ? [card, vault] : [vault, card];
  return parts.filter(Boolean).join("\n") || "(the vault has no tags yet)";
}

/**
 * Turn an action plus a card into the messages to send.
 *
 * Returns `{ error }` instead of a request when the action can't be done
 * honestly — most importantly a Tighten whose field can't fit back through
 * the output budget, which would otherwise come back cut off mid-sentence.
 * `hash` identifies the exact request, for the answer cache.
 */
function aiBuildRequest(kind, cfg, rec, body, edit, knownTags, opts) {
  if (rec && rec.aiPrivate) return { error: AI_PRIVATE_MESSAGE };
  const s = sanitizeAiSettings(cfg);
  const action = aiActionDef(kind, s);
  if (!action) throw new Error("Unknown AI action: " + kind);
  if (action.custom && !action.template.trim()) return { error: "This prompt has no instructions yet. Write them in the ✦ AI panel, under Prompts." };
  if (action.custom && !action.allFields && !action.fields.length) return { error: "This prompt reads no fields. Tick All fields, or pick some, in the ✦ AI panel." };
  const field = action.perField ? String((opts && opts.field) || "") : "";

  const tagsAll = effectiveTags(rec || {}, edit).concat(vaultTagsOf(edit));
  const vars = {
    name: "", tags: tagsAll.length ? tagsAll.join(", ") : "(none)",
    knownTags: aiKnownTagsText(knownTags, s.tagTarget),
    loreCount: 0, greetingCount: 0, field: "",
  };

  let cardBlock, trimmed = [], original = "";
  if (action.perField) {
    if (AI_TIGHTEN_FIELDS.indexOf(field) < 0) return { error: "Pick a field to tighten." };
    const fc = buildFieldContext(rec, body, edit, field);
    original = fc.original;
    if (!original.trim()) return { error: fc.label + " is empty — nothing to tighten." };
    // The whole field has to come back, so the reply budget must hold it.
    const need = Math.ceil(estimateTokens(original) * 1.1) + 60;
    if (need > s.maxTokens) {
      return {
        error: fc.label + " is about " + fmtNum(estimateTokens(original)) + " tokens, so a rewrite needs " +
          "about " + fmtNum(need) + " tokens of reply. Max tokens out is " + fmtNum(s.maxTokens) +
          ". Raise it in the ✦ AI panel (a reasoning model needs more again for its thinking).",
        need,
      };
    }
    cardBlock = fc.text;
    vars.name = fc.name; vars.field = fc.label.toLowerCase();
  } else {
    const keys = action.custom ? (action.allFields ? CARD_FIELDS.map((f) => f.key) : action.fields) : null;
    // Leave about 800 tokens for the instructions and the system prompt.
    const fit = Object.assign({}, s, { contextChars: Math.min(s.contextChars, aiRoomChars(s, 800)) });
    const ctx = buildCardContext(rec, body, edit, fit, keys);
    cardBlock = ctx.text; trimmed = ctx.trimmed;
    vars.name = ctx.name; vars.loreCount = ctx.loreCount; vars.greetingCount = ctx.greetCount;
  }

  const r = renderPromptTemplate(action.custom ? action.template : (s.prompts[kind] || action.template), vars);
  const format = AI_OUTPUT_FORMATS[action.output] || "";
  const user = cardBlock + "\n\n" + r.text.trim() + (format ? "\n\n" + format : "");
  const system = aiSystemPrompt(s);
  const tooBig = aiFitWarning(system.length + user.length, s);
  if (tooBig && action.perField) return { error: tooBig + " Use a model with more context, or lower Max tokens out." };
  return {
    kind, field, system, user, original, tooBig,
    missing: r.missing, trimmed,
    estimate: aiEstimateRequest(system, user, s.maxTokens),
    hash: aiHash(kind + "\n" + field + "\n" + system + "\n" + user),
    promptVersion: AI_PROMPT_VERSION,
  };
}

/* ── the answer cache ────────────────────────────────────────────────── */

/**
 * Cache key: card, action, model, and a hash of the exact request. Any change
 * to what would be sent — an edit in the vault, a trimmed budget, a reworded
 * prompt — misses, and the previous answer is shown as out of date instead.
 */
function aiNoteId(fingerprint, kind, model, hash) {
  return [fingerprint || "", kind || "", model || "", hash || ""].join("|");
}

function makeAiNote(fingerprint, kind, model, hash, text, extra) {
  return Object.assign({
    id: aiNoteId(fingerprint, kind, model, hash),
    fingerprint, kind, model, hash,
    field: "",
    text: String(text == null ? "" : text),
    at: Date.now(),
    promptVersion: AI_PROMPT_VERSION,
    usage: null,
  }, extra || {});
}

/**
 * From a card's cached rows, the answer to show for one action: the exact
 * match if there is one, otherwise the newest earlier answer, marked as not
 * current.
 */
function pickAiNote(rows, kind, model, field, hash) {
  const mine = (rows || []).filter((r) => r && r.kind === kind && r.model === model &&
    String(r.field || "") === String(field || ""));
  const exact = mine.filter((r) => r.hash && r.hash === hash)[0];
  if (exact) return { note: exact, current: true };
  mine.sort((a, b) => (b.at || 0) - (a.at || 0));
  return mine.length ? { note: mine[0], current: false } : { note: null, current: false };
}

/**
 * Move cached answers to a card's new fingerprint after Save to card.
 * The request hash doesn't change (the saved text is what the overlay
 * already showed), so an answer that was current stays current.
 */
async function migrateAiNotes(oldFp, newFp) {
  if (!oldFp || !newFp || oldFp === newFp) return 0;
  try {
    const db = await dbOpen();
    const rows = await new Promise((res, rej) => {
      const tx = db.transaction(STORE_AINOTES, "readonly");
      const r = tx.objectStore(STORE_AINOTES).index("fingerprint").getAll(IDBKeyRange.only(oldFp));
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    });
    if (!rows.length) return 0;
    const tx = db.transaction(STORE_AINOTES, "readwrite");
    const os = tx.objectStore(STORE_AINOTES);
    for (const row of rows) {
      os.delete(row.id);
      os.put(Object.assign({}, row, { id: aiNoteId(newFp, row.kind, row.model, row.hash), fingerprint: newFp }));
    }
    await txDone(tx);
    return rows.length;
  } catch (e) {
    return 0;   // never block a card save over a cache
  }
}

/* ── reading the relay's stream ──────────────────────────────────────── */

/** Splits NDJSON as it arrives. Bad lines become error events, not throws. */
function ndjsonSplitter() {
  let buf = "";
  const parse = (line) => {
    try { return JSON.parse(line); }
    catch (e) { return { t: "error", message: "The local server sent something unreadable: " + line.slice(0, 160) }; }
  };
  return {
    feed(chunk) {
      buf += chunk;
      const out = [];
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (line) out.push(parse(line));
      }
      return out;
    },
    end() {
      const line = buf.trim();
      buf = "";
      return line ? [parse(line)] : [];
    },
  };
}

function aiEmptyStream() {
  return { text: "", think: "", finish: "", usage: null, model: "", done: false, error: "", tools: [] };
}

/** Fold one relay event into the running state. Returns a new object. */
function aiStreamStep(acc, ev) {
  const a = Object.assign({}, acc);
  if (!ev || typeof ev !== "object") return a;
  if (ev.t === "text") a.text += String(ev.v || "");
  else if (ev.t === "think") a.think += String(ev.v || "");
  else if (ev.t === "tool") a.tools = (a.tools || []).concat([{ id: String(ev.id || ""), name: String(ev.name || ""), args: String(ev.args || "") }]);
  else if (ev.t === "done") {
    a.done = true;
    a.finish = String(ev.finish || "");
    a.usage = ev.usage || null;
    a.model = String(ev.model || "");
  } else if (ev.t === "error") a.error = String(ev.message || "The request failed.");
  return a;
}

/**
 * Separate reasoning a model wrote into its answer (<think>…</think> at the
 * start, as some servers pass it through). An unclosed opening block means
 * everything is thinking.
 */
function splitInlineThinking(text) {
  let s = String(text == null ? "" : text);
  let think = "";
  for (;;) {
    const m = s.match(/^\s*<(think|thinking|reasoning)>/i);
    if (!m) break;
    const close = new RegExp("</" + m[1] + ">", "i");
    const rest = s.slice(m[0].length);
    const c = rest.search(close);
    if (c < 0) { think += rest; s = ""; break; }
    think += rest.slice(0, c);
    s = rest.slice(c).replace(close, "");
  }
  return { text: s.trim(), think };
}

/* ── understanding the answer ────────────────────────────────────────── */

/** Pull a JSON object out of an answer that may be fenced or prefixed. */
function parseAiJson(text) {
  const s = String(text == null ? "" : text).trim();
  if (!s) return null;
  const candidates = [];
  const fenced = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fenced) candidates.push(fenced[1]);
  candidates.push(s);
  const first = s.indexOf("{"), last = s.lastIndexOf("}");
  if (first >= 0 && last > first) candidates.push(s.slice(first, last + 1));
  for (const c of candidates) {
    try {
      const v = JSON.parse(String(c).trim());
      if (v && typeof v === "object" && !Array.isArray(v)) return v;
    } catch (e) { /* next */ }
  }
  return null;
}

/* The flags a critique may raise. Anything else becomes "review", so the
   finding still reaches you. */
const AI_CRITIQUE_FLAGS = ["needsEdit", "jailbreak", "broken", "rewrite", "review"];

/** `{ findings, verdict }`, or `{ prose }` when the reply wasn't the JSON asked for. */
function parseCritique(text) {
  const data = parseAiJson(text);
  const out = { findings: [], verdict: "", prose: "" };
  if (!data || !Array.isArray(data.findings)) {
    out.prose = String(text == null ? "" : text).trim();
    return out;
  }
  out.verdict = typeof data.verdict === "string" ? data.verdict.trim().slice(0, 400) : "";
  for (const f of data.findings) {
    if (!f) continue;
    const note = String((typeof f === "string" ? f : f.note) || "").trim();
    if (!note) continue;
    let flag = String((f && f.flag) || "").trim();
    if (AI_CRITIQUE_FLAGS.indexOf(flag) < 0) flag = "review";
    out.findings.push({ flag, note: note.slice(0, 400) });
  }
  return out;
}

function aiCleanTag(raw) {
  const t = String(raw == null ? "" : raw).replace(/^[\s\-*\d.)"'#]+|["'.\s]+$/g, "").trim();
  if (!t || t.length > 40 || t.split(/\s+/).length > 4) return "";
  return t;
}

/**
 * Suggested tags, deduplicated against `existing` and capped. Returns null
 * when the reply is neither the JSON asked for nor a plain list of tags —
 * splitting a paragraph on commas would propose sentence fragments.
 */
function parseTagSuggestions(text, existing, cap) {
  const data = parseAiJson(text);
  let list;
  if (data && Array.isArray(data.tags)) list = data.tags;
  else {
    const pieces = String(text == null ? "" : text).split(/[,\n]/).map((p) => p.trim()).filter(Boolean);
    if (!pieces.length || pieces.some((p) => !aiCleanTag(p))) return null;
    list = pieces;
  }
  const have = new Set((existing || []).map((t) => normTagName(t)));
  const out = [];
  for (const raw of list) {
    const t = aiCleanTag(raw);
    const k = t ? normTagName(t) : "";
    if (!k || have.has(k)) continue;
    have.add(k);
    out.push(t);
    if (out.length >= (cap || 8)) break;
  }
  return out;
}

/** {{macros}} and <START> markers in a piece of card text, lower-cased. */
function aiMacrosIn(text) {
  const found = {};
  String(text || "").replace(/\{\{\s*([^{}]+?)\s*\}\}|<START>/gi, (m, name) => {
    found[name ? "{{" + name.toLowerCase() + "}}" : "<START>"] = true;
    return m;
  });
  return Object.keys(found);
}

/**
 * Check a Tighten reply against the field it rewrites.
 *
 * Refuses anything that would silently damage the card: no <rewrite> block
 * (a refusal or a chat reply), a block with no closing tag (cut off), or an
 * empty one. Macro loss and big length changes are passed through as
 * warnings, shown next to the diff.
 */
function parseRewrite(text, original) {
  const s = String(text == null ? "" : text);
  const open = s.search(/<rewrite>/i);
  if (open < 0) {
    return { ok: false, error: "The model didn't answer with a <rewrite> block, so there's nothing safe to propose. Its reply is below." };
  }
  const rest = s.slice(open + "<rewrite>".length);
  const close = rest.search(/<\/rewrite>/i);
  if (close < 0) {
    return { ok: false, error: "The rewrite has no closing tag, so it was probably cut off. Nothing was proposed. Raise Max tokens out and try again." };
  }
  const rewrite = rest.slice(0, close).replace(/^[ \t]*\n/, "").replace(/\s+$/, "");
  const nm = rest.slice(close).match(/<notes>([\s\S]*?)(<\/notes>|$)/i);
  const notes = nm ? nm[1].trim().slice(0, 300) : "";
  if (!rewrite.trim()) return { ok: false, error: "The rewrite came back empty. Nothing was proposed." };
  const orig = String(original || "");
  if (rewrite.trim() === orig.trim()) return { ok: true, unchanged: true, rewrite, notes, warnings: [] };

  const warnings = [];
  const before = aiMacrosIn(orig), after = aiMacrosIn(rewrite);
  const lost = before.filter((m) => after.indexOf(m) < 0);
  const added = after.filter((m) => before.indexOf(m) < 0);
  if (lost.length) warnings.push("Drops " + lost.join(", ") + ", which the original uses.");
  if (added.length) warnings.push("Adds " + added.join(", ") + ", which the original doesn't use.");
  const ratio = rewrite.length / Math.max(1, orig.length);
  if (ratio < 0.35) warnings.push("Under a third of the original length — check nothing was dropped.");
  if (ratio > 1.05) warnings.push("Longer than the original.");
  return { ok: true, unchanged: false, rewrite, notes, warnings };
}

/**
 * The tags Suggest tags mustn't repeat. For vault-only tags that's every tag
 * the card shows; for the card's own tags, only those, so a vault-only tag
 * can be suggested for the card file too.
 */
function aiTagExclusions(rec, edit, cfg) {
  const own = effectiveTags(rec || {}, edit);
  return sanitizeAiSettings(cfg).tagTarget === "card" ? own : own.concat(vaultTagsOf(edit));
}

/**
 * Turn a finished stream into an outcome.
 *
 * `ctx` is `{ kind, original, existingTags, maxTokens, tagTarget }`. Returns
 *   `{ ok: false, error, raw, think }`  — show the error; don't cache
 *   `{ ok: true, text, think, cutOff, parsed, proposal }` — `proposal` is
 *   `{ bucket, value, meta }` or null. Tag suggestions go to `vaultTags`, or
 *   to `cardTags` when `tagTarget` is "card".
 */
function interpretAiResult(acc, ctx) {
  const c = ctx || {};
  const action = aiActionDef(c.kind) || { output: "text" };
  const split = splitInlineThinking(acc.text);
  const text = split.text;
  const think = (acc.think || "") + split.think;
  const fail = (error) => ({ ok: false, error, raw: text, think });
  const budgetHit = acc.finish === "length";
  const budgetNote = budgetHit ? " It stopped at the Max tokens out limit (" + fmtNum(c.maxTokens || 0) + ")." : "";

  if (acc.error) return fail(acc.error);
  if (!acc.done) return fail("The connection closed before the answer finished. Nothing was saved.");
  if (!text) {
    if (think.trim()) {
      return fail("The model spent its whole reply thinking and never wrote an answer." + budgetNote +
        " Raise Max tokens out in the ✦ AI panel — a reasoning model needs several thousand.");
    }
    return fail("The endpoint finished without writing anything" + (acc.finish ? " (finish: " + acc.finish + ")" : "") + ".");
  }

  const meta = { model: acc.model || "", at: Date.now() };

  if (action.output === "text") {
    return { ok: true, text, think, cutOff: budgetHit, parsed: null, proposal: null };
  }

  if (action.output === "flags") {
    const p = parseCritique(text);
    if (p.prose) {
      if (budgetHit) return fail("The answer was cut off before its JSON finished." + budgetNote);
      return { ok: true, text, think, cutOff: false, parsed: p, proposal: null, offFormat: true };
    }
    const value = p.findings.map((f) => ({ key: f.flag, note: f.note }));
    return { ok: true, text, think, cutOff: false, parsed: p,
      proposal: value.length ? { bucket: "flags", value, meta: Object.assign({ notes: p.verdict }, meta) } : null };
  }

  if (action.output === "vaultTags") {
    const tags = parseTagSuggestions(text, c.existingTags || [], 8);
    if (tags === null) {
      if (budgetHit) return fail("The answer was cut off before its JSON finished." + budgetNote);
      return { ok: true, text, think, cutOff: false, parsed: { tags: [] }, proposal: null, offFormat: true };
    }
    // Suggest tags answers the same either way; the switch decides where they wait.
    const proposal = !tags.length ? null
      : c.tagTarget === "card" ? { bucket: "cardTags", value: { add: tags, remove: [] }, meta }
      : { bucket: "vaultTags", value: tags, meta };
    return { ok: true, text, think, cutOff: false, parsed: { tags }, proposal };
  }

  if (action.output === "fields") {
    const r = parseRewrite(text, c.original);
    if (!r.ok) return fail(r.error);
    if (r.unchanged) return { ok: true, text, think, cutOff: false, parsed: r, proposal: null };
    const value = {};
    value[c.field] = r.rewrite;
    return { ok: true, text, think, cutOff: false, parsed: r,
      proposal: { bucket: "fields", value,
        meta: Object.assign({ base: c.original, warnings: r.warnings, notes: r.notes }, meta) } };
  }
  return fail("Unknown output type.");
}

/* ── proposals ───────────────────────────────────────────────────────────
   An AI action never edits anything; it fills `edit.aiProposal`, a separate
   area from the fields you edit by hand. Accepting an item copies it into
   the ordinary overlay, and Save to card (backup, verified write) is still
   the only way anything reaches the file.

   Each field rewrite remembers the text it was made from (`base`). If the
   field has changed since, accepting would throw that change away, so it is
   refused until the rewrite is regenerated.
   ─────────────────────────────────────────────────────────────────────── */

function emptyProposal() {
  return { fields: {}, fieldMeta: {}, vaultTags: [], flags: [], unflag: [], greetings: null, cardTags: null, noteAdd: [],
    model: "", at: 0, promptVersion: AI_PROMPT_VERSION, notes: "" };
}

/**
 * The proposal on an edit record, normalised; never null. Field rewrites
 * without a recorded base (made by version 1, which sent trimmed fields and
 * could propose a truncated rewrite) are dropped rather than offered.
 */
function proposalOf(edit) {
  const p = edit && edit.aiProposal;
  if (!p || typeof p !== "object") return emptyProposal();
  const fieldMeta = (p.fieldMeta && typeof p.fieldMeta === "object") ? p.fieldMeta : {};
  const fields = {};
  const src = (p.fields && typeof p.fields === "object") ? p.fields : {};
  for (const k of Object.keys(src)) {
    if (typeof src[k] === "string" && fieldMeta[k] && typeof fieldMeta[k].base === "string") fields[k] = src[k];
  }
  const meta = {};
  for (const k of Object.keys(fields)) meta[k] = fieldMeta[k];
  return {
    fields, fieldMeta: meta,
    vaultTags: Array.isArray(p.vaultTags) ? p.vaultTags : [],
    flags: Array.isArray(p.flags) ? p.flags : [],
    // Flags the agent says have been dealt with: [{ key, reason, model, at }].
    unflag: Array.isArray(p.unflag) ? p.unflag.filter((u) => u && typeof u.key === "string" && u.key) : [],
    // The chat agent's other suggestions: a new list of alternate greetings,
    // changes to the card's own tags, and lines for the vault notes.
    greetings: (p.greetings && Array.isArray(p.greetings.list) && Array.isArray(p.greetings.base)) ? p.greetings : null,
    cardTags: (p.cardTags && ((p.cardTags.add || []).length || (p.cardTags.remove || []).length))
      ? Object.assign({}, p.cardTags, { add: p.cardTags.add || [], remove: p.cardTags.remove || [] }) : null,
    noteAdd: Array.isArray(p.noteAdd) ? p.noteAdd.filter((n) => n && typeof n.text === "string" && n.text.trim()) : [],
    model: p.model || "", at: p.at || 0,
    promptVersion: typeof p.promptVersion === "number" ? p.promptVersion : 0,
    notes: typeof p.notes === "string" ? p.notes : "",
  };
}

function proposalCount(p) {
  const q = proposalOf({ aiProposal: p });
  return Object.keys(q.fields).length + q.vaultTags.length + q.flags.length + q.unflag.length +
    (q.greetings ? 1 : 0) + (q.cardTags ? q.cardTags.add.length + q.cardTags.remove.length : 0) + q.noteAdd.length;
}

/**
 * Fold new suggestions in. Field rewrites replace only the field they are
 * for; tags and flags replace their own bucket (two critiques leave one set
 * of findings to judge, not two), unless `meta.add` is set: the chat agent's
 * tags and flags join what's waiting. Other buckets are untouched.
 */
function mergeProposal(existing, bucket, value, meta) {
  const p = proposalOf({ aiProposal: existing });
  const m = meta || {};
  const next = Object.assign({}, p);
  if (bucket === "fields") {
    next.fields = Object.assign({}, p.fields);
    next.fieldMeta = Object.assign({}, p.fieldMeta);
    for (const k of Object.keys(value || {})) {
      next.fields[k] = String(value[k]);
      next.fieldMeta[k] = {
        base: String(m.base == null ? "" : m.base),
        warnings: Array.isArray(m.warnings) ? m.warnings : [],
        notes: String(m.notes || ""), model: m.model || "", at: m.at || Date.now(),
        // "agent" for the chat agent's edits, which it may build on; empty for the ✦ AI actions.
        by: m.by ? String(m.by) : "", reason: String(m.reason || ""),
      };
    }
  } else if (bucket === "vaultTags") {
    const add = Array.isArray(value) ? value : [];
    next.vaultTags = m.add ? p.vaultTags.concat(add.filter((t) => !p.vaultTags.some((x) => normTagName(x) === normTagName(t)))) : add;
  } else if (bucket === "flags") {
    const add = Array.isArray(value) ? value : [];
    if (m.add) next.flags = p.flags.filter((f) => !add.some((a) => a.key === f.key)).concat(add);
    else { next.flags = add; next.notes = String(m.notes || ""); }
  } else if (bucket === "greetings") {
    // The whole new list, and the list it was made from.
    const v = value || {};
    next.greetings = { list: (v.list || []).map(String), base: (v.base || []).map(String),
      by: m.by ? String(m.by) : "", reason: String(m.reason || ""), model: m.model || "", at: m.at || Date.now() };
  } else if (bucket === "cardTags") {
    // Adds and removes gather up; the newest word on a tag wins.
    const v = value || {};
    const clean = (list) => (Array.isArray(list) ? list : []).map((t) => String(t).trim()).filter(Boolean);
    const add = clean(v.add), remove = clean(v.remove);
    const hit = (list, t) => list.some((x) => normTagName(x) === normTagName(t));
    const was = p.cardTags || { add: [], remove: [], reason: "" };
    const nextAdd = was.add.filter((t) => !hit(remove, t) && !hit(add, t)).concat(add);
    const nextRemove = was.remove.filter((t) => !hit(add, t) && !hit(remove, t)).concat(remove);
    next.cardTags = (nextAdd.length || nextRemove.length)
      ? { add: nextAdd, remove: nextRemove, reason: String(m.reason || was.reason || ""), model: m.model || "", at: m.at || Date.now() }
      : null;
  } else if (bucket === "noteAdd") {
    const add = (Array.isArray(value) ? value : [value]).map((x) => String(x == null ? "" : x).trim()).filter(Boolean)
      .map((text) => ({ text, model: m.model || "", at: m.at || Date.now() }));
    next.noteAdd = p.noteAdd.concat(add);
  } else if (bucket === "unflag") {
    // One per flag: a newer reason for the same flag replaces the older one; others stay.
    const add = (Array.isArray(value) ? value : []).filter((u) => u && u.key)
      .map((u) => ({ key: String(u.key), reason: String(u.reason || ""), model: m.model || "", at: m.at || Date.now(),
        // { field: fingerprint } the agent checked; accepting re-checks them.
        basis: u.basis && typeof u.basis === "object" ? Object.assign({}, u.basis) : null }));
    next.unflag = p.unflag.filter((u) => !add.some((a) => a.key === u.key)).concat(add);
  }
  next.model = m.model || p.model || "";
  next.at = m.at || Date.now();
  next.promptVersion = AI_PROMPT_VERSION;
  return next;
}

/**
 * The flag findings a key picks: "*" all of them, "#3" the fourth finding
 * alone, a flag key every finding of that flag.
 */
function proposalFlagsPicked(flags, key) {
  if (key === "*") return flags.slice();
  const m = /^#(\d+)$/.exec(String(key));
  if (m) return flags[Number(m[1])] ? [flags[Number(m[1])]] : [];
  return flags.filter((f) => f.key === key);
}

/** Drop one item ("*" drops the whole bucket). */
function proposalWithout(existing, bucket, key) {
  const p = proposalOf({ aiProposal: existing });
  const next = Object.assign({}, p);
  if (bucket === "fields") {
    next.fields = Object.assign({}, p.fields);
    next.fieldMeta = Object.assign({}, p.fieldMeta);
    for (const k of key === "*" ? Object.keys(p.fields) : [key]) { delete next.fields[k]; delete next.fieldMeta[k]; }
  } else if (bucket === "flags") {
    const drop = proposalFlagsPicked(p.flags, key);
    next.flags = p.flags.filter((f) => drop.indexOf(f) < 0);
    if (!next.flags.length) next.notes = "";
  } else if (bucket === "vaultTags") {
    next.vaultTags = key === "*" ? [] : p.vaultTags.filter((t) => normTagName(t) !== normTagName(key));
  } else if (bucket === "unflag") {
    next.unflag = key === "*" ? [] : p.unflag.filter((u) => u.key !== key);
  } else if (bucket === "greetings") {
    next.greetings = null;
  } else if (bucket === "cardTags") {
    if (key === "*" || !p.cardTags) next.cardTags = null;
    else {
      const off = (list) => list.filter((t) => normTagName(t) !== normTagName(key));
      const add = off(p.cardTags.add), remove = off(p.cardTags.remove);
      next.cardTags = add.length || remove.length ? Object.assign({}, p.cardTags, { add, remove }) : null;
    }
  } else if (bucket === "noteAdd") {
    next.noteAdd = key === "*" ? [] : p.noteAdd.filter((n, i) => String(i) !== String(key));
  }
  return next;
}

/** The alternate greetings as the vault shows them now, edits included. */
function greetingsNow(body, edit) {
  return ((edit && Array.isArray(edit.greetings)) ? edit.greetings : ((body && body.alternate_greetings) || [])).map(String);
}

/** True when a proposed greetings list was made from a list that has changed since. */
function proposalGreetingsIsStale(edit, body) {
  const g = proposalOf(edit).greetings;
  if (!g) return true;
  const now = greetingsNow(body, edit);
  return now.length !== g.base.length || now.some((x, i) => x !== g.base[i]);
}

/** True when a proposed rewrite no longer matches the field it was made from. */
function proposalFieldIsStale(edit, body, key) {
  const p = proposalOf(edit);
  const m = p.fieldMeta[key];
  if (!m) return true;
  return String(effectiveField(body, edit, key) || "") !== m.base;
}

/**
 * The edit patch that accepts one proposed item ("*" = the whole bucket, for
 * tags and flags). Built from the edit as it is now, so pass it the latest
 * record. Returns null when there is nothing safe to accept: a missing item,
 * or a field rewrite whose field has changed since.
 */
function proposalAcceptPatch(edit, body, bucket, key) {
  const p = proposalOf(edit);
  const without = proposalWithout(edit && edit.aiProposal, bucket, key);
  if (bucket === "fields") {
    if (!Object.prototype.hasOwnProperty.call(p.fields, key)) return null;
    if (proposalFieldIsStale(edit, body, key)) return null;
    const fields = Object.assign({}, (edit && edit.fields) || {});
    fields[key] = p.fields[key];
    return { fields, aiProposal: without };
  }
  if (bucket === "vaultTags") {
    const wanted = key === "*" ? p.vaultTags : p.vaultTags.filter((t) => normTagName(t) === normTagName(key));
    if (!wanted.length) return null;
    const have = vaultTagsOf(edit);
    const add = wanted.filter((t) => !have.some((x) => normTagName(x) === normTagName(t)));
    return { vaultTags: have.concat(add), aiProposal: without };
  }
  if (bucket === "flags") {
    const wanted = proposalFlagsPicked(p.flags, key);
    if (!wanted.length) return null;
    // A flag the agent raised from fields that have changed since may no longer hold.
    if (wanted.some((f) => basisIsStale(edit, body, f))) return null;
    // Each finding is a flag of its own, even when the card already has that
    // kind: notes are never run together. The same note isn't added twice.
    return { flags: addFlagEntries(flagsOf(edit), wanted, Date.now()), aiProposal: without };
  }
  if (bucket === "unflag") {
    const wanted = key === "*" ? p.unflag : p.unflag.filter((u) => u.key === key);
    if (!wanted.length) return null;
    // The fields the agent checked have changed since: its reason may no longer hold.
    if (wanted.some((u) => unflagIsStale(edit, body, u))) return null;
    const keys = wanted.map((u) => u.key);
    // A flag already gone just clears the suggestion.
    return { flags: flagsOf(edit).filter((f) => keys.indexOf(f.key) < 0), aiProposal: without };
  }
  if (bucket === "greetings") {
    if (!p.greetings || proposalGreetingsIsStale(edit, body)) return null;
    return { greetings: p.greetings.list.slice(), aiProposal: without };
  }
  if (bucket === "cardTags") {
    if (!p.cardTags) return null;
    const pick = (list) => key === "*" ? list : list.filter((t) => normTagName(t) === normTagName(key));
    const add = pick(p.cardTags.add), remove = pick(p.cardTags.remove);
    if (!add.length && !remove.length) return null;
    // Applied to the card's tags as they are now: a tag already there, or already gone, is fine.
    const now = (edit && Array.isArray(edit.tags)) ? edit.tags : ((body && body.tags) || []);
    const hit = (list, t) => list.some((x) => normTagName(x) === normTagName(t));
    const kept = now.filter((t) => !hit(remove, t));
    return { tags: kept.concat(add.filter((t) => !hit(kept, t))), aiProposal: without };
  }
  if (bucket === "noteAdd") {
    const wanted = key === "*" ? p.noteAdd : p.noteAdd.filter((n, i) => String(i) === String(key));
    if (!wanted.length) return null;
    const had = String((edit && edit.notes) || "").replace(/\s+$/, "");
    return { notes: (had ? had + "\n" : "") + wanted.map((n) => n.text).join("\n"), aiProposal: without };
  }
  return null;
}

/** Endpoint presets. 127.0.0.1 rather than localhost: on Windows the name
    can resolve to ::1 and miss a server listening only on IPv4. */
const AI_ENDPOINT_PRESETS = [
  { label: "Ollama",           url: "http://127.0.0.1:11434/v1" },
  { label: "LM Studio",        url: "http://127.0.0.1:1234/v1" },

  { label: "text-gen-webui",   url: "http://127.0.0.1:5000/v1" },
  { label: "llama.cpp server", url: "http://127.0.0.1:8080/v1" },
  { label: "OpenAI",           url: "https://api.openai.com/v1" },
  { label: "OpenRouter",       url: "https://openrouter.ai/api/v1" },
  { label: "Groq",             url: "https://api.groq.com/openai/v1" },
  { label: "Together AI",      url: "https://api.together.xyz/v1" },
];

/**
 * The one line a bulk Suggest-tags run ends with. `stats` counts what
 * happened: proposed (cards that got suggestions), applied (cards whose
 * suggestions went straight on as vault-only tags), tags (suggestions in
 * all), cached (skipped because a current answer exists), empty (answered
 * with nothing new), failed, overCap (left over the bulk cap), and stopped
 * (the run ended early).
 */
function aiBulkSummary(stats) {
  const s = stats || {};
  const n = (k) => Math.max(0, Number(s[k]) || 0);
  const plural = (k, one, many) => k + " " + (k === 1 ? one : many);
  const parts = [];
  const tags = plural(n("tags"), "tag suggestion", "tag suggestions");
  if (n("answered")) parts.push(plural(n("answered"), "card", "cards") + " answered");
  if (n("proposed")) parts.push(plural(n("proposed"), "card", "cards") + " got " + tags);
  if (n("applied")) parts.push(plural(n("applied"), "card", "cards") + " tagged (" + tags + " applied)");
  if (n("empty")) parts.push(n("empty") + " had nothing new");
  if (n("cached")) parts.push(n("cached") + " skipped (already answered)");
  if (n("failed")) parts.push(n("failed") + " failed");
  if (n("overCap")) parts.push(n("overCap") + " left over the bulk cap");
  if (s.stopped) parts.push("stopped early");
  return parts.length ? parts.join(" · ") : "Nothing to do";
}

      creator: { type: "string" },
      folder: { type: "string", description: "Folder path, as shown in the vault." },
      flag: { type: "string", description: "A flag key such as needsEdit, or favorite, edited, aiPending." },
      count: { type: "integer", description: "How many, 1 to " + AGENT_RANDOM_MAX.cards + " (default 1). No card twice." } } } },
  { name: "random_pick", group: "chance",
    description: "Pick at random from a list you give: a name, a direction for a scene, which idea to try. Give every option; don't trim the list first.",
    parameters: { type: "object", properties: {
      options: { type: "array", items: { type: "string" }, description: "2 to " + AGENT_RANDOM_MAX.options + " options." },
      count: { type: "integer", description: "How many to pick (default 1). No option twice." } }, required: ["options"] } },
  { name: "roll_dice", group: "chance",
    description: "Roll dice, as in a tabletop game: 2d6+1, d20, 3d8-2. Returns each die and the total.",
    parameters: { type: "object", properties: {
      dice: { type: "string", description: "NdM with an optional +K or -K, up to " + AGENT_RANDOM_MAX.dice + " dice of up to " + AGENT_RANDOM_MAX.sides + " sides." } },
      required: ["dice"] } },
];

function agentToolDef(name) {
  for (const t of AGENT_TOOLS) if (t.name === name) return t;
  return null;
}

/** The tools in the OpenAI function format the relay passes on. */
/*
 * Small-model mode: a short list of tools that only look (find, read and
 * search cards, read workspace notes, pick at random) and short rules, about
 * a quarter of the full set. Small models follow a few tools far better than
 * thirty, and the full set alone is more than a 4,096-token model can take.
 */
const AGENT_SMALL_TOOLS = ["list_cards", "grep_cards", "read_card", "inspect_card", "list_duplicates", "fs_list", "fs_read", "random_card", "random_pick", "roll_dice"];

/** The tools offered under these agent settings. */
function agentActiveTools(settings) {
  const small = settings && settings.toolset === "small";
  const list = small ? AGENT_TOOLS.filter((t) => AGENT_SMALL_TOOLS.indexOf(t.name) >= 0) : AGENT_TOOLS;
  return list.map((t) => (t.name === "propose_flags" ? agentFlagsTool(t) : t));
}

/** propose_flags as the model sees it: every flag it may use, and for the
    user's own flags, what each is for and when to suggest it. */
function agentFlagsTool(t) {
  const mine = statusFlags().filter((f) => f.custom);
  const params = JSON.parse(JSON.stringify(t.parameters));
  params.properties.flags.items.properties.key.description = "One of: " + statusFlags().map((f) => f.key).join(", ") + ".";
  const description = t.description + (mine.length
    ? " Besides the built-in flags, the user made these, with when to use each: " +
      mine.map((f) => f.key + " (" + f.label + ")" + (f.agent.trim() ? ": " + f.agent.trim() : "")).join("; ") + "."
    : "");
  return Object.assign({}, t, { description, parameters: params });
}

function agentToolsForModel(settings) {
  return agentActiveTools(settings).map((t) => ({ type: "function", function: { name: t.name, description: t.description, parameters: t.parameters } }));
}

/* The persona is the ✦ AI panel's, shared with the card actions; it isn't
   an agent setting, and an old saved one is dropped by the sanitiser. */
const DEFAULT_AGENT_SETTINGS = {
  approval: "ask",         // ask | apply: workspace changes wait for approval, or land with an Undo
  toolMode: "auto",         // auto | text: native tool calls, or the <tool> text protocol
  stepCap: AGENT_LIMITS.stepCap.def,
  requestsPerMin: AGENT_LIMITS.requestsPerMin.def,
  tokensPerMin: AGENT_LIMITS.tokensPerMin.def,
  cardReadsPerMin: AGENT_LIMITS.cardReadsPerMin.def,
  unpinnedEditsPerMin: AGENT_LIMITS.unpinnedEditsPerMin.def,
  toolOutputChars: AGENT_LIMITS.toolOutputChars.def,
  contextChars: AGENT_LIMITS.contextChars.def,
  condenseAt: AGENT_LIMITS.condenseAt.def,
  handoffPrompt: "",        // what a condense handoff must cover; empty means AGENT_HANDOFF_DEFAULT
  listPreviews: false,      // every list_cards line also shows how the card's description starts (costs tokens)
  toolset: "full",          // full | small: small-model mode sends a short, look-only tool list and short rules
};

/* What a handoff must cover when a chat condenses. Editable in Agent options. */
const AGENT_HANDOFF_DEFAULT = [
  "Write a handoff for this chat so it can carry on without the messages above. Cover:",
  "- the goal: what the user is trying to do, in their words where it matters",
  "- decisions made and preferences the user stated",
  "- cards involved, by name and id, and what was found about each",
  "- workspace files read or changed, and why",
  "- open tasks and the current todo list, with what's done",
  "- anything the user is waiting on from you",
  "Be complete but brief, and use markdown headings. Don't invent anything that wasn't said.",
].join("\n");

function sanitizeAgentSettings(raw) {
  const s = Object.assign({}, DEFAULT_AGENT_SETTINGS, raw && typeof raw === "object" ? raw : {});
  for (const k of Object.keys(s)) if (!(k in DEFAULT_AGENT_SETTINGS)) delete s[k];
  if (s.approval !== "apply") s.approval = "ask";
  if (s.toolMode !== "text") s.toolMode = "auto";
  for (const k of Object.keys(AGENT_LIMITS)) s[k] = Math.round(clampAi(s[k], AGENT_LIMITS[k]));
  s.handoffPrompt = String(s.handoffPrompt == null ? "" : s.handoffPrompt);
  if (s.handoffPrompt.trim() === AGENT_HANDOFF_DEFAULT.trim()) s.handoffPrompt = "";
  s.listPreviews = s.listPreviews === true;
  if (s.toolset !== "small") s.toolset = "full";
  return s;
}

function agentHandoffPrompt(settings) {
  return String(sanitizeAgentSettings(settings).handoffPrompt || "").trim() || AGENT_HANDOFF_DEFAULT;
}

function newAgentSession(id, now) {
  return {
    id, title: "New chat", createdAt: now, updatedAt: now,
    messages: [],        // user | assistant | tool | note, in order
    todo: [],
    pinnedId: "",
    pinnedSid: "",       // the pinned card's short id: it follows the card if it's moved
    textMode: false,     // this session talks through <tool> blocks
    seen: {},            // workspace path → the version the agent last read
    seenCards: {},       // card id → { field: fingerprint } as read_card last returned it
    agentMd: null,       // { text } read once, when the first message was sent
  };
}

function agentSessionTitle(text) {
  const s = String(text || "").replace(/\s+/g, " ").trim();
  return s.length > 60 ? s.slice(0, 57).replace(/\s+\S*$/, "") + "…" : (s || "New chat");
}

/* ── the text protocol, for models without tool calling ─────────────── */

function agentTextProtocol(settings) {
  const lines = [
    "How to use tools: this endpoint has no native tool calling, so call a tool by writing a block like",
    "<tool name=\"fs_read\">{\"path\":\"agent.md\"}</tool>",
    "with the arguments as JSON. You may write several blocks in one reply. After your blocks, stop:",
    "the results arrive in the next message as <tool_result> blocks. A reply with no block ends your turn.",
    "Never write a <tool_result> block yourself: only the vault writes those, and one in your reply is thrown away.",
    "",
    "Tools:",
  ];
  for (const t of agentActiveTools(settings)) lines.push("- " + t.name + ": " + t.description + " Arguments: " + JSON.stringify(t.parameters.properties || {}));
  return lines.join("\n");
}

/** Tool calls written as <tool name="x">{json}</tool>. An unclosed block is left as text. */
function parseTextToolCalls(text) {
  const s = String(text == null ? "" : text);
  const calls = [];
  const rest = s.replace(/<tool\s+name\s*=\s*["']([\w.-]+)["']\s*>([\s\S]*?)<\/tool>/g, (m, name, args) => {
    calls.push({ id: "t" + (calls.length + 1), name, args: args.trim() || "{}" });
    return "";
  });
  return { text: rest.replace(/\n{3,}/g, "\n\n").trim(), calls };
}

/**
 * Only the vault writes <tool_result> blocks. A model that writes one is making
 * up (or repeating) a result. After a tool block, everything from there on rests
 * on a result it hasn't had yet, so the reply is cut there; otherwise just the
 * blocks go, each ending at its own </tool_result>. A block the model leaves
 * unclosed ends where its data does: lines from a real tool result (`known`,
 * the chat's results so far), tag lines, "Key: value" lines, list items and
 * card lines go; the first line of ordinary prose is the answer, and stays.
 */
function dropModelResults(text, known) {
  let s = String(text == null ? "" : text);
  const at = s.search(/<tool_result\b/i);
  if (at < 0) return s;
  if (/<tool\s+name\s*=/i.test(s.slice(0, at))) return s.slice(0, at).trim();
  const knownLines = new Set();
  for (const k of known || []) for (const l of String(k).split("\n")) { const x = l.trim(); if (x) knownLines.add(x); }
  const isData = (line) => {
    const x = line.trim();
    return !x || knownLines.has(x) || /^<\/?[\w-]+(\s[^>]*)?>$/.test(x) || /^[A-Z][\w '()\/-]{0,30}:(\s|$)/.test(x) ||
      /^(-|\*|\d+\.)\s/.test(x) || / · /.test(x);
  };
  for (let i = at; i >= 0; i = s.search(/<tool_result\b/i)) {
    const rest = s.slice(i);
    const next = rest.slice(1).search(/<tool_result\b/i);
    const limit = next >= 0 ? next + 1 : rest.length;
    const close = rest.slice(0, limit).search(/<\/tool_result>/i);
    let end = limit;
    if (close >= 0) end = close + "</tool_result>".length;
    else {
      const open = rest.indexOf(">");
      if (open >= 0 && open < limit) {
        end = open + 1;
        for (const line of rest.slice(end, limit).split("\n")) {
          if (!isData(line)) break;
          end += line.length + 1;
        }
        end = Math.min(end, limit);
      }
    }
    s = s.slice(0, i) + rest.slice(end);
  }
  return s.replace(/\n{3,}/g, "\n\n").trim();
}

/** The chat's latest tool results, which a model may repeat in its reply. */
function agentKnownResults(session) {
  return ((session && session.messages) || []).filter((m) => m.role === "tool").slice(-30).map((m) => String(m.result || ""));
}

/** Why a step came back with nothing to show, as specifically as the reply allows. */
function emptyReplyReason(finish, hadText, think) {
  const f = String(finish || "");
  if (hadText) return "The model only repeated a tool result instead of answering. Regenerate reply usually gets a proper answer.";
  if (think) return "The model spent its whole reply thinking and never answered. Raise Max tokens out in the ✦ AI panel.";
  if (/length|max_tokens/i.test(f)) return "The reply hit Max tokens before any answer. Raise Max tokens in the ✦ AI panel.";
  if (/filter|safety|recitation|prohibited|blocklist|spii|block/i.test(f)) return "The provider blocked the reply (finish reason: " + f + "). Rewording the request or another model may get through.";
  return "The model sent back an empty reply" + (f ? " (finish reason: " + f + ")" : "") + ". This comes from the provider; Regenerate reply often works.";
}

function agentCallsAsText(calls) {
  return (calls || []).map((c) => "<tool name=\"" + c.name + "\">" + (c.args || "{}") + "</tool>").join("\n");
}

/* ── reading one model step ──────────────────────────────────────────── */

/**
 * Take every thinking block out of a reply, wherever it is: a model may
 * think, write, then think again. An unclosed block (still streaming, or cut
 * off) is thinking to the end. Unlike splitInlineThinking, which the card
 * actions use and which only looks at the start, this keeps the answer free
 * of reasoning that arrives mid-reply.
 */
function splitThinkingAnywhere(text) {
  let s = String(text == null ? "" : text);
  const thoughts = [];
  const answer = [];
  for (;;) {
    const m = s.match(/<(think|thinking|reasoning)>/i);
    if (!m) { answer.push(s); break; }
    answer.push(s.slice(0, m.index));
    const rest = s.slice(m.index + m[0].length);
    const close = rest.search(new RegExp("</" + m[1] + ">", "i"));
    if (close < 0) { thoughts.push(rest); break; }
    thoughts.push(rest.slice(0, close));
    s = rest.slice(close + m[1].length + 3);
  }
  return {
    text: answer.join("").replace(/\n{3,}/g, "\n\n").trim(),
    think: thoughts.map((x) => x.trim()).filter(Boolean).join("\n\n"),
  };
}

/**
 * One reply from the model as the loop needs it: text, and the tool calls it
 * made. Like the actions, a reply that is only thinking, empty, or that ended
 * without a done event is a failure, never passed off as an answer.
 */
function interpretAgentStep(acc, textMode, known) {
  if (acc.error) return { ok: false, error: acc.error };
  if (!acc.done) return { ok: false, error: "The reply stopped before it finished (the connection closed early)." };
  const split = splitThinkingAnywhere(acc.text);
  const think = String(acc.think || "") + split.think;
  let text = dropModelResults(split.text, known);
  let calls = (acc.tools || []).map((c) => ({ id: String(c.id), name: String(c.name), args: String(c.args || "{}") }));
  if (textMode) {
    const p = parseTextToolCalls(text);
    text = p.text; calls = p.calls;
  }
  if (!text && !calls.length) return { ok: false, error: emptyReplyReason(acc.finish, /<tool_result\b/i.test(split.text), think) };
  return { ok: true, text, think, calls, usage: acc.usage, finish: acc.finish, model: acc.model };
}

/* ── what the model is sent ──────────────────────────────────────────── */

const AGENT_DROPPED = "[This older tool result was dropped to keep the chat within the model's context. Run the tool again if you need it.]";

/* Attachments. A photo is counted as this many characters of context, a
   rough stand-in for the tokens a model spends on one image. */
const AGENT_IMAGE_CHARS = 3000;
const AGENT_MAX_IMAGES = 6;
const AGENT_MAX_FILE_CHARS = 200000;

/** Roughly how much of the model's context one chat message takes, in characters. */
function agentMessageSize(m) {
  return String(m.text || "").length + String(m.result || "").length + String(m.args || "").length +
    (m.calls || []).reduce((n, c) => n + String(c.args || "").length, 0) +
    (m.files || []).reduce((n, f) => n + String(f.text || "").length + 40, 0) +
    (m.images || []).length * AGENT_IMAGE_CHARS;
}

/** An attached text file, fenced as material. It can't close its own fence. */
function agentFileBlock(f) {
  const name = String(f.name || "file").replace(/["<>\n]/g, "");
  return "<file name=\"" + name + "\">\n" + String(f.text || "").replace(/<(\/?)file\b/gi, "&lt;$1file") + "\n</file>";
}

/** Your message as the model gets it: text (plus attached files), and photos as image parts. */
function agentUserContent(m, noImages) {
  let text = [String(m.text || "")].concat((m.files || []).map(agentFileBlock)).filter(Boolean).join("\n\n");
  const images = noImages ? [] : (m.images || []).filter((x) => x && x.url);
  if (noImages && (m.images || []).length) text += "\n\n[" + m.images.length + " photo(s) not sent: this model can't see images]";
  if (!images.length) return text;
  return [{ type: "text", text: text || "(photo)" }].concat(images.map((x) => ({ type: "image_url", image_url: { url: x.url } })));
}

/**
 * Keep a long chat within `budget` characters by dropping the oldest tool
 * results first. What you and the model said is never dropped.
 */
function fitAgentContext(messages, budget) {
  const size = agentMessageSize;
  let total = messages.reduce((n, m) => n + size(m), 0);
  if (!budget || total <= budget) return messages;
  const out = messages.slice();
  for (let i = 0; i < out.length && total > budget; i++) {
    const m = out[i];
    if (m.role !== "tool" || m.result === AGENT_DROPPED) continue;
    total -= String(m.result || "").length - AGENT_DROPPED.length;
    out[i] = Object.assign({}, m, { result: AGENT_DROPPED });
  }
  return out;
}

/**
 * The session as chat messages. `extra.persona` is the ✦ AI panel's persona,
 * shared with the card actions. `extra.pinned` is the pinned card, fenced; it
 * is rebuilt every turn so the model sees the card as it is now.
 */
function agentModelMessages(session, settings, extra) {
  const s = sanitizeAgentSettings(settings);
  const textMode = !!session.textMode;
  // The persona leads; the fixed rules follow it, so where the two pull apart the rules have the last word.
  const sys = [String((extra && extra.persona) || "").trim() || AI_PERSONA_DEFAULT, "", s.toolset === "small" ? AGENT_RULES_SMALL : AGENT_RULES];
  if (session.agentMd && String(session.agentMd.text || "").trim()) {
    sys.push("", session.handoff
      ? "Your notes (agent.md in your workspace, as it was when this chat last condensed):"
      : "Your notes (agent.md in your workspace, as it was when this chat began):",
    "<agent_md>", session.agentMd.text, "</agent_md>");
  }
  // After a condense, the handoff (read once, then) stands in for everything before it.
  if (session.handoff && String(session.handoff.text || "").trim()) {
    sys.push("", "This chat was condensed. Everything said before this point is summarised in your handoff (" +
      (session.handoff.path || "the handoff") + "); carry on from it:", "<handoff>", session.handoff.text, "</handoff>");
  }
  if (extra && extra.pinned) sys.push("", extra.pinned);
  if (textMode) sys.push("", agentTextProtocol(s));
  const out = [{ role: "system", content: sys.join("\n") }];
  const live = session.messages.slice(session.condensedAt || 0).filter((m) => m.role !== "note");
  const msgs = extra && extra.noFit ? live : fitAgentContext(live, (extra && extra.budgetChars) || s.contextChars);
  let pendingResults = [];
  let lastUser = -1;
  const flush = () => {
    if (!pendingResults.length) return;
    out.push({ role: "user", content: pendingResults.join("\n\n") });
    pendingResults = [];
  };
  for (const m of msgs) {
    if (m.role === "tool") {
      if (textMode) pendingResults.push("<tool_result name=\"" + m.name + "\">\n" + m.result + "\n</tool_result>");
      else out.push({ role: "tool", tool_call_id: m.id, name: m.name, content: String(m.result) });
      continue;
    }
    flush();
    if (m.role === "user") { lastUser = out.length; out.push({ role: "user", content: agentUserContent(m, !!(extra && extra.noImages)) }); }
    else if (m.role === "assistant") {
      const calls = m.calls || [];
      if (textMode) {
        out.push({ role: "assistant", content: [m.text || "", agentCallsAsText(calls)].filter(Boolean).join("\n") || "(no reply)" });
      } else if (calls.length) {
        out.push({ role: "assistant", content: m.text || null,
          tool_calls: calls.map((c) => ({ id: c.id, type: "function", function: { name: c.name, arguments: c.args || "{}" } })) });
      } else out.push({ role: "assistant", content: String(m.text || "") });
    }
  }
  flush();
  // The pinned card again, right beside your latest message, where a model looks
  // first (it's also in the system message, which can be long). Not saved.
  if (extra && extra.pinnedLine && lastUser >= 0) {
    const c = out[lastUser].content;
    out[lastUser] = { role: "user", content: Array.isArray(c)
      ? [{ type: "text", text: extra.pinnedLine + "\n\n" + (c[0] && c[0].text || "") }].concat(c.slice(1))
      : extra.pinnedLine + "\n\n" + c };
  }
  return out;
}

/**
 * The pinned card, as the chat is told about it: which card the user is
 * looking at right now. Only a pointer, never its text; the agent reads it
 * with read_card when it needs to, and can still look at any other card.
 */
/** The one-line reminder that goes with your latest message. */
function agentPinnedLine(rec, goneName) {
  // Pinned, but the card has left the vault (deleted or moved out of the linked folders).
  if (!rec && goneName) return "[The card the user pinned, " + aiFenceText(goneName) + ", is no longer in the vault. If they say \"this card\", tell them it's gone and ask which card they mean.]";
  if (!rec) return "";
  if (rec.aiPrivate) return "[The pinned card is in a folder the user keeps private from the AI: you can't see or read it.]";
  return "[Pinned card: " + aiFenceText(rec.name) + " (id " + aiFenceText(agentCardKey(rec)) + "). \"This card\" means it; read it with read_card before working on it.]";
}

function agentPinnedNote(rec) {
  if (!rec) return "";
  if (rec.aiPrivate) return "The card the user is looking at is in a folder they keep private from the AI, so you can't see or read it. If they ask about \"this card\", say so.";
  return "The card the user is looking at right now: " + aiFenceText(rec.name) + " (id " + aiFenceText(agentCardKey(rec)) + ")" +
    (rec.creator ? ", by " + aiFenceText(rec.creator) : "") + ". Take \"this card\" and similar to mean it, and work on it unless the user names another. Its text isn't " +
    "included here: read it with read_card when you need it.";
}

/* ── condensing ──────────────────────────────────────────────────────── */

/**
 * How full the chat is: the characters the next request would carry (with
 * nothing trimmed) against the Chat length budget. `level` is "ok", "warn"
 * (15 points below the condense point) or "full" (the next message condenses).
 */
/**
 * Characters of chat the agent can send: its own Chat length budget, or less
 * when the ✦ AI panel says the model's context is smaller. `fixedChars` is
 * what every request carries anyway (instructions, notes, tools).
 */
function agentFixedChars(session, settings, extra) {
  const empty = Object.assign({}, session, { messages: [], condensedAt: 0 });
  const sys = agentModelMessages(empty, settings, Object.assign({}, extra || {}, { noFit: true }))[0].content;
  const tools = session && session.textMode ? "" : JSON.stringify(agentToolsForModel(sanitizeAgentSettings(settings)));
  return String(sys).length + tools.length;
}

function agentBudgetChars(agentSettings, aiSettings, fixedChars) {
  const s = sanitizeAgentSettings(agentSettings);
  const room = aiRoomChars(aiSettings, 0);
  if (room === Infinity) return s.contextChars;
  return Math.max(2000, Math.min(s.contextChars, room - (fixedChars || 0)));
}

function agentContextUsage(session, settings, extra) {
  const s = sanitizeAgentSettings(settings);
  const msgs = agentModelMessages(session, s, Object.assign({}, extra || {}, { noFit: true }));
  let chars = 0;
  for (const m of msgs) {
    if (Array.isArray(m.content)) {
      for (const p of m.content) chars += p.type === "text" ? String(p.text || "").length : AGENT_IMAGE_CHARS;
    } else chars += String(m.content || "").length;
    for (const c of m.tool_calls || []) chars += String(c.function.arguments || "").length + c.function.name.length;
  }
  const budget = (extra && extra.budgetChars) || s.contextChars;
  const pct = budget ? Math.round((chars / budget) * 100) : 0;
  const level = pct >= s.condenseAt ? "full" : pct >= s.condenseAt - 15 ? "warn" : "ok";
  return { chars, pct, level, condenseAt: s.condenseAt };
}

/** The chat so far as plain text, for the model to condense. Oldest tool results go first if it's too long. */
function agentTranscript(session, maxChars) {
  const msgs = fitAgentContext(session.messages.slice(session.condensedAt || 0).filter((m) => m.role !== "note"), maxChars);
  const lines = [];
  if (session.handoff && session.handoff.text) lines.push("## Handoff from before", session.handoff.text, "");
  for (const m of msgs) {
    if (m.role === "user") {
      lines.push("User: " + (m.text || "") +
        ((m.files || []).length ? "\n[attached files: " + m.files.map((f) => f.name).join(", ") + "]" : "") +
        ((m.images || []).length ? "\n[attached " + m.images.length + " photo(s)]" : ""));
    } else if (m.role === "assistant") {
      if (m.text) lines.push("Agent: " + m.text);
      for (const c of m.calls || []) lines.push("[called " + c.name + " " + (c.args || "{}") + "]");
    } else if (m.role === "tool") {
      const r = String(m.result || "");
      lines.push("[" + m.name + " result" + (m.ok === false ? " (failed)" : "") + ": " + (r.length > 3000 ? r.slice(0, 3000) + " …" : r) + "]");
    }
  }
  return lines.join("\n\n");
}

/** The request that writes a handoff. No tools; the transcript is the material. */
function agentCondenseRequest(session, settings, extra) {
  const s = sanitizeAgentSettings(settings);
  const sys = [String((extra && extra.persona) || "").trim() || AI_PERSONA_DEFAULT, "", AGENT_RULES,
    "", "You are condensing this chat. Answer with the handoff only, in markdown."].join("\n");
  return [
    { role: "system", content: sys },
    { role: "user", content: "<transcript>\n" + agentTranscript(session, Math.max(20000, Math.floor(s.contextChars * 0.8))) +
      "\n</transcript>\n\n" + agentHandoffPrompt(s) },
  ];
}

/** Where a chat's handoff is saved in the workspace. */
function agentHandoffPath(session) {
  const slug = String(session.title || "chat").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "chat";
  return "handoffs/" + slug + "-" + String(session.id || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 6) + ".md";
}

/**
 * After a condense the model no longer has what it read, so it has to read
 * again before changing anything: every card read is forgotten, and every
 * workspace read but `keep` ({ path: ver }, e.g. agent.md read just now).
 */
function agentForgetReads(session, keep) {
  session.seenCards = {};
  session.seen = Object.assign({}, keep || {});
  return session;
}

/* ── regenerate and fork ──────────────────────────────────────────────
   Sending a message records `session.lastTurn`: where your message is, what
   the agent had read and planned before the turn (seen, seenCards, todo),
   and, per card, its Proposed changes before the turn's first suggestion and
