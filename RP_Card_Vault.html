    if (kind === "reads") rateLog.current = rateRecord(rateLog.current, Date.now(), "reads", n || 1);
    if (kind === "edits") rateLog.current = rateRecord(rateLog.current, Date.now(), "edits", n || 1);
  };

  /** One model request, streamed. Falls back to text tool calls once if the model can't do tools. */
  const makeStep = (signal) => async () => {
    const L = latest.current;
    const s = sessRef.current;
    const pinned = await pinnedBlock(s);
    const pinRec = agentPinnedRecord(s, L.records);
    for (let attempt = 0; attempt < 2; attempt++) {
      const textMode = !!s.textMode || L.agent.toolMode === "text";
      const sv = Object.assign({}, s, { textMode });
      const extra = { pinned, pinnedLine: agentPinnedLine(pinRec, s.pinnedId ? (s.pinnedName || s.pinnedId) : ""), persona: L.ai.persona, noImages: noImagesFor(s) };
      extra.budgetChars = agentBudgetChars(L.agent, L.ai, agentFixedChars(sv, L.agent, extra));
      const msgs = agentModelMessages(sv, L.agent, extra);
      const req = { messages: msgs, temperature: L.ai.temperature, maxTokens: L.ai.maxTokens, timeoutMs: L.ai.timeoutMs };
      if (!textMode) req.tools = agentToolsForModel(L.agent);
      // Said once per chat and setting: a request the model can't take in whole.
      const tooBig = aiFitWarning(JSON.stringify(req.messages).length + (req.tools ? JSON.stringify(req.tools).length : 0), L.ai);
      const fitKey = (L.ai.contextTokens || 0) + "/" + L.agent.toolset;
      if (tooBig && s.fitWarned !== fitKey) {
        s.fitWarned = fitKey;
        emit({ role: "note", kind: "error", text: tooBig + (L.agent.toolset === "small"
          ? " Raise the model's context in its server if you can."
          : " Turn on Small-model mode in Agent options (⚙), or raise the model's context in its server.") });
      }
      setStatus("Waiting for the model…");
      setLive(aiEmptyStream());
      const r = await vaultFetch("/__vault/ai/chat", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(req), signal,
      });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        setLive(null);
        if (d.code === "tools_unsupported" && !textMode) {
          s.textMode = true;
          emit({ role: "note", kind: "textmode", text: "This model can't call tools directly, so this chat now writes its tool calls as text." });
          continue;
        }
        if (d.code === "images_unsupported") {
          // Remember it for this model, so later messages go without the photos instead of failing again.
          s.noImagesModel = L.relay.model || "";
          return { ok: false, error: "This model can't look at photos. Your message is kept above: send it again and it goes " +
            "without the photos, or pick a model that can see images in the ✦ AI panel." };
        }
        return { ok: false, error: d.error || ("The local server answered HTTP " + r.status) };
      }
      const acc = await readAgentStream(r, (a) => {
        setLive(a);
        const shown = splitThinkingAnywhere(a.text);
        setStatus(shown.text ? "Writing…" : (a.think || shown.think) ? "Thinking…" : "Waiting for the model…");
      });
      setLive(null);
      const used = (acc.usage && acc.usage.total_tokens) ||
        (estimateTokens(JSON.stringify(msgs)) + estimateTokens(acc.text + acc.think));
      rateLog.current = rateRecord(rateLog.current, Date.now(), "tokens", used);
      return interpretAgentStep(acc, textMode, agentKnownResults(s));
    }
    return { ok: false, error: "The model wouldn't take the request with or without tools." };
  };

  const makeApprove = (signal) => (change) => new Promise((resolve) => {
    const done = (v) => { setPending(null); resolve(v); };
    if (signal) signal.addEventListener("abort", () => done(false), { once: true });
    setPending({ change, done });
    setStatus("Waiting for you to approve a change");
  });

  const run = async () => {
    const ctrl = new AbortController();
    runRef.current = ctrl;
    setRunning(true);
    const gate = makeGate(ctrl.signal);
    let res;
    try {
      res = await runAgentLoop({
        step: makeStep(ctrl.signal),
        runTool: (call) => {
          setStatus("Running " + call.name + "…");
          return runAgentTool(call, {
            ws: agentWs, vault, session: sessRef.current,
            approval: latest.current.agent.approval, approve: makeApprove(ctrl.signal),
            gate, maxOut: latest.current.agent.toolOutputChars, now: () => Date.now(),
            previews: !!latest.current.agent.listPreviews, toolset: latest.current.agent.toolset,
          });
        },
        gate, emit, stepCap: latest.current.agent.stepCap, signal: ctrl.signal,
      });
    } catch (e) {
      res = { stopped: "error" };
      emit({ role: "note", kind: "error", text: (e && e.message) || String(e) });
    }
    if (res.stopped === "cancelled") emit({ role: "note", kind: "stopped", text: "Stopped." });
    runRef.current = null;
    setRunning(false); setStatus(""); setLive(null); setPending(null);
    const done = sessRef.current;
    persist(done);
    if (!done.autoTitled && (res.stopped === "answered" || res.stopped === "finished")) makeTitle(done);
  };

  /**
   * Name the chat after what it's about, once its first turn has an answer:
   * one small request with no tools. Quiet: a failure keeps the title it has,
   * and a rate limit that would make it wait just skips it until next turn.
   */
  const makeTitle = async (s) => {
    if (s.autoTitled || s.titling) return;
    const L = latest.current;
    const firstUser = s.messages.filter((m) => m.role === "user")[0];
    const firstReply = s.messages.filter((m) => (m.role === "assistant" && m.text) || (m.display && m.display.summary))[0];
    if (!firstUser || !firstReply) return;
    const now = Date.now();
    if (rateWait(rateLog.current, now, "requests", L.agent.requestsPerMin, 1) || rateWait(rateLog.current, now, "tokens", L.agent.tokensPerMin, 1)) return;
    rateLog.current = rateRecord(rateLog.current, now, "requests", 1);
    s.titling = true;
    s.autoTitled = true;   // one try per chat
    try {
      const messages = agentTitleRequest(firstUser.text, firstReply.text || firstReply.display.summary);
      const r = await vaultFetch("/__vault/ai/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages, temperature: 0.3, maxTokens: Math.min(L.ai.maxTokens, 1500), timeoutMs: L.ai.timeoutMs }),
      });
      if (!r.ok) return;
      const acc = await readAgentStream(r);
      rateLog.current = rateRecord(rateLog.current, Date.now(), "tokens",
        (acc.usage && acc.usage.total_tokens) || estimateTokens(JSON.stringify(messages) + acc.text + acc.think));
      const title = acc.done && !acc.error ? cleanAgentTitle(acc.text) : "";
      if (!title) return;
      s.title = title;
      if (sessRef.current.id === s.id) { sessRef.current.title = title; persist(sessRef.current); }
      else if (!deletedChats.current.has(s.id)) {   // a chat deleted meanwhile stays deleted
        dbPut(STORE_AGENT, s);
        setSessions((prev) => prev.map((x) => (x.id === s.id ? Object.assign({}, x, { title }) : x)));
      }
    } catch (e) {
      /* the chat keeps its first-message title */
    } finally {
      delete s.titling;
    }
  };

  const send = async (override) => {
    const text = String(override != null ? override : input).trim();
    const withAttach = override == null && (attach.images.length || attach.files.length);
    if ((!text && !withAttach) || running || condensing) return;
    if (!ready) { onToast("Set up the ✦ AI panel first: the agent uses the same endpoint and model.", "warm"); return; }
    toBottom();   // sending means you want to see the reply
    const s = sessRef.current;
    const msg = { role: "user", text, at: Date.now() };
    if (withAttach) {
      if (attach.images.length) msg.images = attach.images.map((x) => ({ name: x.name, url: x.url, w: x.w, h: x.h }));
      if (attach.files.length) msg.files = attach.files.map((f) => ({ name: f.name, text: f.text }));
    }
    // Condense first if this message would take the chat past the trigger.
    if (s.messages.some((m) => m.role === "user")) {
      const L = latest.current;
      const nx = { persona: L.ai.persona, pinned: pinnedText, noImages: noImagesFor(s) };
      nx.budgetChars = agentBudgetChars(L.agent, L.ai, agentFixedChars(s, L.agent, nx));
      const next = agentContextUsage(Object.assign({}, s, { messages: s.messages.concat([msg]) }), L.agent, nx);
      if (next.level === "full") await condense(true);
    }
    if (!s.messages.length) {
      // A new chat reads agent.md once. Reopening a chat later doesn't.
      s.title = agentSessionTitle(text || (msg.files && msg.files[0].name) || "Photo");
      s.createdAt = Date.now();
      try {
        const f = await agentWs.read("agent.md");
        s.agentMd = { text: f.text };
        s.seen = Object.assign({}, s.seen, { [f.path]: f.ver });
        s.messages = s.messages.concat([{ role: "note", kind: "agentmd", at: Date.now(),
          text: "Read agent.md (" + fmtNum(f.text.length) + " characters) for this new chat." }]);
      } catch (e) {
        s.messages = s.messages.concat([{ role: "note", kind: "error", at: Date.now(), text: "Couldn't read agent.md: " + e.message }]);
      }
    }
    // What the turn starts from, so ↻ can undo it and run it again.
    s.lastTurn = agentTurnStart(s, s.messages.length);
    s.messages = s.messages.concat([msg]);
    setInput("");
    if (withAttach) setAttach({ images: [], files: [] });
    await persist(s);
    run();
  };

  /**
   * Condense: the model writes a handoff for the chat so far into
   * handoffs/ in the workspace. The handoff and a fresh agent.md are read
   * once, now, and stand in for everything before this point from then on.
   * On failure nothing changes, and the old trimming still protects the chat.
   */
  const condense = async (auto) => {
    const s = sessRef.current;
    if (running || condensing) return false;
    if (!s.messages.slice(s.condensedAt || 0).some((m) => m.role === "user")) {
      if (!auto) onToast("There's nothing to condense yet.", "muted");
      return false;
    }
    const L = latest.current;
    setCondensing(true);
    setStatus(auto ? "The chat is nearly full, so it's condensing first…" : "Condensing the chat…");
    try {
      const messages = agentCondenseRequest(s, L.agent, { persona: L.ai.persona });
      const r = await vaultFetch("/__vault/ai/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages, temperature: 0.3, maxTokens: L.ai.maxTokens, timeoutMs: L.ai.timeoutMs }),
      });
      if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || "HTTP " + r.status); }
      const acc = await readAgentStream(r);
      rateLog.current = rateRecord(rateLog.current, Date.now(), "tokens",
        (acc.usage && acc.usage.total_tokens) || estimateTokens(JSON.stringify(messages) + acc.text + acc.think));
      if (acc.error) throw new Error(acc.error);
      if (!acc.done) throw new Error("the reply stopped before it finished");
      const text = splitThinkingAnywhere(acc.text).text;
      if (!text) throw new Error("the model sent back no handoff");
      const path = agentHandoffPath(s);
      let ver = null;
      try { ver = (await agentWs.read(path)).ver; } catch (e) { if (e.status !== 404) throw e; }
      await agentWs.write(path, text, ver);
      let mdNote = "";
      // What it read before is gone from what it sees: it reads cards and files again before changing them.
      agentForgetReads(s, {});
      try {
        const f = await agentWs.read("agent.md");
        s.agentMd = { text: f.text };
        s.seen = Object.assign({}, s.seen, { [f.path]: f.ver });
        mdNote = " agent.md was read again too.";
      } catch (e) { mdNote = " (agent.md couldn't be re-read: " + e.message + ")"; }
      s.handoff = { text, path, at: Date.now() };
      s.condensedAt = s.messages.length;
      s.condenseCount = (s.condenseCount || 0) + 1;
      s.messages = s.messages.concat([{ role: "note", kind: "condensed", at: Date.now(),
        text: "Condensed" + (auto ? " (the chat was nearly full)" : "") + ": everything above is summarised in " + path +
          ", which the agent reads from here on instead of those messages." + mdNote }]);
      persist(s);
      return true;
    } catch (e) {
      emit({ role: "note", kind: "error", text: "Couldn't condense (" + e.message + "). The chat carries on, with the oldest tool results trimmed as before." });
      return false;
    } finally {
      setCondensing(false);
      setStatus("");
    }
  };

  const readDataUrl = (blob) => new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result));
    fr.onerror = () => reject(fr.error || new Error("couldn't read it"));
    fr.readAsDataURL(blob);
  });
  const readText = (blob) => new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result));
    fr.onerror = () => reject(fr.error || new Error("couldn't read it"));
    fr.readAsText(blob);
  });

  /** A photo, shrunk to at most 1600px on its long side when the browser can, so requests stay light. */
  const shrinkPhoto = async (file) => {
    const raw = await readDataUrl(file);
    if (typeof createImageBitmap !== "function" || typeof OffscreenCanvas !== "function") return { name: file.name, url: raw };
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
      if (scale === 1 && raw.length < 1500000 && /^data:image\/(png|jpe?g|webp);/.test(raw)) return { name: file.name, url: raw, w, h };
      const c = new OffscreenCanvas(w, h);
      c.getContext("2d").drawImage(bmp, 0, 0, w, h);
      const blob = await c.convertToBlob({ type: "image/webp", quality: 0.85 });
      return { name: file.name, url: await readDataUrl(blob), w, h };
    } catch (e) {
      return { name: file.name, url: raw };
    }
  };

  const TEXT_EXT = /\.(txt|md|markdown|json|csv|tsv|ya?ml|xml|html?|log|ini|toml|js|ts|py|css)$/i;
  const addFiles = async (list) => {
    const add = { images: [], files: [] };
    const errs = [];
    for (const f of Array.from(list || [])) {
      if (/^image\//.test(f.type || "")) {
        if (attach.images.length + add.images.length >= AGENT_MAX_IMAGES) { errs.push("at most " + AGENT_MAX_IMAGES + " photos per message"); continue; }
        try { add.images.push(await shrinkPhoto(f)); } catch (e) { errs.push(f.name + ": " + e.message); }
      } else if (/^text\//.test(f.type || "") || TEXT_EXT.test(f.name || "")) {
        try {
          const text = await readText(f);
          if (text.length > AGENT_MAX_FILE_CHARS) errs.push(f.name + " is over " + fmtNum(AGENT_MAX_FILE_CHARS) + " characters");
          else add.files.push({ name: f.name, text });
        } catch (e) { errs.push(f.name + ": " + e.message); }
      } else errs.push(f.name + " isn't a photo or a text file");
    }
    if (add.images.length || add.files.length) {
      setAttach((a) => ({ images: a.images.concat(add.images), files: a.files.concat(add.files) }));
    }
    if (errs.length) onToast("Not attached: " + errs.join(" · "), "warm");
  };

  const onPaste = (e) => {
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter((f) => /^image\//.test(f.type || ""));
    if (files.length) { e.preventDefault(); addFiles(files); }
  };
  const hasFiles = (e) => !!(e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf("Files") >= 0);

  const stop = () => { if (runRef.current) runRef.current.abort(); };

  const newChat = () => { if (!running) show(newAgentSession(uid(), Date.now())); };
  const openSession = async (id) => {
    if (running) return;
    const s = await dbGet(STORE_AGENT, id);
    if (s) show(s);
  };
  const deleteSession = async (id) => {
    const m = sessions.filter((x) => x.id === id)[0];
    // The agent's turn is still writing to this chat; deleting it now would
    // send the rest of the turn into whatever chat replaced it.
    if (running && sessRef.current.id === id) { window.alert("The agent is still working in this chat. Stop it first, then delete the chat."); return; }
    if (!window.confirm("Delete the chat \"" + (m ? m.title : id) + "\"? Its workspace files stay.")) return;
    deletedChats.current.add(id);
    await dbDel(STORE_AGENT, id);
    setSessions((prev) => prev.filter((x) => x.id !== id));
    if (sessRef.current.id === id) show(newAgentSession(uid(), Date.now()));
  };

  const pin = (id) => {
    const s = sessRef.current;
    const rec = id ? records.filter((r) => r.id === id)[0] : null;
    s.pinnedId = rec ? rec.id : "";
    s.pinnedSid = rec ? (rec.sid || "") : "";   // follows the card if it's moved
    s.pinnedName = rec ? rec.name : "";   // kept in case the card later leaves the vault
    setPinQuery(""); setPinOpen(false);
    if (s.messages.length) persist(s); else show(s);
  };

  /**
   * Undo one change the agent made straight away: a workspace file change, or
   * vault-only tags put on directly. Throws if it can't (e.g. the file changed
   * since). Returns what was undone, in words.
   */
  const undoChange = async (d, known) => {
    if (d.lorebookEdit) {
      // Only while the lorebook is still as the agent left it. `known` tracks
      // what earlier undos in the same regenerate put back.
      const L = d.lorebookEdit;
      const same = (x, y) => JSON.stringify(x || null) === JSON.stringify(y || null);
      const cur = known && known.has(L.fp) ? known.get(L.fp) : (latest.current.editsMap.get(L.fp) || {}).lorebook;
      if (!same(cur, L.next)) throw new Error("it has changed since");
      onPatchEdit(L.fp, (c) => (same(c.lorebook, L.next) ? { lorebook: L.prev || null } : null));
      if (known) known.set(L.fp, L.prev || null);
      return "the change to " + L.card + "'s lorebook";
    }
    if (d.cardMoved) {
      // Move it back where it was: the same verified move, the other way.
      const M = d.cardMoved;
      const rec = latest.current.records.filter((r) => (M.sid && r.sid === M.sid) || r.id === M.cardId)[0];
      if (!rec) throw new Error("it's no longer in the vault where it was moved");
      const res = await latest.current.onCardFiles.move(rec, M.fromRootId, M.fromDir);
      if (res && res.skipped) throw new Error(res.reason || "it couldn't be moved back");
      return "moving " + M.card + " back to " + (M.from || "where it was");
    }
    if (d.bulkTags) {
      // Card by card, only where the tags are still as the agent left them.
      const B = d.bulkTags;
      const same = (x, y) => JSON.stringify(x || null) === JSON.stringify(y || null);
      const field = B.kind === "card" ? "tags" : "vaultTags";
      const valueOf = (e) => (B.kind === "card" ? (e && Array.isArray(e.tags) ? e.tags : null) : vaultTagsOf(e));
      const back = [];
      let changedSince = 0;
      for (const c of B.changes || []) {
        const key = field + ":" + c.fp;
        const cur = known && known.has(key) ? known.get(key) : valueOf(latest.current.editsMap.get(c.fp));
        if (!same(cur, c.after)) { changedSince++; continue; }
        back.push({ fp: c.fp, patch: (e) => (same(valueOf(e), c.after) ? { [field]: B.kind === "card" ? (c.before || null) : (c.before || []) } : null) });
        if (known) known.set(key, c.before || (B.kind === "card" ? null : []));
      }
      if (!back.length) throw new Error("all " + (B.changes || []).length + " cards have changed since");
      onPatchMany(back);
      return "the tag change on " + back.length + " card" + (back.length === 1 ? "" : "s") +
        (changedSince ? " (" + changedSince + " left alone: changed since)" : "");
    }
    if (d.tagsApplied) {
      // Only the tags it added, and only if they're still there.
      const t = d.tagsApplied;
      onPatchEdit(t.fp, (cur) => ({ vaultTags: vaultTagsOf(cur).filter((x) => !t.tags.some((y) => normTagName(x) === normTagName(y))) }));
      return "the vault-only tags " + t.tags.join(", ") + " on " + t.card;
    }
    if (d.tool === "fs_write" || d.tool === "fs_edit") {
      if (d.before == null) await agentWs.del(d.path, d.ver);
      else await agentWs.write(d.path, d.before, d.ver);
    } else if (d.tool === "fs_delete") {
      if (d.dir) await agentWs.mkdir(d.path); else await agentWs.write(d.path, d.before, null);
    } else if (d.tool === "fs_move") {
      if (d.dir) await agentWs.move(d.to, d.path, null);
      else { const f = await agentWs.read(d.to); await agentWs.move(d.to, d.path, f.ver); }
    }
    return "the change to " + d.path;
  };

  const markUndone = (s, i) => {
    s.messages = s.messages.map((x, j) => (j === i ? Object.assign({}, x, { display: Object.assign({}, x.display, { undone: true }) }) : x));
  };

  const undo = async (i) => {
    const s = sessRef.current;
    const m = s.messages[i];
    const d = m && m.display;
    if (!d || d.undone || !(d.applied || d.tagsApplied || d.lorebookEdit || d.bulkTags || d.cardMoved)) return;
    let what;
    try { what = await undoChange(d); }
    catch (e) { onToast("Couldn't undo: " + e.message, "red"); return; }
    markUndone(s, i);
    s.messages = s.messages.concat([{ role: "note", kind: "undo", at: Date.now(),
      text: d.tagsApplied ? "You took the vault-only tags " + d.tagsApplied.tags.join(", ") + " off " + d.tagsApplied.card + " again."
        : d.lorebookEdit ? "You undid the change to " + d.lorebookEdit.what + " of " + d.lorebookEdit.card + "."
        : d.bulkTags ? "You undid " + what + "."
        : d.cardMoved ? "You moved " + d.cardMoved.card + " back to " + (d.cardMoved.from || "where it was") + "."
        : "You undid " + what + "." }]);
    persist(s);
  };

  /**
   * ↻ on the latest reply: undo what that turn changed (workspace changes,
   * vault-only tags put on, and its suggestions, where nothing has touched
   * them since), forget what it read, and run it again from your message.
   */
  const regenerate = async () => {
    if (running || condensing) return;
    const s = sessRef.current;
    const plan = agentRegenPlan(s);
    if (!plan) return;
    const undone = [], left = [];
    const known = new Map();   // lorebooks as earlier undos here left them
    for (const i of plan.undo) {
      const d = s.messages[i].display;
      try { undone.push(await undoChange(d, known)); }
      catch (e) {
        const what = d.path || (d.lorebookEdit && d.lorebookEdit.card + "'s lorebook") || (d.tagsApplied && "the tags on " + d.tagsApplied.card) ||
          (d.bulkTags && "the tag change on " + d.bulkTags.count + " cards") || (d.cardMoved && "moving " + d.cardMoved.card + " back") || "a change";
        left.push(what + " (" + e.message + ")");
      }
    }
    const nameOf = (fp) => { const r = latest.current.records.filter((x) => x.fp === fp)[0]; return r ? r.name : "a card"; };
    for (const pr of plan.proposals) {
      const cur = latest.current.editsMap.get(pr.fp);
      if (!agentSameProposal(cur && cur.aiProposal, pr.after)) { left.push("the suggestions on " + nameOf(pr.fp) + ", which have changed since"); continue; }
      onPatchEdit(pr.fp, (c) => (agentSameProposal(c.aiProposal, pr.after) ? { aiProposal: pr.before || emptyProposal() } : null));
      undone.push("the suggestions on " + nameOf(pr.fp));
    }
    s.seen = plan.restore.seen;
    s.seenCards = plan.restore.seenCards;
    s.todo = plan.restore.todo;
    s.lastTurn = Object.assign({}, s.lastTurn, { proposals: {} });
    for (const m of s.messages.slice(plan.userIndex + 1)) {
      const f = m.role === "tool" && m.display && m.display.cardFile;
      if (f) left.push("the new card \"" + f.card + "\" (created and copied cards stay)");
    }
    s.messages = plan.keep.concat([{ role: "note", kind: "regen", at: Date.now(),
      text: "Regenerating the reply." + (undone.length ? " Undid " + undone.join("; ") + "." : "") +
        (left.length ? " Left as they are: " + left.join("; ") + "." : "") }]);
    await persist(s);
    toBottom();
    run();
  };

  /** A new chat from this one, up to message `i` (at your message, its text goes back in the box). */
  const fork = async (i) => {
    if (running || condensing) return;
    const f = agentForkSession(sessRef.current, i, uid(), Date.now());
    if (!f) return;
    f.session.messages = f.session.messages.concat([{ role: "note", kind: "fork", at: Date.now(),
      text: "Forked from \"" + sessRef.current.title + "\". Earlier messages are copied; the agent reads cards and files again before changing them." }]);
    show(f.session);
    await persist(f.session);
    setInput(f.draft);
    toBottom();
    onToast("Forked into a new chat", "blue");
  };

  const copyText = async (text) => {
    const t = String(text || "");
    try { await navigator.clipboard.writeText(t); }
    catch (e) {
      // Older or locked-down browsers: the textarea way.
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e2) { /* nothing more to try */ }
      document.body.removeChild(ta);
    }
    onToast("Copied", "muted");
  };

  const personaLabel = agentPersonaLabel(ai);
  const pinnedRec = agentPinnedRecord(sess, records);
  const pinLabel = sess.pinnedId ? (pinnedRec ? pinnedRec.name : (sess.pinnedName || sess.pinnedId) + " (no longer in the vault)") : "All characters";
  // Before you type: every card, in the main grid's sort. Typing narrows it.
  const pinSorted = useMemo(() => (pinOpen ? sortCards(records, sortKey) : []), [pinOpen, records, sortKey]);
  const pinMatches = useMemo(() => {
    const q = pinQuery.trim().toLowerCase();
    if (!q) return pinSorted;
    return pinSorted.filter((r) => (String(r.name) + " " + String(r.creator || "")).toLowerCase().indexOf(q) >= 0);
  }, [pinQuery, pinSorted]);
  const PIN_SHOWN = 200;

  return (
    <Fragment>
    {full ? <div className="fadeIn" style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 94 }} /> : null}
    <div className={full ? "agent-full" : undefined} style={Object.assign({ display: "flex", flexDirection: "column", flex: 1, minHeight: 0,
      outline: dragOver ? "2px dashed var(--accent-blue)" : "none", outlineOffset: -4 }, full ? {
        // Near full screen, like the Files dialog's, and faintly see-through.
        position: "fixed", top: "3vh", left: "2vw", width: "96vw", height: "94vh", zIndex: 95,
        background: SEE_THROUGH_BG, border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-md)",
        boxShadow: "0 24px 64px rgba(0,0,0,0.5)",
      } : null)}
      onDragOver={(e) => { if (hasFiles(e)) { e.preventDefault(); e.stopPropagation(); if (!dragOver) setDragOver(true); } }}
      onDragLeave={(e) => { if (e.currentTarget === e.target) setDragOver(false); }}
      onDrop={(e) => { if (hasFiles(e)) { e.preventDefault(); e.stopPropagation(); setDragOver(false); addFiles(e.dataTransfer.files); } }}>
      {/* header */}
      <div style={{ padding: "8px 12px", borderBottom: "1px solid var(--border-subtle)", flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <div title={sess.title} style={{ flex: 1, minWidth: 0, fontSize: 12.5, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            {sess.title}
          </div>
          <SmallBtn color="muted" onClick={() => setModal("sessions")}>Chats{sessions.length ? " " + sessions.length : ""}</SmallBtn>
          <SmallBtn color="blue" disabled={running} onClick={newChat}>+ New</SmallBtn>
          <SmallBtn color="muted" onClick={() => setModal("options")} title="Agent options">⚙</SmallBtn>
          <SmallBtn color="muted" onClick={() => setFull(!full)} title={full ? "Back to the sidebar" : "Full screen"}>{full ? "⤡" : "⤢"}</SmallBtn>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 7 }}>
          {/* Condense now, and how full the chat is: yellow when getting full, red when the next message condenses. */}
          {(() => {
            const c = usage.level === "full" ? "red" : usage.level === "warn" ? "warm" : "green";
            return (
              <button className={"agent-meter agent-meter-" + usage.level} disabled={running || condensing}
                onClick={() => condense(false)}
                title={"The chat is using about " + usage.pct + "% of its length budget. It condenses at " + usage.condenseAt +
                  "%. Click to condense now."}
                style={{
                  flex: 1, minWidth: 0, position: "relative", overflow: "hidden", cursor: running || condensing ? "default" : "pointer",
                  padding: "4px 8px", borderRadius: "var(--radius-sm)", border: "1px solid " + acRgba(c, 0.45),
                  background: "var(--bg-input)", color: ac(c), fontFamily: "'Outfit', sans-serif", fontSize: 11, fontWeight: 500,
                  display: "flex", alignItems: "center", gap: 6,
                }}>
                <span style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: Math.min(100, usage.pct) + "%", background: acRgba(c, 0.18) }} />
                <span style={{ position: "relative", flex: 1, textAlign: "left", whiteSpace: "nowrap" }}>{condensing ? "Condensing…" : "⧉ Condense"}</span>
                <span style={Object.assign({}, monoTiny, { position: "relative" })}>{usage.pct}%</span>
              </button>
            );
          })()}
          <SmallBtn color="green" onClick={() => { setFilesAt("agent.md"); setModal("files"); }} title="Open agent.md">agent.md</SmallBtn>
          <SmallBtn color="green" onClick={() => { setFilesAt(""); setModal("files"); }} title="The agent's workspace files">Files</SmallBtn>
        </div>

        <div style={{ position: "relative", marginTop: 7 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <button className="agent-pin" onClick={() => { setPinOpen(!pinOpen); setPinQuery(""); }} title="What this chat is about"
              style={Object.assign({}, inputBase, {
                flex: 1, minWidth: 0, padding: "5px 8px", fontSize: 11.5, textAlign: "left", cursor: "pointer",
                display: "flex", alignItems: "center", gap: 6,
                color: sess.pinnedId ? "var(--text-primary)" : "var(--text-secondary)",
              })}>
              <span style={{ color: "var(--accent-warm)" }}>{"\u{1F4CC}"}</span>
              <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{pinLabel}</span>
              <span style={{ color: "var(--text-muted)", fontSize: 9 }}>{pinOpen ? "▴" : "▾"}</span>
            </button>
            {sess.pinnedId ? <SmallBtn color="muted" onClick={() => pin("")} title="Back to All characters">×</SmallBtn> : null}
          </div>
          {pinOpen ? (
            <div style={Object.assign({}, panelStyle, {
              position: "absolute", left: 0, right: 0, top: "100%", zIndex: 20, marginTop: 2,
              boxShadow: "0 8px 24px rgba(0,0,0,0.4)", display: "flex", flexDirection: "column",
            })}>
              <input autoFocus value={pinQuery} placeholder="Search cards…"
                onChange={(e) => setPinQuery(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Escape") setPinOpen(false); }}
                onBlur={() => setTimeout(() => setPinOpen(false), 150)}
                style={Object.assign({}, inputBase, { padding: "5px 8px", fontSize: 11.5, margin: 6, width: "auto" })} />
              <div className="vault-scroll agent-pin-list" style={{ maxHeight: 260 }}>
                <div onMouseDown={(e) => { e.preventDefault(); pin(""); }}
                  style={{ padding: "5px 9px", fontSize: 11.5, cursor: "pointer", borderBottom: "1px solid var(--border-subtle)",
                    color: !sess.pinnedId ? "var(--accent-blue)" : "var(--text-primary)", fontWeight: 600 }}>
                  All characters
                </div>
                {pinMatches.slice(0, PIN_SHOWN).map((r) => (
                  <div key={r.id} onMouseDown={(e) => { e.preventDefault(); pin(r.id); }}
                    style={{ padding: "5px 9px", fontSize: 11.5, cursor: "pointer", borderBottom: "1px solid var(--border-subtle)",
                      color: agentIsPinned(sess, r) ? "var(--accent-blue)" : "var(--text-primary)" }}>
                    {r.name}{r.creator ? <span style={{ color: "var(--text-muted)" }}> · {r.creator}</span> : null}
                  </div>
                ))}
                {pinMatches.length > PIN_SHOWN ? (
                  <div style={{ padding: "5px 9px", fontSize: 10.5, color: "var(--text-muted)" }}>
                    {fmtNum(pinMatches.length - PIN_SHOWN)} more. Type to narrow the list.
                  </div>
                ) : null}
                {pinQuery.trim() && !pinMatches.length ? (
                  <div style={{ padding: "5px 9px", fontSize: 10.5, color: "var(--text-muted)" }}>No card matches.</div>
                ) : null}
              </div>
            </div>
          ) : null}
        </div>

        <div className="agent-approval" style={{ marginTop: 7 }}
          title={agent.approval === "apply" ? "Workspace changes are written straight away; each can be undone." : "Each workspace change waits for your Apply / Reject."}>
          <Toggle small color="warm" checked={agent.approval === "apply"}
            onChange={(v) => onSaveAgent({ approval: v ? "apply" : "ask" })}
            label={agent.approval === "apply" ? "File changes: apply now" : "File changes: ask first"} />
        </div>
      </div>

      {/* messages */}
      <div ref={listRef} onScroll={onListScroll} className="vault-scroll agent-list" style={{ flex: 1, minHeight: 0, padding: "4px 12px 8px" }}>
        {!ready ? (
          <div style={{ marginTop: 10 }}>
            <AiNotice color="warm">
              The agent uses the ✦ AI panel's endpoint and model, and that isn't ready yet.
              <div style={{ marginTop: 7 }}><SmallBtn color="blue" onClick={onOpenAiSettings}>Open ✦ AI</SmallBtn></div>
            </AiNotice>
          </div>
        ) : null}
        {!sess.messages.length && ready ? (
          <div style={{ fontSize: 11.5, color: "var(--text-muted)", lineHeight: 1.7, marginTop: 10 }}>
            Ask about your cards: find ones with a tea party in the greeting, compare two versions, list what's
            flagged. The agent can read every card and keeps its own notes in the workspace (agent.md is read at the
            start of each new chat). It can suggest changes to cards: small fixes on any card, bigger ones on the
            pinned card. Each waits in that card's Proposed changes for you.
          </div>
        ) : null}
        {sess.messages.map((m, i) => (
          <AgentMessage key={i} m={m} i={i} records={records} running={running} persona={personaLabel}
            open={!!openTools[i]} onToggle={() => setOpenTools((o) => Object.assign({}, o, { [i]: !o[i] }))}
            onUndo={undo} onAnswer={(o) => send(o)} onOpenCard={onOpenCard} onCopy={copyText} onFork={fork} />
        ))}
        {!running && !condensing && !pending && sess.messages.length ? (() => {
          const last = sess.messages[sess.messages.length - 1];
          const canRegen = !!agentRegenPlan(sess);
          // Continue: after a reply, or when the step cap stopped it.
          const canGoOn = last.role === "assistant" || last.role === "tool" || (last.role === "note" && last.kind === "stepcap");
          if (!canRegen && !canGoOn) return null;
          return (
            <div className="agent-turn-acts" style={{ display: "flex", gap: 6, margin: "2px 0 8px", flexWrap: "wrap" }}>
              {canRegen ? (
                <SmallBtn color="muted" onClick={regenerate}
                  title="Undo what this turn changed (where nothing has touched it since) and ask again">↻ Regenerate reply</SmallBtn>
              ) : null}
              {canGoOn ? <SmallBtn color="blue" disabled={!ready} onClick={() => send("Continue.")} title="Tell the agent to carry on">Continue</SmallBtn> : null}
            </div>
          );
        })() : null}
        {running && !pending ? (() => {
          const shown = live ? splitThinkingAnywhere(live.text) : { text: "", think: "" };
          shown.text = dropModelResults(shown.text, agentKnownResults(sessRef.current));
          const thinking = live ? [live.think, shown.think].filter(Boolean).join("\n\n") : "";
          return (
            <div className="agent-live" style={{ margin: "8px 0" }}>
              {!shown.text ? <AgentLoader thinking={!!thinking} /> : null}
              {thinking ? (
                <div className="vault-scroll agent-live-thinking" style={{
                  marginTop: 6, padding: "6px 9px", maxHeight: 140, fontSize: 11, lineHeight: 1.55, whiteSpace: "pre-wrap",
                  wordBreak: "break-word", color: "var(--text-muted)", fontStyle: "italic",
                  borderLeft: "2px solid var(--border-accent)", background: "var(--bg-input)",
                  display: "flex", flexDirection: "column-reverse",
                }}><div>{thinking.length > 4000 ? "…" + thinking.slice(-4000) : thinking}</div></div>
              ) : null}
              {shown.text ? (
                <div className="agent-reply" style={{
                  marginTop: 6, padding: "8px 11px 9px", borderRadius: "var(--radius-sm)",
                  background: acRgba("purple", 0.07), border: "1px solid " + acRgba("purple", 0.22),
                  borderLeft: "3px solid var(--accent-purple)", color: "var(--text-primary)",
                }}>
                  <div style={{ fontSize: 10.5, color: "var(--accent-purple)", fontWeight: 600, marginBottom: 4 }}>✦ {personaLabel}</div>
                  <Markdown text={shown.text} />
                </div>
              ) : null}
            </div>
          );
        })() : null}
        {pending ? (
          <div style={{ margin: "8px 0", padding: 9, borderRadius: "var(--radius-sm)", background: acRgba("warm", 0.07), border: "1px solid " + acRgba("warm", 0.35) }}>
            <div style={{ fontSize: 11.5, marginBottom: 6, color: "var(--accent-warm)" }}>The agent wants to make this change:</div>
            <AgentChangeView d={pending.change} />
            <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
              <SmallBtn color="green" onClick={() => pending.done(true)}>Apply</SmallBtn>
              <SmallBtn color="red" onClick={() => pending.done(false)}>Reject</SmallBtn>
            </div>
          </div>
        ) : null}
        {!atBottom ? (
          <div className="agent-to-latest" style={{ position: "sticky", bottom: 4, display: "flex", justifyContent: "center", pointerEvents: "none" }}>
            <span style={{ pointerEvents: "auto", boxShadow: "0 2px 8px rgba(0,0,0,0.35)", borderRadius: "var(--radius-sm)" }}>
              <SmallBtn color="blue" onClick={toBottom} title="Scroll to the newest message">↓ Latest</SmallBtn>
            </span>
          </div>
        ) : null}
      </div>

      {/* input */}
      <div style={{ padding: "8px 12px 10px", borderTop: "1px solid var(--border-subtle)", flexShrink: 0 }}>
        {running || status ? (
          <div style={Object.assign({}, monoTiny, { color: "var(--text-muted)", marginBottom: 5 })}>{status || "Working…"}</div>
        ) : null}
        {attach.images.length || attach.files.length ? (
          <div className="agent-attachments" style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 6 }}>
            {attach.images.map((x, k) => (
              <div key={"i" + k} title={x.name} style={{ position: "relative", width: 44, height: 44, borderRadius: 4, overflow: "hidden", border: "1px solid var(--border-subtle)" }}>
                <img src={x.url} alt={x.name} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
                <span onClick={() => setAttach((a) => ({ images: a.images.filter((_, j) => j !== k), files: a.files }))}
                  title="Remove" style={{ position: "absolute", top: 0, right: 0, padding: "0 4px", cursor: "pointer", fontSize: 11,
                    background: "rgba(0,0,0,0.6)", color: "#fff", borderBottomLeftRadius: 4 }}>×</span>
              </div>
            ))}
            {attach.files.map((f, k) => (
              <span key={"f" + k} style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
                <Pill color="cyan" title={fmtNum(f.text.length) + " characters"}>{"\u{1F4C4}"} {f.name}</Pill>
                <span onClick={() => setAttach((a) => ({ images: a.images, files: a.files.filter((_, j) => j !== k) }))}
                  title="Remove" style={{ cursor: "pointer", color: "var(--text-muted)", fontSize: 12 }}>×</span>
              </span>
            ))}
          </div>
        ) : null}
        <div style={{ display: "flex", gap: 6, alignItems: "flex-end" }}>
          <input ref={fileInput} type="file" multiple accept="image/*,.txt,.md,.markdown,.json,.csv,.tsv,.yaml,.yml,.xml,.html,.log,.ini,.toml"
            style={{ display: "none" }} onChange={(e) => { addFiles(e.target.files); e.target.value = ""; }} />
          <SmallBtn color="muted" onClick={() => fileInput.current && fileInput.current.click()}
            title="Attach photos or text files (you can also paste or drop them here)" style={{ padding: "7px 9px" }}>{"\u{1F4CE}"}</SmallBtn>
          <textarea value={input} onChange={(e) => setInput(e.target.value)} rows={2} placeholder={running ? "The agent is working…" : "Message the agent (Enter to send)"}
            onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
            onPaste={onPaste}
            style={Object.assign({}, inputBase, { resize: "vertical", lineHeight: 1.5, fontSize: 12, flex: 1 })} />
          {running
            ? <SmallBtn color="red" onClick={stop} style={{ padding: "7px 12px" }}>Stop</SmallBtn>
            : <SmallBtn color="blue" disabled={(!input.trim() && !attach.images.length && !attach.files.length) || !ready || condensing}
                onClick={() => send()} style={{ padding: "7px 12px" }}>Send</SmallBtn>}
        </div>
      </div>

      {modal === "sessions" ? (
        <AgentSessionsModal sessions={sessions} currentId={sess.id} running={running} records={records}
          onOpen={openSession} onDelete={deleteSession} onNew={newChat} onClose={() => setModal(null)} />
      ) : null}
      {modal === "options" ? (
        <AgentOptionsModal agent={agent} onSave={onSaveAgent} onClose={() => setModal(null)} onOpenAiSettings={onOpenAiSettings} />
      ) : null}
      {modal === "files" ? <WorkspaceModal onToast={onToast} initialPath={filesAt} onClose={() => setModal(null)} /> : null}
    </div>
    </Fragment>
  );
}

function makeDefaultFilters(sort) {
  return {
    q: "", deep: false, sort: sort || "name",
    tagsInc: [], tagsExc: [], tagMode: "and",
    dirs: [], specs: [], flags: {}, flagKeys: [],
    tokenMin: 0, tokenMax: 0,
  };
}

/* ════════════════════════════════════════════
   14. INSPECTOR
   ════════════════════════════════════════════ */

const TABS = [
  { key: "overview", label: "Overview" },
  { key: "fields",   label: "Fields" },
  { key: "greet",    label: "Greetings" },
  { key: "lore",     label: "Lorebook" },
  { key: "tags",     label: "Tags & Notes" },
  { key: "ai",       label: "✦ AI" },
  { key: "raw",      label: "Raw" },
];

function StatRow({ k, v, color }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", gap: 10, padding: "3px 0", borderBottom: "1px solid rgba(42,47,61,0.5)" }}>
      <span style={{ fontSize: 11, color: "var(--text-muted)" }}>{k}</span>
      <span style={{
        fontSize: 11, fontFamily: "'JetBrains Mono', monospace", textAlign: "right",
        color: color ? ac(color) : "var(--text-secondary)", wordBreak: "break-word",
      }}>{v}</span>
    </div>
  );
}

function EditableText({ value, original, onChange, onRevert, rows, mono }) {
  const dirty = value !== original;
  return (
    <div>
      <textarea value={value} onChange={(e) => onChange(e.target.value)} rows={rows || 5}
        style={Object.assign({}, inputBase, {
          fontFamily: mono ? "'JetBrains Mono', monospace" : "'Outfit', sans-serif",
          fontSize: 12, lineHeight: 1.55, minHeight: 60,
          borderColor: dirty ? "var(--accent-purple)" : "var(--border-subtle)",
        })}
        onFocus={(e) => (e.target.style.borderColor = dirty ? "var(--accent-purple)" : "var(--accent-warm-dim)")}
        onBlur={(e) => (e.target.style.borderColor = dirty ? "var(--accent-purple)" : "var(--border-subtle)")} />
      <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 3 }}>
        <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)" })}>{fmtTokens(estimateTokens(value))} · {fmtNum(value.length)} chars</span>
        {dirty ? (
          <Fragment>
            <Pill color="purple">edited</Pill>
            <SmallBtn color="muted" onClick={onRevert}>revert</SmallBtn>
          </Fragment>
        ) : null}
      </div>
    </div>
  );
}

function TagEditor({ tags, baseTags, onChange, tagIndex }) {
  const [draft, setDraft] = useState("");
  const [focus, setFocus] = useState(false);
  const baseSet = new Set((baseTags || []).map(normTagName));

  const add = (raw) => {
    const t = String(raw).trim();
    if (!t) return;
    const k = normTagName(t);
    if (tags.some((x) => normTagName(x) === k)) { setDraft(""); return; }
    onChange(tags.concat([t]));
    setDraft("");
  };

  const suggestions = useMemo(() => {
    const q = normTagName(draft);
    if (!q) return [];
    const have = new Set(tags.map(normTagName));
    return tagIndex.list.filter((t) => t.key.indexOf(q) >= 0 && !have.has(t.key)).slice(0, 8);
  }, [draft, tags, tagIndex]);

  return (
    <div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 8 }}>
        {tags.length === 0 ? <span style={{ fontSize: 11, color: "var(--text-muted)" }}>No tags.</span> : null}
        {tags.map((t, i) => {
          const added = !baseSet.has(normTagName(t));
          return (
            <span key={t + i} style={{
              display: "inline-flex", alignItems: "center", gap: 5, fontSize: 11,
              padding: "3px 7px", borderRadius: 3,
              background: acRgba(added ? "purple" : "warm", 0.12),
              border: "1px solid " + acRgba(added ? "purple" : "warm", 0.3),
              color: ac(added ? "purple" : "warm"),
            }}>
              {t}
              <span onClick={() => onChange(tags.filter((_, j) => j !== i))}
                style={{ cursor: "pointer", opacity: 0.7, fontSize: 12 }}>×</span>
            </span>
          );
        })}
      </div>
      <div style={{ position: "relative" }}>
        <input value={draft} placeholder="add tag, Enter to commit"
          onChange={(e) => setDraft(e.target.value)}
          onFocus={() => setFocus(true)}
          onBlur={() => setTimeout(() => setFocus(false), 150)}
          onKeyDown={(e) => {
            if (e.key === "Enter") { e.preventDefault(); add(suggestions.length && draft && suggestions[0].key.startsWith(normTagName(draft)) && e.shiftKey ? suggestions[0].label : draft); }
            if (e.key === "," ) { e.preventDefault(); add(draft); }
          }}
          style={Object.assign({}, inputBase, { padding: "7px 10px", fontFamily: "'Outfit', sans-serif" })} />
        {focus && suggestions.length ? (
          <div style={{
            position: "absolute", top: "100%", left: 0, right: 0, zIndex: 20, marginTop: 3,
            background: "var(--bg-elevated)", border: "1px solid var(--border-accent)",
            borderRadius: "var(--radius-sm)", maxHeight: 180, overflowY: "auto",
          }}>
            {suggestions.map((s) => (
              <div key={s.key} className="tagRow" onMouseDown={() => add(s.label)}
                style={{ padding: "5px 9px", cursor: "pointer", display: "flex", justifyContent: "space-between", fontSize: 11.5 }}>
                <span>{s.label}</span>
                <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)" })}>{s.count}</span>
              </div>
            ))}
          </div>
        ) : null}
      </div>
    </div>
  );
}

/* ── inspector: AI tab ────────────────────────────────────────────────────
   One path from answer to card: an action's suggestions land in Proposed
   changes, and only an Accept there moves anything into the edit overlay.
   Nothing here writes to a card file or to the card's own tags.

   Answers are cached per card, action, model and exact request, so opening
   a card again is free, and an answer about text that has since changed is
   shown as out of date rather than passed off as current.
   ─────────────────────────────────────────────────────────────────────── */

function AiAnswer({ text }) {
  // Models answer in loose markdown. Keep paragraphs; drop heading and bold noise.
  const paras = String(text || "").split(/\n{2,}/).map((p) => p.trim()).filter(Boolean);
  return (
    <div style={{ fontSize: 12, lineHeight: 1.7, color: "var(--text-secondary)" }}>
      {paras.map((p, i) => (
        <p key={i} style={{ margin: i ? "9px 0 0" : 0, whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
          {p.replace(/^#{1,6}\s*/, "").replace(/\*\*/g, "")}
        </p>
      ))}
    </div>
  );
}

/** A word-level diff, rendered. Reuses the duplicate comparer's engine. */
function DiffView({ before, after }) {
  const d = useMemo(() => diffText(before, after), [before, after]);
  return (
    <div style={{
      fontSize: 11.5, lineHeight: 1.65, fontFamily: "'Outfit', sans-serif",
      whiteSpace: "pre-wrap", wordBreak: "break-word", maxHeight: 320, overflowY: "auto",
      padding: 9, borderRadius: "var(--radius-sm)",
      background: "var(--bg-input)", border: "1px solid var(--border-subtle)",
    }} className="vault-scroll">
      {d.parts.map((part, i) => {
        if (part.t === "same") return <span key={i} style={{ color: "var(--text-muted)" }}>{part.text}</span>;
        const del = part.t === "del";
        return (
          <span key={i} style={{
            color: del ? "var(--accent-red)" : "var(--accent-green)",
            background: acRgba(del ? "red" : "green", 0.12),
            textDecoration: del ? "line-through" : "none",
          }}>{part.text}</span>
        );
      })}
    </div>
  );
}

function AiNotice({ color, children, mono }) {
  return (
    <div style={{
      padding: 9, marginBottom: 10, borderRadius: "var(--radius-sm)",
      background: acRgba(color, 0.08), border: "1px solid " + acRgba(color, 0.28),
      fontSize: 11, lineHeight: 1.65, color: "var(--text-secondary)", wordBreak: "break-word",
      fontFamily: mono ? "'JetBrains Mono', monospace" : undefined,
    }}>{children}</div>
  );
}

/**
 * Pending AI suggestions, each with Accept and Reject.
 *
 * Accepting copies the item into the same overlay your own typing goes to;
 * Save to card (backup, verified write) is still the only way to the file.
 * Patches are computed from the edit record as it is when the click lands.
 */
function AiProposals({ body, edit, onPatchEdit, onToast }) {
  const p = proposalOf(edit);
  const total = proposalCount(p);
  const [openField, setOpenField] = useState("");
  if (!total) return null;

  const accept = (bucket, key, label) => {
    if (!proposalAcceptPatch(edit, body, bucket, key)) return;
    onPatchEdit((cur) => proposalAcceptPatch(cur, body, bucket, key));
    onToast("Accepted " + label + " — in your vault edits, not the card file until you save to card",
      bucket === "fields" ? "purple" : bucket === "flags" ? "warm" : "green");
  };
  const reject = (bucket, key) => {
    onPatchEdit((cur) => ({ aiProposal: proposalWithout(cur.aiProposal, bucket, key) }));
  };
  const rejectAll = () => {
    onPatchEdit({ aiProposal: emptyProposal() });
    onToast("Cleared " + total + " suggestion(s)", "muted");
  };

  const fieldKeys = Object.keys(p.fields);

  return (
    <div style={{
      marginBottom: 14, borderRadius: "var(--radius-sm)",
      border: "1px solid " + acRgba("blue", 0.3), background: acRgba("blue", 0.05),
    }}>
      <div style={{
        padding: "8px 10px", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap",
        borderBottom: "1px solid " + acRgba("blue", 0.2),
      }}>
        <span style={{ fontSize: 12, fontWeight: 600, color: "var(--accent-blue)" }}>Proposed changes · {total}</span>
        <span style={{ marginLeft: "auto" }}>
          <SmallBtn color="muted" onClick={rejectAll}>Reject all</SmallBtn>
        </span>
      </div>

      <div style={{ padding: 10 }}>
        <div style={{ fontSize: 10, color: "var(--text-muted)", lineHeight: 1.6, marginBottom: 10 }}>
          Nothing here has touched the card. Accepting puts an item into your vault edits; the file
          only changes when you press Save to card.
        </div>

        {fieldKeys.map((key) => {
          const def = CARD_FIELDS.filter((f) => f.key === key)[0] || { key, label: key };
          const meta = p.fieldMeta[key] || {};
          const before = meta.base || "";
          const after = p.fields[key];
          const stale = proposalFieldIsStale(edit, body, key);
          const open = openField === key;
          const delta = estimateTokens(after) - estimateTokens(before);
          return (
            <div key={key} style={{
              marginBottom: 8, padding: 9, borderRadius: "var(--radius-sm)",
              background: "var(--bg-tertiary)", border: "1px solid var(--border-subtle)",
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap", marginBottom: 7 }}>
                <span style={{ fontSize: 11.5, color: "var(--text-secondary)", fontWeight: 500 }}>{def.label}</span>
                <Pill color={delta < 0 ? "green" : "warm"}>{delta < 0 ? "" : "+"}{fmtNum(delta)}t</Pill>
                {meta.by === "agent" ? <Pill color="purple">chat agent</Pill> : null}
                {meta.model ? <Pill color="muted">{meta.model}</Pill> : null}
                <span style={{ marginLeft: "auto", display: "flex", gap: 5 }}>
                  <SmallBtn color="muted" onClick={() => setOpenField(open ? "" : key)}>{open ? "Hide diff" : "Show diff"}</SmallBtn>
                  <SmallBtn color="green" disabled={stale} onClick={() => accept("fields", key, def.label)}
                    title={stale ? "The field has changed since this was written" : "Put this rewrite into your vault edits"}>
                    Accept
                  </SmallBtn>
                  <SmallBtn color="red" onClick={() => reject("fields", key)}>Reject</SmallBtn>
                </span>
              </div>
              {stale ? (
                <div className="ai-field-stale" style={{ fontSize: 10.5, color: "var(--accent-warm)", lineHeight: 1.6, marginBottom: 6 }}>
                  {def.label} has changed since this {meta.by === "agent" ? "change was suggested" : "rewrite was made"}, so accepting
                  it would throw that change away. {meta.by === "agent" ? "Ask the agent to read the card again and redo it." : "Run Tighten again for a rewrite of the current text."}
                </div>
              ) : null}
              {meta.reason ? (
                <div className="ai-agent-reason" style={{ fontSize: 11, color: "var(--text-secondary)", lineHeight: 1.6, margin: "0 0 6px" }}>{meta.reason}</div>
              ) : null}
              {(meta.warnings || []).map((w, i) => (
                <div key={i} style={{ fontSize: 10.5, color: "var(--accent-warm)", lineHeight: 1.6 }}>⚠ {w}</div>
              ))}
              {meta.notes ? (
                <div style={{ fontSize: 11, color: "var(--text-secondary)", fontStyle: "italic", lineHeight: 1.6, margin: "4px 0 6px" }}>
                  {meta.notes}
                </div>
              ) : null}
              {open ? <DiffView before={before} after={after} /> : (
                <div style={{ fontSize: 11, color: "var(--text-muted)", lineHeight: 1.55, maxHeight: 44, overflow: "hidden" }}>
                  {after.slice(0, 220)}{after.length > 220 ? "…" : ""}
                </div>
              )}
            </div>
          );
        })}

        {p.vaultTags.length ? (
          <div style={{ margin: "4px 0 12px" }}>
            <label style={tinyLabel}>Vault-only tags · {p.vaultTags.length}</label>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 7 }}>
              {p.vaultTags.map((tag) => (
                <span key={tag} style={{ display: "inline-flex", alignItems: "center", gap: 3 }}>
                  <span onClick={() => accept("vaultTags", tag, tag)} style={{ cursor: "pointer" }} title="Accept this tag">
                    <Pill color="purple">+ {tag}</Pill>
                  </span>
                  <span onClick={() => reject("vaultTags", tag)} title="Reject this tag"
                    style={{ cursor: "pointer", color: "var(--text-muted)", fontSize: 11 }}>×</span>
                </span>
              ))}
            </div>
            <SmallBtn color="purple" onClick={() => accept("vaultTags", "*", p.vaultTags.length + " vault-only tag(s)")}>
              Accept all {p.vaultTags.length}
            </SmallBtn>
          </div>
        ) : null}

        {p.flags.length ? (
          <div style={{ marginTop: 4 }}>
            <label style={tinyLabel}>Flags · {p.flags.length}</label>
            {p.notes ? (
              <div style={{ fontSize: 11, color: "var(--text-secondary)", fontStyle: "italic", lineHeight: 1.6, marginBottom: 7 }}>{p.notes}</div>
            ) : null}
            <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
              {p.flags.map((f, i) => {
                const def = flagDef(f.key);
                const stale = basisIsStale(edit, body, f);
                const checked = f.basis ? Object.keys(f.basis).map(agentFieldLabel).join(", ") : "";
                return (
                  <div key={f.key + i} style={{
                    padding: 8, borderRadius: "var(--radius-sm)",
                    background: acRgba(def.color, 0.06), border: "1px solid " + acRgba(def.color, 0.22),
                  }}>
                    <div style={{ fontSize: 11, lineHeight: 1.6, color: "var(--text-secondary)", marginBottom: 6 }}>
                      {f.by === "agent" ? <span><Pill color="purple">chat agent</Pill>{" "}</span> : null}{f.note}
                      {checked ? <span style={{ color: "var(--text-muted)" }}> (found in: {checked})</span> : null}
                    </div>
                    {stale ? (
                      <div className="ai-flag-stale" style={{ fontSize: 10.5, color: "var(--accent-warm)", lineHeight: 1.6, marginBottom: 6 }}>
                        {checked} changed after the agent looked, so this may not hold any more. Ask it to look again.
                      </div>
                    ) : null}
                    <div style={{ display: "flex", gap: 5 }}>
                      <SmallBtn color={def.color} disabled={stale} onClick={() => accept("flags", "#" + i, def.label)}>Accept {def.icon} {def.label}</SmallBtn>
                      <SmallBtn color="muted" onClick={() => reject("flags", "#" + i)}>Reject</SmallBtn>
                    </div>
                  </div>
                );
              })}
            </div>
            {p.flags.length > 1 ? (
              <div style={{ marginTop: 7 }}>
                <SmallBtn color="warm" onClick={() => accept("flags", "*", p.flags.length + " flag(s)")}>Accept all {p.flags.length}</SmallBtn>
              </div>
            ) : null}
          </div>
        ) : null}

        {p.unflag.length ? (
          <div className="ai-unflag" style={{ marginTop: 10 }}>
            <label style={tinyLabel}>Flags to remove · {p.unflag.length}</label>
            <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
              {p.unflag.map((u) => {
                const def = flagDef(u.key);
                const still = flagsOf(edit).some((f) => f.key === u.key);
                const stale = unflagIsStale(edit, body, u);
                const checked = u.basis ? Object.keys(u.basis).map(agentFieldLabel).join(", ") : "";
                return (
                  <div key={u.key} style={{ padding: 8, borderRadius: "var(--radius-sm)", background: "var(--bg-tertiary)", border: "1px solid var(--border-subtle)" }}>
                    <div style={{ fontSize: 11, lineHeight: 1.6, color: "var(--text-secondary)", marginBottom: 6 }}>
                      <Pill color={def.color}>{def.icon} {def.label}</Pill>{" "}
                      {still ? "has been dealt with, says the agent: " : "is already gone. The agent's reason: "}{u.reason}
                      {checked ? <span style={{ color: "var(--text-muted)" }}> (checked: {checked})</span> : null}
                    </div>
                    {stale ? (
                      <div className="ai-unflag-stale" style={{ fontSize: 10.5, color: "var(--accent-warm)", lineHeight: 1.6, marginBottom: 6 }}>
                        {checked} changed after the agent checked it, so its reason may not hold any more. Ask it to look again.
                      </div>
                    ) : null}
                    <div style={{ display: "flex", gap: 5 }}>
                      <SmallBtn color="green" disabled={stale} onClick={() => accept("unflag", u.key, "removing " + def.label)}
                        title={stale ? "The card changed after the agent checked it" : ""}>
                        {still ? "Remove " + def.label : "Clear"}
                      </SmallBtn>
                      <SmallBtn color="muted" onClick={() => reject("unflag", u.key)}>Keep the flag</SmallBtn>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ) : null}

        {p.greetings ? (() => {
          const g = p.greetings;
          const stale = proposalGreetingsIsStale(edit, body);
          const open = openField === "@greetings";
          return (
            <div className="ai-greetings" style={{ marginTop: 10, padding: 9, borderRadius: "var(--radius-sm)", background: "var(--bg-tertiary)", border: "1px solid var(--border-subtle)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap", marginBottom: 6 }}>
                <span style={{ fontSize: 11.5, color: "var(--text-secondary)", fontWeight: 500 }}>Alternate greetings</span>
                <Pill color="cyan">{g.base.length} → {g.list.length}</Pill>
                <Pill color="purple">chat agent</Pill>
                <span style={{ marginLeft: "auto", display: "flex", gap: 5 }}>
                  <SmallBtn color="muted" onClick={() => setOpenField(open ? "" : "@greetings")}>{open ? "Hide diff" : "Show diff"}</SmallBtn>
                  <SmallBtn color="green" disabled={stale} onClick={() => accept("greetings", "*", "the alternate greetings")}
                    title={stale ? "The greetings have changed since this was suggested" : "Put these greetings into your vault edits"}>Accept</SmallBtn>
                  <SmallBtn color="red" onClick={() => reject("greetings", "*")}>Reject</SmallBtn>
                </span>
              </div>
              {stale ? (
                <div className="ai-greetings-stale" style={{ fontSize: 10.5, color: "var(--accent-warm)", lineHeight: 1.6, marginBottom: 6 }}>
                  The greetings have changed since this was suggested, so accepting it would throw that change away. Ask the agent to read the card again and redo it.
                </div>
              ) : null}
              {g.reason ? <div style={{ fontSize: 11, color: "var(--text-secondary)", lineHeight: 1.6, marginBottom: 6 }}>{g.reason}</div> : null}
              {open ? <DiffView before={g.base.join(AGENT_GREETING_SEP)} after={g.list.join(AGENT_GREETING_SEP)} /> : null}
            </div>
          );
        })() : null}

        {p.cardTags ? (
          <div className="ai-card-tags" style={{ marginTop: 10 }}>
            <label style={tinyLabel}>Card tags (saved in the card file) · {p.cardTags.add.length + p.cardTags.remove.length}</label>
            {p.cardTags.reason ? <div style={{ fontSize: 11, color: "var(--text-secondary)", lineHeight: 1.6, marginBottom: 6 }}><Pill color="purple">chat agent</Pill> {p.cardTags.reason}</div> : null}
            <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 7 }}>
              {p.cardTags.add.map((tag) => ({ tag, sign: "+" })).concat(p.cardTags.remove.map((tag) => ({ tag, sign: "−" }))).map((x) => (
                <span key={x.sign + x.tag} style={{ display: "inline-flex", alignItems: "center", gap: 3 }}>
                  <span onClick={() => accept("cardTags", x.tag, (x.sign === "+" ? "adding " : "removing ") + x.tag)} style={{ cursor: "pointer" }}
                    title={x.sign === "+" ? "Accept adding this tag" : "Accept removing this tag"}>
                    <Pill color={x.sign === "+" ? "green" : "red"}>{x.sign} {x.tag}</Pill>
                  </span>
                  <span onClick={() => reject("cardTags", x.tag)} title="Reject" style={{ cursor: "pointer", color: "var(--text-muted)", fontSize: 11 }}>×</span>
                </span>
              ))}
            </div>
            <SmallBtn color="green" onClick={() => accept("cardTags", "*", "the card-tag changes")}>Accept all</SmallBtn>
          </div>
        ) : null}

        {p.noteAdd.length ? (
          <div className="ai-note-add" style={{ marginTop: 10 }}>
            <label style={tinyLabel}>Lines for the notes · {p.noteAdd.length}</label>
            {p.noteAdd.map((n, i) => (
              <div key={i} style={{ display: "flex", gap: 6, alignItems: "flex-start", marginBottom: 5 }}>
                <div style={{ flex: 1, fontSize: 11, color: "var(--text-secondary)", lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{n.text}</div>
                <SmallBtn color="green" onClick={() => accept("noteAdd", String(i), "the note")}>Add</SmallBtn>
                <SmallBtn color="muted" onClick={() => reject("noteAdd", String(i))}>Reject</SmallBtn>
              </div>
            ))}
          </div>
        ) : null}
      </div>
    </div>
  );
}

/** A cached or fresh answer, shown for reading. Decisions live in AiProposals. */
function AiResult({ note, current, kind, writeMode, pending, onRepropose, ai }) {
  // Your own prompts answer in plain text.
  const action = aiActionDef(kind, ai) || { output: "text", color: "cyan" };
  const proposing = writeMode !== "off";
  let content = null;

  if (action.output === "text") content = <AiAnswer text={note.text} />;

  if (action.output === "flags") {
    const c = parseCritique(note.text);
    content = c.prose ? (
      <Fragment>
        <div style={{ fontSize: 10.5, color: "var(--accent-warm)", marginBottom: 8, lineHeight: 1.6 }}>
          The model didn't answer in the JSON format asked for, so nothing was proposed. Its reply:
        </div>
        <AiAnswer text={c.prose} />
      </Fragment>
    ) : (
      <Fragment>
        {c.verdict ? <div style={{ fontSize: 12, lineHeight: 1.7, color: "var(--text-secondary)", marginBottom: 8 }}>{c.verdict}</div> : null}
        {!c.findings.length ? (
          <div style={{ fontSize: 12, color: "var(--accent-green)" }}>No problems found.</div>
        ) : c.findings.map((f, i) => {
          const def = flagDef(f.flag);
          return (
            <div key={i} style={{ fontSize: 11.5, lineHeight: 1.6, color: "var(--text-secondary)", marginBottom: 5 }}>
              <Pill color={def.color}>{def.icon} {def.label}</Pill> {f.note}
            </div>
          );
        })}
      </Fragment>
    );
  }

  if (action.output === "vaultTags") {
    const tags = parseTagSuggestions(note.text, [], 8);
    content = tags === null ? (
      <Fragment>
        <div style={{ fontSize: 10.5, color: "var(--accent-warm)", marginBottom: 8, lineHeight: 1.6 }}>
          The model didn't answer with a list of tags, so nothing was proposed. Its reply:
        </div>
        <AiAnswer text={note.text} />
      </Fragment>
    ) : !tags.length ? (
      <div style={{ fontSize: 12, color: "var(--text-muted)" }}>No new tags suggested.</div>
    ) : (
      <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
        {tags.map((t) => <Pill key={t} color="purple">{t}</Pill>)}
      </div>
    );
  }

  if (action.output === "fields") {
    const r = parseRewrite(note.text, note.original);
    content = !r.ok ? <AiAnswer text={note.text} /> : r.unchanged ? (
      <div style={{ fontSize: 12, color: "var(--accent-green)", lineHeight: 1.7 }}>
        Already tight — the model sent it back unchanged.
      </div>
    ) : (
      <Fragment>
        {r.notes ? <div style={{ fontSize: 11.5, fontStyle: "italic", color: "var(--text-secondary)", marginBottom: 7 }}>{r.notes}</div> : null}
        {r.warnings.map((w, i) => (
          <div key={i} style={{ fontSize: 10.5, color: "var(--accent-warm)", lineHeight: 1.6 }}>⚠ {w}</div>
        ))}
        {proposing ? null : <div style={{ marginTop: 7 }}><DiffView before={note.original || ""} after={r.rewrite} /></div>}
      </Fragment>
    );
  }

  return (
    <div style={{ padding: 11, borderRadius: "var(--radius-sm)", background: "var(--bg-tertiary)", border: "1px solid var(--border-subtle)" }}>
      <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", marginBottom: 9 }}>
        <Pill color={action.color || "muted"}>{note.answeredBy || note.model || "?"}</Pill>
        <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)" })}>{fmtDate(note.at)}</span>
        {note.usage && note.usage.total_tokens ? (
          <Pill color="muted" title="Reported by the endpoint">{fmtNum(note.usage.total_tokens)}t</Pill>
        ) : null}
        {note.cutOff ? (
          <Pill color="warm" title="The answer stopped at Max tokens out, so its end is missing">cut off</Pill>
        ) : null}
        {!current ? (
          <Pill color="warm" title="The card, the settings or the prompt have changed since. Run again for an answer about what would be sent now.">
            out of date
          </Pill>
        ) : null}
      </div>
      {content}
      {proposing && current && !pending && AI_PROPOSAL_KINDS[kind] && onRepropose ? (
        <div style={{ marginTop: 9 }}>
          <SmallBtn color="muted" onClick={onRepropose} title="Put this answer's suggestions back into Proposed changes">
            Propose these again
          </SmallBtn>
        </div>
      ) : null}
    </div>
  );
}

function InspectorAiTab({ rec, body, edit, ai, relay, tagIndex, onRun, onClearNotes, onPatchEdit, onToast, onOpenSettings, onSaveAi }) {
  const [kind, setKind] = useState("summarise");
  const [field, setField] = useState(() =>
    AI_TIGHTEN_FIELDS.filter((k) => String(effectiveField(body, edit, k) || "").trim())[0] || "description");
  const [rows, setRows] = useState([]);
  const [live, setLive] = useState(null);
  const [busy, setBusy] = useState(false);
  const [fail, setFail] = useState(null);
  const [showRaw, setShowRaw] = useState(false);
  const runRef = useRef(null);

  const ready = aiReady(ai, relay);
  const problems = ai.enabled ? aiSettingsProblems(ai, relay) : [];
  const model = relay.model || "";
  // A custom prompt deleted while it was selected falls back to Summarise.
  const action = aiActionDef(kind, ai) || aiActionDef("summarise");
  useEffect(() => { if (!aiActionDef(kind, ai)) setKind("summarise"); }, [kind, ai]);
  const fieldArg = action.perField ? field : "";
  const knownTags = useMemo(() => aiTagVocabulary(tagIndex), [tagIndex]);

  const req = useMemo(() => {
    if (!body) return null;
    try { return aiBuildRequest(kind, ai, rec, body, edit, knownTags, { field: fieldArg }); }
    catch (e) { return { error: e.message }; }
  }, [kind, fieldArg, ai, rec, body, edit, knownTags]);

  const picked = pickAiNote(rows, kind, model, fieldArg, req && req.hash);
  // Whether this action's suggestions are already waiting in Proposed changes.
  const pendingNow = proposalOf(edit);
  const toCardTags = kind === "tags" && ai.tagTarget === "card";
  const bucketHere = toCardTags ? "cardTags" : AI_PROPOSAL_KINDS[kind];
  const pendingHere = bucketHere === "fields" ? Object.prototype.hasOwnProperty.call(pendingNow.fields, fieldArg)
    : bucketHere === "cardTags" ? !!(pendingNow.cardTags && pendingNow.cardTags.add.length)
    : bucketHere ? pendingNow[bucketHere].length > 0 : false;

  // Load this card's cached answers; leaving the card cancels a running request.
  useEffect(() => {
    let dead = false;
    setRows([]); setFail(null); setLive(null); setBusy(false);
    dbAllByIndex(STORE_AINOTES, "fingerprint", rec.fp).then((all) => { if (!dead) setRows(all); });
    return () => {
      dead = true;
      const r = runRef.current;
      runRef.current = null;
      if (r) r.abort();
    };
  }, [rec.fp]);

  const run = async () => {
    if (!ready || !req || req.error || busy) return;
    const ctrl = new AbortController();
    runRef.current = ctrl;
    setBusy(true); setFail(null); setShowRaw(false); setLive(aiEmptyStream());
    try {
      const res = await onRun(rec, body, edit, kind, {
        field: fieldArg, knownTags, signal: ctrl.signal,
        onProgress: (acc) => { if (runRef.current === ctrl) setLive(acc); },
      });
      if (runRef.current !== ctrl) return;
      if (!res.ok) { setFail(res); logProblem("AI action", kind + ": " + res.error); }
      else {
        setRows((prev) => prev.filter((r) => r.id !== res.note.id).concat([res.note]));
        const pr = res.outcome.proposal;
        if (pr && ai.writeMode !== "off") {
          if (pr.bucket === "vaultTags" && ai.writeMode === "auto-tags-only") {
            onToast("Added " + pr.value.length + " vault-only tag(s)", "purple");
          } else {
            const n = pr.bucket === "cardTags" ? pr.value.add.length : Array.isArray(pr.value) ? pr.value.length : Object.keys(pr.value).length;
            onToast(n + " suggestion(s) in Proposed changes", action.color || "blue");
          }
        }
      }
    } catch (e) {
      if (runRef.current !== ctrl) return;
      setFail({ error: e && e.name === "AbortError" ? "Cancelled. The request to the endpoint was stopped as well." : ((e && e.message) || String(e)) });
    }
    if (runRef.current === ctrl) {
      runRef.current = null;
      setBusy(false); setLive(null);
    }
  };

  const cancel = () => { if (runRef.current) runRef.current.abort(); };

  // Put a cached answer's suggestions back, e.g. after rejecting them by mistake.
  const repropose = () => {
    const note = picked.note;
    if (!note) return;
    const out = interpretAiResult(
      { text: note.text, think: "", finish: note.finish || "", usage: note.usage, model: note.answeredBy || note.model, done: true, error: "" },
      { kind, field: note.field, original: note.original, existingTags: aiTagExclusions(rec, edit, ai), tagTarget: ai.tagTarget, maxTokens: ai.maxTokens });
    if (!out.ok || !out.proposal) { onToast("Nothing to propose from this answer", "muted"); return; }
    const pr = out.proposal;
    onPatchEdit((cur) => ({ aiProposal: mergeProposal(cur.aiProposal, pr.bucket, pr.value, pr.meta) }));
  };

  if (!ai.enabled) {
    return (
      <div style={{ fontSize: 12, color: "var(--text-muted)", lineHeight: 1.75 }}>
        The AI harness is switched off. Turn it on in the <strong style={{ color: "var(--accent-blue)" }}>✦ AI</strong> panel
        in the header to summarise, critique, tag or tighten cards from here.
        <div style={{ marginTop: 10 }}><SmallBtn color="blue" onClick={onOpenSettings}>Open the AI panel</SmallBtn></div>
      </div>
    );
  }

  const liveText = live ? splitInlineThinking(live.text) : null;
  const liveThink = live ? (live.think.length + liveText.think.length) : 0;

  return (
    <Fragment>
      <div style={{ display: "flex", gap: 5, marginBottom: 10, flexWrap: "wrap" }}>
        {aiAllActions(ai).map((a) => (
          <SmallBtn key={a.key} color={a.color} active={kind === a.key} disabled={busy}
            onClick={() => { setKind(a.key); setFail(null); }} title={a.hint}>
            {a.icon} {a.label}{rows.some((r) => r.kind === a.key && r.model === model) ? " ✓" : ""}
          </SmallBtn>
        ))}
      </div>

      <AiProposals body={body} edit={edit} onPatchEdit={onPatchEdit} onToast={onToast} />

      {problems.length ? (
        <AiNotice color="warm">
          {problems[0]}
          <div style={{ marginTop: 7 }}><SmallBtn color="warm" onClick={onOpenSettings}>Open the AI panel</SmallBtn></div>
        </AiNotice>
      ) : null}

      <div style={{ fontSize: 11, color: "var(--text-muted)", lineHeight: 1.6, marginBottom: 9 }}>{action.hint}</div>

      {kind === "tags" && onSaveAi ? (
        <div className="ai-tag-target" style={{ marginBottom: 10 }}>
          <Toggle small color="green" checked={ai.tagTarget === "card"}
            onChange={(v) => onSaveAi({ tagTarget: v ? "card" : "vault" })}
            label={ai.tagTarget === "card" ? "Tags go to: the card's own tags" : "Tags go to: vault-only tags"} />
          <div style={{ fontSize: 10, color: "var(--text-muted)", lineHeight: 1.6, marginTop: 4 }}>
            {ai.tagTarget === "card"
              ? "Saved in the card file once you accept them and save to card. They always wait for you, whatever the write mode."
              : "Kept in the vault only, never written to the card file."}
            {" "}The bulk ✦ Suggest tags in the selection bar follows this too.
          </div>
        </div>
      ) : null}

      {action.perField ? (
        <div style={{ marginBottom: 10 }}>
          <label style={tinyLabel}>Field</label>
          <select value={field} disabled={busy} onChange={(e) => { setField(e.target.value); setFail(null); }} style={selectStyle}>
            {AI_TIGHTEN_FIELDS.map((k) => {
              const def = CARD_FIELDS.filter((f) => f.key === k)[0] || { label: k };
              const len = String(effectiveField(body, edit, k) || "").length;
              return <option key={k} value={k}>{def.label} — {len ? fmtTokens(estimateTokens(effectiveField(body, edit, k))) : "empty"}</option>;
            })}
          </select>
        </div>
      ) : null}

      <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", marginBottom: 10 }}>
        {busy ? (
          <Fragment>
            <SmallBtn color="red" onClick={cancel}>Cancel</SmallBtn>
            <span style={Object.assign({}, monoTiny, { color: "var(--text-muted)" })}>
              {!live || (!live.text && !liveThink) ? "Waiting for " + (model || "the model") + "…"
                : liveText.text ? "Writing… " + fmtNum(liveText.text.length) + " characters"
                : "Thinking… " + fmtNum(liveThink) + " characters"}
            </span>
          </Fragment>
        ) : (
          <Fragment>
