<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RP Card Vault</title>

<!-- Installable-app plumbing. Harmless when the page is opened any other way:
     the manifest is simply ignored and the service worker never registers. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14171e">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
// Caches the app shell so the installed window still opens when the little
// Node server isn't running. Only meaningful over http(s); silently skipped
// for file:// where service workers aren't allowed anyway.
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* not fatal */ });
  });
}
</script>
<script>
// The theme chosen in Settings, remembered in this browser so the page opens in
// it instead of flashing the default first. The vault's own settings load later.
try {
  var savedTheme = JSON.parse(localStorage.getItem("rpCardVault-theme") || "null");
  if (savedTheme && savedTheme.vars) {
    for (var k in savedTheme.vars) if (/^--[a-z-]+$/.test(k)) document.documentElement.style.setProperty(k, String(savedTheme.vars[k]));
    document.documentElement.style.colorScheme = savedTheme.light ? "light" : "dark";
  }
} catch (e) { /* storage blocked: the default theme it is */ }
</script>
<style>
/* The fonts ship in lib/fonts, so the page never contacts Google Fonts. */
@import url('lib/fonts/fonts.css');

:root {
  --bg-primary:    #0d0f13;
  --bg-secondary:  #14171e;
  --bg-tertiary:   #1a1e28;
  --bg-elevated:   #1f2430;
  --bg-input:      #161a23;

  --border-subtle: #2a2f3d;
  --border-accent: #3d4455;

  --text-primary:   #e8e6e1;
  --text-secondary: #9a978f;
  --text-muted:     #5e5c56;

  --accent-warm:      #c7935a;
  --accent-warm-dim:  #9e7345;
  --accent-warm-glow: rgba(199,147,90,0.12);
  --accent-red:       #b85450;
  --accent-green:     #6b9e6b;
  --accent-blue:      #5b7ea6;
  --accent-pink:      #a6637a;
  --accent-cyan:      #5b9e9e;
  --accent-purple:    #8b6bae;

  --on-art-mix: 100%;     /* how much of an accent's colour a label on a picture keeps (the rest is white) */

  --radius-sm: 4px;
  --radius-md: 8px;
  color-scheme: dark;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
#root { height: 100vh; }

select option { background: var(--bg-tertiary); color: var(--text-primary); }
select optgroup { background: var(--bg-secondary); color: var(--text-secondary); font-style: normal; font-weight: 600; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-accent); }

@keyframes progressPulse { 0%,100% { opacity: .6 } 50% { opacity: 1 } }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes spin { to { transform: rotate(360deg) } }

.fadeIn { animation: fadeIn .15s ease-out; }

/* Agent chat loaders: one picked at random per request. */
@keyframes agBounce { 0%,80%,100% { transform: translateY(0); opacity: .35 } 40% { transform: translateY(-5px); opacity: 1 } }
@keyframes agBars { 0%,100% { transform: scaleY(.3) } 50% { transform: scaleY(1) } }
@keyframes agRing { 0% { transform: scale(.4); opacity: .9 } 100% { transform: scale(1.4); opacity: 0 } }
@keyframes agCards { 0%,100% { transform: translateX(0) rotate(-8deg) } 50% { transform: translateX(8px) rotate(8deg) } }
@keyframes agShimmer { 0% { background-position: -120px 0 } 100% { background-position: 120px 0 } }
.ag-loader { display: inline-flex; align-items: center; gap: 3px; height: 16px; width: 26px; justify-content: center; flex-shrink: 0; position: relative; }
.ag-loader i { display: block; background: var(--accent-blue); }
.ag-dots i { width: 5px; height: 5px; border-radius: 50%; animation: agBounce 1.1s ease-in-out infinite; }
.ag-dots i:nth-child(2) { animation-delay: .15s } .ag-dots i:nth-child(3) { animation-delay: .3s }
.ag-orbit { border-radius: 50%; }
.ag-orbit i { position: absolute; width: 5px; height: 5px; border-radius: 50%; top: 1px; left: 11px; transform-origin: 2.5px 7px; animation: spin 1s linear infinite; }
.ag-orbit i:nth-child(2) { animation-delay: -.33s; opacity: .6 } .ag-orbit i:nth-child(3) { animation-delay: -.66s; opacity: .3 }
.ag-bars i { width: 3px; height: 14px; border-radius: 1px; animation: agBars .9s ease-in-out infinite; }
.ag-bars i:nth-child(2) { animation-delay: .15s } .ag-bars i:nth-child(3) { animation-delay: .3s } .ag-bars i:nth-child(4) { animation-delay: .45s }
.ag-ring i { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: none; border: 2px solid var(--accent-blue); animation: agRing 1.3s ease-out infinite; }
.ag-ring i:nth-child(2) { animation-delay: .65s }
.ag-cards i { position: absolute; width: 9px; height: 13px; border-radius: 2px; border: 1px solid var(--accent-warm); background: var(--bg-tertiary); animation: agCards 1.4s ease-in-out infinite; }
.ag-cards i:nth-child(2) { animation-delay: -.7s; border-color: var(--accent-blue) }
.ag-shimmer i { width: 24px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--border-subtle) 0%, var(--accent-blue) 50%, var(--border-subtle) 100%); background-size: 240px 6px; animation: agShimmer 1.2s linear infinite; }
@media (prefers-reduced-motion: reduce) { .ag-loader i { animation: none !important; } }
/* Copy and fork under each message: faint until you point at the message. */
.agent-msg-acts { display: flex; gap: 2px; opacity: 0.35; transition: opacity .12s; }
.agent-msg:hover .agent-msg-acts, .agent-msg-acts:focus-within { opacity: 1; }
.agent-msg-acts button { background: none; border: none; padding: 1px 5px; border-radius: 4px; cursor: pointer;
  color: var(--text-muted); font-size: 10.5px; font-family: inherit; }
.agent-msg-acts button:hover { color: var(--text-primary); background: var(--bg-tertiary); }

.vault-scroll { overflow-y: auto; overflow-x: hidden; }
.no-sel { user-select: none; }

textarea { font-family: 'Outfit', sans-serif; resize: vertical; }

.cardTile { transition: border-color .12s, transform .12s, background .12s; }
.cardTile:hover { border-color: var(--border-accent) !important; }

.tagRow { transition: background .1s; }
.tagRow:hover { background: var(--bg-elevated); }

kbd {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  background: var(--bg-input); border: 1px solid var(--border-subtle);
  border-radius: 3px; padding: 1px 5px; color: var(--text-secondary);
}
</style>
</head>
<body>
<div id="root"></div>

<!-- Fail-loud guard. Installed BEFORE anything else so that a syntax error in
     the Babel-transformed script, a blocked CDN, or a stray rejection paints a
     readable panel instead of leaving a blank white page. -->
<script>
(function () {
  var shown = false;
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function panel(title, detail) {
    var r = document.getElementById("root");
    if (!r || shown) return;
    if (r.getAttribute("data-mounted") === "1") return;  // app is alive; don't clobber it
    shown = true;
    r.innerHTML =
      '<div style="font-family:ui-sans-serif,system-ui,sans-serif;color:#e8e6e1;padding:34px;max-width:860px;margin:0 auto;line-height:1.65">' +
      '<div style="font-size:24px;font-weight:700;color:#c7935a;margin-bottom:6px">RP Card Vault failed to start</div>' +
      '<div style="font-size:13px;color:#9a978f;margin-bottom:18px">' + esc(title) + '</div>' +
      '<pre style="font-family:ui-monospace,monospace;font-size:11.5px;background:#161a23;border:1px solid #2a2f3d;' +
      'border-radius:6px;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#b85450;max-height:340px">' +
      esc(detail) + '</pre>' +
      '<div style="font-size:12px;color:#9a978f;margin-top:16px">' +
      'If this mentions a script that failed to load, the libraries in the lib folder are missing ' +
      'and cdnjs could not be reached. Keep the lib folder next to RP_Card_Vault.html, or connect to the internet.' +
      '</div></div>';
  }
  window.addEventListener("error", function (e) {
    if (e && e.target && e.target.tagName === "SCRIPT") {
      // A missing local library isn't fatal: the cdnjs copy loads next.
      if (e.target.getAttribute("data-local")) return;
      panel("A required script could not be loaded.", "Failed to load: " + (e.target.src || "(inline)"));
      return;
    }
    panel("A script error stopped the app before it could render.",
      (e && e.error && e.error.stack) || (e && e.message) || String(e));
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var r = e && e.reason;
    panel("An unhandled promise rejection stopped startup.", (r && r.stack) || String(r));
  });
  // If nothing has rendered after 12s, say so rather than sitting blank forever.
  setTimeout(function () {
    var r = document.getElementById("root");
    if (r && r.getAttribute("data-mounted") !== "1" && !r.innerHTML.trim()) {
      panel("The app never mounted.",
        "React: " + (typeof window.React) + "\nReactDOM: " + (typeof window.ReactDOM) +
        "\nBabel: " + (typeof window.Babel) +
        "\n\nIf these are 'undefined', the libraries (lib folder, or cdnjs) did not load.");
    }
  }, 12000);
})();
</script>

<!-- React, ReactDOM, Babel and JSZip ship in lib/, so the vault starts on a
     computer with no internet. When a local copy is missing (an older install
     that was given only the new page and serve.js, say), the line after it
     loads the same file from cdnjs. Both are checked against the same hash. -->
<script src="lib/react.production.min.js" integrity="sha512-8Q6Y9XnTbOE+JNvjBQwJ2H8S+UV4uA6hiRykhdtIyDYZ2TprdNmWOUaKdGzOhyr4dCyk287OejbPvwl7lrfqrQ==" data-local="1"></script>
<script>window.React || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" integrity="sha512-8Q6Y9XnTbOE+JNvjBQwJ2H8S+UV4uA6hiRykhdtIyDYZ2TprdNmWOUaKdGzOhyr4dCyk287OejbPvwl7lrfqrQ==" crossorigin="anonymous" referrerpolicy="no-referrer"><\/script>')</script>
<script src="lib/react-dom.production.min.js" integrity="sha512-MOCpqoRoisCTwJ8vQQiciZv0qcpROCidek3GTFS6KTk2+y7munJIlKCVkFCYY+p3ErYFXCjmFjnfTTRSC1OHWQ==" data-local="1"></script>
<script>window.ReactDOM || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" integrity="sha512-MOCpqoRoisCTwJ8vQQiciZv0qcpROCidek3GTFS6KTk2+y7munJIlKCVkFCYY+p3ErYFXCjmFjnfTTRSC1OHWQ==" crossorigin="anonymous" referrerpolicy="no-referrer"><\/script>')</script>
<script src="lib/babel.min.js" integrity="sha512-OG8Ewzlpr7HnTHwrXzN256M6xbPdDJdurFYIRh0vRHOeFsL0S9yIwHiWSA2kopUevhG/ta4qyVVc2hCRSJy2MQ==" data-local="1"></script>
<script>window.Babel || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js" integrity="sha512-OG8Ewzlpr7HnTHwrXzN256M6xbPdDJdurFYIRh0vRHOeFsL0S9yIwHiWSA2kopUevhG/ta4qyVVc2hCRSJy2MQ==" crossorigin="anonymous" referrerpolicy="no-referrer"><\/script>')</script>
<script src="lib/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" data-local="1"></script>
<script>window.JSZip || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"><\/script>')</script>
<!-- data-presets="react" is deliberate: it keeps Babel from down-levelling to
     ES5, which would require a regeneratorRuntime we don't ship. JSX is the
     only transform we actually need. -->
<script type="text/babel" data-presets="react">
const { useState, useRef, useCallback, useEffect, useLayoutEffect, useMemo, Fragment } = React;

/* ════════════════════════════════════════════
   1. CONSTANTS / CONFIG
   ════════════════════════════════════════════ */

const APP_NAME    = "RP Card Vault";
// The release. serve.js (VAULT_VERSION), package.json and the newest heading
// in CHANGELOG.md say the same; test/release.test.js checks.
const APP_VERSION = "1.4.3";

const DB_NAME = "rpCardVault";
const DB_VER  = 3;               // 2 added aiNotes; 3 added agentSessions

const STORE_KV     = "kv";
const STORE_ROOTS  = "roots";
const STORE_CARDS  = "cards";
const STORE_THUMBS = "thumbs";
const STORE_EDITS  = "edits";
const STORE_OPLOG  = "oplog";
const STORE_BODIES = "bodies";   // full card text, kept out of the in-memory index
const STORE_AINOTES = "aiNotes"; // cached AI answers, keyed by fingerprint+kind+model
const STORE_AGENT  = "agentSessions"; // agent chats, kept until you delete them

const ROOT_ROLES = {
  inbox:     { label: "Inbox",     color: "cyan",   icon: "\u{1F4E5}", desc: "New downloads land here. Source for the ingest pipeline." },
  library:   { label: "Library",   color: "warm",   icon: "\u{1F4DA}", desc: "Your live front-end character folder." },
  archive:   { label: "Archive",   color: "green",  icon: "\u{1F5C3}", desc: "Redundant backup copies." },
  reference: { label: "Reference", color: "purple", icon: "\u{1F50D}", desc: "Scanned and searchable, never written to." },
};

const CARD_EXTS = ["png", "apng", "json", "charx"];

// Fields we surface in the inspector, in display order.
const CARD_FIELDS = [
  { key: "description",              label: "Description",               big: true,  weighty: true },
  { key: "personality",              label: "Personality",               big: true,  weighty: true },
  { key: "scenario",                 label: "Scenario",                  big: true,  weighty: true },
  { key: "first_mes",                label: "First Message",             big: true,  weighty: true },
  { key: "mes_example",              label: "Example Dialogue",          big: true,  weighty: false },
  { key: "system_prompt",            label: "System Prompt",             big: true,  weighty: false },
  { key: "post_history_instructions",label: "Post-History Instructions", big: true,  weighty: false },
  { key: "creator_notes",            label: "Creator Notes",             big: true,  weighty: false },
];

const SORTS = [
  { key: "name",      label: "Name (A–Z)" },
  { key: "nameDesc",  label: "Name (Z–A)" },
  { key: "mtimeDesc", label: "File date (newest)" },
  { key: "mtime",     label: "File date (oldest)" },
  { key: "tokensDesc",label: "Tokens (most)" },
  { key: "tokens",    label: "Tokens (fewest)" },
  { key: "tagsDesc",  label: "Tag count (most)" },
  { key: "loreDesc",  label: "Lorebook entries (most)" },
  { key: "sizeDesc",  label: "File size (largest)" },
  { key: "specDesc",  label: "Spec version (newest)" },
  { key: "random",    label: "Random" },
];

/** The sort the grid opens with: the one chosen in Settings, or the last one used. */
function startupSort(settings) {
  const want = settings && settings.startSort === "last" ? settings.lastSort : settings && settings.startSort;
  return SORTS.some((x) => x.key === want) ? want : "name";
}

/* ── flags ───────────────────────────────────────────────────────────
   Vault-only markers. Status flags carry a free-text reason ("contains
   jailbreak, remove"); colour flags are just a visual marker. None of this
   is ever written into a card file.
   ──────────────────────────────────────────────────────────────────── */

const FLAG_PRESETS = [
  { key: "needsEdit", label: "Needs editing",      color: "warm",   icon: "✎", hint: "What needs changing?" },
  { key: "jailbreak", label: "Contains jailbreak", color: "red",    icon: "⚠", hint: "What did you spot?" },
  { key: "broken",    label: "Broken card",        color: "red",    icon: "✕", hint: "What's wrong with it?" },
  { key: "review",    label: "To review",          color: "blue",   icon: "?", hint: "What are you checking?" },
  { key: "rewrite",   label: "Needs a rewrite",    color: "pink",   icon: "✍", hint: "Which parts?" },
  { key: "wip",       label: "Work in progress",   color: "purple", icon: "⚙", hint: "Where did you get to?" },
  { key: "keeper",    label: "Keeper",             color: "green",  icon: "★", hint: "Why?" },
];

const FLAG_COLORS = [
  { key: "c-red",    label: "Red",    color: "red",    icon: "●", swatch: true },
  { key: "c-amber",  label: "Amber",  color: "warm",   icon: "●", swatch: true },
  { key: "c-green",  label: "Green",  color: "green",  icon: "●", swatch: true },
  { key: "c-blue",   label: "Blue",   color: "blue",   icon: "●", swatch: true },
  { key: "c-purple", label: "Purple", color: "purple", icon: "●", swatch: true },
];

/* Flags of your own, made in Settings → Flags. Each has a name, an icon, a
   colour, the question its note asks, and a line telling the agent when to
   suggest it. They live in your settings (so Export vault data carries them),
   and are set here whenever the settings change. Keys start "u-", so they can
   never collide with a built-in flag. */
const CUSTOM_FLAG_COLORS = ["warm", "red", "green", "blue", "pink", "cyan", "purple"];
const CUSTOM_FLAG_MAX = 30;
let CUSTOM_FLAGS = [];

function sanitizeCustomFlags(list) {
  const out = [], seen = new Set();
  for (const f of Array.isArray(list) ? list : []) {
    if (!f || typeof f !== "object") continue;
    const key = String(f.key || "");
    if (!/^u-[a-z0-9-]{1,40}$/.test(key) || seen.has(key)) continue;
    seen.add(key);
    out.push({
      key,
      label: String(f.label || "").replace(/\s+/g, " ").replace(/^ /, "").slice(0, 40),
      color: CUSTOM_FLAG_COLORS.indexOf(f.color) >= 0 ? f.color : "warm",
      icon: Array.from(String(f.icon || "").trim()).slice(0, 2).join("") || "⚑",
      hint: String(f.hint || "").slice(0, 80),
      agent: String(f.agent || "").slice(0, 400),
      custom: true,
    });
    if (out.length >= CUSTOM_FLAG_MAX) break;
  }
  return out;
}

function setCustomFlags(list) { CUSTOM_FLAGS = sanitizeCustomFlags(list); return CUSTOM_FLAGS; }

/** A free key for a new flag of your own, from its name. */
function customFlagKey(label, existing) {
  const slug = String(label || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30) || "flag";
  const taken = new Set((existing || []).map((f) => f.key));
  let k = "u-" + slug, n = 2;
  while (taken.has(k)) k = "u-" + slug + "-" + n++;
  return k;
}

/** The flags that take a note: the built-in ones, then yours. */
function statusFlags() {
  return FLAG_PRESETS.concat(CUSTOM_FLAGS.map((f) => (f.label.trim() ? f : Object.assign({}, f, { label: "Untitled flag" }))));
}
function allFlags() { return statusFlags().concat(FLAG_COLORS); }

function flagDef(key) {
  for (const f of allFlags()) if (f.key === key) return f;
  // One of yours that has since been removed from Settings: still shown, by its name.
  if (/^u-/.test(String(key))) return { key, label: String(key).slice(2).replace(/-/g, " "), color: "muted", icon: "⚑" };
  return { key, label: key, color: "muted", icon: "⚑" };
}

const THUMB_W = 240;
const SCAN_HEAD_BYTES = 512 * 1024;   // try metadata from first 512KB before full read
const GRID_BUFFER_ROWS = 3;

/* ════════════════════════════════════════════
   2. INDEXEDDB LAYER
   ════════════════════════════════════════════

   Deliberate deviation from the suite's localStorage convention:
   - FileSystemDirectoryHandle objects can ONLY be persisted via
     structured clone into IndexedDB. localStorage cannot hold them.
   - Metadata + thumbnails for thousands of cards blows past the
     ~5MB localStorage quota immediately.
   Everything still stays 100% client-side. No backend.
   ════════════════════════════════════════════ */

let _dbPromise = null;

function dbOpen() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VER); }
    catch (e) { reject(e); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_KV))     db.createObjectStore(STORE_KV);
      if (!db.objectStoreNames.contains(STORE_ROOTS))  db.createObjectStore(STORE_ROOTS, { keyPath: "id" });
      if (!db.objectStoreNames.contains(STORE_CARDS)) {
        const s = db.createObjectStore(STORE_CARDS, { keyPath: "id" });
        s.createIndex("rootId", "rootId", { unique: false });
        s.createIndex("fingerprint", "fingerprint", { unique: false });
        s.createIndex("fileHash", "fileHash", { unique: false });
      }
      if (!db.objectStoreNames.contains(STORE_THUMBS)) db.createObjectStore(STORE_THUMBS);
      if (!db.objectStoreNames.contains(STORE_BODIES)) db.createObjectStore(STORE_BODIES);
      if (!db.objectStoreNames.contains(STORE_EDITS))  db.createObjectStore(STORE_EDITS, { keyPath: "fingerprint" });
      if (!db.objectStoreNames.contains(STORE_OPLOG))  db.createObjectStore(STORE_OPLOG, { keyPath: "id", autoIncrement: true });
      // Added in DB_VER 2. Every store here is created behind a contains()
      // check, so an existing vault picks this up on the version bump without
      // touching anything already in it.
      if (!db.objectStoreNames.contains(STORE_AINOTES)) {
        const s = db.createObjectStore(STORE_AINOTES, { keyPath: "id" });
        s.createIndex("fingerprint", "fingerprint", { unique: false });
      }
      // Added in DB_VER 3, the same way.
      if (!db.objectStoreNames.contains(STORE_AGENT)) {
        const s = db.createObjectStore(STORE_AGENT, { keyPath: "id" });
        s.createIndex("updatedAt", "updatedAt", { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
    req.onblocked = () => reject(new Error("IndexedDB blocked — close other tabs running this tool."));
  });
  return _dbPromise;
}

function txDone(tx) {
  return new Promise((res, rej) => {
    tx.oncomplete = () => res();
    tx.onerror    = () => rej(tx.error);
    tx.onabort    = () => rej(tx.error || new Error("tx aborted"));
  });
}

async function dbGet(store, key) {
  try {
    const db = await dbOpen();
    return await new Promise((res, rej) => {
      const r = db.transaction(store, "readonly").objectStore(store).get(key);
      r.onsuccess = () => res(r.result);
      r.onerror   = () => rej(r.error);
    });
  } catch (e) { return undefined; }
}

/*
 * Several windows of the vault can be open at once (the app window and a
 * browser tab, say). Each keeps your edits in memory and writes a card's
 * whole edit back when you change it, so a window holding an older copy
 * would undo what another just saved. Every saved edit is therefore
 * announced to the other windows, which take it in straight away.
 */
let editsChannel = null;
function vaultEditsChannel() {
  if (!editsChannel && typeof BroadcastChannel !== "undefined") {
    try { editsChannel = new BroadcastChannel("rpCardVault-edits"); if (editsChannel.unref) editsChannel.unref(); }
    catch (e) { editsChannel = null; }
  }
  return editsChannel;
}

function announceEdits(put, deleted) {
  const ch = vaultEditsChannel();
  if (!ch) return;
  try { ch.postMessage({ put: put || [], deleted: deleted || [] }); } catch (e) { /* nothing listening */ }
}

async function dbPut(store, value, key) {
  try {
    const db = await dbOpen();
    const tx = db.transaction(store, "readwrite");
    if (key !== undefined) tx.objectStore(store).put(value, key);
    else tx.objectStore(store).put(value);
    await txDone(tx);
    if (store === STORE_EDITS) announceEdits([value]);
    return true;
  } catch (e) { console.warn("dbPut failed", store, e); return false; }
}

/*
 * Store many values in one transaction. One value the database can't store
 * (a card nested thousands of levels deep, say, which its copier can't
 * follow) must not cost the others: put() throws for it straight away, so
 * it's skipped and the rest go in. If the transaction fails as a whole
 * instead, each value is tried on its own. Returns false if any was left out.
 */
async function dbPutMany(store, items) {
  if (!items || !items.length) return true;
  const putAll = async (list) => {
    const db = await dbOpen();
    const tx = db.transaction(store, "readwrite");
    const os = tx.objectStore(store);
    let skipped = 0;
    for (const it of list) {
      try {
        if (it && it.__key !== undefined) os.put(it.__val, it.__key);
        else os.put(it);
      } catch (e) {
        skipped++;
        console.warn("dbPutMany: skipped a value the database can't store", store, it && (it.__key || it.id), e);
      }
    }
    await txDone(tx);
    if (store === STORE_EDITS) announceEdits(list);
    return skipped === 0;
  };
  try { return await putAll(items); }
  catch (e) {
    console.warn("dbPutMany failed as a batch; storing one by one", store, e);
    let ok = true;
    for (const it of items) {
      try { if (!(await putAll([it]))) ok = false; }
      catch (e2) { ok = false; }
    }
    return ok;
  }
}

async function dbDel(store, key) {
  try {
    const db = await dbOpen();
    const tx = db.transaction(store, "readwrite");
    tx.objectStore(store).delete(key);
    await txDone(tx);
    if (store === STORE_EDITS) announceEdits([], [key]);
    return true;
  } catch (e) { return false; }
}

async function dbAll(store) {
  try {
    const db = await dbOpen();
    return await new Promise((res, rej) => {
      const r = db.transaction(store, "readonly").objectStore(store).getAll();
      r.onsuccess = () => res(r.result || []);
      r.onerror   = () => rej(r.error);
    });
  } catch (e) { return []; }
}

/**
 * Index records whose folder is no longer registered. They can be left behind
 * when a folder is removed while a scan of it is still running, and each one
 * shows up as a duplicate with "?" for its folder.
 */
function orphanCardIds(cards, roots) {
  const known = new Set((roots || []).map((r) => r.id));
  return (cards || []).filter((c) => c && !known.has(c.rootId)).map((c) => c.id);
}

/** Drop index records (card, text, thumbnail) by id. Never touches files. */
async function dbDelCardRecords(ids) {
  for (const id of ids) {
    await dbDel(STORE_CARDS, id); await dbDel(STORE_BODIES, id); await dbDel(STORE_THUMBS, id);
  }
}

/** Every index record of a folder, read from the database rather than from
    what's on screen, so records saved a moment ago are included too. */
async function dbDelCardsOfRoot(rootId) {
  const recs = await dbAllByIndex(STORE_CARDS, "rootId", rootId);
  await dbDelCardRecords(recs.map((c) => c.id));
  return recs.length;
}

/**
 * Whether a key is in a store, without reading its value. For saved folders
 * this matters: their records hold folder handles, and reading one back
 * closes the whole browser on Chromium 153 (see HANDLE_CRASH_VERSIONS).
 */
async function dbHas(store, key) {
  try {
    const db = await dbOpen();
    return await new Promise((res, rej) => {
      const r = db.transaction(store, "readonly").objectStore(store).count(key);
      r.onsuccess = () => res(r.result > 0);
      r.onerror   = () => rej(r.error);
    });
  } catch (e) { return false; }
}

/** Every key in a store, or [] if it can't be read. */
async function dbKeys(store) {
  try {
    const db = await dbOpen();
    return await new Promise((res, rej) => {
      const r = db.transaction(store, "readonly").objectStore(store).getAllKeys();
      r.onsuccess = () => res(r.result || []);
      r.onerror   = () => rej(r.error);
    });
  } catch (e) { return []; }
}

async function dbClearStore(store) {
  try {
    const db = await dbOpen();
    const tx = db.transaction(store, "readwrite");
    tx.objectStore(store).clear();
    await txDone(tx);
    return true;
  } catch (e) { return false; }
}

async function dbDeleteByIndex(store, indexName, value) {
  try {
    const db = await dbOpen();
    const tx = db.transaction(store, "readwrite");
    const idx = tx.objectStore(store).index(indexName);
    const req = idx.openCursor(IDBKeyRange.only(value));
    const keys = [];
    req.onsuccess = () => {
      const c = req.result;
      if (c) { keys.push(c.primaryKey); c.delete(); c.continue(); }
    };
    await txDone(tx);
    return keys;
  } catch (e) { return []; }
}

async function dbAllByIndex(store, indexName, value) {
  try {
    const db = await dbOpen();
    return await new Promise((res, rej) => {
      const r = db.transaction(store, "readonly").objectStore(store).index(indexName).getAll(IDBKeyRange.only(value));
      r.onsuccess = () => res(r.result || []);
      r.onerror   = () => rej(r.error);
    });
  } catch (e) { return []; }
}

/**
 * Chrome refuses IndexedDB (and often the directory picker) for pages opened
 * straight off disk as file://. Rather than silently forgetting everything on
 * reload, find out at boot and say so.
 */
const IS_FILE_URL = typeof location !== "undefined" && location.protocol === "file:";

// Chromium family is the only one that implements the File System Access API.
// Distinguishing "wrong origin" from "wrong browser" matters: they have
// completely different fixes and one of them is unfixable from here.
const IS_CHROMIUM = (function () {
  if (typeof navigator === "undefined") return false;
  const ua = navigator.userAgent || "";
  if (/Firefox|FxiOS/.test(ua)) return false;
  if (/^((?!chrome|android|crios|edg|opr).)*safari/i.test(ua)) return false;
  return /Chrome|Chromium|Edg|OPR|Brave|CriOS/.test(ua) || typeof window.chrome === "object";
})();

// Brave ships a user-agent identical to Chrome's on purpose, so sniffing the UA
// string identifies it as Chrome. navigator.brave is the only reliable tell —
// and it matters here, because Brave is the one Chromium browser that removes
// the File System Access API outright.
const IS_BRAVE = typeof navigator !== "undefined" && !!navigator.brave;

const BROWSER_LABEL = (function () {
  if (typeof navigator === "undefined") return "this browser";
  if (IS_BRAVE) return "Brave";
  const ua = navigator.userAgent || "";
  if (/Firefox/.test(ua)) return "Firefox";
  if (/Edg/.test(ua)) return "Edge";
  if (/OPR/.test(ua)) return "Opera";
  if (/Chrome/.test(ua)) return "Chrome";
  if (/Safari/.test(ua)) return "Safari";
  return "this browser";
})();

};
const THEME_CHOICES = ["auto", "vault", "midnight", "parchment", "contrast"];

/** The theme a setting means: "auto" is Vault or Parchment by the system's preference. */
function themeKeyFor(choice, prefersLight) {
  if (choice === "auto" || !THEMES[choice]) return choice === "auto" && prefersLight ? "parchment" : "vault";
  return choice;
}

/** Every variable's value for these settings: { vars, light }. */
function themeVars(settings, prefersLight) {
  const t = THEMES[themeKeyFor(settings && settings.theme, prefersLight)];
  const vars = {};
  THEME_VARS.forEach((k, i) => { vars[k] = t.colors[i]; });
  const accent = settings && settings.accentColor;
  if (/^#[0-9a-f]{6}$/i.test(String(accent || ""))) {
    vars["--accent-warm"] = accent;
    vars["--accent-warm-dim"] = "color-mix(in srgb, " + accent + " 78%, black)";
    vars["--accent-warm-glow"] = "color-mix(in srgb, " + accent + " 12%, transparent)";
  }
  return { vars, light: t.light };
}

/** Put a theme on the page, and remember it for the next start. */
function applyTheme(theme) {
  if (typeof document === "undefined") return;
  const el = document.documentElement;
  for (const k of Object.keys(theme.vars)) el.style.setProperty(k, theme.vars[k]);
  el.style.colorScheme = theme.light ? "light" : "dark";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme.vars["--bg-secondary"]);
  try { localStorage.setItem("rpCardVault-theme", JSON.stringify(theme)); } catch (e) { /* storage blocked */ }
}

/* Chromium versions with a storage bug the vault can't work around: once a
   page has saved a folder handle (the vault saves your card folders), the
   whole browser closes the next time that page opens its saved data, in any
   database or storage bucket. A regression in 153, fixed in 154. Chrome, Edge
   and Opera share the engine, so the engine's version is what counts. */
const HANDLE_CRASH_VERSIONS = [153];

/** The Chromium engine's major version from a user agent, or 0. */
function chromiumMajor(ua) {
  // "HeadlessChrome/153" is the same engine (browsers run by automation).
  const m = /\b(?:Headless)?Chrom(?:e|ium)\/(\d+)\./.exec(String(ua || ""));
  return m ? Number(m[1]) : 0;
}

/** The engine version if this browser has that bug, else 0. */
function handleCrashVersion(ua) {
  const v = chromiumMajor(ua);
  return HANDLE_CRASH_VERSIONS.indexOf(v) >= 0 ? v : 0;
}

/** Where this browser checks for updates (a page you type into the address bar). */
function browserUpdatePage(label) {

}

// No port here on purpose. Each copy can have its own (vault.local), and this

const SERVE_HINT = "Run \"Start RP Card Vault.bat\" from the folder this file is in — " +

/* The address this copy is actually being served from, and the same port under
   the other hostname — which is the trap being warned about. Read from the
   origin rather than hardcoded, so the warning stays true whichever copy and
   whichever port you're looking at. */
const CURRENT_ORIGIN_LABEL = (function () {
  // No origin to read (file://). A placeholder rather than a real port, so the
  // warning can't send anyone to the wrong copy of the vault.
  if (typeof location === "undefined" || !location.host) return "127.0.0.1:PORT";
  return location.host;
})();

const ALT_ORIGIN_LABEL = (function () {
  const host = CURRENT_ORIGIN_LABEL;
  if (host.indexOf("127.0.0.1") === 0) return host.replace("127.0.0.1", "localhost");
  if (host.indexOf("localhost") === 0) return host.replace("localhost", "127.0.0.1");
  return "localhost" + (host.indexOf(":") >= 0 ? host.slice(host.indexOf(":")) : "");
})();

/*

}

/* ════════════════════════════════════════════
   3. UTILITIES
   ════════════════════════════════════════════ */

function estimateTokens(text) {
  if (!text) return 0;
  return Math.ceil(String(text).length / 4);
}

/**
 * Split long text into pieces that fit a context window, preferring to break
 * at a paragraph, then a line, then a sentence, then a space — never
 * mid-word if it can be helped. `overlap` repeats a tail of the previous
 * piece so a model doesn't lose the thread between chunks.
 *
 * Sizes are in characters, not tokens: estimateTokens() counts 4 chars to a
 * token, so a 6000-character chunk is roughly 1500 tokens.
 */
function chunkText(text, maxChars, overlap) {
  const s = String(text == null ? "" : text);
  const size = Math.max(200, Math.floor(maxChars || 6000));
  const lap = Math.max(0, Math.min(Math.floor(overlap || 0), Math.floor(size / 2)));
  if (s.length <= size) return s.length ? [s] : [];

  const out = [];
  let pos = 0;
  while (pos < s.length) {
    let end = Math.min(s.length, pos + size);
    if (end < s.length) {
      // Only accept a break point in the last 40% of the window, so one
      // stubborn wall of text can't collapse every chunk to a few words.
      const floor = pos + Math.floor(size * 0.6);
      const win = s.slice(floor, end);
      const spots = [win.lastIndexOf("\n\n"), win.lastIndexOf("\n"), win.lastIndexOf(". "), win.lastIndexOf(" ")];
      for (let i = 0; i < spots.length; i++) {
        const b = spots[i];
        if (b > 0) { end = floor + b + (i === 2 ? 2 : 1); break; }
      }
    }
    const piece = s.slice(pos, end);
    if (!piece.length) break;
    out.push(piece);
    if (end >= s.length) break;
    pos = Math.max(end - lap, pos + 1);
  }
  return out;
}

function fmtNum(n) {
  if (n === null || n === undefined || isNaN(n)) return "0";
  return Number(n).toLocaleString("en-US");
}

function fmtTokens(n) { return "~" + fmtNum(n) + "t"; }

function fmtBytes(b) {
  if (!b) return "0 B";
  const u = ["B", "KB", "MB", "GB"];
  let i = 0, v = b;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + " " + u[i];
}

function fmtDate(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  if (isNaN(d.getTime())) return "—";
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function fmtDateShort(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  if (isNaN(d.getTime())) return "—";
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

function extOf(name) {
  const i = String(name).lastIndexOf(".");
  return i < 0 ? "" : name.slice(i + 1).toLowerCase();
}

function baseName(name) {
  const i = String(name).lastIndexOf(".");
  return i < 0 ? name : name.slice(0, i);
}

function safeFileName(s) {
  let n = String(s || "card").replace(/[\\/:*?"<>|\x00-\x1F]/g, "_").replace(/\s+/g, " ").trim().slice(0, 120);
  // Windows drops trailing dots and spaces, and CON, NUL, COM1 and the like are
  // devices whatever comes after them.
  n = n.replace(/[. ]+$/, "");
  if (/^(con|prn|aux|nul|com[0-9]|lpt[0-9])$/i.test(n)) n = "_" + n;
  return n || "card";
}

function uid() {
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9);
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function downloadFile(content, filename, type) {
  downloadBlob(new Blob([content], { type: type || "text/plain" }), filename);
}

async function sha256Hex(buf) {
  try {
    const d = await crypto.subtle.digest("SHA-256", buf);
    const b = new Uint8Array(d);
    let s = "";
    for (let i = 0; i < b.length; i++) s += b[i].toString(16).padStart(2, "0");
    return s;
  } catch (e) {
    // Non-secure context fallback: cheap 53-bit rolling hash. Collisions are
    // vanishingly unlikely at collection scale and only affect dupe hinting.
    const b = new Uint8Array(buf);
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < b.length; i++) {
      h1 = Math.imul(h1 ^ b[i], 2654435761);
      h2 = Math.imul(h2 ^ b[i], 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return "fb" + (((h2 >>> 0) * 4294967296 + (h1 >>> 0)).toString(16));
  }
}

async function sha256Text(str) {
  return sha256Hex(new TextEncoder().encode(str));
}

function bytesToLatin1(bytes) {
  let s = "";
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return s;
}

function b64ToUtf8(b64) {
  const clean = String(b64).replace(/[\r\n\s]/g, "");
  const bin = atob(clean);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  return btoa(bytesToLatin1(bytes));
}

/* ════════════════════════════════════════════
   4. PNG CHUNK READER / WRITER
   ════════════════════════════════════════════ */

const PNG_SIG = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];

function isPng(bytes) {
  if (!bytes || bytes.length < 8) return false;
  for (let i = 0; i < 8; i++) if (bytes[i] !== PNG_SIG[i]) return false;
  return true;
}

/**
 * Walk PNG chunks. Tolerant of truncated buffers (we often only read the
 * first 512KB of a file), and stops early once IDAT is reached unless the
 * caller wants everything.
 * Returns { chunks, sawIDAT, truncated }
 */
function readPngChunks(bytes, opts) {
  opts = opts || {};
  const stopAtIDAT = opts.stopAtIDAT !== false;
  const out = { chunks: [], sawIDAT: false, truncated: false, sawIEND: false };
  if (!isPng(bytes)) return out;
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let off = 8;
  let guard = 0;
  while (off + 8 <= bytes.length && guard++ < 500000) {
    const len = dv.getUint32(off);
    if (len > 0x7fffffff) { out.truncated = true; break; }
    const type =
      String.fromCharCode(bytes[off + 4], bytes[off + 5], bytes[off + 6], bytes[off + 7]);
    const dataStart = off + 8;
    const dataEnd = dataStart + len;
    if (dataEnd + 4 > bytes.length) {
      // chunk body doesn't fit in what we have
      out.truncated = true;
      if (type === "IDAT") out.sawIDAT = true;
      break;
    }
    if (type === "IDAT") {
      out.sawIDAT = true;
      if (stopAtIDAT) { out.chunks.push({ type, start: off, len, data: null }); break; }
    }
    if (type === "IEND") { out.sawIEND = true; out.chunks.push({ type, start: off, len, data: null }); break; }
    out.chunks.push({ type, start: off, len, data: bytes.subarray(dataStart, dataEnd) });
    off = dataEnd + 4;
  }
  return out;
}

/*
 * The most card text a compressed chunk may unpack to. A real card, lorebook
 * and all, is a few MB at most; without a limit, a small file built to unpack
 * to gigabytes (a "decompression bomb") would take the whole tab down.
 */
const CARD_UNPACK_MAX = 64 * 1024 * 1024;

/* The PNG text chunks that hold card data; no other chunk is ever unpacked. */
const CARD_PNG_KEYS = ["ccv3", "chara", "character"];

async function inflateRaw(bytes, max) {
  // zTXt uses zlib (deflate with header). DecompressionStream("deflate") handles it.
  if (typeof DecompressionStream === "undefined") throw new Error("no DecompressionStream");
  const limit = max || CARD_UNPACK_MAX;
  const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate")).getReader();
  const parts = [];
  let total = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    total += value.length;
    if (total > limit) {
      try { await reader.cancel(); } catch (e) { /* already closed */ }
      throw new Error("compressed chunk unpacks to over " + Math.round(limit / 1048576) + " MB");
    }
    parts.push(value);
  }
  const out = new Uint8Array(total);
  let at = 0;
  for (const p of parts) { out.set(p, at); at += p.length; }
  return out;
}

/**
 * Extract all text-ish key/value pairs from PNG chunks.
 * Handles tEXt (latin1), iTXt (utf8, optionally deflated), zTXt (deflated latin1).
 */
async function extractPngText(bytes) {
  // Walk the WHOLE file, not just up to IDAT: a few exporters append the
  // card chunk after the image data, and stopping early would miss them.
  const res = readPngChunks(bytes, { stopAtIDAT: false });
  const map = Object.create(null);   // chunk names come from the file: no inherited keys
  for (const c of res.chunks) {
    if (!c.data) continue;
    if (c.type !== "tEXt" && c.type !== "iTXt" && c.type !== "zTXt") continue;
    const d = c.data;
    let nul = -1;
    for (let i = 0; i < d.length; i++) if (d[i] === 0) { nul = i; break; }
    if (nul < 0) continue;
    const key = bytesToLatin1(d.subarray(0, nul));
    // Only card chunks are read; others are just noted by name.
    if (CARD_PNG_KEYS.indexOf(key) < 0) { if (!(key in map)) map[key] = ""; continue; }
    try {
      if (c.type === "tEXt") {
        map[key] = bytesToLatin1(d.subarray(nul + 1));
      } else if (c.type === "zTXt") {
        // [key]\0[compressionMethod][data]
        const comp = d.subarray(nul + 2);
        map[key] = bytesToLatin1(await inflateRaw(comp));
      } else {
        // iTXt: key\0 compFlag compMethod langTag\0 translatedKey\0 text
        let p = nul + 1;
        const compFlag = d[p]; p += 1;
        p += 1; // compMethod
        let z1 = p; while (z1 < d.length && d[z1] !== 0) z1++;
        p = z1 + 1;
        let z2 = p; while (z2 < d.length && d[z2] !== 0) z2++;
        p = z2 + 1;
        const body = d.subarray(p);
        const raw = compFlag === 1 ? await inflateRaw(body) : body;
        map[key] = new TextDecoder("utf-8").decode(raw);
      }
    } catch (e) { /* skip unreadable chunk */ }
  }
  return { text: map, sawIDAT: res.sawIDAT, truncated: res.truncated };
}

/* --- CRC32 for writing chunks --- */
const CRC_TABLE = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function makeChunk(type, dataBytes) {
  const len = dataBytes.length;
  const out = new Uint8Array(len + 12);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, len);
  for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
  out.set(dataBytes, 8);
  const crcInput = out.subarray(4, 8 + len);
  dv.setUint32(8 + len, crc32(crcInput));
  return out;
}

function makeTextChunk(key, valueLatin1) {
  const k = new TextEncoder().encode(key);   // keys are ASCII
  const v = new Uint8Array(valueLatin1.length);
  for (let i = 0; i < valueLatin1.length; i++) v[i] = valueLatin1.charCodeAt(i) & 0xff;
  const data = new Uint8Array(k.length + 1 + v.length);
  data.set(k, 0); data[k.length] = 0; data.set(v, k.length + 1);
  return makeChunk("tEXt", data);
}

/**
 * Build a NEW png byte array: same image data, with chara/ccv3/character
 * text chunks replaced by the supplied card JSON. Used only for exporting
 * edited copies — never applied in place to a source file.
 */
function writeCardIntoPng(origBytes, cardV3, cardV2) {
  if (!isPng(origBytes)) throw new Error("Not a PNG");
  const res = readPngChunks(origBytes, { stopAtIDAT: false });
  const dropKeys = new Set(["chara", "ccv3", "character"]);
  const pieces = [new Uint8Array(PNG_SIG)];

  const v3b64 = utf8ToB64(JSON.stringify(cardV3));
  const v2b64 = utf8ToB64(JSON.stringify(cardV2 || cardV3));
  let inserted = false;

  const dv = new DataView(origBytes.buffer, origBytes.byteOffset, origBytes.byteLength);
  let off = 8;
  let guard = 0;
  while (off + 8 <= origBytes.length && guard++ < 100000) {
    const len = dv.getUint32(off);
    const type = String.fromCharCode(origBytes[off + 4], origBytes[off + 5], origBytes[off + 6], origBytes[off + 7]);
    const total = 12 + len;
    if (off + total > origBytes.length) break;
    const whole = origBytes.subarray(off, off + total);

    let skip = false;
    if (type === "tEXt" || type === "iTXt" || type === "zTXt") {
      const d = origBytes.subarray(off + 8, off + 8 + len);
      let nul = -1;
      for (let i = 0; i < d.length; i++) if (d[i] === 0) { nul = i; break; }
      if (nul > 0) {
        const key = bytesToLatin1(d.subarray(0, nul));
        if (dropKeys.has(key)) skip = true;
      }
    }

    if (!skip) pieces.push(whole);

    // Insert our chunks immediately after IHDR
    if (type === "IHDR" && !inserted) {
      pieces.push(makeTextChunk("chara", v2b64));
      pieces.push(makeTextChunk("ccv3", v3b64));
      inserted = true;
    }

    off += total;
    if (type === "IEND") break;
  }

  let size = 0;
  for (const p of pieces) size += p.length;
  const out = new Uint8Array(size);
  let o = 0;
  for (const p of pieces) { out.set(p, o); o += p.length; }
  return out;
}

function adler32(bytes) {
  let a = 1, b = 0;
  for (let i = 0; i < bytes.length; i++) { a = (a + bytes[i]) % 65521; b = (b + a) % 65521; }
  return ((b << 16) | a) >>> 0;
}

/**
 * A plain PNG of one colour, w×h, built byte by byte (uncompressed deflate
 * blocks). The picture for a new card when no canvas is available; new
 * cards in the browser get a drawn one (makePlaceholderPng).
 */
function solidPng(w, h, rgb) {
  const row = 1 + w * 3;
  const raw = new Uint8Array(row * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const o = y * row + 1 + x * 3;
      raw[o] = rgb[0]; raw[o + 1] = rgb[1]; raw[o + 2] = rgb[2];
    }
  }
  const blocks = Math.max(1, Math.ceil(raw.length / 65535));
  const z = new Uint8Array(2 + raw.length + blocks * 5 + 4);
  z[0] = 0x78; z[1] = 0x01;
  let p = 2;
  for (let i = 0; i < blocks; i++) {
    const start = i * 65535, len = Math.min(65535, raw.length - start);
    z[p++] = i === blocks - 1 ? 1 : 0;
    z[p++] = len & 255; z[p++] = len >> 8;
    z[p++] = ~len & 255; z[p++] = (~len >> 8) & 255;
    z.set(raw.subarray(start, start + len), p);
    p += len;
  }
  const ad = adler32(raw);
  z[p++] = ad >>> 24; z[p++] = (ad >>> 16) & 255; z[p++] = (ad >>> 8) & 255; z[p++] = ad & 255;
  const ihdr = new Uint8Array(13);
  const dv = new DataView(ihdr.buffer);
  dv.setUint32(0, w); dv.setUint32(4, h);
  ihdr[8] = 8; ihdr[9] = 2;   // 8-bit RGB, no interlace
  const pieces = [new Uint8Array(PNG_SIG), makeChunk("IHDR", ihdr), makeChunk("IDAT", z), makeChunk("IEND", new Uint8Array(0))];
  const out = new Uint8Array(pieces.reduce((n, x) => n + x.length, 0));
  let o = 0;
  for (const x of pieces) { out.set(x, o); o += x.length; }
  return out;
}

/**
 * The picture for a new card: its name on a coloured background, drawn on a
 * canvas (400×600). Falls back to a plain colour where there's no canvas.
 */
async function makePlaceholderPng(name) {
  const rgb = placeholderColor(name);
  try {
    const c = document.createElement("canvas");
    c.width = 400; c.height = 600;
    const g = c.getContext && c.getContext("2d");
    if (!g || !c.toBlob) throw new Error("no canvas");
    const grad = g.createLinearGradient(0, 0, 0, 600);
    grad.addColorStop(0, "rgb(" + rgb.join(",") + ")");
    grad.addColorStop(1, "rgb(" + rgb.map((v) => Math.round(v * 0.45)).join(",") + ")");
    g.fillStyle = grad;
    g.fillRect(0, 0, 400, 600);
    g.fillStyle = "rgba(255,255,255,0.92)";
    g.textAlign = "center";
    g.font = "600 34px Outfit, 'Segoe UI', sans-serif";
    // Wrap the name over a few lines, centred.
    const words = String(name || "New card").split(/\s+/);
    const lines = [];
    let line = "";
    for (const w of words) {
      const t = line ? line + " " + w : w;
      if (g.measureText(t).width > 340 && line) { lines.push(line); line = w; } else line = t;
    }
    if (line) lines.push(line);
    const shown = lines.slice(0, 5);
    shown.forEach((l, i) => g.fillText(l, 200, 300 - (shown.length - 1) * 21 + i * 42));
    const blob = await new Promise((res) => c.toBlob(res, "image/png"));
    if (!blob) throw new Error("no image");
    return new Uint8Array(await blob.arrayBuffer());
  } catch (e) {
    return solidPng(400, 600, rgb);
  }
}

/** A colour for a new card's picture, picked from its name so each looks different. */
function placeholderColor(name) {
  let h = 0;
  for (const ch of String(name || "")) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const palette = [[78, 60, 120], [44, 88, 112], [112, 58, 74], [56, 96, 70], [120, 84, 44], [70, 70, 96]];
  return palette[h % palette.length];
}

/**
 * A brand-new card (chara_card_v3) from a few fields. Only name is needed;
 * everything else starts empty.
 */
function newCardPayload(f) {
  const x = f || {};
  const str = (v) => String(v == null ? "" : v);
  const now = Math.floor(Date.now() / 1000);
  return {
    spec: "chara_card_v3", spec_version: "3.0",
    data: {
      name: str(x.name).trim() || "New card",
      description: str(x.description), personality: str(x.personality), scenario: str(x.scenario),
      first_mes: str(x.first_mes), mes_example: str(x.mes_example),
      creator_notes: str(x.creator_notes), system_prompt: "", post_history_instructions: "",
      alternate_greetings: [], group_only_greetings: [], tags: (Array.isArray(x.tags) ? x.tags : []).map(str).filter(Boolean),
      creator: str(x.creator), character_version: "", nickname: "", source: [],
      creation_date: now, modification_date: now, extensions: {},
    },
  };
}

/* ════════════════════════════════════════════
   5. CARD NORMALIZATION (V1 / V2 / V3 / CHARX)
   ════════════════════════════════════════════ */

function asStr(v) {
  if (v === null || v === undefined) return "";
  if (typeof v === "string") return v;
  if (typeof v === "number" || typeof v === "boolean") return String(v);
  try { return JSON.stringify(v); } catch (e) { return String(v); }
}

function asArr(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v;
  if (typeof v === "string") return v.split(",").map((s) => s.trim()).filter(Boolean);
  return [];
}

function normalizeLorebook(book) {
  if (!book || typeof book !== "object") return null;
  const rawEntries = Array.isArray(book.entries)
    ? book.entries
    : (book.entries && typeof book.entries === "object" ? Object.values(book.entries) : []);
  const entries = rawEntries.map((e, i) => ({
    idx: i,
    keys: asArr(e.keys || e.key),
    secondaryKeys: asArr(e.secondary_keys || e.keysecondary),
    content: asStr(e.content),
    comment: asStr(e.comment || e.name),
    enabled: e.enabled !== false && e.disable !== true,
    constant: !!e.constant,
    selective: !!e.selective,
    insertionOrder: e.insertion_order ?? e.order ?? 0,
    position: asStr(e.position),
    tokens: estimateTokens(asStr(e.content)),
  }));
  return {
    name: asStr(book.name),
    description: asStr(book.description),
    scanDepth: book.scan_depth ?? null,
    tokenBudget: book.token_budget ?? null,
    recursiveScanning: !!book.recursive_scanning,
    entries,
    totalTokens: entries.reduce((a, e) => a + e.tokens, 0),
  };
}

/**
 * Turn any card payload into one flat shape the rest of the app uses.
 * Returns { spec, specRaw, data } or null.
 */
function normalizeCard(raw) {
  if (!raw || typeof raw !== "object") return null;

  let spec = "v1";
  let src = raw;
  const specRaw = asStr(raw.spec || "");

  if (raw.spec === "chara_card_v3" || (raw.data && specRaw.indexOf("v3") >= 0)) {
    spec = "v3"; src = raw.data || raw;
  } else if (raw.spec === "chara_card_v2" || (raw.data && specRaw.indexOf("v2") >= 0)) {
    spec = "v2"; src = raw.data || raw;
  } else if (raw.data && typeof raw.data === "object" && (raw.data.name || raw.data.description)) {
    spec = "v2"; src = raw.data;   // unlabeled but wrapped — treat as v2
  } else {
    spec = "v1"; src = raw;
  }

  const book = src.character_book || src.characterBook || src.character_bookv3 || null;

  const d = {
    name: asStr(src.name || src.char_name || ""),
    nickname: asStr(src.nickname),
    description: asStr(src.description || src.char_persona),
    personality: asStr(src.personality || src.personality_summary),
    scenario: asStr(src.scenario || src.world_scenario),
    first_mes: asStr(src.first_mes || src.char_greeting),
    mes_example: asStr(src.mes_example || src.example_dialogue),
    system_prompt: asStr(src.system_prompt),
    post_history_instructions: asStr(src.post_history_instructions),
    creator_notes: asStr(src.creator_notes),
    creator: asStr(src.creator || src.create_by || ""),
    character_version: asStr(src.character_version || src.version || ""),
    tags: asArr(src.tags).map(asStr).filter(Boolean),
    alternate_greetings: asArr(src.alternate_greetings).map(asStr).filter(Boolean),
    group_only_greetings: asArr(src.group_only_greetings).map(asStr).filter(Boolean),
    source: asArr(src.source).map(asStr),
    creation_date: src.creation_date || null,
    modification_date: src.modification_date || null,
    lorebook: normalizeLorebook(book),
    extensions: src.extensions && typeof src.extensions === "object" ? src.extensions : {},
    assetCount: Array.isArray(src.assets) ? src.assets.length : 0,
    creator_notes_multilingual: src.creator_notes_multilingual || null,
    talkativeness: src.talkativeness ?? null,
    _rawKeys: Object.keys(src),
  };

  if (!d.name && !d.description && !d.first_mes) return null;

  // Token accounting
  let core = 0;
  for (const f of CARD_FIELDS) {
    if (f.weighty) core += estimateTokens(d[f.key]);
  }
  const all = CARD_FIELDS.reduce((a, f) => a + estimateTokens(d[f.key]), 0);
  d.tokensCore = core;
  d.tokensAll = all;
  d.tokensGreetings = d.alternate_greetings.reduce((a, g) => a + estimateTokens(g), 0);
  d.tokensLore = d.lorebook ? d.lorebook.totalTokens : 0;

  return { spec, specRaw, data: d, raw };
}

function specRank(spec) {
  return spec === "v3" ? 3 : spec === "v2" ? 2 : spec === "v1" ? 1 : 0;
}

/**
 * Given the raw bytes of a file, produce { ok, spec, data, raw, err }.
 */
/**
 * One zip entry's bytes, refusing more than `limit` as it unpacks. The size
 * in the zip's header is the file's own claim, so a crafted one can say 1 KB
 * and unpack to gigabytes; this counts what actually comes out.
 */
function unzipEntryLimited(entry, limit) {
  return new Promise((resolve, reject) => {
    const parts = [];
    let total = 0, done = false;
    const stream = entry.internalStream("uint8array");
    stream.on("data", (chunk) => {
      if (done) return;
      total += chunk.length;
      if (total > limit) {
        done = true;
        try { stream.pause(); } catch (e) { /* already stopped */ }
        reject(new Error("card.json unpacks to over " + Math.round(limit / 1048576) + " MB"));
        return;
      }
      parts.push(chunk);
    });
    stream.on("error", (e) => { if (!done) { done = true; reject(e); } });
    stream.on("end", () => {
      if (done) return;
      done = true;
      const out = new Uint8Array(total);
      let at = 0;
      for (const p of parts) { out.set(p, at); at += p.length; }
      resolve(out);
    });
    stream.resume();
  });
}

async function parseCardBytes(bytes, filename) {
  const ext = extOf(filename);

  if (ext === "json") {
    try {
      const txt = new TextDecoder("utf-8").decode(bytes);
      const obj = JSON.parse(txt);
      const norm = normalizeCard(obj);
      if (!norm) return { ok: false, err: "JSON is not a character card" };
      return Object.assign({ ok: true }, norm);
    } catch (e) { return { ok: false, err: "Bad JSON: " + e.message }; }
  }

  if (ext === "charx") {
    if (typeof JSZip === "undefined") return { ok: false, err: "JSZip unavailable" };
    try {
      const zip = await JSZip.loadAsync(bytes);
      const f = zip.file("card.json") || zip.file(/card\.json$/i)[0];
      if (!f) return { ok: false, err: "charx has no card.json" };
      const size = f._data && f._data.uncompressedSize;
      if (size > CARD_UNPACK_MAX) return { ok: false, err: "charx card.json unpacks to over " + Math.round(CARD_UNPACK_MAX / 1048576) + " MB" };
      const obj = JSON.parse(new TextDecoder("utf-8").decode(await unzipEntryLimited(f, CARD_UNPACK_MAX)));
      const norm = normalizeCard(obj);
      if (!norm) return { ok: false, err: "charx card.json not a character card" };
      return Object.assign({ ok: true, isCharx: true }, norm);
    } catch (e) { return { ok: false, err: "charx read failed: " + e.message }; }
  }

  // PNG / APNG
  if (!isPng(bytes)) return { ok: false, err: "Not a PNG or recognised card format" };
  let info;
  try { info = await extractPngText(bytes); }
  catch (e) { return { ok: false, err: "PNG parse failed: " + e.message }; }

  const t = info.text || {};
  // Prefer highest spec available.
  const candidates = [
    { key: "ccv3", val: t.ccv3 },
    { key: "chara", val: t.chara },
    { key: "character", val: t.character },
  ].filter((c) => c.val);

  if (!candidates.length) {
    return { ok: false, err: info.truncated ? "__NEED_FULL__" : "No embedded card data (no chara/ccv3 chunk)", noData: true };
  }

  let best = null;
  for (const c of candidates) {
    let obj = null;
    const v = c.val.trim();
    try {
      if (v.charAt(0) === "{") obj = JSON.parse(v);
      else obj = JSON.parse(b64ToUtf8(v));
    } catch (e) {
      try { obj = JSON.parse(b64ToUtf8(v)); } catch (e2) { obj = null; }
    }
    if (!obj) continue;
    const norm = normalizeCard(obj);
    if (!norm) continue;
    if (!best || specRank(norm.spec) > specRank(best.spec)) best = norm;
  }

  if (!best) return { ok: false, err: "Embedded card data unreadable" };
  return Object.assign({ ok: true, pngKeys: Object.keys(t) }, best);
}

/* --- fingerprinting --- */

function normForFp(s) {
  return String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
}

async function contentFingerprint(d) {
  // Identity of the *character*, independent of file encoding or filename.
  const basis = [normForFp(d.name), normForFp(d.description), normForFp(d.first_mes)].join("\u0000");
  return sha256Text(basis);
}

async function looseFingerprint(d) {
  // Identity of the character across versions: name + creator only.
  return sha256Text(normForFp(d.name) + "\u0000" + normForFp(d.creator));
}

/* ── short card ids ──────────────────────────────────────────────────────
   A record's id is its full path (root id:folder/file): long, and changed
   by a move. Each record also gets a short id, `sid` ("c" + a base-36
   number, e.g. c1jk), which the chat agent uses. It stays while the file
   does, carries over when the vault moves the card or a rescan finds the
   same file renamed, and is never reused. The next number lives in kv. */

const SID_KEY = "cardSidNext";

function sidNumber(sid) {
  const m = /^c([0-9a-z]+)$/.exec(String(sid || ""));
  return m ? parseInt(m[1], 36) : -1;
}

/**
 * Give every record a short id, in this order of preference: the one it
 * already has, or had under the same record id (`prevById`); one the vault's
 * own move left for its new path (`hints`, new record id → sid); one from a
 * record removed in this scan with the same bytes (`removed`, a rename);
 * else the next number. Returns { records, next }; records that change are
 * copied, never mutated.
 */
function assignShortIds(records, prevById, removed, hints, next) {
  let n = Math.max(1, Number(next) || 1);
  const sids = records.map(() => "");
  const taken = new Set();
  const claim = (i, sid) => {
    if (!sid || taken.has(sid)) return false;
    sids[i] = sid; taken.add(sid);
    return true;
  };
  records.forEach((r, i) => { const p = prevById && prevById.get(r.id); if (!claim(i, r.sid)) claim(i, p && p.sid); });
  records.forEach((r, i) => { if (!sids[i] && hints) claim(i, hints[r.id]); });
  const gone = (removed || []).filter((g) => g && g.sid && g.sig);
  records.forEach((r, i) => {
    if (sids[i] || !r.sig) return;
    const g = gone.filter((x) => x.sig === r.sig && !taken.has(x.sid))[0];
    if (g) claim(i, g.sid);
  });
  for (const s of sids) n = Math.max(n, sidNumber(s) + 1);
  records.forEach((r, i) => {
    if (sids[i]) return;
    while (taken.has("c" + n.toString(36))) n++;
    claim(i, "c" + n.toString(36));
    n++;
  });
  return { records: records.map((r, i) => (r.sid === sids[i] ? r : Object.assign({}, r, { sid: sids[i] }))), next: n };
}

/* ════════════════════════════════════════════
   6. TAG SYSTEM
   ════════════════════════════════════════════ */

/**
 * Canonical key for a tag. Collapses the variants that actually plague real
 * collections: case, whitespace, underscores/hyphens as separators, stray
 * punctuation, and leading/trailing junk. The card file is never touched —
 * this only affects how tags are grouped in the UI.
 */
function normTagName(t) {
  let s = String(t || "");
  s = s.replace(/[\u200B-\u200D\uFEFF\u2060]/g, "");   // zero-width junk
  s = s.trim().toLowerCase();
  s = s.replace(/[_\-–—]+/g, " ");         // _ - – — become spaces
  s = s.replace(/[^\p{L}\p{N}\s+&'/]/gu, " ");       // keep letters/digits/+&'/
  s = s.replace(/\s+/g, " ").trim();
  return s;
}

function tagDisplayFromKey(key) {
  if (!key) return "";
  return key.replace(/\b\p{L}/gu, (c) => c.toUpperCase());
}

/**
 * Resolve one card's raw tag list into canonical keys, applying
 * normalization + the user's alias map, and dropping hidden tags.
 */
function resolveTags(rawTags, tagMeta, normalize) {
  const aliases = (tagMeta && tagMeta.aliases) || {};
  const out = [];
  const seen = new Set();
  for (const raw of rawTags || []) {
    let key = normalize === false ? String(raw).trim() : normTagName(raw);
    if (!key) continue;
    // follow alias chain (guard against cycles)
    let hops = 0;
    while (aliases[key] && aliases[key] !== key && hops++ < 8) key = aliases[key];
    if (!key || seen.has(key)) continue;
    seen.add(key);
    out.push(key);
  }
  return out;
}

/**
 * Build the tag facet index over a set of records.
 * Returns { list: [{key,label,count,custom,embedded}], byKey }
 */
function buildTagIndex(records, tagMeta, normalize) {
  const hidden = new Set((tagMeta && tagMeta.hidden) || []);
  const byKey = new Map();
  const labelVotes = new Map();

  const bump = (key, rawLabel, kind) => {
    if (!key || hidden.has(key)) return;
    let e = byKey.get(key);
    if (!e) { e = { key, label: "", count: 0, embedded: 0, custom: 0, vault: 0 }; byKey.set(key, e); }
    e.count++;
    if (kind === "vault") e.vault++;
    else if (kind === "custom") e.custom++;
    else e.embedded++;
    if (rawLabel) {
      let lv = labelVotes.get(key);
      if (!lv) { lv = new Map(); labelVotes.set(key, lv); }
      const trimmed = String(rawLabel).trim();
      lv.set(trimmed, (lv.get(trimmed) || 0) + 1);
    }
  };

  for (const r of records) {
    // r.tags       - the card's own tag list, after any local edits
    // r.addedTags  - the subset of those the user added here
    // r.vaultTags  - vault-only tags, never written into a card file
    const addedSet = new Set(resolveTags(r.addedTags || [], tagMeta, normalize));
    const eff = resolveTags(r.tags, tagMeta, normalize);
    const vault = resolveTags(r.vaultTags || [], tagMeta, normalize);
    const rawByKey = new Map();
    for (const raw of (r.tags || []).concat(r.vaultTags || [])) {
      const k = normalize === false ? String(raw).trim() : normTagName(raw);
      if (k && !rawByKey.has(k)) rawByKey.set(k, raw);
    }
    const seen = new Set();
    for (const k of eff) {
      if (seen.has(k)) continue;
      seen.add(k);
      bump(k, rawByKey.get(k) || k, addedSet.has(k) ? "custom" : "embedded");
    }
    for (const k of vault) {
      if (seen.has(k)) continue;   // already on the card itself
      seen.add(k);
      bump(k, rawByKey.get(k) || k, "vault");
    }
  }

  // pick the most common original casing as the display label
  for (const [key, e] of byKey) {
    const lv = labelVotes.get(key);
    if (lv && lv.size) {
      let best = null, bestN = -1;
      for (const [lab, n] of lv) if (n > bestN) { best = lab; bestN = n; }
      e.label = best && best.length ? best : tagDisplayFromKey(key);
    } else {
      e.label = tagDisplayFromKey(key);
    }
  }

  const pinned = new Set((tagMeta && tagMeta.pinned) || []);
  const list = Array.from(byKey.values()).sort((a, b) => {
    const pa = pinned.has(a.key) ? 1 : 0, pb = pinned.has(b.key) ? 1 : 0;
    if (pa !== pb) return pb - pa;
    if (b.count !== a.count) return b.count - a.count;
    return a.key.localeCompare(b.key);
  });
  return { list, byKey };
}

/**
 * Suggest near-duplicate tag groups the user might want to merge.
 * Cheap heuristics only: singular/plural, space-removal collisions,
 * and one-character edit distance on short tags.
 */
function suggestTagMerges(tagList) {
  const groups = new Map();
  const skel = (k) => k.replace(/\s+/g, "").replace(/s$/, "").replace(/ies$/, "y");
  for (const t of tagList) {
    const s = skel(t.key);
    if (!s) continue;
    let g = groups.get(s);
    if (!g) { g = []; groups.set(s, g); }
    g.push(t);
  }
  const out = [];
  for (const [, g] of groups) {
    if (g.length < 2) continue;
    const sorted = g.slice().sort((a, b) => b.count - a.count);
    out.push({ canonical: sorted[0], others: sorted.slice(1) });
  }
  return out.sort((a, b) => b.canonical.count - a.canonical.count);
}

/* ════════════════════════════════════════════
   7. FILE SYSTEM ACCESS + SCAN ENGINE
   ════════════════════════════════════════════ */

function fsSupported() {
  return typeof window !== "undefined" && typeof window.showDirectoryPicker === "function";
}

async function verifyPermission(handle, readWrite) {
  if (!handle) return false;
  const opts = readWrite ? { mode: "readwrite" } : { mode: "read" };
  try {
    if ((await handle.queryPermission(opts)) === "granted") return true;
    if ((await handle.requestPermission(opts)) === "granted") return true;
  } catch (e) { /* fall through */ }
  return false;
}

// "_vault backups" is BACKUP_FOLDER_NAME and "_vault data" VAULT_DATA_FOLDER
// (both defined further down): every Save to card adds a copy to the first,
// and automatic backups of your vault data go to the second. Indexing them
// would count each backup as a card.
const SKIP_DIRS = new Set(["node_modules", ".git", ".vault_thumbs", "$recycle.bin", "system volume information", "_vault backups", "_vault data"]);

/**
 * Recursively list candidate card files under a directory handle.
 * Not a generator — Babel's ES5 generator transform needs a runtime we
 * don't ship, so this pushes into an array via callback instead.
 */
async function listCardFiles(dirHandle, rel, acc, onTick, depth, dirAcc) {
  depth = depth || 0;
  if (depth > 12) return;
  let entries;
  try { entries = dirHandle.values(); } catch (e) { return; }
  for await (const entry of entries) {
    const nm = entry.name;
    if (nm.startsWith(".")) continue;
    if (entry.kind === "directory") {
      if (SKIP_DIRS.has(nm.toLowerCase())) continue;
      const sub = rel ? rel + "/" + nm : nm;
      // Record the folder itself, so folders you just made — and folders that
      // are currently empty — still appear in the tree.
      if (dirAcc) dirAcc.push(sub);
      await listCardFiles(entry, sub, acc, onTick, depth + 1, dirAcc);
    } else {
      const ext = extOf(nm);
      if (CARD_EXTS.indexOf(ext) < 0) continue;
      acc.push({ handle: entry, rel: rel ? rel + "/" + nm : nm, dir: rel, file: nm, ext });
      if (onTick && acc.length % 50 === 0) onTick(acc.length);
    }
  }
}

async function getDirByPath(rootHandle, dirs, create) {
  let h = rootHandle;
  for (const seg of dirs) {
    if (!seg) continue;
    h = await h.getDirectoryHandle(seg, { create: !!create });
  }
  return h;
}

/** Byte signature: size + first 256KB + last 64KB. Identical files always
 *  collide; different files effectively never do. Far cheaper than hashing
 *  every byte of a multi-thousand card library. */
async function byteSignature(file) {
  const headLen = Math.min(file.size, 256 * 1024);
  const head = new Uint8Array(await file.slice(0, headLen).arrayBuffer());
  let tail = new Uint8Array(0);
  if (file.size > headLen) {
    const tailStart = Math.max(headLen, file.size - 64 * 1024);
    tail = new Uint8Array(await file.slice(tailStart).arrayBuffer());
  }
  const sizeBytes = new TextEncoder().encode("|" + file.size + "|");
  const all = new Uint8Array(head.length + sizeBytes.length + tail.length);
  all.set(head, 0); all.set(sizeBytes, head.length); all.set(tail, head.length + sizeBytes.length);
  return sha256Hex(all);
}

async function makeThumb(file, targetW) {
  try {
    if (typeof createImageBitmap !== "function") return null;
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, targetW / bmp.width);
    const w = Math.max(1, Math.round(bmp.width * scale));
    const h = Math.max(1, Math.round(bmp.height * scale));
    let canvas, ctx;
    if (typeof OffscreenCanvas === "function") {
      canvas = new OffscreenCanvas(w, h);
      ctx = canvas.getContext("2d");
    } else {
      canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      ctx = canvas.getContext("2d");
    }
    ctx.drawImage(bmp, 0, 0, w, h);
    bmp.close && bmp.close();
    if (canvas.convertToBlob) return await canvas.convertToBlob({ type: "image/webp", quality: 0.72 });
    return await new Promise((res) => canvas.toBlob(res, "image/webp", 0.72));
  } catch (e) { return null; }
}

function searchBlobFor(rec) {
  return [
    rec.name, rec.creator, rec.version, rec.file, rec.dir,
    (rec.tags || []).join(" "),
    (rec.vaultTags || []).join(" "),
    (rec.flags || []).map((f) => flagDef(f.key).label + " " + (f.note || "")).join(" "),
    rec.descPreview || "",
    rec.notes || "",
  ].join(" \u00b7 ").toLowerCase();
}

/* ── import-mode roots ──────────────────────────────────────────────
   Brave removes the File System Access API outright, and Firefox/Safari
   never shipped it. <input type="file" webkitdirectory> still hands us a
   whole folder tree, read-only, in every browser. Import roots use that:
   the catalogue, tags, notes, edits and thumbnails all persist normally —
   only the live file handles are session-scoped, so the folder has to be
   re-picked after a reload to read card bytes again.
   ────────────────────────────────────────────────────────────────── */

// id -> File, for the current session only. Files are not persisted.
const IMPORT_FILES = new Map();
// rootId -> [{rel, dir, file, ext, fileObj}] queued by the folder picker
const IMPORT_PENDING = new Map();

function isImportRoot(root) { return !!root && root.mode === "import"; }

function importRootId(folderName) { return "imp:" + normTagName(folderName || "folder").replace(/\s+/g, "-"); }

function fileFor(recId) { return IMPORT_FILES.get(recId) || null; }

/** Turn a FileList from a webkitdirectory input into per-root file groups. */
function groupPickedFiles(fileList) {
  const groups = new Map();
  for (const f of Array.from(fileList || [])) {
    const relPath = f.webkitRelativePath || f.name;
    const parts = relPath.split("/").filter(Boolean);
    const folderName = parts.length > 1 ? parts[0] : "picked cards";
    const rest = parts.length > 1 ? parts.slice(1) : [parts[0]];
    const ext = extOf(f.name);
    if (CARD_EXTS.indexOf(ext) < 0) continue;
    if (f.name.startsWith(".")) continue;
    const dirs = rest.slice(0, -1);
    if (dirs.some((d) => SKIP_DIRS.has(d.toLowerCase()))) continue;
    const rid = importRootId(folderName);
    if (!groups.has(rid)) groups.set(rid, { id: rid, name: folderName, files: [] });
    groups.get(rid).files.push({
      rel: rest.join("/"), dir: dirs.join("/"), file: f.name, ext, fileObj: f,
    });
  }
  return Array.from(groups.values());
}

/**
 * Parse a single card file into { rec, body, thumb }. Shared by both the
 * handle-based scanner and the read-only import scanner so the two can never
 * drift apart.
 */
async function processCardFile(root, info, file) {
  const id = root.id + ":" + info.rel;
  const rec = {
    id, rootId: root.id, rel: info.rel, dir: info.dir, file: info.file, ext: info.ext,
    size: file.size, mtime: file.lastModified, scanVersion: 1,
    scannedAt: Date.now(), ok: false, err: "", spec: "none",
    name: baseName(info.file), creator: "", version: "",
    tags: [], tokensCore: 0, tokensAll: 0, tokensGreetings: 0, tokensLore: 0,
    altCount: 0, loreCount: 0, assetCount: 0, descPreview: "",
    sig: "", fp: "", lfp: "", hasThumb: false,
  };

  try { rec.sig = await byteSignature(file); }
  catch (e) { /* non-fatal */ }

  // Metadata usually sits before IDAT, so try a head slice first.
  let parsed = null;
  try {
    if (info.ext === "png" || info.ext === "apng") {
      const headBytes = new Uint8Array(await file.slice(0, Math.min(file.size, SCAN_HEAD_BYTES)).arrayBuffer());
      parsed = await parseCardBytes(headBytes, info.file);
      if (!parsed.ok && file.size > SCAN_HEAD_BYTES) {
        const full = new Uint8Array(await file.arrayBuffer());
        parsed = await parseCardBytes(full, info.file);
      }
    } else {
      const full = new Uint8Array(await file.arrayBuffer());
      parsed = await parseCardBytes(full, info.file);
    }
  } catch (e) {
    parsed = { ok: false, err: "Read failed: " + e.message };
  }

  let body = null;
  if (parsed && parsed.ok) {
    const d = parsed.data;
    rec.ok = true;
    rec.spec = parsed.spec;
    rec.specRaw = parsed.specRaw || "";
    rec.name = d.name || baseName(info.file);
    rec.hasName = !!d.name;
    rec.creator = d.creator;
    rec.version = d.character_version;
    rec.tags = d.tags;
    rec.tokensCore = d.tokensCore;
    rec.tokensAll = d.tokensAll;
    rec.tokensGreetings = d.tokensGreetings;
    rec.tokensLore = d.tokensLore;
    rec.altCount = d.alternate_greetings.length;
    rec.loreCount = d.lorebook ? d.lorebook.entries.length : 0;
    rec.assetCount = d.assetCount;
    rec.descPreview = d.description.slice(0, 400);
    rec.creationDate = d.creation_date || null;
    rec.fp = await contentFingerprint(d);
    rec.lfp = await looseFingerprint(d);
    rec.warnings = cardWarnings(d);
    body = { __key: id, __val: d };
  } else {
    rec.ok = false;
    rec.err = (parsed && parsed.err) || "Unknown parse failure";
    rec.fp = "nofp:" + rec.sig;
    rec.lfp = rec.fp;
  }

  let thumb = null;
  if (info.ext === "png" || info.ext === "apng") {
    const tb = await makeThumb(file, THUMB_W);
    if (tb) { thumb = { __key: id, __val: tb }; rec.hasThumb = true; }
  }

  return { rec, body, thumb };
}

function reusableRecord(prev, file) {
  return prev && prev.size === file.size && prev.mtime === file.lastModified && prev.scanVersion === 1;
}

/**
 * Scan one root. Reuses cached records when size+mtime are unchanged.
 * ctl = { stop:boolean }
 * onProgress({ phase, done, total, label })
 */
async function scanRoot(root, existing, ctl, onProgress) {
  if (isImportRoot(root)) return scanImportRoot(root, existing, ctl, onProgress);

  const okPerm = await verifyPermission(root.handle, root.role !== "reference");
  if (!okPerm) return { error: "Permission denied for " + root.name, records: [], bodies: [], thumbs: [], removed: [] };

  onProgress({ phase: "listing", done: 0, total: 0, label: "Listing " + root.name + "…" });
  const files = [];
  const dirList = [];
  await listCardFiles(root.handle, "", files, (n) => onProgress({ phase: "listing", done: n, total: 0, label: "Listing " + root.name + " — " + n + " files" }), 0, dirList);

  const records = [], bodies = [], thumbs = [];
  const seenIds = new Set();
  let done = 0;

  for (const f of files) {
    if (ctl && ctl.stop) break;
    const id = root.id + ":" + f.rel;
    seenIds.add(id);
    done++;
    if (done % 5 === 0 || done === files.length) {
      onProgress({ phase: "parsing", done, total: files.length, label: f.file });
    }

    let file;
    try { file = await f.handle.getFile(); }
    catch (e) { continue; }

    const prev = existing.get(id);
    if (reusableRecord(prev, file)) { records.push(prev); continue; }

    const out = await processCardFile(root, f, file);
    records.push(out.rec);
    if (out.body) bodies.push(out.body);
    if (out.thumb) thumbs.push(out.thumb);
  }

  const removed = [];
  for (const [id, r] of existing) {
    if (r.rootId === root.id && !seenIds.has(id)) removed.push(id);
  }

  return { records, bodies, thumbs, removed, error: null, count: files.length, dirs: dirList.sort() };
}

/** Read-only scan over files handed to us by a directory <input>. */
async function scanImportRoot(root, existing, ctl, onProgress) {
