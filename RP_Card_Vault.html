    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let lastPaint = 0;
    const paint = (force) => {
      const now = Date.now();
      if (!opts.onProgress || (!force && now - lastPaint < 120)) return;
      lastPaint = now;
      opts.onProgress(acc);
    };
    for (;;) {
      const chunk = await reader.read();
      if (chunk.done) break;
      for (const ev of split.feed(dec.decode(chunk.value, { stream: true }))) acc = aiStreamStep(acc, ev);
      paint(false);
    }
    for (const ev of split.end()) acc = aiStreamStep(acc, ev);
    paint(true);

    const outcome = interpretAiResult(acc, {
      kind, field: req.field, original: req.original, maxTokens: settingsNow.maxTokens,
      existingTags: aiTagExclusions(rec, edit, settingsNow), tagTarget: settingsNow.tagTarget,
    });
    if (!outcome.ok) return outcome;

    const model = acc.model || aiRelay.model;
    const note = makeAiNote(rec.fp, kind, aiRelay.model, req.hash, outcome.text, {
      field: req.field, original: req.original, answeredBy: model,
      usage: acc.usage, finish: acc.finish, cutOff: !!outcome.cutOff,
      thinkChars: outcome.think.length, estimate: req.estimate, trimmed: req.trimmed,
    });
    await dbPut(STORE_AINOTES, note);
    await logOp("ai", {
      card: rec.name, kind, field: req.field || undefined, model,
      tokens: (acc.usage && acc.usage.total_tokens) || req.estimate.total,
      estimated: !(acc.usage && acc.usage.total_tokens),
    });

    const prop = outcome.proposal;
    if (prop && settingsNow.writeMode !== "off") {
      const meta = Object.assign({}, prop.meta, { model });
      patchEdit(rec.fp, (cur) => {
        const merged = Object.assign({}, cur, { aiProposal: mergeProposal(cur.aiProposal, prop.bucket, prop.value, meta) });
        // The one thing ever applied without asking: vault-only tags, which
        // never leave the vault.
        if (prop.bucket === "vaultTags" && settingsNow.writeMode === "auto-tags-only") {
          return proposalAcceptPatch(merged, body, "vaultTags", "*") || { aiProposal: merged.aiProposal };
        }
        return { aiProposal: merged.aiProposal };
      });
    }
    return { ok: true, note, outcome };
  }, [aiSettings, aiRelay, patchEdit]);

  /** Drop every cached answer for one card, across actions and models. */
  const clearAiNotes = useCallback(async (fp) => {
    const keys = await dbDeleteByIndex(STORE_AINOTES, "fingerprint", fp);
    return keys.length;
  }, []);

  // The bulk run reads each card's edit record as it is when its turn comes,
  // not as it was when the run started.
  const editsNow = useRef(editsMap);
  editsNow.current = editsMap;
  const aiBulkCtrl = useRef(null);

  /**
   * ✦ Suggest tags for a selection, one card at a time through runAi, so each
   * answer is cached and proposed exactly as a single run would be. Cards with
   * a current tags answer from this model are skipped; at most `batchCap`
   * requests go out; three failures in a row end the run (that is usually the
   * endpoint, not the cards). Stop cancels the request in flight too.
   */
  const bulkAiRun = useCallback(async (ids, kind) => {
    if (scan.running) return;
    if (!aiReady(aiSettings, aiRelay)) {
      showToast(aiSettingsProblems(aiSettings, aiRelay)[0] || "The AI isn't ready — open the ✦ AI panel.", "warm");
      setModal("ai");
      return;
    }
    const action = aiActionDef(kind, aiSettings);
    if (!action) return;
    const isTags = kind === "tags";
    if (isTags && aiSettings.writeMode === "off") {
      showToast("The AI is read-only, so suggestions would have nowhere to go. Choose another mode in the ✦ AI panel.", "warm");
      return;
    }
    const recs = ids.map((id) => recById.get(id)).filter(Boolean);
    if (!recs.length) return;
    const model = aiRelay.model;
    const cap = aiSettings.batchCap;
    const toCard = aiSettings.tagTarget === "card";
    const where = toCard
      ? "suggested as the cards' own tags, in each card's Proposed changes for you to accept. Accepted ones go into the card file when you save to card"
      : aiSettings.writeMode === "auto-tags-only"
      ? "added straight on as vault-only tags. Card files and their own tags are never touched"
      : "put in each card's Proposed changes as vault-only tags for you to accept. Card files and their own tags are never touched";
    if (!window.confirm(
      (isTags ? "Suggest tags for " : "Run \"" + action.label + "\" on ") + recs.length + " cards?\n\n" +
      "One request per card to " + model + ", at most " + cap + " this run. Cards that already have a current answer are skipped.\n\n" +
      (isTags ? "Suggestions are " + where + "."
        : "Each answer is saved in that card's ✦ AI tab. Nothing about the cards is changed.")
    )) return;

    const knownTags = aiTagVocabulary(tagIndex);
    const stats = { answered: 0, proposed: 0, applied: 0, tags: 0, cached: 0, empty: 0, failed: 0, overCap: 0, stopped: false };
    const errs = [];
    let sent = 0, streak = 0;
    stopRef.current = { stop: false };
    for (let i = 0; i < recs.length; i++) {
      const rec = recs[i];
      if (stopRef.current.stop) { stats.stopped = true; break; }
      setScan({ running: true, done: i, total: recs.length, label: rec.name, rootName: "✦ " + action.label });
      const body = await dbGet(STORE_BODIES, rec.id);
      if (!body) {
        stats.failed++;
        if (errs.length < 2) errs.push(rec.name + ": no cached card text (rescan its folder)");
        continue;
      }
      const edit = editsNow.current.get(rec.fp);
      let req;
      try { req = aiBuildRequest(kind, aiSettings, rec, body, edit, knownTags, {}); }
      catch (e) { req = { error: e.message }; }
      if (req.error) {
        // A problem with this card, not the endpoint: it doesn't count toward the streak.
        stats.failed++;
        if (errs.length < 2) errs.push(rec.name + ": " + req.error);
        continue;
      }
      const rows = await dbAllByIndex(STORE_AINOTES, "fingerprint", rec.fp);
      if (pickAiNote(rows, kind, model, "", req.hash).current) { stats.cached++; continue; }
      if (sent >= cap) { stats.overCap = recs.length - i; break; }
      sent++;
      const ctrl = new AbortController();
      aiBulkCtrl.current = ctrl;
      let res;
      try {
        res = await runAi(rec, body, edit, kind, { knownTags, signal: ctrl.signal });
      } catch (e) {
        if (e && e.name === "AbortError") { stats.stopped = true; break; }
        res = { ok: false, error: (e && e.message) || String(e) };
      } finally {
        aiBulkCtrl.current = null;
      }
      if (!res.ok) {
        stats.failed++;
        if (errs.length < 2) errs.push(rec.name + ": " + res.error);
        if (++streak >= 3) { stats.stopped = true; break; }
        continue;
      }
      streak = 0;
      if (!isTags) { stats.answered++; continue; }
      const prop = res.outcome.proposal;
      const n = !prop ? 0 : prop.bucket === "cardTags" ? prop.value.add.length : Array.isArray(prop.value) ? prop.value.length : 0;
      if (!n) stats.empty++;
      else {
        stats.tags += n;
        // Only vault-only tags are ever applied without asking; card tags always wait.
        if (prop.bucket === "vaultTags" && aiSettings.writeMode === "auto-tags-only") stats.applied++; else stats.proposed++;
      }
    }
    setScan({ running: false, done: 0, total: 0, label: "", rootName: "" });
    await logOp(isTags ? "aiBulkTags" : "aiBulkRun", Object.assign({ count: recs.length, model, action: action.label }, stats));
    const summary = aiBulkSummary(stats);
    showToast("✦ " + action.label + ": " + summary + (errs.length ? " — " + errs.join(" | ") : ""),
      stats.failed ? "warm" : "green");
  }, [scan.running, aiSettings, aiRelay, recById, tagIndex, runAi, showToast]);

  const bulkAiTags = useCallback((ids) => bulkAiRun(ids, "tags"), [bulkAiRun]);

  /* ---- send to front end ---- */
  /** A folder destination's folder, if it's still linked and writable. */
  const folderTargetOf = useCallback((dest) => {
    if (!dest || !dest.folderKey) return null;
    const { rootId, dir } = parseDirKey(dest.folderKey);
    const root = roots.find((r) => r.id === rootId);
    if (!root || isImportRoot(root)) return null;
    return { root, dir };
  }, [roots]);

  /**
   * Optionally file cards away once they've actually reached the front end.
   * Only the ones that made it are moved — a failed send leaves everything
   * exactly where it was, so nothing quietly disappears from the inbox.
   */
  const autoFileAfterSend = useCallback(async (okIds) => {
    if (!settings.autoFileAfterSend || !okIds.length) return null;
    if (!settings.afterSendKey) return { note: "not filed away: no folder is chosen for that (Settings → Destinations)" };
    const { rootId, dir } = parseDirKey(settings.afterSendKey);
    const root = roots.find((r) => r.id === rootId);
    if (!root || isImportRoot(root)) {
      showToast("Auto-file is on but its folder is gone or read-only — check Settings", "warm");
      return null;
    }
    const movable = okIds.filter((id) => {
      const rec = recById.get(id);
      if (!rec) return false;
      const src = roots.find((r) => r.id === rec.rootId);
      return src && !isImportRoot(src);
    });
    if (!movable.length) return null;
    return moveCards(movable, root, dir, { noConfirm: true, silent: true });
  }, [settings.autoFileAfterSend, settings.afterSendKey, roots, recById, moveCards, showToast]);

  /** Upload into a front end with an import API (SillyTavern, Lumiverse, any HTTP importer). */
  const sendViaApi = useCallback(async (ids, dest) => {
    const recs = ids.map((id) => recById.get(id)).filter(Boolean);
    if (!recs.length) return;
    if (destStatus.available === false) {
      showToast("The local server isn't answering — start the vault with \"Start RP Card Vault.bat\"", "red");
      return;
    }
    if (!destStatus.byId[dest.id]) {
      showToast("Not connected to " + dest.name + " — Settings → Destinations", "warm");
      setModal("settings");
      return;
    }
    setScan({ running: true, done: 0, total: recs.length, label: "Uploading…", rootName: dest.name });
    let ok = 0, failed = 0;
    const errs = [];
    const okIds = [];
    for (let i = 0; i < recs.length; i++) {
      const rec = recs[i];
      setScan({ running: true, done: i, total: recs.length, label: rec.file, rootName: dest.name });
      try {
        const { bytes } = await readOriginalBytes(rec, roots);
        const r = await vaultFetch("/__vault/dest/send?id=" + encodeURIComponent(dest.id) + "&name=" + encodeURIComponent(rec.file), {
          method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: bytes,
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          if (r.status === 401) setDestStatus((st) => { const byId = Object.assign({}, st.byId); delete byId[dest.id]; return { available: st.available, byId }; });
          throw new Error(d.error || ("HTTP " + r.status));
        }
        ok++; okIds.push(rec.id);
      } catch (e) {
        failed++;
        if (errs.length < 2) errs.push(rec.name + ": " + e.message);
        if (/not connected|sign|unauthori|couldn't reach/i.test(e.message)) break;
      }
    }
    setScan({ running: false, done: 0, total: 0, label: "", rootName: "" });
    await logOp("apiImport", { count: recs.length, to: dest.name, ok, failed });
    const filed = await autoFileAfterSend(okIds);
    showToast(
      ok + " sent to " + dest.name +
      (filed ? " · " + (filed.note || filed.moved + " filed into " + filed.label) : "") +
      (failed ? " · " + failed + " failed — " + errs.join(" | ") : ""),
      failed ? "red" : "green"
    );
  }, [recById, roots, destStatus, showToast, autoFileAfterSend]);

  /** Copy into a folder destination. */
  const sendToFolder = useCallback(async (ids, dest) => {
    const target = folderTargetOf(dest);
    if (!target) {
      showToast(dest.name + " has no folder, or its folder is read-only — Settings → Destinations", "warm");
      setModal("settings");
      return;
    }
    const recs = ids.map((id) => recById.get(id)).filter(Boolean);
    if (!recs.length) return;
    const { root, dir } = target;
    if (!(await verifyPermission(root.handle, true))) { showToast("Write permission denied for " + root.name, "red"); return; }
    setScan({ running: true, done: 0, total: recs.length, label: "Sending…", rootName: root.name });
    let sent = 0, already = 0, failed = 0;
    const okIds = [], errs = [];
    for (let i = 0; i < recs.length; i++) {
      const rec = recs[i];
      setScan({ running: true, done: i, total: recs.length, label: rec.file, rootName: root.name });
      try {
        const { bytes } = await readOriginalBytes(rec, roots);
        const out = await copyIntoRoot(root, dir ? dir.split("/") : [], rec.file, new Blob([bytes]), rec.sig);
        if (out.skipped) already++; else sent++;
        okIds.push(rec.id);
      } catch (e) { failed++; errs.push(rec.file + ": " + ((e && e.message) || String(e))); }
    }
    setScan({ running: false, done: 0, total: 0, label: "", rootName: "" });
    await logOp("sendToFrontend", { count: recs.length, to: root.name + (dir ? "/" + dir : ""), sent, already, failed });
    const filed = await autoFileAfterSend(okIds);
    showToast(
      sent + " sent to " + dest.name +
      (already ? ", " + already + " already there" : "") +
      (filed ? " · " + (filed.note || filed.moved + " filed into " + filed.label) : "") +
      (failed ? ", " + failed + " failed — " + errs.slice(0, 2).join(" | ") : "") +
      (sent && !filed ? " · refresh your front end to see them" : ""),
      failed ? "red" : "green"
    );
    runScanRef.current(root.id, false, { quiet: true });
  }, [folderTargetOf, recById, roots, showToast, autoFileAfterSend]);

  /** Send to a destination by id, or to your default. */
  // Cards that left the vault (moved, filed away after a send, renamed and
  // rescanned) leave the selection too, so S and Send never act on ghosts.
  useEffect(() => {
    setSelection((prev) => {
      if (!prev.size || Array.from(prev).every((id) => recById.has(id))) return prev;
      return new Set(Array.from(prev).filter((id) => recById.has(id)));
    });
  }, [recById]);

  const sendToFrontend = useCallback(async (ids, destId) => {
    const list = settings.destinations || [];
    const dest = (destId && list.filter((d) => d.id === destId)[0]) || defaultDestinationOf(settings);
    if (!dest) {
      showToast("Add a destination first — Settings → Destinations", "warm");
      setModal("settings");
      return;
    }
    // A selection can outlive its cards (moved, filed away or rescanned since):
    // say so, rather than send nothing without a word.
    const asked = ids || [];
    const known = asked.filter((id) => recById.has(id));
    if (!known.length) {
      showToast(asked.length
        ? "Nothing sent: " + (asked.length === 1 ? "that card isn't" : "those cards aren't") + " in the vault any more (moved, filed away or rescanned). Pick " + (asked.length === 1 ? "it" : "them") + " again and send."
        : "Pick a card to send first", "warm");
      return;
    }
    try {
      return await (dest.type === "folder" ? sendToFolder(known, dest) : sendViaApi(known, dest));
    } catch (e) {
      setScan({ running: false, done: 0, total: 0, label: "", rootName: "" });
      showToast("Couldn't send to " + dest.name + ": " + ((e && e.message) || String(e)), "red");
    }
  }, [settings, sendToFolder, sendViaApi, showToast, recById]);

  useEffect(() => { sendToFrontendRef.current = sendToFrontend; }, [sendToFrontend]);

  /* ---- context menu ---- */
  const [ctxMenu, setCtxMenu] = useState(null);
  const [flagModal, setFlagModal] = useState(null);

  useEffect(() => {

  const [compare, setCompare] = useState(null);

  const openFolderMenu = useCallback((root, node, e) => {

        { sep: true },
        { label: "Use as trash folder", icon: "\u{1F5D1}", color: "warm", disabled: isImportRoot(root),
          hint: settings.trashKey === key ? "current" : "",
          onClick: () => { patchSettings({ trashKey: key }); showToast("Trash folder set to " + label, "warm"); } },
        (() => {
          const own = (settings.privateFolders || []).indexOf(key) >= 0;

          return {

            showToast(label + " added as a destination" + (settings.defaultDestination ? "" : " (your default)"), "green");
          } },
        { sep: true },
        {
          label: noDupes ? "Include in duplicate checks" : "Ignore in duplicate checks",

          onClick: () => setFolderDupeMode(key, noDupes ? "include" : "exclude"),

        (explicitDupeMode ? {

          onClick: () => setFolderDupeMode(key, null),
        } : { sep: true }),
        { label: "Rescan this folder", icon: "↻", color: "cyan", onClick: () => runScan(root.id, false) },
      ],
    });
  }, [folderRoles, records, settings, setFolderRole, setRootRole, newFolder, patchSettings, showToast, runScan,
      dupeMode, dupeExcluder, setFolderDupeMode]);

  const openCardMenu = useCallback((rec, e) => {
    e.preventDefault();
    e.stopPropagation();
    const targetIds = selection.has(rec.id) && selection.size > 1 ? Array.from(selection) : [rec.id];
    if (targetIds.length === 1) { setSelection(new Set([rec.id])); }

    const srcReadOnly = srcRoot && isImportRoot(srcRoot);

    const moveSub = [];
    for (const root of roots) {
      if (isImportRoot(root)) continue;
      const folders = foldersOfRoot(records, root);
      moveSub.push({ header: root.name });
      for (const dir of folders) {
        const here = root.id === rec.rootId && (rec.dir || "") === dir;
        moveSub.push({
          label: dir === "" ? "(top level)" : dir,
          icon: here ? "•" : "\u{1F4C2}",
          disabled: srcReadOnly || (here && n === 1),
          hint: here && n === 1 ? "here" : "",
          onClick: () => moveCards(targetIds, root, dir, { noConfirm: n <= 5 }),
        });
      }
      moveSub.push({
        label: "New folder here…", icon: "＋", color: "green", disabled: srcReadOnly,

      moveSub.push({ sep: true });

    const copySub = writableRoots.map((root) => ({

        { label: "Duplicate", icon: "⧉", color: "green", disabled: n > 1 || srcReadOnly,

        (settings.destinations || []).length > 1 ? {

          icon: "\u{1F680}", color: "green",
          submenu: settings.destinations.map((d) => ({

            hint: d.id === settings.defaultDestination ? "S" : "",

  const exportManifest = useCallback(() => {

    const rows = [["name", "creator", "version", "spec", "tags", "folder", "path", "tokens_permanent", "lorebook_entries", "alt_greetings", "size_bytes", "modified", "rating", "favorite", "notes"]];

  /* ---- keyboard ---- */
  useEffect(() => {
    const h = (e) => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      // Escape closes the inspector, never a dialog: those close only from their own buttons.
      if (e.key === "Escape" && !modal && focusId) setFocusId(null);
      if (!focusId || modal) return;
      const idx = filtered.findIndex((r) => r.id === focusId);
      if (idx < 0) return;
      let next = -1;
      if (e.key === "ArrowRight") next = idx + 1;
      if (e.key === "ArrowLeft") next = idx - 1;
      if (e.key === "f") {
        const rec = filtered[idx];
        patchEdit(rec.fp, { favorite: !rec.favorite });
        return;
      }
      if (e.key === "s" || e.key === "S") {
        const ids = selection.size ? Array.from(selection) : [filtered[idx].id];
        sendToFrontendRef.current(ids);
        return;
      }
      if (next >= 0 && next < filtered.length) {
        e.preventDefault();
        setFocusId(filtered[next].id);
        setSelection(new Set([filtered[next].id]));
      }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [focusId, filtered, modal, patchEdit, selection]);

  /* ---- grid geometry ---- */
  const tileW = settings.tileSize;
  const tileH = Math.round(tileW * 1.35) + 44;
  const gap = 10;
  const vg = useGridVirtual(gridRef, filtered.length, tileW, tileH, gap);
  const rowH = settings.viewMode === "list" ? 56 : vg.rowH;
  const listVis = useMemo(() => {
    if (settings.viewMode !== "list") return null;
    return filtered;
  }, [settings.viewMode, filtered]);

  const focusRec = focusId ? recById.get(focusId) : null;
  const focusEdit = focusRec ? editsMap.get(focusRec.fp) : null;
  const focusDupeGroup = useMemo(() => {
    if (!focusRec) return null;
    for (const g of dupes.exact.concat(dupes.content)) {
      if (g.items.some((r) => r.id === focusRec.id)) return g.items;
    }
    return null;
  }, [focusRec, dupes]);

  const totalTokens = useMemo(() => filtered.reduce((a, r) => a + r.tokensCore, 0), [filtered]);
  const moveTargets = useMemo(
    () => roots.filter((r) => !isImportRoot(r)).map((root) => ({ root, folders: foldersOfRoot(records, root) })),
    [roots, records]
  );

  if (!ready) {
    return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100%", color: "var(--text-muted)", fontSize: 13 }}>Opening vault…</div>;
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      {/* ── header ── */}
      <div style={{
        display: "flex", alignItems: "center", gap: 12, padding: "10px 16px", flexShrink: 0,
        background: "linear-gradient(180deg, var(--bg-secondary), var(--bg-primary))",
        borderBottom: "1px solid var(--border-subtle)",
      }}>
        <div style={{
          width: 36, height: 36, flexShrink: 0, borderRadius: "var(--radius-sm)",
          background: "var(--accent-warm-glow)", border: "1px solid " + acRgba("warm", 0.3),
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          {/* The app icon's stack of cards, drawn in the theme's own colours. */}
          <svg className="app-emblem" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5.5" width="13.5" height="16.5" rx="2" fill="var(--accent-warm-dim)" />
            <rect x="7" y="2" width="13.5" height="16.5" rx="2" fill="var(--accent-warm)" />
            <circle cx="13.75" cy="7.6" r="2.3" fill="var(--bg-primary)" />
            <rect x="9.75" y="11.2" width="8" height="2" rx="1" fill="var(--bg-primary)" />
            <rect x="10.75" y="14.6" width="6" height="1.4" rx="0.7" fill="var(--bg-primary)" />
          </svg>
        </div>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontFamily: "'Crimson Pro', serif", fontSize: 24, fontWeight: 700, lineHeight: 1.1 }}>{APP_NAME}</div>
          <div style={{ fontSize: 11.5, fontWeight: 300, color: "var(--text-muted)" }}>
            {fmtNum(cards.length)} cards · {fmtNum(roots.length)} folders · {fmtNum(tagIndex.list.length)} tags
            {dupes.exact.length ? " · " + fmtNum(dupes.exact.length) + " duplicate groups" : ""}
          </div>
        </div>

        {scan.running ? (
          <div style={{ flex: 1, maxWidth: 380, marginLeft: 16 }}>
            <ProgressBar step={scan.done} total={scan.total} label={(scan.rootName ? scan.rootName + " · " : "") + scan.label} />
          </div>
        ) : <div style={{ flex: 1 }} />}

        <div style={{ display: "flex", gap: 5, flexWrap: "wrap", justifyContent: "flex-end" }}>
          {scan.running ? (
            <SmallBtn color="red" onClick={() => {
              stopRef.current.stop = true;
              if (aiBulkCtrl.current) aiBulkCtrl.current.abort();
            }}>Stop</SmallBtn>
          ) : (
            <SmallBtn color="cyan" onClick={() => runScan(null, false)} disabled={!roots.length}>Rescan</SmallBtn>
          )}
          <SmallBtn color="warm" onClick={() => setModal("ingest")} disabled={!roots.length || scan.running}>Ingest</SmallBtn>
          <SmallBtn color="red" onClick={() => setModal("dupes")} disabled={!cards.length}>
            Dupes{dupes.exact.length ? " " + dupes.exact.length : ""}
          </SmallBtn>
          <SmallBtn color="purple" onClick={() => setModal("tags")} disabled={!cards.length}>Tags</SmallBtn>
          <SmallBtn color="green" onClick={() => setModal("roots")}>Folders</SmallBtn>
          <SmallBtn color="blue" onClick={() => setModal("ai")} active={aiSettings.enabled}
            title={aiReady(aiSettings, aiRelay)
              ? "AI harness · " + (aiSettings.model || "no model")
              : aiSettings.enabled ? "AI harness is on but not ready — open to see why" : "AI harness (off)"}>
            ✦ AI{aiSettings.enabled && !aiReady(aiSettings, aiRelay) ? " ⚠" : ""}
          </SmallBtn>
          <SmallBtn color="muted" onClick={() => setModal("log")}>Log</SmallBtn>
          <SmallBtn color="muted" onClick={() => setModal("settings")}>⚙</SmallBtn>
        </div>
      </div>

      {/* ── storage warning ── */}
      {!storage.ok ? (
        <div style={{
          flexShrink: 0, padding: "9px 16px", display: "flex", gap: 10, alignItems: "flex-start",
          background: acRgba("warm", 0.1), borderBottom: "1px solid " + acRgba("warm", 0.3),
        }}>
          <span style={{ fontSize: 14, lineHeight: 1.3 }}>⚠</span>
          <div style={{ fontSize: 11.5, lineHeight: 1.65, color: "var(--text-secondary)" }}>
            <strong style={{ color: "var(--accent-warm)" }}>Nothing will be remembered between sessions.</strong>{" "}
            {IS_FILE_URL
              ? "Chrome blocks local databases for pages opened directly from disk, so your folder registrations, tags, notes and ratings can't be saved. Serve the file over localhost instead — "
              : "The browser refused access to IndexedDB — "}
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "var(--text-muted)" }}>
              {IS_FILE_URL ? SERVE_HINT : storage.msg}
            </span>
          </div>
        </div>
      ) : null}

      {/* Hidden directory picker — the read-only path that works everywhere. */}
      <input ref={dirInputRef} type="file" multiple webkitdirectory="" directory=""
        style={{ display: "none" }}
        onChange={(e) => { const fl = e.target.files; e.target.value = ""; handlePickedFolder(fl); }} />

      {/* ── overlapping registered folders ── */}
      {nestedWarn.length ? (
        <div style={{
          flexShrink: 0, padding: "9px 16px", display: "flex", gap: 10, alignItems: "center",
          background: acRgba("red", 0.1), borderBottom: "1px solid " + acRgba("red", 0.3),
        }}>
          <span style={{ fontSize: 14 }}>⚠</span>
          <div style={{ fontSize: 11.5, lineHeight: 1.6, color: "var(--text-secondary)", flex: 1 }}>
            <strong style={{ color: "var(--accent-red)" }}>{nestedWarn[0].inner.name}</strong> sits inside{" "}
            <strong>{nestedWarn[0].outer.name}</strong> (at {nestedWarn[0].path}), so every card in it is
            indexed twice — which is why they all show up as duplicates. Dropping the inner registration
            and labelling that subfolder instead fixes it. No files are touched.
          </div>
          <SmallBtn color="green" onClick={() => repairNesting(nestedWarn[0])}>Fix it</SmallBtn>
          <SmallBtn color="muted" onClick={() => setNestedWarn([])}>dismiss</SmallBtn>
        </div>
      ) : null}

      {/* ── re-attach notice for imported folders ── */}
      {importsNeedingAttach.length && roots.length ? (
        <div style={{
          flexShrink: 0, padding: "9px 16px", display: "flex", gap: 10, alignItems: "center",
          background: acRgba("cyan", 0.09), borderBottom: "1px solid " + acRgba("cyan", 0.28),
        }}>
          <span style={{ fontSize: 14 }}>{"\u{1F517}"}</span>
          <div style={{ fontSize: 11.5, lineHeight: 1.6, color: "var(--text-secondary)", flex: 1 }}>
            <strong style={{ color: "var(--accent-cyan)" }}>
              {importsNeedingAttach.map((r) => r.name).join(", ")}
            </strong>{" "}
            {importsNeedingAttach.length === 1 ? "is" : "are"} imported read-only, so the card files
            aren't attached after a reload. Browsing, tags and search all work — re-pick the folder to
            read card contents or export copies again.
          </div>
          <SmallBtn color="cyan" onClick={() => dirInputRef.current && dirInputRef.current.click()}>Re-attach folder</SmallBtn>
        </div>
      ) : null}

      {/* ── body ── */}
      <div style={{ flex: 1, display: "flex", minHeight: 0 }}>
        {!fsSupported() && roots.length === 0 ? (
          IS_BRAVE ? (
            <Empty icon={"\u{1F981}"} title="Brave blocks folder access by default"
              hint="Brave removes the File System Access API that the vault uses to scan and file your cards — it's on their published list of deviations from Chromium. You have two ways forward:">
              <div style={{
                marginTop: 14, textAlign: "left", maxWidth: 620,
                background: "var(--bg-secondary)", border: "1px solid var(--border-subtle)",
                borderRadius: "var(--radius-md)", padding: 16, fontSize: 12.5, lineHeight: 1.7,
              }}>
                <div style={{ fontWeight: 600, color: "var(--accent-warm)", marginBottom: 6 }}>
                  Option 1 — turn the API on in Brave (full features)
                </div>
                <div style={{ color: "var(--text-secondary)", marginBottom: 6 }}>
                  Open a new tab, go to{" "}
                  <code style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, color: "var(--accent-cyan)" }}>brave://flags</code>,
                  search <strong>file system</strong>, set the File System Access entry to{" "}
                  <strong>Enabled</strong>, relaunch Brave, then reload this page.
                </div>
                <div style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 16 }}>
                  If no such flag exists in your Brave version, use Option 2 or run the vault in Chrome or Edge.
                </div>

                <div style={{ fontWeight: 600, color: "var(--accent-cyan)", marginBottom: 6 }}>
                  Option 2 — import a folder read-only (works right now)
                </div>
                <div style={{ color: "var(--text-secondary)", marginBottom: 10 }}>
                  Pick a folder and the vault reads every card in it, including subfolders. You get the
                  full catalogue, tag facets, search, duplicate detection, the inspector, editing and CSV
                  export. What you don't get is the automatic copy into Library and Archive — that needs
                  write access — and folders must be re-picked after a reload.
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <SmallBtn color="cyan" style={{ padding: "8px 16px", fontSize: 12 }}
                    onClick={() => dirInputRef.current && dirInputRef.current.click()}>
                    Import a folder (read-only)
                  </SmallBtn>
                </div>
              </div>
            </Empty>
          ) : IS_CHROMIUM && IS_FILE_URL ? (
            <Empty icon={"\u{1F50C}"} title="Almost there — this page needs a real address"
              hint={"You opened the file directly from disk, and " + BROWSER_LABEL + " blocks folder access for file:// pages. The vault itself is fine; it just needs to be served over localhost. This takes one double-click:"}>
              <div style={{
                marginTop: 14, textAlign: "left", maxWidth: 560,
                background: "var(--bg-secondary)", border: "1px solid var(--border-subtle)",
                borderRadius: "var(--radius-md)", padding: 16, lineHeight: 1.75, fontSize: 12.5,
              }}>
                <div style={{ marginBottom: 10, color: "var(--text-secondary)" }}>
                  <strong style={{ color: "var(--accent-warm)" }}>1.</strong> Put{" "}
                  <code style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, color: "var(--accent-cyan)" }}>serve.js</code>{" "}
                  and{" "}
                  <code style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, color: "var(--accent-cyan)" }}>Start RP Card Vault.bat</code>{" "}
                  in the same folder as this file.
                </div>
                <div style={{ marginBottom: 10, color: "var(--text-secondary)" }}>
                  <strong style={{ color: "var(--accent-warm)" }}>2.</strong> Double-click{" "}
                  <strong>Start RP Card Vault.bat</strong>. A console window opens and your browser follows automatically.
                </div>
                <div style={{ marginBottom: 14, color: "var(--text-secondary)" }}>
                  <strong style={{ color: "var(--accent-warm)" }}>3.</strong> Leave that console open while you use the vault.
                </div>
                <div style={{
                  fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
                  background: "var(--bg-input)", border: "1px solid var(--border-subtle)",
                  borderRadius: "var(--radius-sm)", padding: "8px 10px", color: "var(--text-muted)",
                }}>
                  no .bat? &nbsp;cd into the folder and run:&nbsp;
                  <span style={{ color: "var(--accent-green)" }}>node serve.js</span>
                </div>
                <div style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 12, lineHeight: 1.6 }}>
                  Always use the same address. Your tags, notes and folder permissions are stored
                  per-origin, so{" "}
                  <code style={{ fontFamily: "'JetBrains Mono', monospace" }}>{CURRENT_ORIGIN_LABEL}</code> and{" "}
                  <code style={{ fontFamily: "'JetBrains Mono', monospace" }}>{ALT_ORIGIN_LABEL}</code> would each
                  hold a separate vault — as does every other port you might start the server on.
                </div>
              </div>
            </Empty>
          ) : (
            <Empty icon="⚠" title={BROWSER_LABEL + " can't file cards automatically"}
              hint={BROWSER_LABEL + " hasn't shipped the File System Access API, so the vault can't get write access to your folders. You can still import a folder read-only and use the whole catalogue — or run the vault in Chrome or Edge for the full ingest pipeline."}>
              <div style={{ marginTop: 12 }}>
                <SmallBtn color="cyan" style={{ padding: "8px 16px", fontSize: 12 }}
                  onClick={() => dirInputRef.current && dirInputRef.current.click()}>
                  Import a folder (read-only)
                </SmallBtn>
              </div>
            </Empty>
          )
        ) : roots.length === 0 ? (
          <Empty icon={"\u{1F4C1}"} title="Point the vault at your card folders"
            hint="Add your downloads folder as Inbox, your front-end character folder as Library, and your backup folder as Archive. The vault reads cards, builds an index, and copies files where you tell it — it never edits or deletes your originals.">
            <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap", justifyContent: "center" }}>
              <SmallBtn color="warm" style={{ padding: "8px 16px", fontSize: 12 }} onClick={addRoot}>Add a folder</SmallBtn>
              <SmallBtn color="cyan" style={{ padding: "8px 16px", fontSize: 12 }}
                onClick={() => dirInputRef.current && dirInputRef.current.click()}>Import read-only</SmallBtn>
            </div>
            {/* After an update or a move, an empty vault usually means a different address, not lost data. */}
            <div className="upgrade-note" style={{ maxWidth: 520, margin: "18px auto 0", fontSize: 11.5, lineHeight: 1.7, color: "var(--text-muted)", textAlign: "left" }}>
              <strong style={{ color: "var(--text-secondary)" }}>Used the vault before?</strong> Your tags, notes and edits are kept by
              your browser under the address the vault ran at, and this copy runs at <code>{location.host}</code>. If your old copy used
              another port, nothing is lost: put a file named <code>vault.local</code> containing <code>port=</code> and the old
              port number next to the launchers and start it again (the old address is in your old shortcut or browser history), or use Export vault data in
              the old copy and Import vault data here (both in ⚙ Settings). See HOW TO RUN.txt.
            </div>
          </Empty>
        ) : (
          <Fragment>
            <FilterSidebar
              filters={filters} setFilters={setFilters} tagIndex={tagIndex}
              roots={roots} rootCounts={rootCounts} total={records.length} shown={filtered.length}
              settings={settings} onOpenTagManager={() => setModal("tags")}
              folderTrees={folderTrees} onDropCards={onDropCards} dragActive={dragActive}
              onNewFolder={() => newFolder(null, "")}
              folderRoles={folderRoles} onFolderMenu={openFolderMenu} flagCounts={flagCounts}
              dupeExcluder={dupeExcluder}
              mode={sideMode}
              onMode={(m) => { setSideMode(m); if (m === "agent") setAgentOpened(true); }}
              agent={agentOpened ? (
                <AgentPanel ai={aiSettings} relay={aiRelay} agent={agentSettings} onSaveAgent={patchAgentSettings}
                  records={records} editsMap={editsMap} tagIndex={tagIndex} sortKey={filters.sort} onPatchEdit={patchEdit}
                  onPatchMany={patchManyEdits} roots={roots}
                  onCardFiles={{ create: createCardFile, copy: copyCardFile, move: moveCardFile }} dupes={dupes}
                  onOpenCard={(id) => setFocusId(id)}
                  onOpenAiSettings={() => setModal("ai")} onToast={showToast} />
              ) : null} />

            <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
              {/* toolbar */}
              <div style={{
                display: "flex", alignItems: "center", gap: 8, padding: "7px 12px", flexShrink: 0,
                borderBottom: "1px solid var(--border-subtle)", background: "var(--bg-secondary)", flexWrap: "wrap",
              }}>
                <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>
                  {fmtNum(filtered.length)} shown
                  <span style={{ color: "var(--text-muted)" }}> · {fmtTokens(totalTokens)} total permanent context</span>
                </span>
                {deepBusy ? <Pill color="cyan">deep searching…</Pill> : null}
                {deepIds ? <Pill color="cyan">{fmtNum(deepIds.size)} deep hits</Pill> : null}

                {selection.size > 1 ? (
                  <Fragment>
                    <span style={{ width: 1, height: 18, background: "var(--border-subtle)", margin: "0 2px" }} />
                    <Pill color="warm">{fmtNum(selection.size)} selected</Pill>
                    <SmallBtn color="green" onClick={() => sendToFrontend(Array.from(selection))}
                      title={defaultDestinationOf(settings) ? "Send to " + defaultDestinationOf(settings).name + " (S); right-click a card to pick another destination" : "Add a destination in Settings first"}>Send to front end</SmallBtn>
                    <SmallBtn color="purple" onClick={() => setModal("bulkTag")}>Tag…</SmallBtn>
                    {(() => {
                      const n = Array.from(selection).filter((id) => { const r = recById.get(id); return r && r.edited; }).length;
                      return n ? (
                        <SmallBtn color="green" disabled={scan.running} onClick={() => saveManyToCard(Array.from(selection))}
                          title="Write the vault's changes into these card files, each backed up and verified">Save to card ({fmtNum(n)})</SmallBtn>
                      ) : null;
                    })()}
                    {aiSettings.enabled ? (
                      <SmallBtn color="blue" disabled={scan.running} onClick={() => bulkAiTags(Array.from(selection))}
                        title={"Ask " + (aiRelay.model || "the AI") + " for tag suggestions, one card at a time, as " +
                          (aiSettings.tagTarget === "card" ? "the cards' own tags" : "vault-only tags") + " (the switch in a card's ✦ AI tab)"}>✦ Suggest tags</SmallBtn>
                    ) : null}
                    {aiSettings.enabled && aiCustomActions(aiSettings).some((a) => a.bulk) ? (
                      <select value="" disabled={scan.running} className="bulk-prompt"
                        onChange={(e) => { const k = e.target.value; e.target.value = ""; if (k) bulkAiRun(Array.from(selection), k); }}
                        title="Run one of your own prompts on every selected card"
                        style={Object.assign({}, selectStyle, { width: "auto", padding: "4px 26px 4px 8px", fontSize: 11 })}>
                        <option value="">✦ Run prompt…</option>
                        {aiCustomActions(aiSettings).filter((a) => a.bulk).map((a) => <option key={a.key} value={a.key}>{a.icon} {a.label}</option>)}
                      </select>
                    ) : null}
                    {moveTargets.length ? (
                      <select value="" onChange={(e) => {
                        if (!e.target.value) return;
                        const i = e.target.value.indexOf("::");
                        const rt = roots.find((r) => r.id === e.target.value.slice(0, i));
                        if (rt) moveCards(Array.from(selection), rt, e.target.value.slice(i + 2));
                        e.target.value = "";
                      }} style={Object.assign({}, selectStyle, { width: "auto", padding: "4px 26px 4px 8px", fontSize: 11 })}>
                        <option value="">Move to…</option>
                        {moveTargets.map((g) => (
                          <optgroup key={g.root.id} label={g.root.name}>
                            {g.folders.map((d) => (
                              <option key={g.root.id + d} value={dirKey(g.root.id, d)}>{d === "" ? "(top level)" : d}</option>
                            ))}
                          </optgroup>
                        ))}
                      </select>
                    ) : null}
                    <SmallBtn color="warm" onClick={() => bulkFavorite(Array.from(selection), true)}>★</SmallBtn>
                    <SmallBtn color="muted" onClick={() => bulkFavorite(Array.from(selection), false)}>☆</SmallBtn>
                    {writableRoots.length ? (
                      <select value="" onChange={(e) => { if (e.target.value) { bulkCopyTo(e.target.value); e.target.value = ""; } }}
                        style={Object.assign({}, selectStyle, { width: "auto", padding: "4px 26px 4px 8px", fontSize: 11 })}>
                        <option value="">Copy to…</option>
                        {writableRoots.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
                      </select>
                    ) : null}
                    <SmallBtn color="warm" onClick={() => trashCards(Array.from(selection))} title="Relocate to your trash folder">{"\u{1F5D1}"}</SmallBtn>
                    <SmallBtn color="red" onClick={() => deleteCards(Array.from(selection))} title="Delete permanently from disk">✕</SmallBtn>
                    <SmallBtn color="muted" onClick={() => setSelection(new Set())}>clear</SmallBtn>
                  </Fragment>
                ) : null}

                <span style={{ marginLeft: "auto", display: "flex", gap: 5, alignItems: "center" }}>
                  <SmallBtn color="cyan" onClick={exportManifest}>Export CSV</SmallBtn>
                  <SmallBtn color="muted" onClick={() => setSelection(new Set(filtered.map((r) => r.id)))}>select all</SmallBtn>
                  <SmallBtn color="warm" active={settings.viewMode === "grid"} onClick={() => patchSettings({ viewMode: "grid" })}>grid</SmallBtn>
                  <SmallBtn color="warm" active={settings.viewMode === "list"} onClick={() => patchSettings({ viewMode: "list" })}>list</SmallBtn>
                  {settings.viewMode === "grid" ? (
                    <input type="range" min="90" max="260" value={settings.tileSize}
                      onChange={(e) => patchSettings({ tileSize: Number(e.target.value) })}
                      style={{ width: 80, accentColor: "var(--accent-warm)" }} />
                  ) : null}
                </span>
              </div>

              {/* grid / list */}
              <div ref={gridRef} className="vault-scroll" style={{ flex: 1, padding: 12, position: "relative" }}>
                {filtered.length === 0 ? (
                  <Empty icon="∅" title="Nothing matches"
                    hint={cards.length ? "Loosen the filters, or clear them from the bottom of the sidebar." : "Run a scan to index your folders."} />
                ) : settings.viewMode === "list" ? (
                  <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    {listVis.slice(0, 800).map((rec, i) => (
                      <CardRow key={rec.id} rec={rec}
                        rootName={(roots.find((r) => r.id === rec.rootId) || {}).name || "?"}
                        selected={selection.has(rec.id)}
                        isDupe={dupes.dupeIds.has(rec.id)}
                        draggable
                        onDragStart={(e) => onCardDragStart(rec, e)}
                        onDragEnd={() => setDragActive(false)}
                        onMouseEnter={() => prefetchDragFile(rec)}
                        onClick={(e) => onTileClick(rec, i, e)}
                        onDouble={() => setFocusId(rec.id)}
                        onContext={(e) => openCardMenu(rec, e)} />
                    ))}
                    {listVis.length > 800 ? (
                      <div style={{ padding: 10, fontSize: 11.5, color: "var(--text-muted)" }}>
                        Showing the first 800 of {fmtNum(listVis.length)} — switch to grid view for the full set, or narrow the filters.
                      </div>
                    ) : null}
                  </div>
                ) : (
                  <div className="card-grid" data-cols={vg.cols} style={{ height: vg.totalHeight, position: "relative" }}>
                    <div style={{
                      position: "absolute", top: vg.offsetY, left: 0, right: 0,
                      display: "flex", flexWrap: "wrap", gap: gap, alignContent: "flex-start",
                    }}>
                      {filtered.slice(vg.start, vg.end).map((rec, i) => (
                        <CardTile key={rec.id} rec={rec} tileW={tileW}
                          selected={selection.has(rec.id)}
                          focused={focusId === rec.id}
                          isDupe={dupes.dupeIds.has(rec.id)}
                          draggable
                          onDragStart={(e) => onCardDragStart(rec, e)}
                          onDragEnd={() => setDragActive(false)}
                          onMouseEnter={() => prefetchDragFile(rec)}
                          onClick={(e) => onTileClick(rec, vg.start + i, e)}
                          onDouble={() => setFocusId(rec.id)}
                          onContext={(e) => openCardMenu(rec, e)} />
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>

            {focusRec ? (
              <Inspector rec={focusRec} roots={roots} edit={focusEdit} tagIndex={tagIndex}
                dupeGroup={focusDupeGroup}
                onSaveToCard={() => saveToCard(focusRec)}
                onOpenFlag={(key, note, index) => setFlagModal({ ids: [focusRec.id], key, note, index })}
                onJumpTo={(id) => { setFocusId(id); setSelection(new Set([id])); }}
                onPatchEdit={(p) => patchEdit(focusRec.fp, p)}
                ai={aiSettings} aiRelay={aiRelay} onRunAi={runAi} onClearAiNotes={clearAiNotes}
                onOpenAiSettings={() => setModal("ai")} onSaveAi={patchAiSettings} onDuplicate={() => duplicateCard(focusRec)}
                onClose={() => setFocusId(null)} onToast={showToast} />
            ) : null}
          </Fragment>
        )}
      </div>

      {/* ── modals ── */}
      {modal === "roots" ? (
        <RootsModal roots={roots} rootCounts={rootCounts} scanning={scan.running}
          onClose={() => setModal(null)} onAdd={addRoot} onSetRole={setRootRole}
          onImport={() => dirInputRef.current && dirInputRef.current.click()}
          onForget={forgetRoot} onRescan={runScan} />
      ) : null}

      {modal === "tags" ? (
        <TagManagerModal tagIndex={tagIndex} tagMeta={tagMeta} onSaveMeta={saveMeta} onClose={() => setModal(null)} />
      ) : null}

      {modal === "ingest" ? (
        <IngestModal roots={roots} records={records} settings={settings} tagMeta={tagMeta} folderRoles={folderRoles}
          dupeExcluder={dupeExcluder}
          onClose={() => setModal(null)} onSaveSettings={patchSettings} onToast={showToast}
          onDone={(ids) => runScan(ids, false, { quiet: true })} />
      ) : null}

      {modal === "dupes" ? (
        <DupesModal dupes={dupes} roots={roots} onClose={() => setModal(null)}
          onSelectIds={(ids) => setSelection(new Set(ids))}
          onResolve={resolveDupeGroups}
          onCompare={(g) => setCompare(g)}
          externalKeepers={dupeKeepers}
          onDismiss={(kind, key) => setDupeVerdict(kind, key, true)}
          onRestore={(kind, key) => setDupeVerdict(kind, key, false)}
          onToast={showToast}
          onJumpTo={(id) => { setFocusId(id); setSelection(new Set([id])); }} />
      ) : null}

      {modal === "bulkTag" ? (
        <BulkTagModal count={selection.size} tagIndex={tagIndex} onClose={() => setModal(null)}
          onApply={(add, rem) => bulkTag(Array.from(selection), add, rem)} />
      ) : null}

      {flagModal ? (
        <FlagModal count={flagModal.ids.length} initialKey={flagModal.key} initialNote={flagModal.note} editing={flagModal.index != null}
          onClose={() => setFlagModal(null)}
          onApply={(key, note) => setFlag(flagModal.ids, key, note, flagModal.index)} />
      ) : null}

      {compare ? (
        <CompareModal group={compare} roots={roots} onClose={() => setCompare(null)}
          onJumpTo={(id) => { setFocusId(id); setSelection(new Set([id])); setModal(null); }}
          onSetKeeper={(g, id) => setDupeKeeper(g.kind + g.key, id)}
          onTrash={(ids) => trashCards(ids)}
          onToast={showToast} />
      ) : null}

      {modal === "log" ? <LogModal onClose={() => setModal(null)} /> : null}

      {modal === "ai" ? (
        <AiSettingsModal ai={aiSettings} onSave={patchAiSettings} relay={aiRelay}
          onSaveEndpoint={aiSaveEndpoint} onSavePrivacy={aiSavePrivacy} onTest={aiTestConnection} onForgetKey={aiForgetKey}
          onRefreshRelay={refreshAiRelay}
          onClose={() => setModal(null)} onToast={showToast}
          knownTagCount={tagIndex.list.length} />
      ) : null}

      {modal === "settings" ? (
        <SettingsModal settings={settings} onSave={patchSettings} onClose={() => setModal(null)}
          onToast={showToast} onHardReset={hardReset} onExportVault={exportVault}
          onImportVault={importVault} cardCount={cards.length} trashOptions={moveTargets}
          destStatus={destStatus} onConnectDest={connectDest} onDisconnectDest={disconnectDest}
          onBackupNow={() => backupVaultData(true)} lastAutoBackup={lastAutoBackup}
          flagUsage={Object.fromEntries(flagCounts.map((f) => [f.key, f.count]))} problemLogInfo={problemLogInfo} />
      ) : null}

      {/* ── context menu ── */}
      {ctxMenu ? (
        <ContextMenu x={ctxMenu.x} y={ctxMenu.y} items={ctxMenu.items} onClose={() => setCtxMenu(null)} />
      ) : null}

      {/* ── toast ── */}
      {toast ? (
        <div className="fadeIn" onClick={() => setToast(null)} style={{
          position: "fixed", bottom: 18, left: "50%", transform: "translateX(-50%)",
          padding: "9px 16px", borderRadius: "var(--radius-md)", zIndex: 200,
          background: "var(--bg-elevated)", border: "1px solid " + acRgba(toast.color, 0.45),
          color: ac(toast.color), fontSize: 12, maxWidth: "80vw", cursor: "pointer",
          boxShadow: "0 10px 30px rgba(0,0,0,0.45)", lineHeight: 1.5,
        }}>
          {toast.msg}
          {toast.sticky ? (
            <span style={{ color: "var(--text-muted)", marginLeft: 8, fontSize: 10 }}>click to dismiss</span>
          ) : null}
        </div>
      ) : null}
    </div>
  );
}

/**
 * On a browser with the storage bug, this comes up instead of the vault, before
 * anything opens the vault's saved data: opening it is what would close the
 * browser. Nothing is read or changed until you choose to go ahead.
 */
function BrowserBugNotice({ version, onContinue }) {
  useEffect(() => {
    // Tell the fail-loud guard in <head> that the page is up.
    const el = document.getElementById("root");
    if (el) el.setAttribute("data-mounted", "1");
  }, []);
  const code = { fontFamily: "'JetBrains Mono', monospace", fontSize: 12, padding: "1px 6px", borderRadius: 4,
    background: "var(--bg-input)", border: "1px solid var(--border-subtle)", color: "var(--text-primary)" };
  return (
    <div className="browser-bug-notice" style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
      padding: "24px 16px", background: "var(--bg-primary)", boxSizing: "border-box" }}>
      <div style={{ maxWidth: 560, width: "100%", padding: 24, borderRadius: "var(--radius-md)", background: "var(--bg-secondary)",
        border: "1px solid " + acRgba("warm", 0.4), lineHeight: 1.7, fontSize: 13, color: "var(--text-secondary)" }}>
        <div style={{ fontFamily: "'Crimson Pro', serif", fontSize: 22, color: "var(--accent-warm)", marginBottom: 10 }}>
          Update {BROWSER_LABEL} before opening the vault
        </div>
        <p style={{ margin: "0 0 10px" }}>
          {BROWSER_LABEL} {version} has a bug: when a page has remembered a folder you gave it, the whole browser
          closes the next time that page opens its saved data. The vault remembers your card folders, so it would
          close {BROWSER_LABEL} as it starts.
        </p>
        <p style={{ margin: "0 0 10px" }}>
          <strong style={{ color: "var(--text-primary)" }}>The fix is to update {BROWSER_LABEL}.</strong> Type{" "}
          <span style={code}>{browserUpdatePage(BROWSER_LABEL)}</span> into the address bar, let it update, and restart it.
          Version {version + 1} and later are fine.
        </p>
        <p style={{ margin: "0 0 16px" }}>
          Nothing is lost while you wait: your cards, tags, notes and folders are all kept, and nothing has been opened yet.
        </p>
        <SmallBtn color="warm" style={{ padding: "8px 16px", fontSize: 12 }} onClick={onContinue}>Open the vault anyway</SmallBtn>
        <div style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 8 }}>
          If you have added folders in this browser before, this will probably close {BROWSER_LABEL}. Nothing is damaged if it does.
        </div>
      </div>
    </div>
  );
}

function VaultRoot() {
  const bugVersion = handleCrashVersion(typeof navigator !== "undefined" ? navigator.userAgent : "");
  const [go, setGo] = useState(!bugVersion);
  return go ? <App /> : <BrowserBugNotice version={bugVersion} onContinue={() => setGo(true)} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<VaultRoot />);
</script>
</body>
</html>
